時都能表達。</mark>"],"L":{"1":{"t":"我需要先確認，自己適不適合開口","b":["<mark class=\"k\">核心：表達的基礎與謹慎。</mark>","","第一爻重視基礎。放在12號閘門上，一個人可能需要先確認自己的情緒狀態、談話環境和表達內容，才願意開口。","","例如：","•   重要的事情會先在心裡整理。","•   情緒不穩定時，可能選擇暫時不說。","•   不確定對方能否理解時，會先觀察。","•   對不熟悉的人，不一定願意表達內心感受。","","它不是單純不善表達，而是需要先確認自己是否處於適合表達的狀態。"],"q":["你有沒有想說的話，但因為覺得時機不對，所以選擇先不說？","當你心情不好的時候，你會更想安靜，還是仍然能夠自然地表達？"],"s":["會在意：","「現在說適合嗎？」","所以可能比較謹慎。"]},"2":{"t":"當狀態對了，我自然會表達","b":["<mark class=\"k\">核心：自然流露與表達天賦。</mark>","","第二爻的特質可能自然出現。放在12號閘門上，一個人不一定刻意學習如何吸引別人，卻可能在狀態合適時，自然流露出個人魅力。","","例如：","•   平常安靜，但熟悉後很會表達。","•   在喜歡的話題上，突然變得健談。","•   有時一句話就能表達出細膩的情緒。","•   不喜歡勉強自己參與沒有感覺的交流。","","它不是單純忽冷忽熱，而是表達有自己的節奏，開放程度會受到當下狀態影響。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["你有沒有發現，自己在某些人面前特別容易表達，但在另一些場合卻很安靜？","當你真的有感覺時，你是不是比較不需要刻意準備，就能說出自己的想法？"],"s":["有時候：","「現在就是很想說。」","但沒有感覺時，可能完全不想說。"]},"3":{"t":"我需要透過表達的經驗，找到適合自己的方式","b":["<mark class=\"k\">核心：試錯與表達調整。</mark>","","第三爻透過實際經驗學習。放在12號閘門上，一個人可能經歷過說得太早、說得太直接，或者明明想表達卻沒有說清楚。","","例如：","•   曾經在情緒激動時說出後悔的話。","•   試過主動表達，卻發現對方無法理解。","•   逐漸學習在重要對話前先整理自己。","•   發現有些事情適合當面說，有些適合等情緒穩定後再說。","","它不是表達能力不好，而是透過經驗學習怎樣拿捏時機、內容與方式。"],"q":["你有沒有經歷過一次對話，讓你後來發現自己需要換一種方式表達？","當你回頭看過去的溝通經驗，有沒有一些事情是你現在會選擇不同時間再說的？"],"s":["可能：","說了 → 發現別人誤會 → 調整說法。"]},"4":{"t":"我在適合的關係中，更容易打開自己","b":["<mark class=\"k\">核心：人際連接與表達的開放程度。</mark>","","第四爻與人際網絡有關。放在12號閘門上，一個人可能在熟悉、安全的關係中，更容易表達自己的感受。","","例如：","•   在朋友面前很健談，在陌生人面前較安靜。","•   與信任的人聊天時，願意分享內心想法。","•   在熟悉的團隊中比較容易展現個人風格。","•   需要時間確認關係是否安全，才願意深入交流。","","它不是虛偽或表裡不一，而是不同的關係環境，會影響他願意開放多少。"],"q":["你是不是在熟悉的人面前，比在陌生人面前更容易做自己？","對你來說，需要建立怎樣的信任，你才會願意說出比較真實的感受？"],"s":["可能在人群中安靜。","但對熟悉的人非常會表達。"]},"5":{"t":"別人期待我說出恰到好處的話","b":["<mark class=\"k\">核心：表達影響力與他人的期待。</mark>","","第五爻容易受到他人投射。放在12號閘門上，別人可能認為這個人懂得表達、會看氣氛，期待他在重要時刻說出適當的話。","","例如：","•   朋友來問應該怎樣開口。","•   同事希望他幫忙緩和緊張的氣氛。","•   別人認為他應該知道什麼時候說話最合適。","•   有時被期待替別人表達難以啟齒的感受。","","它不是必須當所有人的溝通專家，而是別人可能把「你應該知道怎麼說」的期待放在他身上。"],"q":["別人會不會常常來問你，某件事情應該怎樣說？","你有沒有因為別人期待你說得得體，而感到自己必須替場面負責？"],"s":["別人可能覺得：","「你應該知道怎麼說。」"]},"6":{"t":"我逐漸理解，表達也需要等待合適的時機","b":["<mark class=\"k\">核心：成熟、觀察與長遠理解。</mark>","","第六爻帶有觀察與成熟的意味。放在12號閘門上，一個人可能越來越理解，表達不是越多越好，也不是每次有想法就必須說出來。","","例如：","•   不再要求自己隨時都要健談。","•   更懂得選擇值得交流的人。","•   能夠接受某些話暫時不說。","•   明白自己的狀態會改變，不必每次都表現得一樣。","","它不是冷漠或不願與人溝通，而是逐漸知道，什麼時候表達能夠真正產生價值。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你有沒有發現，自己現在比以前更懂得選擇什麼時候開口？","你是否越來越能夠接受，有些時候安靜下來，比勉強表達更適合自己？"],"s":["最終：","「不是每一個想法都需要馬上說出來。」"]}},"oh":"表達與謹慎","oi":[]},"13":{"h":"傾聽、記憶、他人的故事與集體經驗","i":["13號閘門位於G中心，屬於集體感知回路，與傾聽和經驗的記憶有關。","<mark class=\"k\">這個閘門的重點不只是聽別人說話，而是透過故事，接觸人們經歷過的事情。</mark>"],"L":{"1":{"t":"我需要先確認對方值得信任","b":["<mark class=\"k\">核心：建立傾聽的基礎。</mark>","","第一爻重視基礎。放在13號閘門上，一個人可能不會輕易接納所有人的故事，而是先觀察對方是否值得信任。","","例如：","•   不會馬上向陌生人透露自己的隱私。","•   聽到別人的秘密時，會認真看待。","•   需要確認談話有基本的安全感。","•   不喜歡別人隨意傳播自己聽來的事情。","","它不是冷淡，而是理解故事與秘密需要有可以承接它的基礎。"],"q":["你會不會先觀察一個人是否值得信任，才願意聽他講很私人的事情？","對你來說，別人把秘密告訴你，是一件需要認真對待的事嗎？"],"s":["別人願意告訴他秘密之前，需要安全感。"]},"2":{"t":"別人很自然地向我傾訴","b":["<mark class=\"k\">核心：自然的傾聽能力。</mark>","","第二爻的特質可能自然流露。放在13號閘門上，別人可能覺得這個人容易親近，願意把自己的經歷告訴他。","","例如：","•   別人常常主動分享自己的心事。","•   明明只是普通聊天，對方卻說了很多內心感受。","•   朋友覺得他是一個可以傾訴的人。","•   他未必主動詢問，別人卻願意說出來。","","它不是單純喜歡聽八卦，而是可能自然營造出讓人願意分享故事的空間。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["你有沒有發現，別人有時候會主動跟你說很多自己的事情？","你是否經常聽到別人說，跟你聊天很容易把心裡話說出來？"],"s":["別人可能莫名其妙就跟他說很多。"]},"3":{"t":"我透過不同的故事，學習如何傾聽","b":["<mark class=\"k\">核心：經驗、調整與界線。</mark>","","第三爻透過經歷學習。放在13號閘門上，一個人可能需要親自經歷，才知道怎樣傾聽別人，同時保護自己的空間。","","例如：","•   曾經聽了太多別人的煩惱，感到很疲憊。","•   曾經因為太想幫忙，而卷入別人的關係問題。","•   慢慢學習，傾聽不代表必須提供答案。","•   開始分辨哪些故事自己能夠承接，哪些需要交還給當事人。","","它不是不再關心別人，而是透過經驗明白，傾聽與承擔責任是兩回事。"],"q":["你有沒有因為聽了太多別人的煩惱，而覺得自己也被影響？","後來你有沒有學會，聽別人分享不代表自己一定要幫他解決問題？"],"s":["可能從不同人的經歷裡理解人生。"]},"4":{"t":"我在群體中，常常記得大家的故事","b":["<mark class=\"k\">核心：人際連接與共同記憶。</mark>","","第四爻與人際網絡有關。放在13號閘門上，一個人可能在家庭、朋友圈或團隊中，記得大家經歷過的事情。","","例如：","•   朋友聚會時，會想起以前發生過的事情。","•   能夠記得某個人曾經經歷的轉折。","•   在團隊中，知道大家過去怎樣一起解決問題。","•   透過共同經歷，讓群體重新連接。","","它不是單純懷舊，而是故事可能成為人與人之間建立連接的橋梁。"],"q":["在熟悉的朋友圈裡，你會不會經常記得大家以前發生過的事情？","你有沒有發現，回憶共同經歷會讓你覺得人與人之間的關係更緊密？"],"s":["別人會覺得：","「跟你說話，我真的有被聽見。」"]},"5":{"t":"別人期待我理解他們的故事","b":["<mark class=\"k\">核心：他人的投射與傾聽的責任。</mark>","","第五爻容易受到投射。放在13號閘門上，別人可能期待這個人理解他們、替他們保守秘密，甚至幫助他們處理關係。","","例如：","•   不同朋友都來找他傾訴。","•   別人認為他應該理解每個人的立場。","•   有人希望他幫忙協調兩個人之間的矛盾。","•   他可能被放在傳話人或中間人的位置。","","它不是每個人的事情都要由自己承接，而是別人可能期待他成為那個理解所有故事的人。"],"q":["你會不會經常被不同的人找去傾訴？","當別人把自己的故事告訴你時，你會不會覺得自己有責任替他保守秘密，甚至幫助他解決問題？"],"s":["容易成為：","「大家的秘密保管者。」","但要注意不要把別人的問題全部背到自己身上。"]},"6":{"t":"我逐漸從故事中看見更深的理解","b":["<mark class=\"k\">核心：觀察、整合與經驗的沉澱。</mark>","","第六爻重視長遠觀察。放在13號閘門上，一個人可能隨著經驗增加，越來越能從故事中看見人的復雜性。","","例如：","•   不再只根據一個人的單一行為判斷他。","•   開始理解，每個人都有自己的背景和經歷。","•   回顧過去時，能夠看見當時沒有理解的部分。","•   更懂得尊重別人的故事，不急著下結論。","","它不是自認為看透了所有人，而是經過時間後，更能理解每個故事背後都有不同的處境。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你有沒有發現，經歷得越多，越能理解一個人的行為可能有不同原因？","當別人向你分享故事時，你現在會不會比以前更願意先聽完整，再作判斷？"],"s":["成熟後：","「我可以聽見你，但不需要替你活。」"]}},"oh":"傾聽與故事","oi":[]},"14":{"h":"資源、技能、工作能力與能量的投入方向","i":["14號閘門位於薦骨中心，屬於個體回路，與技能、資源及將能量投入某個方向有關。","<mark class=\"k\">理解這個閘門時，重點不只是一個人有沒有賺錢能力，而是：他的能力與資源，正在被投入到什麼方向。</mark>"],"L":{"1":{"t":"我需要先知道，資源應該放在哪裡","b":["<mark class=\"k\">核心：資源配置的基礎。</mark>","","第一爻重視基礎。放在14號閘門上，一個人可能會先確認自己擁有什麼、缺少什麼，以及資源是否足以支持一個方向。","","例如：","•   開始項目之前，先盤點預算。","•   選擇工作時，會考慮時間與能力是否匹配。","•   不喜歡在沒有準備的情況下投入大量資源。","•   想先弄清楚一件事是否值得長期經營。","","它不是單純計較金錢，而是需要理解資源的基礎，才能知道如何投入。"],"q":["當你準備投入一件事時，會不會先評估自己的時間、能力或資源是否足夠？","你會不會很在意，自己的努力最後到底用在什麼地方？"],"s":["會很在意：","「我有什麼能力？什麼資源可以讓我生活？」"]},"2":{"t":"我自然知道怎樣運用自己的能力","b":["<mark class=\"k\">核心：自然的技能與資源運用。</mark>","","第二爻的特質可能自然流露。放在14號閘門上，一個人可能有某些能力，用起來特別順手，卻未必意識到那是自己的優勢。","","例如：","•   很自然地找到有效率的工作方法。","•   處理某類任務時，比別人更容易上手。","•   能夠運用手上的資源完成事情。","•   別人覺得他很有能力，他卻認為自己只是照常做事。","","它不是所有事情都做得好，而是某些技能或資源運用方式可能自然地成為優勢。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["有沒有一些事情你做起來特別順手，但你自己覺得只是很普通？","別人有沒有特別欣賞過你運用某種能力、完成事情的方式？"],"s":["可能很自然地知道：","「這個我會。","」"]},"3":{"t":"我透過不同嘗試，找到值得投入的方向","b":["<mark class=\"k\">核心：試錯、經驗與資源調整。</mark>","","第三爻透過經驗學習。放在14號閘門上，一個人可能需要經歷不同的工作、項目或生活選擇，才逐漸明白自己的能力適合用在哪裡。","","例如：","•   嘗試過幾種工作，才發現自己真正擅長什麼。","•   投入某個項目後，發現消耗遠大於收獲。","•   經歷過資源分配不當，才學會調整。","•   透過不同經驗，逐漸找到更適合自己的工作方式。","","它不是浪費能力，而是透過嘗試認識自己的資源，逐漸學會把力量放在更適合的方向。"],"q":["你有沒有做過一些工作之後，才發現自己真正擅長的事情與原本想象的不一樣？","你有沒有經歷過投入很多時間，卻發現那並不是自己真正想繼續的方向？"],"s":["會試不同事情。","然後發現：","「這個值得繼續。」"]},"4":{"t":"我的能力可以在合作中創造價值","b":["<mark class=\"k\">核心：人際連接與資源的共同運用。</mark>","","第四爻與人際網絡有關。放在14號閘門上，一個人可能透過團隊、合作或熟悉的關係，讓自己的能力產生更大的價值。","","例如：","•   知道自己適合負責哪一部分。","•   與不同專長的人合作，把事情做得更完整。","•   能夠看見團隊中有哪些資源可以運用。","•   透過合作，讓個人技能產生更大的成果。","","它不是必須幫助所有人，而是自己的能力可能透過合適的關係與合作，發揮更大的價值。"],"q":["你會不會發現，和合適的人合作時，自己的能力更容易發揮？","在團隊中，你是否比較容易看見怎樣分配工作或資源會更有效？"],"s":["能力開始進入群體。"]},"5":{"t":"別人期待我把能力變成實際成果","b":["<mark class=\"k\">核心：能力的應用與他人的期待。</mark>","","第五爻容易受到投射。放在14號閘門上，別人可能認為這個人有能力、有資源，期待他負責把事情做好。","","例如：","•   工作上經常被安排需要實際成果的任務。","•   別人認為他很有辦法，什麼都可以處理。","•   團隊希望他提供資源或解決工作上的困難。","•   他可能因為別人相信自己的能力，而接下過多責任。","","它不是有能力就必須承擔所有工作，而是別人可能期待他不斷產出成果；他仍需要選擇什麼值得投入。"],"q":["別人會不會常常覺得你很有能力，所以什麼事情都來找你？","你有沒有因為自己做得到，就接下其實並不想承擔的工作？"],"s":["「你有這個能力，可以幫我嗎？」","所以需要辨識：","什麼值得我投入。"]},"6":{"t":"我逐漸懂得選擇，把資源留給真正重要的事","b":["<mark class=\"k\">核心：成熟、長遠價值與資源的方向。</mark>","","第六爻帶有長遠觀察的意味。放在14號閘門上，一個人可能隨著經驗增加，不再只看自己能做多少，而是開始衡量什麼真正值得投入。","","例如：","•   不再因為有能力，就接受每一個機會。","•   開始重視工作與生活之間的平衡。","•   更謹慎地選擇項目、合作對象和工作方向。","•   明白資源有限，需要有所取舍。","","它不是失去動力，而是越來越明白，能力的價值不只在於產出多少，也在於有沒有用在自己真正重視的方向。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你現在會不會比以前更謹慎地選擇，把時間和能力投入在哪裡？","有沒有一些事情，你以前覺得自己做得到就應該去做，現在卻會先問自己值不值得？"],"s":["真正重要的是：","「我把資源放在哪裡，才真正有生命力？」"]}},"oh":"資源與能力","oi":[]},"15":{"h":"人性的廣度、不同的節奏與對差異的包容","i":["15號閘門位於G中心，與愛及人類經驗有關，也與生活節奏的差異相關。","<mark class=\"k\">這個閘門並不只是作息不規律，而是可能對人類各種不同的節奏有較大的包容度。</mark>"],"L":{"1":{"t":"我需要先找到適合自己的生活節奏","b":["<mark class=\"k\">核心：節奏的基礎與穩定感。</mark>","","第一爻重視基礎。放在15號閘門上，一個人可能需要先了解自己的作息、工作和生活習慣，才能找到比較穩定的狀態。","","例如：","•   需要一段時間觀察自己的睡眠與工作節奏。","•   希望知道怎樣安排生活比較舒服。","•   生活突然改變時，需要重新調整。","•   會留意自己的節奏是否被外界要求打亂。","","它不是一定要過規律的生活，而是先了解自己的基礎節奏，才知道怎樣面對生活中的變化。"],"q":["你有沒有發現，自己需要先找到適合的生活節奏，才會比較舒服？","當生活突然改變時，你通常需要多少時間才能重新適應？"],"s":["會很在意：","「什麼樣的節奏讓我舒服？」"]},"2":{"t":"我的節奏有自己的特點","b":["<mark class=\"k\">核心：自然的生活節奏。</mark>","","第二爻的特質可能自然流露。放在15號閘門上，一個人可能有自己獨特的生活步調，不一定需要刻意安排才會形成。","","例如：","•   有時很投入，有時需要大量休息。","•   自然知道什麼時候適合工作，什麼時候需要停下來。","•   不喜歡為了符合別人而強迫自己保持同樣的速度。","•   可能覺得自己的生活方式很正常，別人卻覺得特別。","","它不是故意與眾不同，而是個人的節奏可能自然地與別人不一樣。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["你有沒有發現，自己的生活節奏和身邊的人不太一樣？","你會不會有自己的工作或休息規律，不一定跟著別人走？"],"s":["別人可能覺得：","「你有時候很安靜，有時候又很瘋狂。」","本人覺得很正常。"]},"3":{"t":"我需要經歷不同節奏，才知道怎樣調整","b":["<mark class=\"k\">核心：經驗與節奏的調整。</mark>","","第三爻透過經驗學習。放在15號閘門上，一個人可能經歷過生活過快、過慢或過度迎合別人，才慢慢找到適合自己的方式。","","例如：","•   試過跟著別人高強度工作，後來發現自己很疲憊。","•   試過把生活安排得太滿，才知道需要留白。","•   發現不同階段需要不同的作息。","•   在變化中學會調整，而不是要求自己永遠維持同一種狀態。","","它不是沒有規律，而是透過經驗學習什麼樣的節奏能夠真正支持自己。"],"q":["你有沒有試過照著別人的生活方式安排自己，最後卻發現並不適合？","你有沒有經歷過一段時間後，才知道自己需要怎樣的工作和休息節奏？"],"s":["可能經歷：","很規律 → 突然改變 → 再回來。","通過體驗知道自己的範圍。"]},"4":{"t":"我的生活節奏會影響身邊的人","b":["<mark class=\"k\">核心：人際連接與節奏的影響。</mark>","","第四爻與人際網絡有關。放在15號閘門上，一個人的生活方式可能影響周圍的人，也可能讓他更能接納不同人的步調。","","例如：","•   在團隊中能夠接受有人快、有人慢。","•   與朋友相處時，不一定要求大家用同一種方式生活。","•   可能成為讓別人放松、不必急著趕進度的人。","•   也可能發現，自己的節奏會影響家庭或團隊的日常安排。","","它不是必須配合所有人，而是能夠在關係中看見不同節奏，並理解它們如何互相影響。"],"q":["當身邊的人做事速度和你不一樣時，你通常會怎樣看待？","你會不會發現，自己的生活節奏有時也會影響家人或團隊？"],"s":["可能讓別人發現：","「原來不一樣也可以。」"]},"5":{"t":"別人期待我接納不同的人","b":["<mark class=\"k\">核心：包容力與他人的投射。</mark>","","第五爻容易受到投射。放在15號閘門上，別人可能期待這個人理解不同的生活方式，或者認為他應該能夠接納所有人的差異。","","例如：","•   別人認為他不應該批評不同生活方式的人。","•   在團隊中，別人期待他包容不同做事節奏的人。","•   他可能被期待協調彼此不一樣的習慣。","•   有時為了接納別人，而忽略了自己也有界線。","","它不是必須接受所有行為，而是即使理解差異，也仍然可以保有自己的界線和選擇。"],"q":["別人會不會覺得你比較能夠接受不同生活方式的人？","你有沒有因為想理解別人，而忽略了自己其實也有不舒服的地方？"],"s":["別人可能覺得：","「你應該什麼都能接受。」","但不代表你必須接受所有東西。"]},"6":{"t":"我開始理解，人本來就有不同的節奏","b":["<mark class=\"k\">核心：長遠視角與對人性的理解。</mark>","","第六爻帶有觀察與成熟的意味。放在15號閘門上，一個人可能逐漸看見，人並不需要按照同一種節奏生活。","","例如：","•   不再輕易把別人和自己比較。","•   接受自己有時需要快、有時需要慢。","•   理解一個人的狀態可能隨著階段改變。","•   不再執著於一種標準的生活方式。","","它不是沒有原則，而是經過觀察後，更能理解不同節奏背後的復雜性，不再要求每個人都符合單一標準。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你有沒有發現，隨著經歷增加，你越來越能夠接受別人和自己的生活方式不一樣？","你現在會不會比較少用同一個標準，去判斷所有人的生活節奏？"],"s":["最終：","「我今天這樣，明天不同，也不代表我失去自己。」"]}},"oh":"極端與包容","oi":[]},"16":{"h":"熱情、練習、熟練度與技能的展現","i":["16號閘門位於喉嚨中心，與技能及對技能的熱情有關。","<mark class=\"k\">這個閘門的重點不是一開始就很厲害，而是當一個人對某件事有興趣時，可能願意反覆練習，把熱情逐漸變成能力。</mark>"],"L":{"1":{"t":"我需要先建立技能的基礎","b":["<mark class=\"k\">核心：知識、練習與基礎能力。</mark>","","第一爻重視基礎。放在16號閘門上，一個人可能希望先掌握基本技巧，才覺得自己真正能夠開始展現能力。","","例如：","•   學一項技能時，先了解基本原理。","•   練習之前，會先研究正確的方法。","•   不希望只是憑感覺做，卻不知道自己為什麼這樣做。","•   可能需要重複練習基礎動作，才比較有信心。","","它不是一定要準備到完美，而是希望自己的熱情有基礎支撐，不只停留在興奮。"],"q":["當你學習一項新技能時，會不會先想弄清楚基礎，再開始發揮？","你會不會因為覺得自己還不夠熟練，而暫時不願意讓別人看見你的表現？"],"s":["會願意：","•   練習","•   學習","•   重複","•   打基礎"]},"2":{"t":"我對喜歡的事情，自然會投入練習","b":["<mark class=\"k\">核心：自然的熱情與技能。</mark>","","第二爻的特質可能自然流露。放在16號閘門上，一個人可能對某些事情特別有興趣，一接觸就願意投入。","","例如：","•   喜歡某項運動，自然會花時間練習。","•   對音樂、設計或表達有興趣時，容易沉浸其中。","•   某些技巧學起來特別快。","•   別人看見他的能力，他卻覺得自己只是喜歡這件事。","","它不是每件事都能輕易學會，而是當興趣與能力相遇時，投入可能自然發生。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["有沒有一些事情，你不需要別人催促，就會自己不斷練習？","當你真正喜歡一件事時，你會不會自然想把它做得更好？"],"s":["可能很容易發現：","「這個我真的很喜歡。」"]},"3":{"t":"我透過反覆練習和修正，逐漸熟練","b":["<mark class=\"k\">核心：試錯、重複與技能發展。</mark>","","第三爻透過經驗學習。放在16號閘門上，一個人可能需要經過多次失敗和修正，才逐漸掌握技能。","","例如：","•   剛開始學習時表現不穩定。","•   練習過程中發現某個動作或方法不適合自己。","•   試過不同的學習方式，才找到有效的方法。","•   透過錯誤，慢慢知道自己需要加強什麼。","","它不是沒有天賦，而是技能需要透過真實練習發展，過程中的錯誤也能成為學習的一部分。"],"q":["你有沒有一項技能，是練習了很久之後才慢慢熟練的？","當你練習時發現自己做不好，你通常會放棄，還是會想辦法調整方法？"],"s":["不是天生完美。","而是：","練 → 錯 → 調整 → 再練。"]},"4":{"t":"我的技能會在群體中發揮影響","b":["<mark class=\"k\">核心：透過關係分享與展現技能。</mark>","","第四爻與人際網絡有關。放在16號閘門上，一個人的技能可能在團隊、社群或熟悉的關係中得到發揮。","","例如：","•   在朋友面前展現自己的興趣和專長。","•   透過團隊合作，把技能運用到實際任務。","•   朋友因為看見他的能力，而介紹新的機會。","•   透過分享練習成果，獲得交流與學習的機會。","","它不是必須向所有人展示自己，而是技能可能透過關係與分享，找到實際發揮的空間。"],"q":["你有沒有因為朋友、同事或某個社群，而獲得展現自己技能的機會？","當你把自己擅長的事情分享出來時，會不會因此認識更多同樣有興趣的人？"],"s":["可能成為團隊裡某方面的專業者。"]},"5":{"t":"別人期待我把技能展現出來","b":["<mark class=\"k\">核心：實際表現與他人的投射。</mark>","","第五爻容易受到投射。放在16號閘門上，別人可能認為這個人擅長某件事，因此期待他能夠展示成果，甚至成為某方面的專家。","","例如：","•   別人知道他會設計，就不斷請他幫忙設計。","•   因為擅長表達，而經常被安排做簡報。","•   別人認為他學得快，所以期待他很快掌握新技能。","•   可能因為別人的期待，而覺得自己不能表現失誤。","","它不是必須每次都表現出色，而是別人可能期待他證明自己的能力；他仍然可以處於學習和進步的過程中。"],"q":["別人會不會因為知道你擅長某件事，就經常期待你幫忙？","當別人覺得你很厲害時，你會不會反而給自己很大的壓力，擔心下一次表現不好？"],"s":["所以容易被期待：","「你應該可以教我。","」"]},"6":{"t":"我開始理解，真正的熟練需要時間","b":["<mark class=\"k\">核心：觀察、整合與技能的成熟。</mark>","","第六爻帶有長遠觀察的意味。放在16號閘門上，一個人可能逐漸理解，技能不只是短期表現，而是長期經驗與練習的累積。","","例如：","•   不再只追求快速學會。","•   更願意觀察自己的進步過程。","•   能夠接受自己仍然需要練習。","•   開始理解，真正的熟練不只在於表現，也在於判斷何時運用技能。","","它不是失去熱情，而是對技能有更成熟的理解，不再只看一時表現，而是看長期發展。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你現在會不會比以前更能夠接受，學習一項技能需要時間？","當你回頭看自己以前學過的東西，會不會發現真正的進步往往來自長期練習？"],"s":["成熟後：","「技能是為了讓我更自由，而不是為了證明我比別人厲害。」"]}},"oh":"技能與熱情","oi":[]},"17":{"h":"觀點、邏輯模式、意見與對未來的理解","i":["17號閘門位於阿基那中心，屬於理解回路。它與形成觀點、整理模式及提出看法有關。","<mark class=\"k\">這個閘門的重點不只是一個人有意見，而是他如何根據觀察與邏輯，形成對事情的理解。</mark>"],"L":{"1":{"t":"我需要先找到觀點的邏輯基礎","b":["<mark class=\"k\">核心：依據、結構與理解。</mark>","","第一爻重視基礎。放在17號閘門上，一個人可能需要先找到支持自己觀點的依據，才比較安心表達。","","例如：","•   討論事情時，希望知道為什麼。","•   不喜歡只聽結論，卻沒有解釋。","•   會搜集資料，試著找出規律。","•   當邏輯不清楚時，可能暫時不願意下判斷。","","它不是單純愛分析，而是需要一定的依據，才能建立自己對事情的看法。"],"q":["當你對一件事形成看法時，會不會很在意背後的理由？","如果別人只告訴你結論，卻沒有解釋原因，你會不會想繼續追問？"],"s":["會喜歡研究：","「到底有沒有邏輯？」"]},"2":{"t":"我自然會看見事情的規律","b":["<mark class=\"k\">核心：自然的模式辨識。</mark>","","第二爻的特質可能自然流露。放在17號閘門上，一個人可能很自然地從不同信息中看見相似之處。","","例如：","•   聽別人描述問題時，很快發現共同點。","•   看到某種做法，會想到它可能產生的結果。","•   別人還沒整理清楚時，他已經有一個初步觀點。","•   自己覺得只是觀察，別人卻覺得分析很有道理。","","它不是每次都能判斷正確，而是可能自然地形成觀點；觀點仍需要接受事實檢驗。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["你會不會很自然地從不同事情中，看見某些相似的規律？","別人有沒有說過，你很快就能整理出自己的看法？"],"s":["可能突然：","「我覺得問題應該是這樣。」"]},"3":{"t":"我需要透過不同經驗修正觀點","b":["<mark class=\"k\">核心：經驗、驗證與觀點調整。</mark>","","第三爻透過經驗學習。放在17號閘門上，一個人可能發現，原本合理的觀點，實際應用後未必完全成立。","","例如：","•   曾經很相信某種工作方式，後來發現有局限。","•   討論後發現自己遺漏了重要的信息。","•   經歷不同情況後，開始調整原來的看法。","•   學會區分理論上合理與現實中有效。","","它不是沒有立場，而是願意透過經驗修正觀點，讓理解更加完整。"],"q":["你有沒有經歷過某件事之後，發現自己以前的看法需要改變？","當新資料與原本觀點不一樣時，你通常會怎樣處理？"],"s":["會不斷：","「真的如此嗎？」"]},"4":{"t":"我的觀點會在交流中產生影響","b":["<mark class=\"k\">核心：人際交流與觀點傳播。</mark>","","第四爻與人際網絡有關。放在17號閘門上，一個人的觀點可能透過朋友、團隊或熟悉的社群傳播。","","例如：","•   在會議中提出不同的看法。","•   和朋友討論時，幫助大家看見問題的另一個角度。","•   透過交流，讓原本模糊的觀點更清楚。","•   因為觀點有邏輯，而被熟悉的人經常詢問意見。","","它不是一定要說服所有人，而是觀點可能在關係交流中產生影響。"],"q":["你會不會經常在討論時，提出別人沒有想到的角度？","當你表達觀點時，身邊的人會不會願意進一步和你討論？"],"s":["喜歡和熟悉的人討論自己的看法。"]},"5":{"t":"別人期待我提供一個清楚的判斷","b":["<mark class=\"k\">核心：觀點的應用與他人投射。</mark>","","第五爻容易受到投射。放在17號閘門上，別人可能期待這個人能夠分析問題、提出建議，或者指出未來可能出現的情況。","","例如：","•   同事遇到問題時，來問他的看法。","•   朋友希望他幫忙分析某段關係。","•   別人認為他應該能看出某個計劃的優缺點。","•   可能因為別人期待答案，而感到必須給出明確結論。","","它不是每個問題都能分析清楚，而是別人可能把判斷與分析的責任投射到他身上。"],"q":["別人會不會常常問你對某件事的看法？","當別人希望你給一個明確答案時，你會不會覺得自己必須分析得很完整？"],"s":["「你怎麼看？」","所以容易成為意見提供者。"]},"6":{"t":"我開始看見觀點只是理解世界的一種方式","b":["<mark class=\"k\">核心：觀察、成熟與觀點的局限。</mark>","","第六爻帶有長遠觀察的意味。放在17號閘門上，一個人可能逐漸理解，再有邏輯的觀點，也未必能夠解釋所有人的經驗。","","例如：","•   開始接受同一件事可以有不同角度。","•   不再急著證明自己的觀點一定正確。","•   更願意觀察新的事實。","•   能夠區分個人看法與客觀事實。","","它不是變得沒有主見，而是逐漸理解，觀點可以幫助自己認識世界，卻不等於世界只有一種解釋。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你有沒有發現，隨著經歷增加，你越來越能夠接受同一件事有不同的解釋？","當別人提出與你不同的觀點時，你現在會不會比較願意先了解他的依據？"],"s":["最終：","「我可以有自己的看法，但不需要所有人都同意。」"]}},"oh":"觀點與邏輯","oi":[]},"18":{"h":"辨識問題、改善、校正與讓事情變得更好","i":["18號閘門位於脾中心，屬於集體理解回路，與辨識需要修正的地方有關。","<mark class=\"k\">它的重點不是挑出所有錯誤，而是看見某些地方可以改善，並辨別怎樣的修正才真正有幫助。</mark>"],"L":{"1":{"t":"我需要先確認，問題到底在哪裡","b":["<mark class=\"k\">核心：辨識問題的基礎。</mark>","","第一爻重視基礎。放在18號閘門上，一個人可能希望先弄清楚問題的根源，再決定是否需要改善。","","例如：","•   看見流程不順時，會想先找原因。","•   不喜歡只解決表面問題。","•   會檢查某種做法為什麼一直出現同樣的錯誤。","•   在提出建議之前，先確認問題是否真實存在。","","它不是單純追求完美，而是需要先辨識問題，才知道怎樣修正才有意義。"],"q":["當你發現事情做得不夠好時，你會不會先想知道真正的原因？","你會不會不滿足於只處理表面，而想找到問題的根源？"],"s":["會喜歡找根本原因。"]},"2":{"t":"我自然會看見可以改善的地方","b":["<mark class=\"k\">核心：自然的修正能力。</mark>","","第二爻的特質可能自然流露。放在18號閘門上，一個人可能很容易發現別人沒有注意到的問題。","","例如：","•   一看流程，就發現某個步驟可以更有效率。","•   很快注意到某種做法不夠合理。","•   自然想到怎樣調整會更好。","•   別人覺得事情已經完成，他卻看見仍有改善空間。","","它不是故意挑剔，而是容易自然看見事情可以被修正的地方；關鍵在於如何表達與運用這個發現。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["你會不會很自然地發現，某件事還有哪裡可以做得更好？","別人覺得已經沒問題的時候，你是不是仍然會注意到一些細節？"],"s":["別人可能覺得沒問題。","你卻看到：","「這裡其實可以更好。」"]},"3":{"t":"我透過修正與錯誤，學習什麼真正有效","b":["<mark class=\"k\">核心：試錯與改善方法。</mark>","","第三爻透過經驗學習。放在18號閘門上，一個人可能需要經過多次嘗試，才知道怎樣改善問題最有效。","","例如：","•   提出一個改進方案，實施後發現並不適合。","•   修正一個流程後，又發現另一個問題。","•   從別人不接受建議的經歷中，學習更好的溝通方式。","•   逐漸分辨哪些問題值得解決，哪些只是個人偏好。","","它不是永遠無法把事情做好，而是透過不斷檢驗和調整，找到真正有效的改善方法。"],"q":["你有沒有試過想改善一件事，結果實施之後才發現還需要調整？","當別人不接受你的建議時，你會不會重新思考自己的方法是否適合？"],"s":["試過之後發現：","「這個改善方式不行。」","於是再調整。"]},"4":{"t":"我會在熟悉的群體中推動改善","b":["<mark class=\"k\">核心：關係中的修正與影響。</mark>","","第四爻與人際網絡有關。放在18號閘門上，一個人可能在家庭、團隊或熟悉的工作環境中，比較容易提出改善建議。","","例如：","•   在團隊中發現流程可以更順暢。","•   對熟悉的人的習慣提出建議。","•   希望共同生活或合作的方式更加合理。","•   因為了解群體的運作，而能看見需要修正的地方。","","它不是要控制別人，而是可能透過熟悉的關係與環境，推動一些實際的改善。"],"q":["在熟悉的團隊或家庭裡，你會不會比較容易發現哪裡可以改善？","當你看見大家一直用一個不太有效的方法做事時，你會不會很想提出建議？"],"s":["可能幫助團隊優化流程。"]},"5":{"t":"別人期待我指出問題並提供解決方案","b":["<mark class=\"k\">核心：改善能力與他人的投射。</mark>","","第五爻容易受到投射。放在18號閘門上，別人可能認為這個人眼光敏銳，能夠找出問題並幫助事情變好。","","例如：","•   同事請他檢查工作有沒有遺漏。","•   別人希望他指出方案的缺點。","•   團隊期待他設計更好的流程。","•   有時因為別人總來問問題，而變得像是負責糾正所有人的人。","","它不是必須修正所有人的問題，而是別人可能期待他承擔改善責任；他仍然需要判斷什麼值得指出、什麼適合由別人處理。"],"q":["別人會不會經常請你檢查事情有沒有問題？","你有沒有因為很容易看見問題，而覺得自己必須負責把它改善好？"],"s":["「你幫我看看哪裡需要改。」","所以容易成為問題發現者。"]},"6":{"t":"我逐漸理解，改善也需要判斷與時機","b":["<mark class=\"k\">核心：成熟的辨識與長遠視角。</mark>","","第六爻帶有長遠觀察的意味。放在18號閘門上，一個人可能越來越明白，不是每個缺點都必須立即修正，也不是每個改善建議都適合現在提出。","","例如：","•   開始選擇真正重要的問題。","•   不再要求每件事都符合自己的標準。","•   更懂得觀察對方是否願意接受建議。","•   理解改善需要時間，也需要實際條件。","","它不是放棄追求進步，而是更成熟地判斷什麼值得改善、什麼時候改善，以及怎樣改善才真正有幫助。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你有沒有發現，自己現在比以前更會選擇哪些問題值得處理？","當你看見別人可以改善的地方時，你會不會比以前更考慮對方是否準備好接受建議？"],"s":["這是 18.6 很重要的成熟。","「看到問題，不代表我一定要處理。」","有些事情只是不同，不一定是錯誤。"]}},"oh":"修正與改善","oi":[]},"19":{"h":"需求、敏感度、親近、資源與歸屬感","i":["19號閘門位於根部中心，屬於部落回路，與需求、資源和人與人之間的依存關係有關。","<mark class=\"k\">這個閘門的重點不只是敏感，而是容易察覺自己或別人需要什麼，以及這些需求能否獲得滿足。</mark>"],"L":{"1":{"t":"我需要先確認，基本需求有沒有被滿足","b":["<mark class=\"k\">核心：需求的基礎與安全感。</mark>","","第一爻重視基礎。放在19號閘門上，一個人可能會特別留意生活中的基本需求，例如時間、支持、資源、陪伴或歸屬感。","","例如：","•   很在意生活是否有足夠的資源。","•   會留意自己有沒有得到支持。","•   對環境是否讓人安心特別敏感。","•   當基本需求沒有被滿足時，很難忽略那種不舒服。","","它不是單純依賴別人，而是需要確認基本需求是否獲得支持，才能安心地與環境互動。"],"q":["當你處於一個環境時，你會不會很快注意到自己是否感到安心、是否得到支持？","如果基本需求一直沒有被滿足，你會不會很難把注意力放在其他事情上？"],"s":["會問：","「我真正需要什麼？」"]},"2":{"t":"我自然會察覺別人的需要","b":["<mark class=\"k\">核心：自然的敏感度與需求感知。</mark>","","第二爻的特質可能自然流露。放在19號閘門上，一個人可能很容易察覺別人需要什麼。","","例如：","•   注意到別人今天情緒不太一樣。","•   在別人開口之前，就發現對方可能需要幫忙。","•   很在意身邊的人有沒有被照顧到。","•   對環境中的氣氛變化比較敏感。","","它不是每次都能準確知道別人需要什麼，而是可能自然注意到需求的線索；仍需要確認，而不是直接替別人決定。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["你會不會常常在別人還沒開口之前，就注意到他可能需要幫助？","當你察覺別人不太對勁時，你通常會主動詢問，還是先觀察？"],"s":["可能很敏感：","「他好像需要幫助。","」"]},"3":{"t":"我透過經驗學習，哪些需求需要回應","b":["<mark class=\"k\">核心：試錯、敏感度與責任界線。</mark>","","第三爻透過經驗學習。放在19號閘門上，一個人可能曾經因為太敏感、太想照顧別人，而承擔超過自己能力的責任。","","例如：","•   看到別人需要幫助，就馬上答應。","•   以為別人希望自己介入，後來發現對方只是想被聽見。","•   曾經為了滿足別人而忽略自己。","•   逐漸學習先確認對方真正需要什麼。","","它不是不再關心別人，而是透過經驗分辨：察覺到需求，不等於必須負責滿足需求。"],"q":["你有沒有因為感覺別人需要幫助，就馬上答應，後來才發現自己承擔太多？","你有沒有經歷過，自己以為對方需要幫助，但後來發現他真正需要的其實不一樣？"],"s":["不是所有需求都需要回應。","會慢慢知道：","「這個我應該幫。」","「這個不需要我負責。」"]},"4":{"t":"我在關係中留意彼此的需求","b":["<mark class=\"k\">核心：人際連接與互相支持。</mark>","","第四爻與人際網絡有關。放在19號閘門上，一個人可能很在意家庭、朋友或團隊之間，是否能夠互相支持。","","例如：","•   會留意家人最近有沒有什麼需要。","•   在團隊中關心大家是否有足夠資源。","•   重視關係中的陪伴和回應。","•   容易成為那個主動詢問別人是否需要幫助的人。","","它不是必須照顧所有人，而是關係中的需求與支持，可能是他特別留意的部分。"],"q":["在親密關係或團隊中，你會不會特別在意彼此有沒有得到足夠的支持？","當你發現身邊的人有需要時，你會不會自然地想做些什麼？"],"s":["可能很容易察覺：","•   情緒","•   需求","•   氣氛","•   別人的不舒服"]},"5":{"t":"別人期待我理解並滿足他們的需求","b":["<mark class=\"k\">核心：照顧責任與他人的投射。</mark>","","第五爻容易受到投射。放在19號閘門上，別人可能期待這個人很敏感、很體貼，應該能夠察覺他們需要什麼。","","例如：","•   家人覺得他應該知道自己需要幫助。","•   朋友期待他主動關心。","•   團隊認為他應該注意大家的感受。","•   當他沒有主動回應時，別人可能覺得他不夠體貼。","","它不是必須猜中所有人的需求，而是別人可能期待他主動照顧他們；關係中仍然需要清楚表達，而不是要求一個人讀懂所有人的心。"],"q":["你有沒有發現，有些人會期待你主動察覺他們的需要？","當別人沒有直接告訴你想要什麼，卻期待你自己發現時，你會有什麼感覺？"],"s":["容易出現：","「你應該懂我需要什麼。」","這就是壓力。"]},"6":{"t":"我逐漸理解，需求需要被看見，也需要被尊重","b":["<mark class=\"k\">核心：成熟的敏感度與需求邊界。</mark>","","第六爻帶有長遠觀察的意味。放在19號閘門上，一個人可能逐漸明白，人與人之間確實需要支持，但每個人的需求也需要自己表達和承擔。","","例如：","•   不再認為自己必須滿足所有人的需要。","•   更願意詢問，而不是自行假設。","•   能夠接受別人有不同的需求。","•   更懂得照顧別人之前，也要留意自己的狀態。","","它不是變得不敏感，而是更成熟地理解需求：看見需求很重要，但尊重彼此的界線同樣重要。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你現在會不會比以前更能分辨，哪些需求是自己可以回應的，哪些需要交還給對方？","當你很在意別人有沒有得到照顧時，你有沒有同時留意自己的需求？"],"s":["這是 19.6 很重要的一課：","「我可以感受到你的需要，但不代表我必須滿足。」"]}},"oh":"需求與敏感度","oi":[]},"20":{"h":"當下的覺察、即時表達與此時此刻的行動","i":["20號閘門位於喉嚨中心，與當下的存在和表達有關。它的重點是此刻正在發生什麼，而不是只停留在過去或未來。"],"L":{"1":{"t":"我需要先確認當下正在發生什麼","b":["<mark class=\"k\">核心：當下覺察的基礎。</mark>","","第一爻重視基礎。放在20號閘門上，一個人可能需要先看清眼前的狀況，才知道如何表達或行動。","","例如：","•   會先觀察現場發生了什麼。","•   不喜歡還沒了解情況就急著回應。","•   需要確認自己正在面對的事情。","•   說話前會先想清楚當下的重點。","","它不是反應慢，而是希望先有足夠的現實依據，再回應眼前的情況。"],"q":["當事情突然發生時，你會不會先觀察清楚，再決定怎樣回應？","你比較容易馬上表達，還是需要先確認眼前的情況？"],"s":["會問：","「現在到底發生什麼？」"]},"2":{"t":"我自然地活在當下","b":["<mark class=\"k\">核心：自然的即時覺察。</mark>","","第二爻的特質可能自然流露。放在20號閘門上，一個人可能很自然地回應眼前正在發生的事。","","例如：","•   說話直接，容易表達此刻的想法。","•   現場有變化時，很快注意到。","•   不一定需要事先準備很多，便能回應眼前的問題。","•   別人覺得他很即時，他自己卻覺得只是順著當下反應。","","它不是每次都必須立即行動，而是對當下的覺察與表達可能自然發生。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["你有沒有發現，自己有時候不需要準備太久，就能回應眼前正在發生的事？","當現場出現變化時，你會不會很快注意到，並自然地作出回應？"],"s":["有時候不會想太遠。","就是：","「現在想做什麼，就做什麼。」"]},"3":{"t":"我透過經驗學習，什麼時候應該立即回應","b":["<mark class=\"k\">核心：試錯與當下判斷。</mark>","","第三爻透過經驗學習。放在20號閘門上，一個人可能曾經太快回應，也可能因為猶豫而錯過時機，後來逐漸學習怎樣拿捏。","","例如：","•   曾經因為馬上說出想法，而引起誤會。","•   經歷之後，學會先確認情況。","•   有時發現即時回應很有幫助，有時則需要暫停。","•   逐漸理解，不是每個當下反應都需要立刻表達。","","它不是反應不穩定，而是透過經驗學習，分辨什麼時候即時回應有幫助，什麼時候暫停更合適。"],"q":["你有沒有因為太快回應，而發現自己忽略了一些重要信息？","你有沒有經歷過，後來才發現當時應該先停一下，而不是馬上說話？"],"s":["事情發生：","「好，現在知道了。」","然後馬上修正。"]},"4":{"t":"我的當下反應會影響周圍的人","b":["<mark class=\"k\">核心：人際互動與即時影響。</mark>","","第四爻與人際網絡有關。放在20號閘門上，一個人的即時表達可能在團隊或關係中產生影響。","","例如：","•   在會議中馬上指出眼前的問題。","•   當氣氛變化時，很快作出回應。","•   在熟悉的關係裡，能夠直接表達當下感受。","•   他的反應可能讓別人更快注意到現場發生的事情。","","它不是必須替所有人作出反應，而是當下的表達可能透過關係產生影響。"],"q":["你會不會發現，自己當下說出的一句話，有時會影響整個現場的氣氛？","當你注意到某件事正在發生時，你通常會馬上說出來，還是先觀察周圍的人？"],"s":["別人會從你的狀態感受到：","「現在應該怎麼做。」"]},"5":{"t":"別人期待我能夠即時給出回應","b":["<mark class=\"k\">核心：即時表現與他人的投射。</mark>","","第五爻容易受到投射。放在20號閘門上，別人可能期待這個人反應快、能夠處理現場，或者馬上給出明確答復。","","例如：","•   工作上常被要求即時決定。","•   別人遇到突發狀況時，第一時間來找他。","•   團隊期待他能夠立刻回應問題。","•   因為別人相信他的反應能力，而感到自己不能猶豫。","","它不是必須隨時都有答案，而是別人可能期待他即時回應；他仍然可以先確認情況，再決定如何行動。"],"q":["別人會不會經常期待你馬上回應或作決定？","當別人催促你立即給答案時，你會不會覺得自己不能停下來思考？"],"s":["「現在怎麼辦？」","所以容易被期待快速回應。"]},"6":{"t":"我逐漸理解，真正的當下不需要勉強","b":["<mark class=\"k\">核心：成熟的覺察與存在感。</mark>","","第六爻帶有觀察與成熟的意味。放在20號閘門上，一個人可能逐漸理解，活在當下並不是不斷反應，而是能夠看見自己此刻真實的狀態。","","例如：","•   不再要求自己每件事都馬上回應。","•   能夠接受某些時候需要安靜。","•   更清楚什麼時候適合行動，什麼時候適合觀察。","•   不再為了證明自己反應快而急著表達。","","它不是失去行動力，而是更成熟地理解當下：有時真實的回應是行動，有時則是先看清楚。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你現在會不會比較能接受，有些事情不需要馬上回應？","當你面對突發狀況時，你會不會比以前更能分辨自己是真的準備好了，還是只是被外界催著行動？"],"s":["即使現在是真的，也只是現在。","「我可以活在當下，也允許下一刻改變。」"]}},"oh":"當下","oi":[]},"21":{"h":"管理、責任、資源與自主權","i":["21號閘門位於意志力中心，屬於部落回路，與管理資源、承擔責任和掌握決定權有關。","<mark class=\"k\">它的重點不只是控制，而是希望事情的責任、資源和決定方式能夠清楚。</mark>"],"L":{"1":{"t":"我需要先知道，誰負責什麼","b":["<mark class=\"k\">核心：責任與管理的基礎。</mark>","","第一爻重視基礎。放在21號閘門上，一個人可能很在意責任是否明確、資源是否受到妥善管理。","","例如：","•   工作開始前，希望知道誰負責哪一部分。","•   對不清楚的權限安排感到不舒服。","•   會先確認預算、規則和責任。","•   不喜歡事情出了問題，卻沒人知道誰應該處理。","","它不是單純喜歡控制，而是需要先建立清楚的責任結構，才比較安心。"],"q":["當你和別人合作時，你會不會很在意責任和權限有沒有說清楚？","如果事情沒有明確負責人，你會不會覺得很難安心？"],"s":["會在意：","「誰負責？錢怎麼管？事情怎麼安排？」"]},"2":{"t":"我自然會想把事情安排好","b":["<mark class=\"k\">核心：自然的管理傾向。</mark>","","第二爻的特質可能自然流露。放在21號閘門上，一個人可能很自然地留意事情有沒有被妥善安排。","","例如：","•   會主動確認事情有沒有人處理。","•   自然注意到資源是否被浪費。","•   在團隊中習慣安排流程。","•   別人覺得他很會管理，他卻覺得只是想讓事情順利。","","它不是每件事都要由自己決定，而是可能自然地注意到事情的安排與管理。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["你會不會很自然地注意到事情有沒有安排妥當？","當你發現某件事沒人管理時，你會不會忍不住想把它安排好？"],"s":["可能看到混亂就想：","「讓我來。」"]},"3":{"t":"我透過管理經驗學習如何拿捏控制","b":["<mark class=\"k\">核心：試錯、權力與責任。</mark>","","第三爻透過經驗學習。放在21號閘門上，一個人可能經歷過管理過多、管理不足，或承擔了不屬於自己的責任。","","例如：","•   曾經把所有事情抓在自己手裡，結果非常疲憊。","•   試過完全放手，後來發現責任不清。","•   透過工作經驗學習如何分配權限。","•   逐漸知道什麼時候應該介入，什麼時候應該讓別人負責。","","它不是管理能力不足，而是透過經驗學習，怎樣在承擔責任與給予空間之間取得平衡。"],"q":["你有沒有試過因為不放心，而把很多事情都抓在自己手裡？","你有沒有經歷過之後，才發現自己需要把部分責任交還給別人？"],"s":["有時候發現：","「管太多反而不好。","」","於是調整。"]},"4":{"t":"我在群體中推動責任與資源的安排","b":["<mark class=\"k\">核心：人際合作與管理影響力。</mark>","","第四爻與人際網絡有關。放在21號閘門上，一個人可能在熟悉的團隊、家庭或合作關係中，比較容易發揮管理能力。","","例如：","•   在團隊中協調誰負責什麼。","•   在家庭裡安排共同資源。","•   發現資源分配不公平時，會想提出調整。","•   透過合作，讓事情的運作更清楚。","","它不是要成為所有人的老板，而是可能透過關係與合作，推動更清楚的責任和資源安排。"],"q":["在團隊或家庭中，你會不會經常參與安排責任或分配資源？","當你發現事情的分工不清楚時，你會不會很想把它重新整理好？"],"s":["別人會開始按照你的安排行動。"]},"5":{"t":"別人期待我負責把事情管理好","b":["<mark class=\"k\">核心：管理責任與他人的投射。</mark>","","第五爻容易受到投射。放在21號閘門上，別人可能認為這個人有能力管理資源，因此期待他負責安排和決定。","","例如：","•   工作上常被委托管理重要事項。","•   別人遇到混亂時，希望他出來處理。","•   團隊期待他承擔最終責任。","•   他可能因為別人相信自己的能力，而不容易拒絕額外責任。","","它不是所有事情都應該由自己負責，而是別人可能期待他掌握局面；他仍然需要確認責任是否合理、自己是否願意承擔。"],"q":["別人會不會經常把需要管理或負責的事情交給你？","你有沒有因為別人覺得你有能力，就接下超過自己負荷的責任？"],"s":["「這個你來處理最適合。」","但不是所有責任都需要你接。"]},"6":{"t":"我逐漸理解，真正的管理也包括放手","b":["<mark class=\"k\">核心：成熟的責任感與長遠管理。</mark>","","第六爻帶有觀察與成熟的意味。放在21號閘門上，一個人可能越來越理解，管理不是掌握每一個細節，而是建立清楚的規則，讓事情能夠持續運作。","","例如：","•   不再事事親自檢查。","•   更願意讓別人承擔自己的責任。","•   能夠接受不同的人有不同的做事方式。","•   關注整體是否運作良好，而不是每個細節是否符合自己的習慣。","","它不是不再負責，而是從親自控制每件事，逐漸走向更成熟的管理方式。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你現在會不會比以前更願意把責任交給別人？","你有沒有發現，真正有效的管理，不一定是自己親自做完所有事情？"],"s":["成熟後：","「真正的掌控，不是控制所有人。」"]}},"oh":"控制與管理","oi":[]},"22":{"h":"情緒開放、優雅、社交狀態與表達的時機","i":["22號閘門位於情緒中心，屬於個體回路，與情緒狀態下的開放和社交表達有關。","<mark class=\"k\">這個閘門的重點不是永遠溫柔或永遠善於社交，而是一個人願意開放多少，可能與當下的情緒狀態密切相關。</mark>"],"L":{"1":{"t":"我需要先理解自己的情緒狀態","b":["<mark class=\"k\">核心：情緒基礎與開放的條件。</mark>","","第一爻重視基礎。放在22號閘門上，一個人可能需要先了解自己當下的感受，才知道是否適合與人互動。","","例如：","•   心情不好的時候，不想勉強社交。","•   需要時間整理情緒，才願意表達。","•   對氣氛不合適的場合比較敏感。","•   不喜歡別人要求自己隨時保持熱情。","","它不是不合群，而是需要先確認自己的情緒狀態，才能自然地打開自己。"],"q":["你會不會發現，自己的社交狀態很容易受到當天心情影響？","當你情緒不太好的時候，你會不會比較想保持自己的空間？"],"s":["會很在意：","「我現在有沒有心情？」"]},"2":{"t":"當情緒狀態合適時，我自然地打開自己","b":["<mark class=\"k\">核心：自然的開放與社交魅力。</mark>","","第二爻的特質可能自然流露。放在22號閘門上，一個人可能在合適的狀態下，自然展現溫柔、親切或富有感染力的一面。","","例如：","•   有感覺時很容易與人交流。","•   在喜歡的環境裡，表現得自然又親切。","•   不需要刻意討好，就能讓人感到舒服。","•   狀態不合適時，卻可能完全不想說話。","","它不是刻意忽冷忽熱，而是開放可能自然發生，也可能隨著情緒狀態改變。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["你有沒有發現，當自己狀態好的時候，會自然變得比較親切或健談？","你是不是不喜歡勉強自己，在沒有感覺的時候也表現得很熱情？"],"s":["有感覺時很有魅力。","沒有感覺時：","「我現在不想說。」"]},"3":{"t":"我透過不同的社交經驗，學習怎樣開放","b":["<mark class=\"k\">核心：經驗與情緒表達的調整。</mark>","","第三爻透過經驗學習。放在22號閘門上，一個人可能經歷過太快打開自己、在不合適的場合表達，或因為情緒而暫時關閉自己。","","例如：","•   曾經在情緒高漲時答應太多事情。","•   發現不是每個環境都適合分享內心感受。","•   透過關係經驗，學習怎樣保護自己。","•   慢慢知道自己需要怎樣的空間，才會覺得自在。","","它不是情緒不穩定就代表無法建立關係，而是透過經驗，學習在開放與保護自己之間找到適合的方式。"],"q":["你有沒有經歷過某些社交經驗，讓你後來更清楚自己適合怎樣與人相處？","你有沒有試過在狀態不好的時候勉強自己社交，最後反而更累？"],"s":["可能經歷：","打開心 → 受傷 → 調整界限。"]},"4":{"t":"我在熟悉的關係中展現開放的一面","b":["<mark class=\"k\">核心：人際連接與情緒交流。</mark>","","第四爻與人際網絡有關。放在22號閘門上，一個人可能在熟悉的關係中，更容易展現自己的溫柔、感受與魅力。","","例如：","•   在朋友面前比在陌生人面前自在。","•   喜歡與信任的人分享感受。","•   通過熟悉的社交圈建立連接。","•   在關係氣氛舒服時，自然帶動交流。","","它不是只能和熟人相處，而是安全與熟悉感可能讓開放更容易發生。"],"q":["你是不是在熟悉的人面前，更容易表現出溫柔或感性的一面？","對你來說，什麼樣的環境會讓你比較願意打開自己？"],"s":["自己的情緒氛圍很容易被別人感受到。"]},"5":{"t":"別人期待我展現親切、優雅的一面","b":["<mark class=\"k\">核心：社交角色與他人的投射。</mark>","","第五爻容易受到投射。放在22號閘門上，別人可能期待這個人懂得社交、會照顧氣氛，或者能夠以得體的方式表達。","","例如：","•   別人認為他很會與人相處。","•   在聚會中，大家期待他活躍氣氛。","•   別人希望他在衝突時表現得溫和。","•   他可能因為不想讓人失望，而勉強自己社交。","","它不是必須永遠表現得溫柔得體，而是別人可能期待他隨時展現開放的一面；他也有權選擇安靜或暫時不參與。"],"q":["別人會不會覺得你很會與人相處，因此期待你負責活躍氣氛？","你有沒有因為別人覺得你應該親切，而勉強自己表現得很熱情？"],"s":["但實際上：","「有魅力不代表我要隨時開放。」"]},"6":{"t":"我逐漸理解，開放也需要順著自己的狀態","b":["<mark class=\"k\">核心：成熟的情緒理解與社交選擇。</mark>","","第六爻帶有觀察與成熟的意味。放在22號閘門上，一個人可能越來越接受，自己並不需要每一天都表現得一樣。","","例如：","•   更能接受有時想獨處。","•   不再因為某天不想社交，就懷疑自己是不是變了。","•   更會選擇適合自己的社交環境。","•   能夠尊重自己，也尊重別人有不同的開放程度。","","它不是變得冷淡，而是更成熟地理解，開放需要真實的狀態，不必成為隨時都要扮演的角色。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你現在會不會比較能接受自己有時想社交、有時只想安靜？","你有沒有發現，當你不再強迫自己表現得熱情時，與人的交流反而更自然？"],"s":["最終知道：","「我有時候開放，有時候需要退回自己。」"]}},"oh":"開放與情緒優雅","oi":[]},"23":{"h":"把復雜的理解說清楚，讓別人聽得懂","i":["23號閘門位於喉嚨中心，屬於個體回路，與把獨特的理解轉化成語言有關。","<mark class=\"k\">它的重點不是說話簡單，而是可能把復雜的想法濃縮成清楚直接的表達。</mark>"],"L":{"1":{"t":"我需要先把想法整理清楚","b":["<mark class=\"k\">核心：表達的基礎與理解結構。</mark>","","第一爻重視基礎。放在23號閘門上，一個人可能需要先在心裡整理好自己的理解，才比較能夠清楚表達。","","例如：","•   想清楚重點之後，才開始解釋。","•   不喜歡自己還沒理解，就急著說服別人。","•   會先整理信息，再決定如何表達。","•   當想法太復雜時，可能暫時不知道從哪裡開始說。","","它不是表達能力差，而是需要先建立清楚的理解，才能把復雜的內容濃縮成簡單的說法。"],"q":["當你想解釋一件復雜的事情時，會不會需要先在心裡整理好重點？","如果自己還沒弄清楚，你會不會很難直接說出來？"],"s":["不是急著表達。","而是：","「我自己都還沒搞懂，怎麼講？」"]},"2":{"t":"我自然會把復雜的東西說得簡單","b":["<mark class=\"k\">核心：自然的表達與簡化能力。</mark>","","第二爻的特質可能自然流露。放在23號閘門上，一個人可能很自然地用簡單的話表達復雜的想法。","","例如：","•   擅長用例子解釋概念。","•   能把長篇內容整理成幾個重點。","•   別人聽不懂時，會換一種說法。","•   自己覺得只是正常解釋，別人卻覺得很清楚。","","它不是刻意把事情講得簡單，而是可能自然找到比較直接的表達方式。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["別人有沒有說過，你很會把復雜的事情解釋得容易理解？","當別人聽不懂時，你會不會很自然地換一個例子再解釋一次？"],"s":["複雜事情突然變成一句：","「其實就是這樣。」"]},"3":{"t":"我需要透過溝通經驗，學習怎樣讓人理解","b":["<mark class=\"k\">核心：試錯與表達調整。</mark>","","第三爻透過經驗學習。放在23號閘門上，一個人可能發現，自己認為很清楚的表達，別人卻未必理解。","","例如：","•   曾經直接說出結論，卻讓別人覺得突然。","•   解釋一個概念時，發現對方缺少背景知識。","•   透過誤會，學習先交代前提。","•   慢慢知道什麼時候應該詳細說明，什麼時候可以直接講重點。","","它不是想法有問題，而是需要透過溝通經驗，學習怎樣讓獨特的理解被別人接收到。"],"q":["你有沒有試過覺得自己已經解釋得很清楚，但別人還是聽不懂？","後來你有沒有發現，換一種說法或補充背景，會讓溝通順利很多？"],"s":["有時候講得太快，別人聽不懂。","於是重新找說法。"]},"4":{"t":"我的表達會在熟悉的關係中被理解","b":["<mark class=\"k\">核心：人際連接與理念交流。</mark>","","第四爻與人際網絡有關。放在23號閘門上，一個人的表達可能在熟悉的群體中更容易被理解，因為彼此已經有共同背景。","","例如：","•   和熟悉的同事溝通時，幾句話就能說清楚。","•   在固定的團隊中，大家比較容易理解他的意思。","•   透過朋友的交流，逐漸找到自己的表達方式。","•   在陌生環境中，需要更多解釋才能讓別人跟上。","","它不是只能和熟人溝通，而是共同背景能夠幫助別人更快理解他的表達。"],"q":["你有沒有發現，和熟悉的人溝通時，很多事情不需要解釋太多，對方就能理解？","當你面對不熟悉的人時，會不會需要先補充更多背景？"],"s":["可能成為：","「把複雜事情講簡單的人。」"]},"5":{"t":"別人期待我把復雜的問題解釋清楚","b":["<mark class=\"k\">核心：表達價值與他人的投射。</mark>","","第五爻容易受到投射。放在23號閘門上，別人可能期待這個人能夠解釋難題、整理重點，或者提出簡單可行的說法。","","例如：","•   同事遇到復雜問題時來問他。","•   別人希望他幫忙整理簡報重點。","•   團隊期待他把抽象概念解釋清楚。","•   他可能因為別人覺得自己很會表達，而承擔過多解釋責任。","","它不是每次都必須讓所有人理解，而是別人可能期待他提供清楚的解釋；溝通是否成功，也取決於聽者的準備度與背景。"],"q":["別人會不會常常找你，幫忙整理重點或解釋復雜的事情？","當別人聽不懂時，你會不會覺得一定是自己沒有解釋好？"],"s":["「你幫我解釋一下。」"]},"6":{"t":"我逐漸理解，清楚表達也需要時機","b":["<mark class=\"k\">核心：成熟的表達與理解的空間。</mark>","","第六爻帶有觀察與成熟的意味。放在23號閘門上，一個人可能越來越知道，不是所有想法都適合立即說出來，也不是每個人都準備好理解自己的觀點。","","例如：","•   不再急著證明自己的理解。","•   更願意先觀察對方是否有興趣。","•   知道有些復雜問題需要慢慢解釋。","•   能夠接受別人暫時聽不懂，不必一直重複。","","它不是不再分享想法，而是更成熟地判斷何時表達、表達多少，以及是否需要給對方時間理解。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你現在會不會比較能接受，不是每個人都能馬上理解你的想法？","當別人聽不懂時，你會不會比以前更願意先觀察，而不是一直解釋？"],"s":["成熟後知道：","「簡單不是把事情說得很淺，而是知道什麼不能省略。」"]}},"oh":"把複雜事情說簡單","oi":[]},"24":{"h":"反覆思考、消化經驗與重新理解","i":["24號閘門位於阿基那中心，屬於個體回路，與反覆思考和把理解帶回意識有關。","<mark class=\"k\">這個閘門的重點不是單純想太多，而是某些問題可能不斷回到腦海中，直到逐漸形成理解。</mark>"],"L":{"1":{"t":"我需要先找到一個能夠理解的基礎","b":["<mark class=\"k\">核心：理解的基礎與邏輯結構。</mark>","","第一爻重視基礎。放在24號閘門上，一個人可能需要找到足夠的解釋，才能安心地放下某個問題。","","例如：","•   對不理解的事情會反覆思考。","•   想知道某件事為什麼會發生。","•   需要把前後邏輯連接起來。","•   如果解釋不完整，可能一直覺得還有哪裡沒弄清楚。","","它不是故意鑽牛角尖，而是需要建立一個可以理解的基礎，才比較容易讓思考告一段落。"],"q":["當你遇到不理解的事情時，會不會一直想弄清楚原因？","如果一件事沒有合理的解釋，你會不會很難真正放下？"],"s":["會不斷問：","「為什麼？」"]},"2":{"t":"我的想法會自然地反覆回來","b":["<mark class=\"k\">核心：自然的思考與重新理解。</mark>","","第二爻的特質可能自然流露。放在24號閘門上，一個人可能發現，某些想法即使暫時放下，過一段時間又會自然浮現。","","例如：","•   走路時突然又想到之前的問題。","•   某個概念會在腦海中反覆出現。","•   沒有刻意思考，卻突然有了新的理解。","•   別人覺得事情已經過去，他卻還在慢慢消化。","","它不是每次都需要刻意思考，而是某些理解可能透過自然的反覆出現，逐漸變得清楚。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["你有沒有發現，某些問題明明暫時放下了，過一段時間卻又自然想到？","有沒有一些理解，是你沒有刻意追求，卻突然在某個時刻明白了？"],"s":["可能想了很久。","突然某一天：","「啊！原來是這樣。","」"]},"3":{"t":"我需要嘗試不同的理解方式","b":["<mark class=\"k\">核心：反覆檢驗與思考調整。</mark>","","第三爻透過經驗學習。放在24號閘門上，一個人可能需要從不同角度理解同一件事，才知道哪些解釋真正說得通。","","例如：","•   一開始相信某個解釋，後來發現還有其他可能。","•   試過問不同的人，聽取不同看法。","•   透過真實經驗修正自己的理解。","•   可能反覆推翻之前的結論，再慢慢整理出新的觀點。","","它不是永遠想不明白，而是透過不同嘗試，逐漸找到較符合經驗的理解。"],"q":["你有沒有為了理解一件事，從不同角度反覆思考？","當你發現原本的解釋不夠完整時，你會不會繼續尋找其他可能？"],"s":["可能一個問題會想很多次。","不是因為沒答案。","而是：","「我要把它真正想通。」"]},"4":{"t":"我會在交流中重新整理自己的理解","b":["<mark class=\"k\">核心：人際交流與思考的消化。</mark>","","第四爻與人際網絡有關。放在24號閘門上，一個人可能透過與熟悉的人交流，逐漸把腦海中的想法整理清楚。","","例如：","•   講出來之後，才發現自己真正想表達什麼。","•   和朋友討論某個問題時，突然想通一部分。","•   透過別人的提問，看見自己遺漏的地方。","•   與熟悉的人交流後，比較容易結束反覆思考。","","它不是一定要別人替自己找答案，而是交流可能幫助自己把內部的思考整理出來。"],"q":["你有沒有發現，有些事情自己想很久都不清楚，但說出來之後反而比較明白？","當你和信任的人討論問題時，會不會更容易整理自己的想法？"],"s":["跟別人討論之後，思路突然清楚。"]},"5":{"t":"別人期待我能夠想出答案","b":["<mark class=\"k\">核心：理解能力與他人的投射。</mark>","","第五爻容易受到投射。放在24號閘門上，別人可能認為這個人很會思考，因此期待他能夠解釋復雜的問題。","","例如：","•   朋友常問他某件事為什麼會發生。","•   同事期待他想出解決問題的思路。","•   別人認為他應該能夠把混亂的事情想清楚。","•   他可能因為想給出答案，而反覆思考同一個問題。","","它不是所有問題都一定有答案，而是別人可能期待他替問題找到解釋；有時允許問題暫時沒有答案，反而更有幫助。"],"q":["別人會不會常常找你分析問題，期待你想出一個解釋？","當你暫時想不出答案時，會不會因為別人期待你而更加焦慮？"],"s":["容易成為：","「你幫我想一下。","」"]},"6":{"t":"我逐漸理解，有些答案需要時間成熟","b":["<mark class=\"k\">核心：成熟的思考與對未知的接受。</mark>","","第六爻帶有觀察與成熟的意味。放在24號閘門上，一個人可能慢慢理解，思考並不一定能夠立即得到答案。","","例如：","•   不再強迫自己每次都要想通。","•   更願意讓某些問題暫時放在一旁。","•   能夠接受新的經驗改變原來的理解。","•   明白有些答案是在生活繼續進行之後才出現。","","它不是放棄思考，而是更成熟地理解，思考有自己的節奏，不需要把每個問題都變成必須立即解決的任務。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你現在會不會比較能夠接受，有些事情暫時想不通也沒關係？","你有沒有發現，有些答案是在經歷更多事情之後，才慢慢明白的？"],"s":["最終：","「不是每一個問題都需要現在得到答案。」"]}},"oh":"反覆思考與頓悟","oi":[]},"25":{"h":"真誠、接納、開放與對生命的信任","i":["25號閘門位於G中心，屬於個體回路，與精神上的開放和對生命的接納有關。","<mark class=\"k\">這裡所說的愛，不應該簡單理解成對所有人都好，也不是沒有原則地包容一切。更重要的是，如何面對生命、面對自己，以及在經歷不同事情後，仍然保有真誠。</mark>"],"L":{"1":{"t":"我需要先建立對自己的接納","b":["<mark class=\"k\">核心：接納的基礎與內在安全感。</mark>","","第一爻重視基礎。放在25號閘門上，一個人可能需要先建立對自己的基本接納，才比較能夠面對外界的評價與變化。","","例如：","•   會思考自己是否值得被愛。","•   在受到批評時，容易懷疑自己。","•   需要時間理解自己的真實感受。","•   希望先確認自己能夠接受自己，才有空間接納別人。","","它不是必須先變得完美才值得被愛，而是學習建立不完全依賴外界認可的內在基礎。"],"q":["當別人不認同時，你會不會很容易開始懷疑自己？","對你來說，接納自己是一件自然的事，還是需要經過很多經歷才慢慢學會？"],"s":["會問：","「我能不能相信生命？」"]},"2":{"t":"我自然地以真誠的方式面對別人","b":["<mark class=\"k\">核心：自然的開放與真誠。</mark>","","第二爻的特質可能自然流露。放在25號閘門上，一個人可能不太喜歡刻意偽裝，傾向於以比較直接、真實的方式與人相處。","","例如：","•   不太喜歡復雜的人際算計。","•   與人交流時，比較重視真誠。","•   不一定會因為別人不喜歡自己，就馬上改變所有做法。","•   別人可能覺得他有一種自然、不做作的感覺。","","它不是認為自己永遠正確，而是比較自然地重視真誠，不願意為了迎合別人而完全失去自己。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["你是不是比較喜歡直接、真誠的人際關係？","當你發現自己需要刻意扮演某種角色才能被接受時，你會有什麼感覺？"],"s":["有時候不太會複雜計算。","就是：","「我覺得這樣做是對的。」"]},"3":{"t":"我透過受傷與失望，重新理解接納","b":["<mark class=\"k\">核心：經驗、衝擊與接納的學習。</mark>","","第三爻透過經驗學習。放在25號閘門上，一個人可能需要經歷失望、被誤解或關係變化，才逐漸理解接納的真實含義。","","例如：","•   曾經因為信任別人而受傷。","•   發現不是每個人都會用同樣方式回應自己的真誠。","•   經歷衝突後，重新思考怎樣接納別人。","•   學會不因為一次受傷，就否定所有關係。","","它不是必須經歷痛苦才能成長，而是現實經驗可能幫助一個人理解，接納並不等於沒有界線，也不等於所有事情都必須原諒。"],"q":["你有沒有經歷過某段關係，讓你重新理解什麼叫接納？","當別人傷害你時，你會不會在接納對方和保護自己之間感到矛盾？"],"s":["可能經歷：","•   受傷","•   失望","•   改變","然後重新理解：","「原來生命是這樣的。」"]},"4":{"t":"我在關係中學習接納彼此的不同","b":["<mark class=\"k\">核心：人際連接與真誠的相處。</mark>","","第四爻與人際網絡有關。放在25號閘門上，一個人可能透過關係，學習怎樣在差異中保有真誠。","","例如：","•   能夠和與自己不同的人相處。","•   不一定要求朋友與自己有相同觀點。","•   在關係中重視真實，而不是表面和諧。","•   希望人與人之間可以減少偽裝。","","它不是必須和所有人建立親密關係，而是能夠在合適的關係裡，給彼此保有真實的空間。"],"q":["你會不會覺得，關係中最重要的是能夠做真實的自己？","當你和別人有不同的觀點時，你能不能在保留自己立場的同時，仍然尊重對方？"],"s":["別人可能在你身上感受到：","「不用那麼複雜。」"]},"5":{"t":"別人期待我表現出接納與善意","b":["<mark class=\"k\">核心：接納形象與他人的投射。</mark>","","第五爻容易受到投射。放在25號閘門上，別人可能期待這個人寬容、善良，或者無論發生什麼都能夠理解別人。","","例如：","•   別人認為他應該原諒某個人。","•   朋友期待他總是保持善意。","•   他可能被認為不會計較、不會拒絕。","•   有時因為不想被認為不夠善良，而勉強接受自己不舒服的事情。","","它不是必須滿足別人對善良的期待，而是別人可能把「你應該能夠接納」的角色放在他身上。接納與設立界線可以同時存在。"],"q":["別人會不會覺得你比較容易體諒別人，所以期待你不要計較？","你有沒有因為不想讓別人覺得自己不夠善良，而勉強接受某些事情？"],"s":["於是期待：","「你應該不會拒絕我吧？」","但純真不代表沒有界限。"]},"6":{"t":"我逐漸理解，接納不代表所有事情都必須認同","b":["<mark class=\"k\">核心：成熟、開放與內在整合。</mark>","","第六爻帶有觀察與成熟的意味。放在25號閘門上，一個人可能逐漸理解，真誠地面對生命，並不代表自己必須認同每一種行為。","","例如：","•   能夠接受自己有復雜的情緒。","•   明白理解別人不等於讚同別人。","•   更清楚自己的價值觀與界線。","•   面對不同經歷時，不再急著把一切分成好與壞。","","它不是失去原則，而是更成熟地理解接納：可以承認事情發生過、理解人的復雜性，同時決定自己願意如何回應。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你有沒有發現，自己現在比較能夠理解一個人，但不一定認同他的做法？","當你接受一件已經發生的事時，會不會發現自己也更有空間決定下一步怎麼走？"],"s":["最終：","「我可以愛一個人，但不需要替他的人生負責。」"]}},"oh":"無條件的愛與純真","oi":[]},"26":{"h":"說服、呈現價值、記憶重點與資源交換","i":["26號閘門位於意志力中心，屬於部落回路，與影響別人、呈現價值和爭取資源有關。","<mark class=\"k\">這個閘門不應該簡單理解成欺騙或推銷。更準確地說，它涉及如何選擇信息、呈現重點，以及讓別人看見某件事的價值。</mark>"],"L":{"1":{"t":"我需要先弄清楚，自己要傳達什麼","b":["<mark class=\"k\">核心：表達策略的基礎。</mark>","","第一爻重視基礎。放在26號閘門上，一個人可能需要先了解自己真正要傳達的重點，才知道如何說服別人。","","例如：","•   推介產品前先了解產品的優缺點。","•   說服別人之前，先整理自己要表達的內容。","•   不喜歡自己對事情一知半解，卻要承擔推介責任。","•   會先思考怎樣表達才能讓信息更準確。","","它不是只追求說服力，而是需要先有清楚的內容與依據，才能有效呈現價值。"],"q":["當你需要說服別人時，會不會先整理自己真正想表達的重點？","如果你對一件事還不夠了解，你會不會比較難開口推薦？"],"s":["會很在意：","「我拿什麼去影響別人？」"]},"2":{"t":"我自然知道怎樣呈現重點","b":["<mark class=\"k\">核心：自然的表達策略。</mark>","","第二爻的特質可能自然流露。放在26號閘門上，一個人可能很自然地知道，應該強調什麼信息，才能讓別人理解一件事的價值。","","例如：","•   介紹事情時，能夠很快抓住重點。","•   知道不同的人會在意不同的信息。","•   擅長把復雜的內容整理成吸引人的表達。","•   別人覺得他很會溝通，他卻覺得只是正常說明。","","它不是每次都能準確影響別人，而是可能自然注意到信息應該怎樣呈現；仍需要保持真實與誠信。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["你有沒有發現，自己很自然地知道該怎樣介紹一件事？","當你面對不同的人時，會不會自然調整表達的重點？"],"s":["會觀察：","「對方這樣聽比較懂。」"]},"3":{"t":"我透過經驗學習，怎樣有效又誠實地表達","b":["<mark class=\"k\">核心：試錯、說服與誠信。</mark>","","第三爻透過經驗學習。放在26號閘門上，一個人可能曾經因為表達過度、強調錯誤重點，或者沒有充分說明事實而產生誤會。","","例如：","•   曾經為了讓別人接受，而把事情說得太滿。","•   發現不同的人需要不同的信息。","•   經歷誤會後，學習更準確地表達。","•   逐漸理解，短期說服成功不代表長期信任也會建立。","","它不是天生不誠實，而是需要透過經驗學習，如何運用說服力而不扭曲事實。"],"q":["你有沒有經歷過，為了讓別人接受自己的觀點，後來發現自己說得太多或太滿？","你現在會不會比以前更在意，表達的內容是否準確，而不只是能不能說服別人？"],"s":["可能試過：","「這樣講有效。」","「這樣講別人反而抗拒。」"]},"4":{"t":"我透過關係與信任，傳遞自己的價值","b":["<mark class=\"k\">核心：人際連接與影響力。</mark>","","第四爻與人際網絡有關。放在26號閘門上，一個人的說服力可能來自長期關係、信任與熟悉感。","","例如：","•   朋友比較願意聽他的建議。","•   通過長期合作，建立可靠的個人形象。","•   能夠在熟悉的圈子中介紹機會或資源。","•   發現信任往往比單次的表達技巧更重要。","","它不是只靠人情來影響別人，而是關係與信任可能幫助價值更容易被理解。"],"q":["你有沒有發現，別人對你的信任，會影響他們願不願意接受你的建議？","當你需要推薦某件事時，你會不會特別重視自己與對方之間的信任？"],"s":["熟悉的人更容易接受你的建議。"]},"5":{"t":"別人期待我能夠說服別人或爭取結果","b":["<mark class=\"k\">核心：影響力與他人的投射。</mark>","","第五爻容易受到投射。放在26號閘門上，別人可能期待這個人很會談判、推介、溝通，或者能為團隊爭取到資源。","","例如：","•   工作上常被安排談判或介紹方案。","•   別人期待他能夠說服客戶。","•   團隊希望他幫忙爭取機會。","•   因為大家覺得他很會說話，而要求他承擔不合理的目標。","","它不是必須為每個結果負責，而是別人可能把說服與爭取資源的期待放在他身上。"],"q":["別人會不會常常期待你去溝通、談判，或說服別人接受某個方案？","當別人認為你很會說話時，你會不會因此覺得自己必須把事情談成？"],"s":["容易被認為：","「你很會談、很會說服人。」"]},"6":{"t":"我逐漸理解，真正的影響力需要建立在信任上","b":["<mark class=\"k\">核心：成熟的策略與長期信譽。</mark>","","第六爻帶有觀察與成熟的意味。放在26號閘門上，一個人可能逐漸理解，表達技巧可以帶來短期結果，但長期的信任更重要。","","例如：","•   不再為了短期成功而誇大事情。","•   更重視承諾是否能夠兌現。","•   能夠接受別人不一定會被自己說服。","•   明白信譽需要長期建立。","","它不是放棄影響別人，而是更成熟地使用表達策略，讓說服力與真實、責任和長期信任保持一致。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你現在會不會比以前更重視長期信任，而不是只關注一次溝通有沒有成功？","當你知道某種說法可以說服別人，但不完全準確時，你會怎樣選擇？"],"s":["成熟後：","「真正的影響，是讓對方自己看見價值，而不是逼對方接受。」"]}},"oh":"影響、說服與資源","oi":[]},"27":{"h":"照顧、給予、營養、責任與生命的維持","i":["27號閘門位於薦骨中心，屬於部落回路，與照顧、滋養和維持生命有關。","<mark class=\"k\">這個閘門不只是喜歡幫助別人，而是會涉及：什麼值得被照顧、怎樣給予，以及照顧的責任應該到哪裡為止。</mark>"],"L":{"1":{"t":"我需要先知道，什麼值得我照顧","b":["<mark class=\"k\">核心：照顧的基礎與責任判斷。</mark>","","第一爻重視基礎。放在27號閘門上，一個人可能需要先確認自己的責任、資源和能力，才知道應該把照顧放在哪裡。","","例如：","•   會考慮自己有沒有時間幫助別人。","•   對家庭責任特別認真。","•   希望知道自己的付出是否真正有幫助。","•   在答應照顧別人之前，會想清楚自己能不能承擔。","","它不是不願意付出，而是需要先確認自己有能力提供怎樣的照顧，才比較能夠持續給予。"],"q":["當別人需要幫助時，你會不會先考慮自己有沒有能力承擔？","你有沒有發現，自己比較願意照顧那些你認為真正需要、也值得你投入的人？"],"s":["重點是基礎和安全感。","會在意：","「我要把我的時間、能量給誰？」","可能會思考：","•   誰真的需要我的幫助？","•   什麼是我的責任？","•   我有沒有能力照顧？","•   這樣幫助真的有用嗎？","它不是單純「很會照顧人」。","而是：","「我要先知道什麼值得我給予。」"]},"2":{"t":"我自然會想照顧別人","b":["<mark class=\"k\">核心：自然的給予與滋養。</mark>","","第二爻的特質可能自然流露。放在27號閘門上，一個人可能很自然地留意別人有沒有吃好、休息好，或是否需要支持。","","例如：","•   看到朋友沒吃飯，會自然關心。","•   家人不舒服時，主動準備需要的東西。","•   習慣詢問別人是否需要幫忙。","•   別人覺得他很照顧人，他卻覺得只是順手。","","它不是必須照顧所有人，而是給予與滋養可能自然地出現在日常行為中。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["你有沒有發現，自己會很自然地留意身邊的人有沒有得到照顧？","當你看見別人缺少某些東西時，會不會不自覺地想幫忙補上？"],"s":["可能看到別人需要：","「我幫你。」","不需要特別計劃。"]},"3":{"t":"我透過照顧經驗，學習給予的界線","b":["<mark class=\"k\">核心：試錯、責任與自我照顧。</mark>","","第三爻透過經驗學習。放在27號閘門上，一個人可能曾經給得太多、照顧得太多，後來才發現自己也需要被照顧。","","例如：","•   因為怕別人辛苦，而接下太多責任。","•   幫助別人之後，發現自己已經沒有休息時間。","•   以為自己必須解決對方的問題。","•   透過疲憊或失望，逐漸學習先確認自己的能力。","","它不是失去愛心，而是透過經驗理解，真正的滋養不應該以長期耗盡自己為代價。"],"q":["你有沒有因為太想照顧別人，後來發現自己反而很累？","你有沒有經歷過之後，才開始學習在幫助別人之前先照顧自己？"],"s":["可能：","幫太多 → 累了 → 調整。","慢慢知道：","「照顧別人，也需要有邊界。」"]},"4":{"t":"我的照顧會在關係中流動","b":["<mark class=\"k\">核心：關係、互相照顧與群體支持。</mark>","","第四爻與人際網絡有關。放在27號閘門上，一個人可能在家庭、朋友或團隊中，扮演照顧與支持的角色。","","例如：","•   在朋友有需要時主動關心。","•   記得家人需要什麼。","•   在團隊中注意成員是否獲得足夠支持。","•   透過照顧，讓關係產生穩定感。","","它不是單方面承擔所有責任，而是照顧也可以是一種互相支持的關係。"],"q":["在家庭或朋友圈裡，你會不會經常成為主動關心別人、提供幫助的人？","當你照顧別人時，你是否也能夠接受別人照顧你？"],"s":["別人可能很自然覺得：","「有你在，我比較安心。」"]},"5":{"t":"別人期待我成為那個會照顧人的人","b":["<mark class=\"k\">核心：照顧角色與他人的投射。</mark>","","第五爻容易受到投射。放在27號閘門上，別人可能認為這個人很有愛心、很會照顧人，因此把更多責任交給他。","","例如：","•   家人習慣讓他處理生活中的大小事。","•   朋友遇到困難時，第一時間找他。","•   團隊認為他會主動照顧大家。","•   他可能因為不想讓人失望，而很難拒絕新的責任。","","它不是每個人的需要都必須由自己滿足，而是別人可能把照顧者的角色放在他身上；他需要判斷哪些責任是自己願意承擔的。"],"q":["別人會不會常常認為你很會照顧人，所以遇到問題就來找你？","你有沒有因為不想讓別人失望，而答應了其實已經超出自己能力的事情？"],"s":["容易出現：","「你不是很會照顧人嗎？」","於是別人可能把責任丟給你。"]},"6":{"t":"我逐漸理解，真正的滋養需要雙方都能持續","b":["<mark class=\"k\">核心：成熟的照顧與長遠責任。</mark>","","第六爻帶有觀察與成熟的意味。放在27號閘門上，一個人可能逐漸理解，照顧不是一次性付出，也不是無止境地滿足別人。","","例如：","•   更重視照顧是否能夠長期持續。","•   明白別人也需要學習照顧自己。","•   不再因為拒絕一次幫助，就認為自己不夠善良。","•   開始建立更健康的給予與接受關係。","","它不是變得自私，而是更成熟地理解，真正的滋養應該支持生命，而不是讓照顧者與被照顧者都失去自主性。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你現在會不會比以前更在意，自己的付出能不能長期持續？","當你沒有能力幫助別人時，你能不能接受自己需要先照顧好自己？"],"s":["最終理解：","「我不是只有給予別人，才能證明自己有價值。」"]}},"oh":"照顧與滋養","oi":[]},"28":{"h":"意義、挑戰、生命價值與值得投入的風險","i":["28號閘門位於脾中心，屬於個體回路，與尋找生命的意義，以及願意為值得的事情面對挑戰有關。","<mark class=\"k\">這個閘門不是喜歡危險，而是可能很在意：如果一件事沒有意義，為什麼要投入生命與時間？</mark>"],"L":{"1":{"t":"我需要先知道，這場挑戰有什麼意義","b":["<mark class=\"k\">核心：意義的基礎與風險判斷。</mark>","","第一爻重視基礎。放在28號閘門上，一個人可能需要先確認一件事值得自己投入，才願意承擔其中的困難。","","例如：","•   不喜歡只為了忙碌而忙碌。","•   會思考一份工作對自己有什麼意義。","•   面對重大選擇時，想知道自己為什麼要做。","•   不願意為了外界期待，承擔沒有價值的風險。","","它不是害怕挑戰，而是希望先知道自己為什麼而戰，才願意投入。"],"q":["當你面對一件很辛苦的事情時，你會不會先想知道它對你有什麼意義？","如果一件事看起來很有成就，卻讓你覺得沒有意義，你還會願意繼續嗎？"],"s":["會問：","「這件事情值得嗎？」"]},"2":{"t":"我自然會被有挑戰性的事情吸引","b":["<mark class=\"k\">核心：自然的挑戰意識。</mark>","","第二爻的特質可能自然流露。放在28號閘門上，一個人可能會對某些具有挑戰性、需要勇氣的事情產生興趣。","","例如：","•   對困難的問題有好奇心。","•   不容易因為事情復雜就馬上退縮。","•   喜歡探索自己還沒有經歷過的領域。","•   別人覺得風險很大，他卻覺得值得了解。","","它不是為了刺激而冒險，而是某些挑戰可能自然吸引他，讓他想知道其中是否有值得投入的意義。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["有沒有一些事情，別人覺得很難，但你反而會想試試看？","當你面對挑戰時，你比較容易被困難嚇退，還是會想知道自己能從中獲得什麼？"],"s":["可能突然：","「這個我就是很想做。」"]},"3":{"t":"我透過挑戰與失敗，尋找真正的意義","b":["<mark class=\"k\">核心：經驗、風險與生命價值的辨認。</mark>","","第三爻透過經驗學習。放在28號閘門上，一個人可能需要親自經歷一些挑戰，才知道什麼值得自己堅持。","","例如：","•   曾經為了一個目標付出很多，後來發現並不適合。","•   經歷失敗後，重新思考自己真正重視什麼。","•   試過追求別人眼中的成功，卻感到空虛。","•   透過困難，逐漸分辨哪些目標只是外界期待。","","它不是注定要經歷苦難，而是現實經驗可能幫助一個人看清，哪些挑戰真正值得承擔。"],"q":["你有沒有經歷過一件很辛苦的事情，後來才發現自己真正重視的是什麼？","有沒有一些目標，你曾經很想得到，但經歷之後發現它並沒有想象中那麼重要？"],"s":["可能經歷：","•   失敗","•   挑戰","•   風險","•   極端經驗","然後知道：","「這個值得。」"]},"4":{"t":"我會在關係與群體中尋找值得堅持的事情","b":["<mark class=\"k\">核心：人際連接與共同意義。</mark>","","第四爻與人際網絡有關。放在28號閘門上，一個人可能透過朋友、團隊或共同目標，找到值得投入的挑戰。","","例如：","•   為自己重視的團隊努力。","•   因為朋友的支持，願意面對困難。","•   在共同經歷中找到目標的意義。","•   透過合作，看見個人努力能夠帶來的影響。","","它不是必須為了群體犧牲自己，而是有意義的關係與共同目標，可能讓挑戰更值得投入。"],"q":["你有沒有因為某個人或某個團隊，而更願意面對原本很困難的事情？","對你來說，和自己重視的人一起完成一件事，會不會讓過程更有意義？"],"s":["別人可能因為看到你堅持，而重新思考自己。"]},"5":{"t":"別人期待我勇敢面對困難","b":["<mark class=\"k\">核心：勇氣的角色與他人的投射。</mark>","","第五爻容易受到投射。放在28號閘門上，別人可能認為這個人很勇敢，能夠面對困難，因此期待他承擔挑戰。","","例如：","•   別人遇到問題時，希望他站出來。","•   團隊認為他能夠處理困難的任務。","•   他可能被期待成為那個不輕易放棄的人。","•   有時即使已經很疲憊，也不願承認自己需要退出。","","它不是必須證明自己勇敢，而是別人可能期待他承擔困難；他仍然需要判斷這件事是否值得自己付出。"],"q":["別人會不會覺得你很能扛事，所以遇到困難就找你？","你有沒有因為不想被認為退縮，而繼續堅持一件其實已經不適合自己的事情？"],"s":["可能有人問：","「你覺得我應該做什麼才有意義？」","但這個答案不能替別人決定。"]},"6":{"t":"我逐漸理解，真正的勇氣也包括選擇","b":["<mark class=\"k\">核心：成熟的風險判斷與生命價值。</mark>","","第六爻帶有觀察與成熟的意味。放在28號閘門上，一個人可能越來越明白，勇敢不只是堅持到底，也包括知道什麼值得繼續、什麼需要放下。","","例如：","•   不再為了證明自己而挑戰所有困難。","•   能夠接受退出某個目標不代表失敗。","•   更清楚自己真正重視的價值。","•   願意把有限的時間與精力放在有意義的事情上。","","它不是失去勇氣，而是更成熟地理解，勇氣應該服務於生命價值，而不是成為不斷證明自己的壓力。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你現在會不會比以前更懂得選擇哪些挑戰值得投入？","你有沒有發現，放下一件不再適合自己的事情，有時也需要很大的勇氣？"],"s":["最終：","「意義不一定是找到一個最終答案，而是我正在經歷的人生本身。」"]}},"oh":"意義、冒險與生命價值","oi":[]},"29":{"h":"投入、堅持、經驗與答應之後的責任","i":["29號閘門位於薦骨中心，屬於集體感知回路，與投入和承諾有關。","<mark class=\"k\">這個閘門的重點不只是堅持，而是一個人如何回應機會、作出承諾，並經歷承諾所帶來的過程。</mark>"],"L":{"1":{"t":"我需要先確認，自己是否真的願意投入","b":["<mark class=\"k\">核心：承諾的基礎與選擇。</mark>","","第一爻重視基礎。放在29號閘門上，一個人可能需要先確認自己真正想不想參與，才適合對事情作出承諾。","","例如：","•   不喜歡在還沒了解清楚時就答應。","•   會考慮時間、精力和現實條件。","•   希望知道自己要承擔什麼。","•   如果沒有真正的意願，答應之後可能會覺得沉重。","","它不是不願意承諾，而是需要先確認投入的基礎，避免因為一時壓力而答應。"],"q":["當別人邀請你參與一件事時，你會不會先確認自己是不是真的想做？","你有沒有因為太快答應，後來才發現自己其實沒有準備好？"],"s":["會在承諾前認真考慮。"]},"2":{"t":"當我真正回應了，我自然會投入","b":["<mark class=\"k\">核心：自然的投入與持續性。</mark>","","第二爻的特質可能自然流露。放在29號閘門上，當一個人真的願意投入某件事時，可能不需要別人一直催促。","","例如：","•   對有興趣的項目持續投入。","•   一旦答應參與，就自然開始行動。","•   願意體驗事情完整的發展過程。","•   別人覺得他很堅持，他卻覺得自己只是想把事情做好。","","它不是每件事都要堅持到底，而是當回應真實、投入合適時，持續參與可能自然發生。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["有沒有一些事情，是你真正想做，所以不需要別人催促也會持續投入？","當你答應了一件自己真心想做的事，你會不會自然地想把它完成？"],"s":["一旦身體真的答應：","「那我就做。」"]},"3":{"t":"我透過承諾的經驗，學習什麼時候該答應","b":["<mark class=\"k\">核心：試錯、承諾與調整。</mark>","","第三爻透過經驗學習。放在29號閘門上，一個人可能經歷過答應太多、堅持得太久，或中途發現自己並不適合。","","例如：","•   因為不想讓別人失望而答應。","•   後來發現時間與精力不夠。","•   曾經因為害怕被說不堅持，而勉強繼續。","•   透過這些經驗，逐漸學習答應之前先確認自己的意願。","","它不是沒有責任感，而是透過經歷，學習區分真正的承諾與被壓力推動的答應。"],"q":["你有沒有答應過一些事情，後來才發現自己其實並不想繼續？","當你已經答應別人時，你會不會因為不想讓人失望，而很難說出自己已經無法承擔？"],"s":["可能：","「我當時答應太快了。」","於是學習辨識。"]},"4":{"t":"我的承諾會在關係中建立信任","b":["<mark class=\"k\">核心：人際連接與共同投入。</mark>","","第四爻與人際網絡有關。放在29號閘門上，一個人可能透過長期的合作與承諾，在關係中建立信任。","","例如：","•   在團隊中願意持續參與共同目標。","•   對朋友作出的承諾，會認真看待。","•   透過共同經歷，讓關係逐漸加深。","•   願意和信任的人一起完成一個長期計劃。","","它不是為了維持關係而什麼都答應，而是透過適合的承諾，讓關係建立在實際投入上。"],"q":["你會不會覺得，和別人一起經歷一段過程，會讓關係變得更深？","當你答應朋友或團隊一件事時，你會不會特別在意自己有沒有兌現？"],"s":["別人會覺得：","「他說會做，就真的會做。」"]},"5":{"t":"別人期待我成為那個堅持到底的人","b":["<mark class=\"k\">核心：持續投入與他人的投射。</mark>","","第五爻容易受到投射。放在29號閘門上，別人可能認為這個人有毅力，因此期待他接下事情並堅持到底。","","例如：","•   別人認為他答應了就一定會做到。","•   團隊把需要長期投入的任務交給他。","•   別人覺得他很可靠，不容易中途退出。","•   他可能因為害怕讓人失望，而繼續承擔不適合自己的承諾。","","它不是所有承諾都必須堅持到底，而是別人可能期待他成為可靠的人；他仍然需要判斷原本的承諾是否合理，以及現實條件有沒有改變。"],"q":["別人會不會覺得你答應了就一定會做到，因此常把長期任務交給你？","你有沒有因為不想讓人失望，而繼續一件自己已經很不願意做的事情？"],"s":["容易被投射：","「你答應了就不能改變。」","但有時候重新選擇也是必要的。"]},"6":{"t":"我逐漸理解，承諾需要經過選擇與成熟","b":["<mark class=\"k\">核心：長遠視角與承諾的智慧。</mark>","","第六爻帶有觀察與成熟的意味。放在29號閘門上，一個人可能越來越明白，真正重要的不是答應越多越好，而是知道哪些事情值得自己完整體驗。","","例如：","•   更謹慎地答應新的責任。","•   不再把每個機會都當成必須抓住的機會。","•   理解承諾需要時間、精力與現實條件支持。","•   更能夠區分堅持與勉強。","","它不是變得不負責任，而是更成熟地理解，真正的承諾需要真實的意願，也需要能夠持續的條件。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你現在會不會比以前更謹慎地決定要答應什麼？","當機會出現時，你會不會開始問自己，這是不是一段真正值得投入的經歷？"],"s":["成熟後：","「真正的堅持，是知道什麼值得繼續。」"]}},"oh":"承諾與堅持","oi":[]},"30":{"h":"渴望、期待、情緒體驗與對未來經歷的向往","i":["30號閘門位於情緒中心，屬於集體感知回路，與欲望和體驗的渴望有關。","<mark class=\"k\">這個閘門不是單純貪心，而是可能對某種體驗有強烈期待，希望生命能夠經歷一些重要的事情。</mark>"],"L":{"1":{"t":"我需要先知道，自己真正渴望什麼","b":["<mark class=\"k\">核心：欲望的基礎與自我理解。</mark>","","第一爻重視基礎。放在30號閘門上，一個人可能需要先了解自己的渴望來自哪裡，才知道是否值得追求。","","例如：","•   會想知道自己為什麼那麼想得到某個結果。","•   對某個目標有期待，卻還不確定原因。","•   需要時間分辨是真正想要，還是受到別人影響。","•   會思考這個願望是否符合自己的生活方向。","","它不是必須壓抑欲望，而是先了解自己真正渴望什麼，才比較能夠作出清楚的選擇。"],"q":["當你很想得到某個結果時，你會不會進一步思考自己為什麼那麼想要？","你有沒有發現，有些渴望是自己真正想要的，有些卻是受到外界期待影響？"],"s":["會問：","「我到底想要什麼？」"]},"2":{"t":"我自然會對某些體驗產生強烈期待","b":["<mark class=\"k\">核心：自然的渴望與情緒向往。</mark>","","第二爻的特質可能自然流露。放在30號閘門上，一個人可能很自然地被某些未來體驗吸引。","","例如：","•   對旅行、關係或新生活有強烈想象。","•   想到某個目標時，內心會出現很大的期待。","•   對有情感意義的事情特別向往。","•   別人覺得只是一個普通目標，他卻能感受到很強烈的渴望。","","它不是每個願望都需要實現，而是對體驗的向往可能自然出現；渴望本身不等於結果一定會發生。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["有沒有一些事情，只要想到未來可能經歷，你就會產生很強烈的期待？","當你對某件事有渴望時，你會不會很容易開始想象它發生之後的感覺？"],"s":["突然很想：","•   戀愛","•   旅行","•   成功","•   體驗","•   做某件事情"]},"3":{"t":"我透過期待落空的經驗，學習面對欲望","b":["<mark class=\"k\">核心：試錯、情緒體驗與調整期待。</mark>","","第三爻透過經驗學習。放在30號閘門上，一個人可能經歷過期待很高、結果卻不如預期，才慢慢學習怎樣面對欲望。","","例如：","•   對某個結果期待很久，後來發現現實不同。","•   因為過度期待，而在事情發生時感到失落。","•   經歷之後，學會讓期待保留彈性。","•   逐漸理解，體驗的價值不一定等於最終結果。","","它不是不應該期待，而是透過真實經歷學習，怎樣在保有渴望的同時，也容許現實有不同的發展。"],"q":["你有沒有因為對一件事期待太高，最後反而特別失望？","你後來有沒有學會，在期待某個結果的同時，也給現實保留一點空間？"],"s":["得到之後才發現：","「原來我真正想要的不是這個。」"]},"4":{"t":"我的渴望會在關係中被激發","b":["<mark class=\"k\">核心：人際連接與共同期待。</mark>","","第四爻與人際網絡有關。放在30號閘門上，一個人的渴望可能會在關係和共同經歷中被激發。","","例如：","•   因為認識某個人，而開始向往一種新的生活。","•   與朋友討論未來時，發現自己真正想要什麼。","•   因為共同目標，對某段經歷產生期待。","•   透過關係，看見自己原本沒有意識到的渴望。","","它不是自己的願望必須來自別人，而是關係可能幫助自己看見或激發原本存在的向往。"],"q":["有沒有一些願望，是你認識某個人或經歷某件事之後，才開始出現的？","當你和別人討論未來時，會不會更容易發現自己真正想要什麼？"],"s":["別人會感受到：","「你真的很想要這個。」"]},"5":{"t":"別人期待我能夠帶來某種體驗或結果","b":["<mark class=\"k\">核心：情緒期待與他人的投射。</mark>","","第五爻容易受到投射。放在30號閘門上，別人可能期待這個人有熱情、能夠帶動氣氛，或者為某個計劃帶來強烈的投入。","","例如：","•   別人期待他對某個目標充滿熱情。","•   關係中，對方期待他表現出強烈的情感。","•   團隊希望他帶動大家對計劃的期待。","•   他可能覺得自己必須一直保持熱情，不能讓別人失望。","","它不是必須持續保持熱情，而是別人可能期待他承載某種情緒與渴望；他也有權經歷熱情變化的過程。"],"q":["別人會不會期待你對某些事情表現出很大的熱情？","當自己的感覺改變時，你會不會因為別人仍然期待你投入，而感到有壓力？"],"s":["容易成為：","「你應該知道怎麼得到它。」"]},"6":{"t":"我逐漸理解，渴望與現實之間需要空間","b":["<mark class=\"k\">核心：成熟的期待與情緒整合。</mark>","","第六爻帶有觀察與成熟的意味。放在30號閘門上，一個人可能逐漸理解，渴望可以很強烈，但現實不一定完全按照想象發展。","","例如：","•   不再要求每個願望都實現。","•   更能夠接受結果與想象不同。","•   從經歷本身尋找意義，而不只看結果。","•   允許自己的渴望隨著經驗改變。","","它不是失去熱情，而是更成熟地理解，渴望可以為生命帶來動力，但不需要把幸福完全建立在某個結果上。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你現在會不會比以前更能接受，事情不一定按照自己想象的方式發生？","當一個期待沒有實現時，你會不會開始看見這段經歷本身也帶來了其他收獲？"],"s":["這是成熟：","「我可以很想要，但不代表我一定要擁有。」"]}},"oh":"欲望與情感經驗","oi":[]},"31":{"h":"領導、表達方向、群體聲音與獲得認可","i":["31號閘門位於喉嚨中心，屬於集體理解回路，與領導及透過表達影響群體有關。","<mark class=\"k\">這個閘門的重點不是主動掌控所有人，而是一個人的聲音是否能夠被群體聽見，以及他能否代表一個共同方向。</mark>"],"L":{"1":{"t":"我需要先理解群體的方向","b":["<mark class=\"k\">核心：領導的基礎與方向感。</mark>","","第一爻重視基礎。放在31號閘門上，一個人可能需要先了解群體的實際情況，才比較能夠提出方向。","","例如：","•   做決定之前，先了解大家面對的問題。","•   不喜歡沒有依據地指揮別人。","•   希望知道團隊真正需要什麼。","•   在表達方向之前，會先觀察現狀。","","它不是不敢領導，而是需要先理解現實與群體的需要，才比較能夠提出有基礎的方向。"],"q":["當你需要帶領別人時，會不會先了解大家真正面對的問題？","你會不會覺得，自己必須先弄清楚狀況，才適合提出方向？"],"s":["會建立自己的觀點和立場。"]},"2":{"t":"我自然會表達自己的看法","b":["<mark class=\"k\">核心：自然的聲音與影響力。</mark>","","第二爻的特質可能自然流露。放在31號閘門上，一個人可能很自然地表達自己對群體方向的看法。","","例如：","•   在討論時自然提出意見。","•   別人會注意他說的話。","•   對某些問題有清楚的方向感。","•   自己覺得只是表達想法，別人卻可能把它當成領導意見。","","它不是每次表達都代表領導，而是個人的聲音可能自然產生影響。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["你有沒有發現，當你表達某個方向時，身邊的人會認真聽取？","別人會不會自然地來問你，對一件事應該怎麼做？"],"s":["別人會自然聽你的意見。"]},"3":{"t":"我透過領導經驗，學習怎樣影響別人","b":["<mark class=\"k\">核心：試錯、方向與責任。</mark>","","第三爻透過經驗學習。放在31號閘門上，一個人可能經歷過提出錯誤方向、別人不接受自己的意見，或者發現自己沒有考慮周全。","","例如：","•   曾經提出建議，卻沒有獲得支持。","•   帶領團隊後，發現方向需要調整。","•   透過合作，學習聽取不同聲音。","•   逐漸明白，影響別人不只是表達意見，也需要理解群體。","","它不是沒有領導能力，而是透過經驗學習，怎樣讓方向真正回應群體的需要。"],"q":["你有沒有經歷過，自己認為很好的方向，卻沒有得到別人的支持？","後來你有沒有發現，除了表達自己的看法，還需要了解其他人的需要？"],"s":["可能試過：","「這樣說大家會聽。」","「這樣說反而沒人想聽。」"]},"4":{"t":"我的影響力會透過熟悉的群體建立","b":["<mark class=\"k\">核心：人際連接與群體認可。</mark>","","第四爻與人際網絡有關。放在31號閘門上，一個人的領導影響可能在熟悉的團隊、社群或關係網絡中逐漸形成。","","例如：","•   在長期合作的團隊中，別人願意聽取他的意見。","•   通過信任關係，逐漸承擔更多責任。","•   熟悉的人知道他的判斷方式，因此願意跟隨。","•   影響力來自長期互動，而不是一次強勢表達。","","它不是靠關係操縱別人，而是信任和群體連接可能讓他的聲音更容易被接納。"],"q":["你有沒有發現，在熟悉的團隊中，別人比較願意聽取你的意見？","你覺得自己的影響力比較來自表達本身，還是來自長期建立的信任？"],"s":["熟悉、信任的人更容易接受你的聲音。"]},"5":{"t":"別人期待我帶領大家找到方向","b":["<mark class=\"k\">核心：領導角色與他人的投射。</mark>","","第五爻容易受到投射。放在31號閘門上，別人可能期待這個人提出方向、作出判斷，或者在混亂時站出來領導大家。","","例如：","•   團隊遇到困難時，別人希望他提出解決方向。","•   朋友期待他在共同計劃中作決定。","•   別人認為他有領導能力，因此把責任交給他。","•   他可能因為別人期待自己，而覺得必須一直表現得有把握。","","它不是必須永遠知道答案，而是別人可能期待他帶領群體；他仍然需要確認自己是否獲得認可，以及是否真的適合承擔這個角色。"],"q":["別人會不會在遇到問題時，期待你站出來給出方向？","當別人把領導責任交給你時，你會不會覺得自己必須表現得很有把握？"],"s":["可能被推出來：","「你來代表我們說。","」"]},"6":{"t":"我逐漸理解，真正的領導需要被認可","b":["<mark class=\"k\">核心：成熟的影響力與群體視角。</mark>","","第六爻帶有觀察與成熟的意味。放在31號閘門上，一個人可能逐漸理解，領導不只是自己想帶領別人，也需要群體願意聽取和接受。","","例如：","•   不再急著證明自己能夠領導。","•   更願意觀察群體是否真的需要自己的方向。","•   理解領導也包括傾聽和調整。","•   不再把別人沒有跟隨自己，直接理解為否定自己。","","它不是放棄影響力，而是更成熟地理解，真正的領導來自表達、信任與群體認可之間的配合。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你現在會不會比較能分辨，什麼時候適合自己站出來，什麼時候適合讓別人帶領？","當別人沒有接受你的建議時，你能不能先理解他們的需要，而不急著證明自己正確？"],"s":["「我可以有聲音，但不需要所有人聽從我。」"]}},"oh":"影響力與領導","oi":[]},"32":{"h":"持續性、潛力、變化中的延續與對失敗的敏感","i":["32號閘門位於脾中心，屬於部落回路，與延續、潛力和對什麼值得保留的判斷有關。","<mark class=\"k\">這個閘門不只是害怕失敗，而是可能很在意：哪些事情有潛力繼續發展，哪些東西需要保留，哪些方向可能無法持續。</mark>"],"L":{"1":{"t":"我需要先確認，這件事有沒有持續發展的基礎","b":["<mark class=\"k\">核心：延續的基礎與潛力判斷。</mark>","","第一爻重視基礎。放在32號閘門上，一個人可能需要先觀察一件事是否有發展的條件，才願意投入。","","例如：","•   開始合作前，先觀察對方是否可靠。","•   選擇工作時，會考慮發展空間。","•   不喜歡只看眼前利益，而忽略長遠情況。","•   對缺乏基礎、難以持續的計劃比較謹慎。","","它不是只想求穩，而是需要判斷一件事有沒有持續發展的可能，才決定是否值得投入。"],"q":["當你考慮一個新機會時，會不會特別留意它有沒有長遠發展的空間？","你會不會很在意，一件事現在看起來不錯，未來是否也能繼續？"],"s":["會很在意：","「這個東西有沒有未來？」"]},"2":{"t":"我自然會注意什麼有潛力","b":["<mark class=\"k\">核心：自然的潛力辨識。</mark>","","第二爻的特質可能自然流露。放在32號閘門上，一個人可能很自然地注意到某個人、計劃或事物有沒有發展空間。","","例如：","•   能看見一個人還沒有發揮出來的能力。","•   對某些項目有一種可以繼續發展的感覺。","•   很自然地比較不同選擇的潛力。","•   別人覺得他想得長遠，他卻認為只是順手觀察。","","它不是每次都能準確預測未來，而是可能自然留意到潛力與延續的線索；判斷仍需要現實信息支持。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["你會不會很自然地注意到某個人或某件事未來可能發展成什麼樣？","你有沒有發現，自己在選擇機會時，會特別留意長遠潛力？"],"s":["可能很快知道：","「這個可以繼續。","」"]},"3":{"t":"我透過失敗與變化，學習什麼值得延續","b":["<mark class=\"k\">核心：試錯、失去與持續性的學習。</mark>","","第三爻透過經驗學習。放在32號閘門上，一個人可能經歷過計劃失敗、合作中斷或方向改變，才逐漸理解哪些東西值得繼續。","","例如：","•   曾經很看好一個機會，後來發現條件不適合。","•   因為害怕失去，而堅持不合適的關係或工作。","•   透過失敗，學會調整原本的判斷。","•   逐漸接受，有些事情結束並不代表自己失敗。","","它不是注定會失去，而是透過變化與經驗，學習區分真正有潛力的事物與只因為不甘心而繼續的投入。"],"q":["你有沒有因為不想承認失敗，而繼續堅持一件已經不適合自己的事情？","當一個計劃沒有按照預期發展時，你會不會需要一段時間，才願意考慮是否應該改變方向？"],"s":["可能經歷：","「這個以前試過，不行。」","因此越來越有判斷力。"]},"4":{"t":"我在關係與合作中判斷什麼值得延續","b":["<mark class=\"k\">核心：人際連接與長期合作。</mark>","","第四爻與人際網絡有關。放在32號閘門上，一個人可能會通過長期關係、團隊合作和實際互動，判斷某個方向是否值得繼續。","","例如：","•   選擇合作對象時，重視長期可靠性。","•   會觀察雙方能否持續合作。","•   在熟悉的團隊中，更容易判斷哪些做法有效。","•   通過人際網絡發現新的發展機會。","","它不是只看關係是否有利益，而是關係的穩定性、信任和共同發展，也可能影響他對延續性的判斷。"],"q":["你在選擇長期合作對象時，會不會特別在意對方是否可靠？","你有沒有因為一段關係長期無法建立信任，而開始重新考慮是否繼續？"],"s":["可能知道：","「這個流程應該保留。」"]},"5":{"t":"別人期待我看出什麼值得繼續","b":["<mark class=\"k\">核心：判斷潛力的責任與他人的投射。</mark>","","第五爻容易受到投射。放在32號閘門上，別人可能認為這個人眼光長遠，期待他判斷某個機會是否值得投資或延續。","","例如：","•   別人請他評估項目的長期發展。","•   團隊希望他指出哪些做法應該保留。","•   朋友期待他分析一段關係是否有未來。","•   他可能因為別人期待判斷，而害怕作出錯誤決定。","","它不是必須預測每件事的結果，而是別人可能把判斷潛力的責任放在他身上；任何判斷都需要承認現實的不確定性。"],"q":["別人會不會常常問你，某個機會或計劃到底值不值得繼續？","當別人期待你判斷未來時，你會不會擔心自己看錯？"],"s":["「你覺得這個項目有未來嗎？」"]},"6":{"t":"我逐漸理解，延續不代表什麼都不能改變","b":["<mark class=\"k\">核心：成熟的判斷與長遠發展。</mark>","","第六爻帶有觀察與成熟的意味。放在32號閘門上，一個人可能逐漸理解，真正的延續並不是把所有東西都保留下來，而是讓有生命力的部分繼續發展。","","例如：","•   更願意結束已經不合適的計劃。","•   能夠接受某段關係或工作階段結束。","•   更懂得調整方法，而不是固守原來的形式。","•   看重長遠的成長，而不是短期維持表面穩定。","","它不是失去堅持，而是更成熟地理解，真正值得延續的是有潛力的核心，不一定是原本的形式。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你現在會不會比以前更能接受，有些事情結束後，反而能為新的發展騰出空間？","當一件事無法繼續時，你會不會開始分辨，是核心價值仍然值得保留，還是整個方向都需要改變？"],"s":["最終：","「真正的延續，也包含知道什麼時候該結束。」"]}},"oh":"延續與辨識","oi":[]},"33":{"h":"退後、回顧、隱私與從經歷中學習","i":["33號閘門位於喉嚨中心，屬於集體感知回路，與回顧過去的經驗、保留隱私和在沉澱後分享故事有關。","<mark class=\"k\">這個閘門不只是喜歡獨處，而是可能需要先退後一步，整理經歷，才知道哪些內容值得分享。</mark>"],"L":{"1":{"t":"我需要先有自己的空間，才能整理經歷","b":["<mark class=\"k\">核心：回顧的基礎與私人空間。</mark>","","第一爻重視基礎。放在33號閘門上，一個人可能需要先有安靜、不被打擾的空間，才能消化發生過的事情。","","例如：","•   經歷很多事情後，需要獨處。","•   不喜歡剛發生一件事，就馬上被要求分享感受。","•   會先在心裡整理，再決定怎樣表達。","•   需要保護自己的私人空間。","","它不是刻意疏遠別人，而是需要有空間整理經驗，才能真正理解自己經歷了什麼。"],"q":["當你經歷很多事情之後，會不會需要一段時間獨處，才能整理自己的感受？","如果別人馬上要求你說出感想，你會不會覺得自己還沒有準備好？"],"s":["會需要：","•   獨處","•   安靜","•   私人空間","•   消化經歷"]},"2":{"t":"我自然會在經歷之後退後觀察","b":["<mark class=\"k\">核心：自然的回顧與隱退。</mark>","","第二爻的特質可能自然流露。放在33號閘門上，一個人可能很自然地在事情結束後退後一步，慢慢回顧發生了什麼。","","例如：","•   一場活動結束後，喜歡自己安靜一下。","•   經歷一段關係後，需要時間理解這段經歷。","•   不一定馬上與別人分享內心感受。","•   別人覺得他突然安靜，他卻覺得自己只是需要消化。","","它不是逃避現實，而是回顧與沉澱可能是他自然處理經驗的方式。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["你有沒有發現，事情結束後，你反而需要一段時間自己待著？","你是不是通常不會在事情剛發生時，就馬上把所有感受告訴別人？"],"s":["事情結束後可能：","「我想一個人待一下。」"]},"3":{"t":"我透過經歷與回顧，學習怎樣分享","b":["<mark class=\"k\">核心：經驗、隱私與分享方式。</mark>","","第三爻透過經驗學習。放在33號閘門上，一個人可能曾經分享得太早、透露太多，或發現自己還沒有真正理解一段經歷。","","例如：","•   曾經在情緒還很強烈時分享事情，後來覺得不妥。","•   發現不是每個人都適合聽自己的私人故事。","•   透過經驗學習保護隱私。","•   逐漸知道哪些事情適合保留，哪些可以轉化成經驗分享。","","它不是不願意分享，而是透過經驗學習，怎樣在表達經歷與保護隱私之間找到適合的界線。"],"q":["你有沒有試過太早分享一件事情，後來發現自己其實還沒整理好？","你現在會不會比以前更謹慎地選擇，哪些經歷適合告訴別人？"],"s":["會：","經歷 → 回想 → 理解 → 整理。"]},"4":{"t":"我會在熟悉的關係中分享過去的故事","b":["<mark class=\"k\">核心：人際連接與共同回憶。</mark>","","第四爻與人際網絡有關。放在33號閘門上，一個人可能在熟悉的關係中，通過分享過去的經歷，建立連接。","","例如：","•   和朋友回顧以前共同經歷的事情。","•   在家庭聚會中分享過去的故事。","•   通過講述經歷，讓別人理解自己的變化。","•   在信任的關係中，更願意分享真實的過去。","","它不是逢人就談過去，而是故事的分享可能發生在適合的關係和時機中。"],"q":["你會不會比較願意和熟悉的人分享自己過去的經歷？","當你回顧過去時，你會不會發現，分享某些故事能幫助你和別人建立連接？"],"s":["不是對所有人說。","而是對信任的人說。"]},"5":{"t":"別人期待我分享經驗，幫助他們理解事情","b":["<mark class=\"k\">核心：經驗的分享與他人的投射。</mark>","","第五爻容易受到投射。放在33號閘門上，別人可能期待這個人從過去的經歷中提煉出經驗，告訴大家應該如何理解某件事。","","例如：","•   別人請他分享過去的工作經驗。","•   團隊希望他回顧一個項目的得失。","•   朋友希望他講述一段經歷帶來的啟發。","•   他可能覺得自己的私人故事應該提供某種教訓。","","它不是每段經歷都必須成為別人的教材，而是別人可能期待他分享經驗；他仍然有權決定哪些內容屬於私人空間。"],"q":["別人會不會經常希望你分享過去的經驗，幫助他們少走一些彎路？","當別人想知道你的私人經歷時，你能不能自在地選擇說多少？"],"s":["可能：","「你以前到底發生過什麼？」"]},"6":{"t":"我逐漸理解，回顧是為了整合經驗，而不是停留在過去","b":["<mark class=\"k\">核心：成熟的回顧與長遠視角。</mark>","","第六爻帶有觀察與成熟的意味。放在33號閘門上，一個人可能逐漸學會從過去的經歷中提煉理解，而不是一直停留在回憶裡。","","例如：","•   回顧過去時，更能看見自己如何成長。","•   不再需要向所有人解釋過去發生的事。","•   更懂得什麼時候分享故事有幫助。","•   能夠把經歷放回過去，同時繼續生活。","","它不是否定過去，而是更成熟地理解，回顧的價值在於整合經驗，讓過去成為理解生命的一部分，而不是永遠限制現在。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["當你回顧過去時，你現在會不會更關注自己從中學到了什麼？","你有沒有發現，有些事情經過時間沉澱後，就不再需要反覆向別人解釋？"],"s":["「不是所有經歷都需要公開。」"]}},"oh":"隱私與回顧","oi":[]},"34":{"h":"生命動力、獨立行動與直接的能量","i":["34號閘門位於薦骨中心，屬於整合回路，與生命動力、行動力量和獨立性有關。","<mark class=\"k\">它的重點不是一定很忙，而是有能量時，可能很自然地想採取行動。</mark>"],"L":{"1":{"t":"我需要先知道，力量應該用在哪裡","b":["<mark class=\"k\">核心：行動的基礎與方向。</mark>","","第一爻重視基礎。放在34號閘門上，一個人可能需要先確認事情是否值得自己行動，才比較容易把力量投入其中。","","例如：","•   不喜歡把力氣浪費在沒有意義的事情上。","•   會觀察自己是否有足夠精力。","•   希望先弄清楚任務的重點。","•   不想只是為了表現能力而行動。","","它不是行動力不足，而是需要有清楚的方向，才能知道力量應該用在哪裡。"],"q":["當你有能力完成一件事時，你會不會先判斷它是否值得你投入？","你有沒有發現，自己不太喜歡把精力花在沒有意義的事情上？"],"s":["會問：","「我真正有能力做什麼？」"]},"2":{"t":"當我有能量時，自然會行動","b":["<mark class=\"k\">核心：自然的行動動力。</mark>","","第二爻的特質可能自然流露。放在34號閘門上，一個人可能在有能量時，自然開始行動，不一定需要別人安排。","","例如：","•   有興趣時，直接動手處理。","•   看見事情需要完成，就自然開始。","•   做自己有感覺的事情時，很容易進入狀態。","•   別人覺得他行動很快，他卻覺得只是順著自己的能量做事。","","它不是任何時候都有能量，而是當能量自然出現時，行動可能直接發生。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["有沒有一些事情，你一旦有感覺，就會自然開始行動？","當你對一件事有興趣時，你是不是比較不需要別人催促？"],"s":["有興趣時：","「我可以一直做。」","沒興趣時：","「不要叫我。","」"]},"3":{"t":"我透過行動經驗，學習怎樣運用力量","b":["<mark class=\"k\">核心：試錯、行動與能量管理。</mark>","","第三爻透過經驗學習。放在34號閘門上，一個人可能經歷過行動太快、承擔太多，或沒有評估自己的精力。","","例如：","•   曾經因為做得到，就接下太多任務。","•   發現自己雖然能夠完成，卻沒有真正想做。","•   行動過程中才發現需要改變方法。","•   慢慢學習，能力與意願需要一起考慮。","","它不是行動力不穩定，而是透過經驗學習，把力量用在真正有回應的事情上。"],"q":["你有沒有因為自己做得到，就接下很多事情，後來才發現自己其實不想做？","你有沒有經歷過，做完一件事才發現，自己雖然有能力，卻沒有得到滿足感？"],"s":["不是想。","是：","做了才知道我能做到哪裡。"]},"4":{"t":"我的行動力量會影響身邊的人","b":["<mark class=\"k\">核心：關係中的行動與影響。</mark>","","第四爻與人際網絡有關。放在34號閘門上，一個人的行動可能在團隊或關係中帶來推動作用。","","例如：","•   在團隊中自然開始處理事情。","•   看到朋友需要協助時，直接採取行動。","•   與合適的人合作時，行動更有效率。","•   自己一旦投入，可能帶動周圍的人一起行動。","","它不是必須帶領所有人，而是行動本身可能在關係中產生推動作用。"],"q":["你有沒有發現，當你開始行動時，身邊的人也會跟著動起來？","在團隊中，你會不會自然地先動手處理事情，再和別人協調？"],"s":["別人看到你行動，也開始行動。"]},"5":{"t":"別人期待我成為那個能把事情做完的人","b":["<mark class=\"k\">核心：行動能力與他人的投射。</mark>","","第五爻容易受到投射。放在34號閘門上，別人可能認為這個人能力強、行動快，因此把很多任務交給他。","","例如：","•   別人覺得他處理事情很有效率。","•   團隊遇到困難時，希望他站出來。","•   因為過去做得到，別人就持續加派工作。","•   他可能因為不想讓人失望，而不斷使用自己的力量。","","它不是有能力就必須完成所有任務，而是別人可能把執行者的角色放在他身上；他仍然需要選擇自己的投入方向。"],"q":["別人會不會因為知道你做得到，就經常把事情交給你？","你有沒有因為別人相信你的能力，而覺得自己不能拒絕？"],"s":["因為：","「你不是很有能力嗎？」","所以需要知道：","有能力，不代表一定要做。"]},"6":{"t":"我逐漸理解，力量也需要選擇與節奏","b":["<mark class=\"k\">核心：成熟的行動與能量運用。</mark>","","第六爻帶有觀察與成熟的意味。放在34號閘門上，一個人可能逐漸明白，力量並不是用得越多越好，而是要知道何時行動、何時休息。","","例如：","•   不再為了證明自己而不停工作。","•   更懂得保留精力給重要的事情。","•   能夠接受自己不是每件事都需要親自處理。","•   開始重視行動的方向，而不只是速度。","","它不是失去動力，而是更成熟地理解，力量的價值不在於消耗多少，而在於是否用在真正值得的地方。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你現在會不會比以前更注意，自己的力量到底用在什麼事情上？","你有沒有發現，有些事情即使自己做得到，也不一定需要親自完成？"],"s":["最終：","「有力量不代表所有事情都值得我用力。」"]}},"oh":"純粹的力量","oi":[]},"35":{"h":"體驗、變化、進展與從經歷中成長","i":["35號閘門位於喉嚨中心，屬於集體感知回路，與經驗的變化和向前發展有關。","<mark class=\"k\">它的重點不是為了變化而變化，而是透過新的體驗，認識生命中不同的可能性。</mark>"],"L":{"1":{"t":"我需要先知道，這次變化會帶來什麼","b":["<mark class=\"k\">核心：變化的基礎與經驗判斷。</mark>","","第一爻重視基礎。放在35號閘門上，一個人可能在進入新體驗前，需要先了解基本情況。","","例如：","•   計劃旅行前先了解目的地。","•   換工作之前，會想知道新的環境是什麼樣。","•   對未知有興趣，但仍然希望知道基本條件。","•   不想只是為了改變而倉促行動。","","它不是害怕變化，而是希望先了解變化的基礎，才比較能夠決定是否投入。"],"q":["當你有機會嘗試新事物時，會不會先了解它大概是什麼樣？","你比較喜歡完全未知的體驗，還是會先做一些準備？"],"s":["會問：","「換了之後真的會更好嗎？」"]},"2":{"t":"我自然會對新體驗產生興趣","b":["<mark class=\"k\">核心：自然的好奇與體驗動力。</mark>","","第二爻的特質可能自然流露。放在35號閘門上，一個人可能很自然地對新的經歷產生興趣。","","例如：","•   喜歡探索不同地方。","•   對新的工作方式或生活經驗感到好奇。","•   聽到別人分享經歷，就想親自試試看。","•   不一定喜歡一直重複相同的生活。","","它不是不能安定下來，而是新體驗可能自然吸引他，讓他透過經歷認識更多可能性。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["有沒有一些新體驗，只要聽到就會讓你很想親自嘗試？","當生活長時間沒有變化時，你會不會開始渴望新的經歷？"],"s":["容易：","「我想試試看。」"]},"3":{"t":"我透過嘗試不同經歷，找到真正想要的變化","b":["<mark class=\"k\">核心：試錯、體驗與方向調整。</mark>","","第三爻透過經驗學習。放在35號閘門上，一個人可能需要親自經歷不同事情，才知道什麼變化真的適合自己。","","例如：","•   嘗試新工作後，發現並不如想象中理想。","•   去過不同地方，才發現自己真正喜歡怎樣的生活。","•   經歷多種活動後，發現有些體驗只是短暫吸引。","•   透過嘗試，逐漸理解變化對自己意味著什麼。","","它不是單純三分鐘熱度，而是透過體驗檢驗自己真正想要的東西；關鍵在於有沒有從經歷中學習。"],"q":["你有沒有試過一開始很想嘗試某件事，後來發現實際體驗和想象很不一樣？","當你嘗試新事物後，你會不會回頭思考自己真正喜歡的是什麼？"],"s":["可能經歷：","體驗 → 不喜歡 → 換 → 再體驗。"]},"4":{"t":"我的經歷會透過關係影響別人","b":["<mark class=\"k\">核心：分享經驗與人際連接。</mark>","","第四爻與人際網絡有關。放在35號閘門上，一個人可能透過分享經歷，為身邊的人帶來新的想法或機會。","","例如：","•   分享旅行經驗，讓朋友發現新的地方。","•   告訴同事某種工作方法的實際體驗。","•   透過不同經歷，帶動朋友嘗試新事物。","•   因為有豐富經驗，成為大家交流生活變化的對象。","","它不是必須帶著別人不斷改變，而是自己的經驗可能透過分享，幫助別人看見新的可能性。"],"q":["你會不會喜歡和朋友分享自己嘗試過的新體驗？","你有沒有因為分享自己的經歷，讓別人也開始考慮嘗試不同的生活方式？"],"s":["會分享：","「我試過這個，真的不錯。」"]},"5":{"t":"別人期待我帶來新的體驗或改變","b":["<mark class=\"k\">核心：變化的角色與他人的投射。</mark>","","第五爻容易受到投射。放在35號閘門上，別人可能認為這個人有經驗、喜歡變化，因此期待他提出新計劃或帶大家走向新的方向。","","例如：","•   朋友希望他安排有趣的活動。","•   團隊期待他提出新的做法。","•   別人認為他很會尋找新機會。","•   他可能因為別人期待新鮮感，而覺得自己不能停下來。","","它不是必須不斷制造變化，而是別人可能期待他帶來新的體驗；他仍然可以選擇休息、重複或維持現狀。"],"q":["別人會不會常常期待你提出新計劃或安排有趣的體驗？","你有沒有因為大家覺得你喜歡變化，就覺得自己必須一直想出新點子？"],"s":["容易成為：","「你應該知道下一步有什麼新東西。」"]},"6":{"t":"我逐漸理解，變化的價值在於經驗如何轉化","b":["<mark class=\"k\">核心：成熟的體驗與長遠理解。</mark>","","第六爻帶有觀察與成熟的意味。放在35號閘門上，一個人可能逐漸理解，經歷很多事情不等於真正成長，重要的是從經歷中獲得什麼。","","例如：","•   不再只追求新的刺激。","•   更願意回顧經歷帶來的理解。","•   能夠接受某些階段需要穩定，而不是一直改變。","•   更清楚自己為什麼想嘗試某件事。","","它不是失去好奇心，而是更成熟地理解，變化的價值不只在於發生了什麼，也在於自己從中獲得了什麼。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你現在會不會比以前更重視一段經歷帶給自己的理解，而不只是體驗本身？","當你很想改變時，你會不會開始問自己，自己真正想從這次變化中得到什麼？"],"s":["「改變不是為了逃離現在，而是因為新的經驗真的有價值。」"]}},"oh":"變化與經驗","oi":[]},"36":{"h":"未知、情緒經驗、挑戰與過渡","i":["36號閘門位於情緒中心，屬於集體感知回路，與面對未知體驗時的情緒波動有關。","<mark class=\"k\">這個閘門不是代表人生一定充滿危機，而是可能對未知的體驗有強烈反應，需要時間穿越情緒，才能理解發生了什麼。</mark>"],"L":{"1":{"t":"我需要先了解未知體驗的基本情況","b":["<mark class=\"k\">核心：面對未知的基礎與準備。</mark>","","第一爻重視基礎。放在36號閘門上，一個人可能在面對新階段或不確定情況時，希望先掌握一些基本信息。","","例如：","•   面對新工作時，會想知道實際情況。","•   不喜歡突然被推入完全陌生的環境。","•   在重大變化前，希望先做一些準備。","•   當事情缺少信息時，可能更容易感到不安。","","它不是不敢面對未知，而是需要先建立一些基本理解，才比較容易進入新的體驗。"],"q":["當你面對一件完全未知的事情時，會不會很想先了解一些基本情況？","如果事情突然發生、完全沒有準備，你通常會有什麼反應？"],"s":["會很在意：","「如果發生變化，我準備好了嗎？」"]},"2":{"t":"我對未知的情緒反應可能自然出現","b":["<mark class=\"k\">核心：自然的情緒感受與體驗反應。</mark>","","第二爻的特質可能自然流露。放在36號閘門上，一個人可能在面對未知時，很自然地產生期待、緊張或其他強烈感受。","","例如：","•   面對重要變化時，情緒很明顯。","•   對未知體驗既期待又擔心。","•   當事情發生時，需要先感受自己的情緒。","•   別人覺得事情沒什麼，他卻感受到很強烈的情緒變化。","","它不是情緒反應就代表事情一定很危險，而是未知可能自然喚起強烈的感受，需要先理解自己的狀態。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["當你面對未知的事情時，會不會同時出現期待和不安？","你有沒有發現，自己需要先經歷一段情緒變化，才能慢慢適應新的情況？"],"s":["可能：","「不知道會發生什麼，但我想體驗。」"]},"3":{"t":"我透過困難與失望，學習面對情緒","b":["<mark class=\"k\">核心：試錯、情緒經驗與適應。</mark>","","第三爻透過經驗學習。放在36號閘門上，一個人可能需要經歷一些不如預期的事情，才逐漸學習怎樣面對情緒波動。","","例如：","•   原本期待某件事，結果卻完全不同。","•   面對突發變化時，情緒一時難以整理。","•   經歷之後，逐漸知道自己需要什麼支持。","•   慢慢學會不在最激動時急著決定。","","它不是注定經歷危機，而是現實經驗可能幫助一個人學習如何面對未知，以及如何在情緒變化中保護自己。"],"q":["你有沒有經歷過某件事情，剛開始很難接受，但過了一段時間才慢慢理解？","當你情緒很強烈時，你會不會需要先給自己一點時間，才知道該怎樣處理？"],"s":["事情出問題後：","「好，我現在知道了。」"]},"4":{"t":"我在關係中經歷和分享情緒變化","b":["<mark class=\"k\">核心：人際連接與共同經歷。</mark>","","第四爻與人際網絡有關。放在36號閘門上，一個人可能透過關係中的支持，面對未知或變化帶來的情緒。","","例如：","•   面對重大變化時，會想和信任的人討論。","•   透過朋友的經驗，理解自己正在經歷什麼。","•   與別人共同經歷挑戰後，關係變得更深。","•   發現有人願意陪伴時，比較能夠面對未知。","","它不是必須依賴別人處理情緒，而是合適的關係可能成為面對變化時的重要支持。"],"q":["當你面對不確定的事情時，會不會比較想找信任的人聊一聊？","有沒有一些困難，是因為有人陪伴，你才比較能夠慢慢走過去？"],"s":["別人可能從你的故事裡學習。"]},"5":{"t":"別人期待我能夠面對困難並提供經驗","b":["<mark class=\"k\">核心：應對危機的角色與他人的投射。</mark>","","第五爻容易受到投射。放在36號閘門上，別人可能期待這個人經歷過事情，因此能夠理解困難，或在不確定時提供幫助。","","例如：","•   朋友遇到困難時，希望他分享經驗。","•   團隊面對變化時，期待他協助處理。","•   別人認為他很能承受壓力。","•   他可能因為別人覺得自己很堅強，而不願承認自己也需要支持。","","它不是必須成為每個人的支柱，而是別人可能期待他面對困難；他也需要允許自己有情緒、有局限，並接受支持。"],"q":["別人會不會覺得你經歷過一些事情，所以遇到困難就來找你？","你有沒有因為別人認為你很堅強，而不太願意讓別人看見自己也會不安？"],"s":["「你經歷過，你應該知道怎麼辦。」"]},"6":{"t":"我逐漸理解，情緒需要經過過程才能沉澱","b":["<mark class=\"k\">核心：成熟、觀察與情緒整合。</mark>","","第六爻帶有觀察與成熟的意味。放在36號閘門上，一個人可能逐漸理解，面對未知不一定能夠立即知道答案，也不一定能夠馬上恢復平靜。","","例如：","•   不再要求自己立刻適應變化。","•   更懂得給情緒留出時間。","•   能夠回顧過去的困難，理解自己如何成長。","•   不再因為當下的不安，就認為未來一定會不好。","","它不是變得麻木，而是更成熟地理解，情緒會隨著體驗發展；給自己時間，才能更完整地理解正在經歷的事情。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你現在會不會比較能夠接受，面對重大變化時，自己需要時間慢慢適應？","當你回顧過去經歷的困難時，會不會發現，當時無法理解的事情，後來逐漸有了不同的意義？"],"s":["不是追求危機。","而是：","「我不需要因為人生出現混亂，就認為自己走錯了。」"]}},"oh":"危機與情緒經驗","oi":[]},"37":{"h":"家庭、歸屬、互惠、承諾與情感支持","i":["37號閘門位於情緒中心，屬於部落回路，與關係中的互惠、家庭感和彼此支持有關。","<mark class=\"k\">這個閘門的重點不是每個人都要成為家人，而是關係需要一定的情感基礎、承諾和互相回應。</mark>"],"L":{"1":{"t":"我需要先確認，關係中有沒有基本的互相支持","b":["<mark class=\"k\">核心：關係的基礎與安全感。</mark>","","第一爻重視基礎。放在37號閘門上，一個人可能很在意關係是否有基本的信任、承諾與互相支持。","","例如：","•   不喜歡關係中只有一方付出。","•   會在意彼此是否遵守約定。","•   希望關係裡有穩定的情感支持。","•   當承諾不清楚時，可能感到不安。","","它不是每件事都要公平計算，而是需要知道關係是否有基本的互相尊重與支持。"],"q":["在親密關係或友情中，你會不會很在意彼此是否互相支持？","如果關係裡總是只有你付出，你會有什麼感覺？"],"s":["很在意：","「彼此的責任是什麼？」"]},"2":{"t":"我自然會營造親近與歸屬感","b":["<mark class=\"k\">核心：自然的關心與關係連接。</mark>","","第二爻的特質可能自然流露。放在37號閘門上，一個人可能很自然地關心身邊的人，希望大家感到被接納。","","例如：","•   喜歡和熟悉的人一起吃飯。","•   會留意家人或朋友最近過得怎樣。","•   自然地邀請別人參與活動。","•   別人覺得他很有親和力，他卻覺得只是想讓大家相處得舒服。","","它不是必須照顧所有人的情緒，而是營造親近和歸屬感可能自然成為他與人互動的方式。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["你會不會很自然地想讓身邊的人感到被關心、被接納？","對你來說，和熟悉的人一起吃飯、聊天或相處，是不是很重要？"],"s":["對家人、朋友可能特別願意付出。"]},"3":{"t":"我透過關係經驗，學習互惠的界線","b":["<mark class=\"k\">核心：試錯、承諾與關係調整。</mark>","","第三爻透過經驗學習。放在37號閘門上，一個人可能經歷過付出不對等、承諾沒有兌現，或為了維持關係而過度承擔。","","例如：","•   曾經為了關係，一直滿足別人的需要。","•   發現對方習慣接受，卻很少回應。","•   因為期待落空，而重新思考關係。","•   慢慢學會表達自己需要什麼，而不是一味付出。","","它不是不再相信關係，而是透過經驗學習，互惠需要雙方參與，不能只靠一個人維持。"],"q":["你有沒有在一段關係中付出很多，後來才發現彼此的投入並不平衡？","你有沒有學會，在關係裡直接表達自己的需要，而不是期待對方自然發現？"],"s":["會發現：","「原來這樣相處比較舒服。」"]},"4":{"t":"我透過熟悉的關係建立歸屬感","b":["<mark class=\"k\">核心：人際連接與群體支持。</mark>","","第四爻與人際網絡有關。放在37號閘門上，一個人可能透過家庭、朋友或固定社群，獲得歸屬感與情感支持。","","例如：","•   重視固定的朋友聚會。","•   喜歡和熟悉的人維持長期聯系。","•   在團隊中，希望大家互相照顧。","•   透過共同的習慣或儀式，維持關係的連接。","","它不是只能待在熟悉的圈子，而是穩定的人際連接可能成為他感到歸屬的重要來源。"],"q":["你會不會特別重視能夠長期維持的友情或群體關係？","對你來說，哪些共同活動會讓你覺得自己真正屬於一個群體？"],"s":["重視：","•   家庭","•   朋友","•   團隊","•   熟悉的人"]},"5":{"t":"別人期待我維持關係中的照顧與承諾","b":["<mark class=\"k\">核心：關係責任與他人的投射。</mark>","","第五爻容易受到投射。放在37號閘門上，別人可能期待這個人負責照顧關係、維持家庭氣氛，或遵守群體的約定。","","例如：","•   家人期待他主動安排聚會。","•   朋友認為他應該記得重要日子。","•   團隊希望他負責協調大家的關係。","•   他可能因為不想讓人失望，而承擔過多情感責任。","","它不是必須維持所有關係，而是別人可能把關係照顧者的角色放在他身上；關係仍然需要雙方共同承擔。"],"q":["別人會不會常常期待你負責維持關係、安排聚會或照顧大家的感受？","你有沒有因為不想讓別人失望，而承擔了太多維系關係的責任？"],"s":["所以可能出現：","「大家有問題都來找你。」"]},"6":{"t":"我逐漸理解，真正的歸屬來自互相尊重","b":["<mark class=\"k\">核心：成熟的關係與互惠。</mark>","","第六爻帶有觀察與成熟的意味。放在37號閘門上，一個人可能逐漸理解，關係不只是維持表面的和諧，也需要每個人能夠真實表達自己的需要。","","例如：","•   更能接受關係會隨著階段改變。","•   不再為了維持和諧而壓抑自己。","•   更重視承諾是否實際兌現。","•   理解真正的家庭感與歸屬感來自雙方願意參與。","","它不是不再重視關係，而是更成熟地理解，真正的親近不只是付出與照顧，也包括尊重彼此的界線和需要。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你現在會不會更在意，關係是否讓雙方都感到被尊重？","當一段關係看起來很和諧，卻需要你一直壓抑自己時，你會怎麼理解這段關係？"],"s":["「我愛你，不代表所有事情都必須由我負責。」"]}},"oh":"家庭、支持與契約","oi":[]},"38":{"h":"原則、韌性、挑戰與值得堅持的事情","i":["38號閘門位於根部中心，屬於個體回路，與面對阻力、尋找意義和堅持重要的事情有關。","<mark class=\"k\">這個閘門不是為了反對而反對，而是可能需要確認某件事值得自己付出，才願意面對其中的困難。</mark>"],"L":{"1":{"t":"我需要先確認，什麼值得我堅持","b":["<mark class=\"k\">核心：堅持的基礎與價值判斷。</mark>","","第一爻重視基礎。放在38號閘門上，一個人可能不會願意為了任何事情投入鬥爭，而是需要知道這件事是否符合自己的原則。","","例如：","•   不喜歡為了小事一直爭論。","•   面對困難時，會先想清楚目標。","•   對沒有意義的衝突缺乏興趣。","•   如果認為某件事很重要，就願意認真面對。","","它不是害怕衝突，而是需要先確認這場堅持是否值得，才願意投入力量。"],"q":["當你面對衝突時，會不會先判斷這件事值不值得堅持？","你有沒有一些原則，即使面對壓力，也很難輕易放棄？"],"s":["不是所有問題都值得投入。"]},"2":{"t":"我自然會堅持自己認為重要的事","b":["<mark class=\"k\">核心：自然的韌性與原則感。</mark>","","第二爻的特質可能自然流露。放在38號閘門上，一個人可能在面對自己重視的事情時，自然表現出韌性。","","例如：","•   遇到困難時不容易馬上放棄。","•   對不合理的事情會自然提出異議。","•   別人覺得事情太難，他卻想再試試看。","•   對某些原則有很直接的堅持。","","它不是每件事都要爭到底，而是當某件事對自己真正重要時，堅持可能自然出現。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["有沒有一些事情，即使別人不理解，你還是會想堅持？","當你覺得一件事很重要時，你是不是比較不容易因為別人反對就放棄？"],"s":["一旦覺得值得：","「我不會輕易放棄。」"]},"3":{"t":"我透過衝突與挫折，學習怎樣堅持","b":["<mark class=\"k\">核心：試錯、衝突與力量的調整。</mark>","","第三爻透過經驗學習。放在38號閘門上，一個人可能經歷過堅持錯誤的方向、衝突升級，或把力量用在不值得的事情上。","","例如：","•   曾經為了證明自己正確而爭論很久。","•   發現堅持一個目標卻讓自己長期疲憊。","•   透過衝突，逐漸理解哪些事情值得爭取。","•   學會表達立場，同時判斷什麼時候可以停止。","","它不是注定愛爭吵，而是透過經驗學習，分辨堅持原則與執著於輸贏之間的差別。"],"q":["你有沒有經歷過一場衝突，後來發現自己其實不需要爭到最後？","當你堅持一件事時，你會不會停下來問自己，這件事現在還值得投入嗎？"],"s":["可能經歷很多碰撞。","最後發現：","「這個真的值得。」"]},"4":{"t":"我會在關係與群體中，為共同重視的事情堅持","b":["<mark class=\"k\">核心：人際連接與共同立場。</mark>","","第四爻與人際網絡有關。放在38號閘門上，一個人可能透過團隊或關係，找到共同重視的事情，並願意為它努力。","","例如：","•   為團隊認為重要的目標堅持。","•   看到朋友受到不公平對待時，願意支持。","•   在群體中表達共同的原則。","•   通過合作，讓原本孤立的堅持獲得更多力量。","","它不是必須替所有人出頭，而是當共同價值受到影響時，關係可能成為堅持的重要支持。"],"q":["你有沒有為了自己重視的人或團隊，而願意面對原本不想處理的困難？","當你看到不公平的事情發生時，你會不會自然想站出來表達立場？"],"s":["別人看到你：","「你怎麼還沒放棄？」"]},"5":{"t":"別人期待我成為那個不會輕易退縮的人","b":["<mark class=\"k\">核心：韌性與他人的投射。</mark>","","第五爻容易受到投射。放在38號閘門上，別人可能認為這個人很堅強，能夠面對困難，因此期待他繼續堅持。","","例如：","•   團隊遇到阻力時，希望他站出來。","•   朋友認為他很有原則，期待他為大家爭取。","•   別人覺得他不會輕易放棄。","•   他可能因為不想被認為軟弱，而一直承擔衝突。","","它不是必須永遠戰鬥，而是別人可能期待他承擔堅持者的角色；他仍然可以判斷何時繼續、何時退出。"],"q":["別人會不會覺得你很有原則，所以遇到困難就期待你站出來？","你有沒有因為不想被認為退縮，而堅持了一件其實已經不值得的事情？"],"s":["容易成為別人問題裡的「戰士」。","但：","不是每一場戰爭都屬於你。"]},"6":{"t":"我逐漸理解，真正的堅持需要選擇","b":["<mark class=\"k\">核心：成熟的韌性與意義。</mark>","","第六爻帶有觀察與成熟的意味。放在38號閘門上，一個人可能逐漸理解，堅持不是每場鬥爭都要贏，而是把力量用在真正重要的事情上。","","例如：","•   不再把每次不同意見都當成挑戰。","•   能夠接受有些事情不需要自己解決。","•   更清楚哪些原則不能輕易放棄。","•   不再為了證明自己而制造衝突。","","它不是失去原則，而是更成熟地理解，真正的韌性來自清楚知道自己為什麼堅持，以及什麼值得自己投入。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你現在會不會比以前更能分辨，哪些衝突值得處理，哪些不需要參與？","當你選擇不再堅持一件事時，你會不會開始理解，那也可能是一種成熟的決定？"],"s":["真正成熟不是永遠堅持。","而是：","「我知道什麼值得繼續，什麼可以放手。」"]}},"oh":"奮鬥與堅持","oi":[]},"39":{"h":"刺激、觸動、情緒反應與喚起真實感受","i":["39號閘門位於根部中心，屬於個體回路，與刺激、挑動和喚起情緒有關。","<mark class=\"k\">這個閘門不應該簡單理解成喜歡惹人生氣。它更涉及刺激如何讓某些原本沒有被看見的感受浮現出來。</mark>"],"L":{"1":{"t":"我需要先知道，什麼樣的刺激是合適的","b":["<mark class=\"k\">核心：刺激的基礎與界線。</mark>","","第一爻重視基礎。放在39號閘門上，一個人可能需要先了解情境與關係，才知道是否適合直接提出某個問題或觸動對方。","","例如：","•   不會在所有場合都直接挑戰別人。","•   會觀察關係是否足夠安全。","•   希望知道自己的表達會帶來什麼影響。","•   在重要關係中，會考慮怎樣提出敏感的話題。","","它不是害怕表達，而是需要先理解情境和界線，才比較能夠負責任地觸動別人。"],"q":["當你想指出一個別人可能不太願意面對的問題時，你會不會先觀察時機？","你會不會考慮，對方目前是否有空間聽見你要表達的內容？"],"s":["不是為了製造衝突。","而是：","「這件事情有沒有真正的生命力？」"]},"2":{"t":"我自然會觸動別人，也容易被別人觸動","b":["<mark class=\"k\">核心：自然的刺激與情緒反應。</mark>","","第二爻的特質可能自然流露。放在39號閘門上，一個人可能很自然地說出某句話，讓別人出現明顯反應；他自己也可能很容易被別人的話觸動。","","例如：","•   一句直接的話，讓別人突然開始認真思考。","•   某些人的表達會立即引起自己的情緒。","•   可能很容易察覺一段對話是否觸及敏感點。","•   自己覺得只是隨口一說，別人卻有很大的反應。","","它不是故意傷害別人，而是刺激與觸動可能自然發生；仍需要留意表達的影響。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["你有沒有發現，自己有時只是說了一句話，別人卻出現很明顯的反應？","你會不會也很容易被別人某句話觸動，甚至開始重新思考一件事？"],"s":["一句話可能讓別人：","「欸，我從來沒想過這個。」"]},"3":{"t":"我透過反應與衝突，學習刺激的界線","b":["<mark class=\"k\">核心：試錯、刺激與表達責任。</mark>","","第三爻透過經驗學習。放在39號閘門上，一個人可能經歷過挑起不必要的衝突，或發現某種表達方式讓對方關閉自己。","","例如：","•   曾經為了讓對方回應而說得太直接。","•   發現自己無意間觸碰了別人的敏感處。","•   透過衝突學習怎樣表達不同意見。","•   逐漸分辨什麼時候需要直接，什麼時候需要先理解對方。","","它不是每次刺激都一定有價值，而是透過經驗學習，怎樣區分有助於看見真相的觸動，與只會制造傷害的挑釁。"],"q":["你有沒有因為說話太直接，而發現對方的反應比自己預期強烈？","後來你有沒有學會，表達真實想法也需要考慮對方能否接收？"],"s":["有時候：","「這樣講太過了。」","於是調整。"]},"4":{"t":"我在關係中觸動彼此真實的感受","b":["<mark class=\"k\">核心：人際連接與情緒的喚起。</mark>","","第四爻與人際網絡有關。放在39號閘門上，一個人可能在熟悉的關係中，通過提問或表達，讓彼此看見沒有說出來的感受。","","例如：","•   與朋友討論時，提出一個讓對方認真思考的問題。","•   在熟悉的關係中，願意談比較真實的感受。","•   通過交流，發現關係中一直沒有說清楚的事情。","•   在信任的環境中，刺激能夠帶來理解，而不是單純衝突。","","它不是要揭穿所有人的問題，而是當關係有足夠的空間時，觸動可能幫助彼此看見真實感受。"],"q":["你有沒有發現，和某些熟悉的人交流時，你們會談到一些平常不容易說出口的感受？","你提出的問題，是否有時會讓對方開始認真面對自己原本沒有注意到的事情？"],"s":["熟悉的人可能知道：","「他不是在攻擊我，他是在刺激我想一想。」"]},"5":{"t":"別人期待我讓他們面對真實問題","b":["<mark class=\"k\">核心：觸動的角色與他人的投射。</mark>","","第五爻容易受到投射。放在39號閘門上，別人可能認為這個人敢於說真話，期待他指出大家不願意面對的問題。","","例如：","•   團隊希望他提出別人不敢說的意見。","•   朋友期待他直接指出問題。","•   別人覺得他能夠打破表面和諧。","•   他可能因為被期待扮演挑戰者，而覺得自己必須不斷刺激別人。","","它不是必須挑戰每一個人，而是別人可能期待他負責觸動大家；他仍然需要判斷這件事是否值得說、是否有幫助。"],"q":["別人會不會覺得你很敢說真話，所以期待你指出大家不願意面對的問題？","你有沒有因為別人期待你直接，而覺得自己必須一直扮演那個提出尖銳問題的人？"],"s":["「你幫我想想辦法。」"]},"6":{"t":"我逐漸理解，觸動的價值在於它帶來了什麼","b":["<mark class=\"k\">核心：成熟的刺激與情緒理解。</mark>","","第六爻帶有觀察與成熟的意味。放在39號閘門上，一個人可能逐漸理解，刺激本身並不代表有意義，重要的是它是否幫助人們看見真實情況。","","例如：","•   不再為了獲得反應而說尖銳的話。","•   更懂得判斷對方是否準備好面對問題。","•   能夠接受有些事情需要時間，而不是一次刺激就能改變。","•   更重視觸動之後有沒有理解與行動。","","它不是失去直接表達的能力，而是更成熟地使用刺激，讓它成為理解的入口，而不是不斷制造衝突的方式。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你現在會不會更在意，自己說出的話是否真的有幫助，而不只是有沒有引起反應？","當你發現對方暫時不願面對某個問題時，你會不會更願意給對方時間？"],"s":["「有些時候，尊重別人保持原來的狀態，也是一種成熟。」"]}},"oh":"挑釁與喚醒","oi":[]},"40":{"h":"工作、付出、休息、獨立空間與承諾","i":["40號閘門位於意志力中心，屬於部落回路，與工作、提供資源、承諾和需要獨處休息有關。","<mark class=\"k\">這個閘門的重點是：一個人可以願意為關係和責任付出，但也需要個人空間，才能恢復自己的力量。</mark>"],"L":{"1":{"t":"我需要先確認，付出之後能不能得到休息","b":["<mark class=\"k\">核心：工作與休息的基礎。</mark>","","第一爻重視基礎。放在40號閘門上，一個人可能很在意工作與休息之間是否有合理安排。","","例如：","•   希望完成責任後，有時間自己待著。","•   不喜歡工作與私人時間完全混在一起。","•   會考慮自己能承擔多少工作。","•   如果一直被要求付出，卻沒有休息空間，容易感到疲憊。","","它不是不願意工作，而是需要先有合理的休息基礎，才能持續承擔責任。"],"q":["當你完成一件重要的工作後，會不會特別需要自己的時間？","如果別人一直要求你付出，卻沒有給你休息空間，你會有什麼感覺？"],"s":["會很在意：","「我的努力有沒有意義？」"]},"2":{"t":"我自然知道什麼時候想獨處","b":["<mark class=\"k\">核心：自然的獨立與恢復需求。</mark>","","第二爻的特質可能自然流露。放在40號閘門上，一個人可能很自然地在完成工作或社交後，想要獨處。","","例如：","•   忙完之後，不想馬上繼續聊天。","•   喜歡一個人安靜吃飯或休息。","•   不一定需要很多活動來恢復。","•   別人可能以為他不想理人，他卻只是需要空間。","","它不是不重視關係，而是獨處可能是恢復自己的自然方式。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["你有沒有發現，忙完之後自己很需要一段不被打擾的時間？","當你想獨處時，你會不會擔心別人誤會你是不想理他們？"],"s":["40.2 比較像：","「對重要的人，我很自然就願意付出。」","不需要特別提醒或計畫，看到需要就會去做。","它不是單純「愛犧牲」。","而是：","「付出本來就是我表達在乎的方式。」"]},"3":{"t":"我透過過度付出，學習休息與責任的界線","b":["<mark class=\"k\">核心：試錯、付出與個人空間。</mark>","","第三爻透過經驗學習。放在40號閘門上，一個人可能曾經承擔太多責任，後來才發現休息並不是可有可無的東西。","","例如：","•   為了完成工作，長期犧牲私人時間。","•   因為不想讓別人失望，答應過多事情。","•   休息不足時，開始對原本願意做的事情產生抗拒。","•   透過疲憊，學習在付出之前考慮自己的負荷。","","它不是沒有責任感，而是透過經驗理解，真正持續的付出需要有恢復空間。"],"q":["你有沒有因為太想把事情做好，而犧牲了自己的休息時間？","當你長期沒有個人空間時，會不會開始對原本願意做的事情感到厭倦？"],"s":["可能：","給太多 → 累 → 重新調整。"]},"4":{"t":"我在關係中付出，也需要關係中的尊重","b":["<mark class=\"k\">核心：互惠、承諾與關係支持。</mark>","","第四爻與人際網絡有關。放在40號閘門上，一個人可能願意為熟悉的人承擔責任，但也會在意這種付出是否受到尊重。","","例如：","•   願意為家人處理重要事情。","•   在團隊中承擔責任，希望大家遵守約定。","•   付出之後，希望自己的時間被尊重。","•   需要與人保持聯系，也需要獨處的空間。","","它不是要求別人每次都回報，而是付出與休息都應該被關係看見，不應把一個人的責任當成理所當然。"],"q":["當你為別人付出時，你會不會希望對方至少尊重你的時間和界線？","你有沒有經歷過，別人習慣了你的付出，卻忽略了你也需要休息？"],"s":["別人會覺得：","「有你在，事情比較穩定。」"]},"5":{"t":"別人期待我承擔責任並持續付出","b":["<mark class=\"k\">核心：責任角色與他人的投射。</mark>","","第五爻容易受到投射。放在40號閘門上，別人可能認為這個人可靠、有責任感，因此期待他持續提供支持。","","例如：","•   家人習慣把責任交給他。","•   工作上別人覺得他一定會完成任務。","•   朋友需要幫忙時，經常想到他。","•   他可能因為別人依賴自己，而不敢說自己已經很累。","","它不是必須一直當可靠的人，而是別人可能期待他承擔責任；他仍然需要明確自己的能力與界線。"],"q":["別人會不會因為覺得你很可靠，而經常把責任交給你？","你有沒有因為不想讓人失望，而不太敢告訴別人自己已經需要休息？"],"s":["所以容易變成：","「反正你會幫。","」"]},"6":{"t":"我逐漸理解，獨處與付出需要平衡","b":["<mark class=\"k\">核心：成熟的責任感與自我恢復。</mark>","","第六爻帶有觀察與成熟的意味。放在40號閘門上，一個人可能逐漸理解，真正的責任不等於無止境地付出。","","例如：","•   更願意提前說明自己的時間與能力。","•   不再因為需要獨處而感到內疚。","•   能夠區分自己願意承擔的責任與別人加給自己的期待。","•   更重視長期可持續的工作與關係方式。","","它不是不再關心別人，而是更成熟地理解，付出與獨處都屬於健康關係的一部分。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你現在會不會更能接受，自己需要獨處並不代表不重視別人？","當你需要拒絕一項額外責任時，你能不能同時尊重自己的需要與對方的處境？"],"s":["「我不是只有不斷付出，才有價值。」"]}},"oh":"付出與休息","oi":[]},"41":{"h":"想象、期待、欲望與新體驗的起點","i":["41號閘門位於根部中心，屬於集體感知回路，與收縮、想象和新體驗的起點有關。","<mark class=\"k\">它的重點不是每個想法都必須實現，而是某種內在的期待可能成為一段新體驗的開始。</mark>"],"L":{"1":{"t":"我需要先弄清楚，自己想體驗什麼","b":["<mark class=\"k\">核心：體驗的基礎與期待的辨認。</mark>","","第一爻重視基礎。放在41號閘門上，一個人可能需要先理解自己真正想經歷什麼，才知道該如何面對新的可能性。","","例如：","•   對未來有期待，卻不確定具體想要什麼。","•   會想象不同生活，但需要時間選擇方向。","•   在決定嘗試新事物前，希望先確認自己的需要。","•   不想只是為了逃離當前生活而改變。","","它不是壓抑想象，而是先辨認自己的渴望，才能知道哪些體驗值得追求。"],"q":["當你開始向往一種新的生活時，會不會先想清楚自己真正想改變什麼？","你有沒有發現，有時自己很想要某種體驗，卻還不太清楚為什麼？"],"s":["會想：","「我真的想體驗這個嗎？」"]},"2":{"t":"我的想象會自然地帶來期待","b":["<mark class=\"k\">核心：自然的想象與體驗向往。</mark>","","第二爻的特質可能自然流露。放在41號閘門上，一個人可能很自然地想象未來可能經歷的事情。","","例如：","•   想到旅行，就開始想象不同的畫面。","•   對新生活產生期待。","•   很容易被某種尚未經歷的體驗吸引。","•   別人覺得只是一個普通的可能性，他卻已經感受到期待。","","它不是每個想象都需要實現，而是想象可能自然帶來對未來體驗的向往。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["你會不會很自然地想象未來可能發生的事情？","當你想到一種新的體驗時，你會不會很容易開始期待它發生？"],"s":["腦中可能有很多：","•   旅行","•   愛情","•   新生活","•   新體驗"]},"3":{"t":"我透過現實經驗，調整原本的期待","b":["<mark class=\"k\">核心：試錯、期待與現實之間的差異。</mark>","","第三爻透過經驗學習。放在41號閘門上，一個人可能發現，想象中的體驗與真實經歷往往有所不同。","","例如：","•   原本想象某種生活會很自由，實際經歷後發現也有責任。","•   期待一段旅行，最後卻發現自己需要休息。","•   嘗試某件事後，發現真正想要的與原本想象不同。","•   透過現實經驗，重新理解自己的渴望。","","它不是想象力不實際，而是透過經驗檢驗期待，逐漸知道自己真正想體驗什麼。"],"q":["你有沒有經歷過，原本很向往一件事，真正體驗後卻發現感覺完全不同？","當現實和想象不一樣時，你會不會因此更清楚自己真正想要什麼？"],"s":["「想象很好，實際呢？」"]},"4":{"t":"我的期待會在關係中被激發","b":["<mark class=\"k\">核心：人際連接與共同體驗。</mark>","","第四爻與人際網絡有關。放在41號閘門上，一個人的新期待可能透過與他人的交流而出現。","","例如：","•   朋友分享旅行經歷後，自己也開始向往。","•   看到別人嘗試新的生活方式，產生新的想法。","•   與人討論未來時，發現自己有新的願望。","•   透過共同計劃，開始期待某段體驗。","","它不是自己的願望必須來自別人，而是關係可能幫助自己發現原本沒有注意到的可能性。"],"q":["有沒有一些新體驗，是因為聽了別人的故事，才開始想嘗試的？","當你和朋友討論未來時，會不會突然發現自己原來還有其他願望？"],"s":["可能讓別人也開始：","「我們要不要試試看？」"]},"5":{"t":"別人期待我開啟新的體驗","b":["<mark class=\"k\">核心：新體驗的角色與他人的投射。</mark>","","第五爻容易受到投射。放在41號閘門上，別人可能期待這個人提出新計劃、帶來新鮮感，或者幫助大家開啟一個新的階段。","","例如：","•   朋友期待他安排新的活動。","•   團隊希望他提出新的可能性。","•   別人覺得他很會想象未來。","•   他可能因為別人期待，而覺得自己必須不斷創造新體驗。","","它不是必須不斷開始新事物，而是別人可能期待他提供新的可能性；他仍然可以選擇暫時不追求變化。"],"q":["別人會不會常常期待你提出新的計劃或體驗？","你有沒有因為別人覺得你很有想象力，而覺得自己必須一直想出新的可能性？"],"s":["容易成為：","「有什麼新東西？」","的來源。"]},"6":{"t":"我逐漸理解，想象是起點，不是必須完成的承諾","b":["<mark class=\"k\">核心：成熟的期待與選擇。</mark>","","第六爻帶有觀察與成熟的意味。放在41號閘門上，一個人可能逐漸理解，想象能夠打開可能性，但並不是每個可能性都要成為現實。","","例如：","•   能夠享受想象，而不急著立即行動。","•   更謹慎地選擇真正想體驗的事情。","•   接受有些願望會隨著時間改變。","•   不再因為沒有實現所有期待，就覺得自己錯過人生。","","它不是放棄夢想，而是更成熟地理解，想象可以幫助自己發現可能性，真正要投入哪一種體驗，則需要進一步選擇。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你現在會不會比較能夠享受想象未來，而不要求自己馬上實現所有想法？","當一個願望慢慢改變時，你會不會允許自己重新選擇，而不是覺得自己必須堅持原來的期待？"],"s":["「有些想象，是為了打開可能性，而不是變成現實。」"]}},"oh":"想象與新體驗的開始","oi":[]},"42":{"h":"成長、完成周期、經驗的收獲與結束","i":["42號閘門位於薦骨中心，屬於集體感知回路，與周期的發展、成長和完成有關。","<mark class=\"k\">它的重點不只是開始新事物，而是讓經歷走過一個階段，從中獲得收獲。</mark>"],"L":{"1":{"t":"我需要先確認，這個周期是否有完成的基礎","b":["<mark class=\"k\">核心：發展的基礎與完成條件。</mark>","","第一爻重視基礎。放在42號閘門上，一個人可能需要先了解事情的條件、資源與發展過程，才知道是否適合投入一個周期。","","例如：","•   開始項目時，會考慮時間和資源。","•   希望知道一個計劃大概會經歷哪些階段。"
