const AXP={"1-2":"1「創造」與 2「接納」：1 想把自己的獨特展現出來，2 提醒要先找到方向、等對的時機。<mark class=\"k\">課題是在創作與等待之間取得節奏。</mark>","3-50":"3「突變」與 50「價值觀」：3 從混亂中摸索出新的做法，50 要判斷哪些規則與責任值得守護。<mark class=\"k\">課題是改變的同時，不丟掉真正重要的價值。</mark>","4-49":"4「答案」與 49「原則」：4 想找到合乎邏輯的解答，49 在意底線與關係的原則。<mark class=\"k\">課題是不要為了一個答案，犧牲了自己的原則或關係。</mark>","5-35":"5「等待」與 35「變化」：5 需要穩定的節奏，35 渴望新的體驗。<mark class=\"k\">課題是在規律與嘗試新事物之間，找到適合自己的步調。</mark>","6-36":"6「衝突」與 36「危機」：6 在關係中學習親密與界線，36 在未知與情緒風暴中成長。<mark class=\"k\">課題是穿過情緒起伏，而不是急著下決定。</mark>","7-13":"7「領導」與 13「傾聽」：7 想為群體指出方向，13 懂得傾聽並保管別人的故事。<mark class=\"k\">課題是先聽懂人，再引領方向，不要不請自來。</mark>","8-14":"8「貢獻」與 14「力量」：8 想以獨特的方式貢獻，14 擁有資源與技能的動力。<mark class=\"k\">課題是把能力與資源投入真正有意義的方向。</mark>","9-16":"9「專注」與 16「熱情技能」：9 要把力量集中在細節上，16 靠熱情反覆練習到熟練。<mark class=\"k\">課題是專注與熱情要有方向，別陷入完美主義或三分鐘熱度。</mark>","10-15":"10「自我行為」與 15「極端」：10 要活出真實的自己，15 包容各種不同的節奏。<mark class=\"k\">課題是接納差異的同時，也守住自己的界線與生活方式。</mark>","11-12":"11「理念」與 12「謹慎」：11 腦中有很多想法與畫面，12 要等到時機與情緒對了才表達。<mark class=\"k\">課題是不必每個想法都說出口，選對時機再分享。</mark>","17-18":"17「觀點」與 18「修正」：17 形成看法與意見，18 看見哪裡需要改善。<mark class=\"k\">課題是意見要帶著善意，不要變成一直挑錯。</mark>","19-33":"19「需求」與 33「隱退」：19 對需要與親近很敏感，33 需要退後整理經驗。<mark class=\"k\">課題是在靠近人與保留獨處空間之間取得平衡。</mark>","20-34":"20「當下」與 34「力量」：20 活在此刻，34 擁有直接的行動力。<mark class=\"k\">課題是力量要有方向，不要只是忙著反應。</mark>","21-48":"21「控制」與 48「深度」：21 想掌握資源與責任，48 在意自己的能力與知識是否足夠。<mark class=\"k\">課題是不必等到完全準備好，也不必什麼都抓在手裡。</mark>","22-47":"22「優雅開放」與 47「領悟」：22 的開放受情緒影響，47 需要時間從混亂中整理意義。<mark class=\"k\">課題是接受自己有狀態起伏，等心情與理解成熟再行動。</mark>","23-43":"23「分辨」與 43「洞見」：23 把複雜的事說得簡單，43 有突然冒出的獨特理解。<mark class=\"k\">課題是先有洞見，再找到讓別人聽得懂的說法。</mark>","24-44":"24「回歸」與 44「警覺」：24 反覆思考、消化經驗，44 靠過去的經驗察覺模式。<mark class=\"k\">課題是不被過去的經驗與想太多困住，讓現實行為來確認。</mark>","25-46":"25「無條件的愛」與 46「身體之愛」：25 以真誠面對生命，46 靠身體與親身參與認識生活。<mark class=\"k\">課題是在經歷中保持真誠，同時照顧自己的身體與界線。</mark>","26-45":"26「策略」與 45「聚集」：26 懂得呈現價值與說服，45 懂得管理資源與群體。<mark class=\"k\">課題是影響力要建立在信任上，不要只靠說得動聽。</mark>","27-28":"27「滋養」與 28「冒險」：27 想照顧與給予，28 想找到值得投入的意義。<mark class=\"k\">課題是付出與冒險都要有意義，也要留力氣給自己。</mark>","29-30":"29「承諾」與 30「欲望」：29 一旦答應就會投入，30 對體驗有強烈期待。<mark class=\"k\">課題是想清楚真正想要什麼再承諾，別被一時的渴望推著走。</mark>","31-41":"31「影響力」與 41「收縮」：31 想表達方向與領導，41 是新體驗的起點與想像。<mark class=\"k\">課題是領導方向來自對新可能性的真實期待，而不是硬撐。</mark>","32-42":"32「延續」與 42「增長」：32 判斷什麼值得延續，42 要完成並結束一個週期。<mark class=\"k\">課題是該結束時能放手，不因怕失敗而硬撐。</mark>","37-40":"37「友誼」與 40「孤獨」：37 重視家庭與關係的互惠，40 需要獨處與休息。<mark class=\"k\">課題是付出之後留給自己空間，不要把責任都扛在身上。</mark>","38-39":"38「鬥爭」與 39「挑釁」：38 為重要的事堅持，39 用刺激喚醒真實感受。<mark class=\"k\">課題是分清楚值得堅持的原則，與只是想贏的衝突。</mark>","51-57":"51「震撼」與 57「直覺」：51 在衝擊中展現勇氣，57 靠細微直覺察覺當下。<mark class=\"k\">課題是在突發與緊張中，聽見提醒，也不要被恐懼支配。</mark>","52-58":"52「靜止」與 58「活力」：52 需要停下來專注，58 有想把事情變更好的活力。<mark class=\"k\">課題是動與靜要交替，讓改善出於喜悅，而不是不滿足。</mark>","53-54":"53「開始」與 54「野心」：53 是新週期的啟動，54 想向上發展。<mark class=\"k\">課題是不要為了成就而不斷開始，選擇有條件發展的事。</mark>","55-59":"55「精神」與 59「親密」：55 在意內在自由與情緒狀態，59 想打破隔閡走近人。<mark class=\"k\">課題是親近他人時，也尊重自己的情緒與節奏。</mark>","56-60":"56「刺激」與 60「限制」：56 用故事與體驗讓生活豐富，60 提醒現實的限制。<mark class=\"k\">課題是在限制中找到新的形式，而不是硬衝。</mark>","61-62":"61「內在真相」與 62「細節」：61 追尋深層的真相，62 把事情說清楚、具體化。<mark class=\"k\">課題是讓深刻的思考能被準確地表達出來。</mark>","63-64":"63「懷疑」與 64「混亂」：63 提出疑問、驗證，64 的畫面與記憶尚未成形。<mark class=\"k\">課題是接受理解需要時間，不必馬上得到答案。</mark>"};
const AXL={"1": "1 爻：這組主題先求穩固的基礎，需要研究清楚才有安全感。", "2": "2 爻：這組主題的天賦自然流露，通常需要被邀請、被看見才會走出來展現。", "3": "3 爻：這組主題要靠親身嘗試與犯錯，才找到真正有用的做法。", "4": "4 爻：這組主題透過朋友與熟人的網絡展開，機會與影響力來自關係。", "5": "5 爻：這組主題常被別人投射期待，被視為能解決問題的人；要維護信用，不承諾做不到的事。", "6": "6 爻：這組主題會隨人生階段成熟：約 30 歲前像 3 爻般嘗試，30–50 歲退後觀察，之後成為榜樣。"};
function axisBlock(v){
  let o='';
  [0,1].forEach(i=>{
    const S=gv(v,'sun',i),E=gv(v,'earth',i); if(!S)return;
    const l=lv(v,'sun',i), k=Math.min(S,E)+'-'+Math.max(S,E);
    const LS=l&&LN[S]&&LN[S].L[l], LE=l&&LN[E]&&LN[E].L[l];
    o+=`<div class="box"><h3>主軸解讀・${i?'紅（潛意識）':'黑（意識）'}　太陽 ${S}${l?'.'+l:''} ／ 地球 ${E}${l?'.'+l:''}</h3>`
     +`<p><b>太陽（你是誰）・${S} ${esc(DATA[S].name)}</b><br>${esc(DATA[S].sun)}</p>`
     +`<p><b>地球（你的根基）・${E} ${esc(DATA[E].name)}</b><br>${esc(DATA[E].earth)}</p>`
     +`<p><b>兩者搭配</b><br>${esc(AXP[k]||'')}</p>`
     +(l?`<p><b>爻線</b><br>${S}.${l}　${esc(LS?LS.t:'')}<br>${E}.${l}　${esc(LE?LE.t:'')}<br>${esc(AXL[l])}</p>`:'')
     +`<p style="color:var(--mute);font-size:14px"><b>給客戶的說法</b><br>你的天賦：${esc(DATA[S].sun)}<br>你的根基：${esc(DATA[E].earth)}<br>你的課題：${esc(((AXP[k]||'').split('課題是')[1]||'').replace(/<\/mark>/g,''))}</p>`
     +(i?'<div class="sidenote">紅色這一側偏向身體與天生的一面，自己較難察覺，常由旁人先看見。</div>':'')+`</div>`;
  });
  return o;
}
function chartResult(v,prof){
  let h='';
  const sb=gv(v,'sun',0), sr=gv(v,'sun',1);
  if(prof&&PRO[profKey(prof)]){const x=PRO[profKey(prof)];h+=`<div class="box"><h3>人生角色 ${prof}・${x.n}</h3><p>${x.d}<br><a href="#profile/${profKey(prof)}" style="color:var(--acc)">查看完整的人生角色頁面 →</a></p></div>`;}
  if(prof&&sb){
    const c=CROSS.find(x=>x.t===profAngle(prof)&&x.s===sb);
    if(c){const match=sr===null||c.d===sr;
      h+=`<div class="box"><h3>輪迴交叉</h3><p><a href="#cross/${c.id}" style="color:var(--acc)">${ANG[c.t].n}交叉・${c.zh}</a>（${c.s}/${OPP[c.s]} | ${c.d}/${OPP[c.d]}）${match?'':`<br><span style="color:var(--mute);font-size:14px">你輸入的設計太陽是 ${sr}，與標準組合的 ${c.d} 不同，請再確認輸入。</span>`}</p></div>`;}
  }
  h+=axisBlock(v);
  for(const [id,name] of CH){
    const p=P(id), parts=[];
    [0,1].forEach(i=>{const n=gv(v,id,i); if(!n)return; const l=lv(v,id,i), E=l&&LN[n]&&LN[n].L[l];
      parts.push(`<div class="box"><h3>${i?'紅・潛意識':'黑・意識'}　閘門 ${n}${l?'.'+l:''} ${esc(DATA[n].name)}</h3>${p.f.map(([lb,k])=>`<p>${p.f.length>1?`<b>${lb}：</b>`:''}${esc(DATA[n][k])}</p>`).join('')}${v.sws&&SWS[n]?swsInline(n):''}${E?`<p style="margin-top:8px"><b>${n}.${l}　${esc(E.t)}</b><br>${(E.s||E.b).map(esc).join('<br>')}</p>`:''}<a href="#${id}/${n}${l?'/'+l:''}" style="font-size:13px;color:var(--acc)">查看完整頁面 →</a></div>`);});
    if(parts.length)h+=`<div class="pcard"><h2>${p.g} ${name}</h2>${parts.join('')}</div>`;
  }
  return h||'<div class="empty">輸入閘門號碼後，解釋會顯示在這裡</div>';
}
function chartPage(){
  let v={prof:'',L:{},sun:['',''],moon:['',''],north:['',''],mercury:['',''],venus:['',''],mars:['',''],jupiter:['',''],saturn:['',''],uranus:['',''],neptune:['',''],pluto:['','']};
  try{const s=JSON.parse(localStorage.getItem('hd_chart')||'null'); if(s&&s.sun)v=Object.assign(v,s);}catch(e){}
  v.L=v.L||{};
  app.innerHTML=`<div class="top"><button class="back" onclick="location.hash=''">← 首頁</button><span class="crumb">我的命盤</span></div>
  <div class="intro">輸入命盤上每個行星的閘門，有爻線可以一起填，例如 34.5（黑＝意識，紅＝潛意識）。地球與南交點會自動帶入；兩個太陽的爻線都填了，人生角色會自動判斷。資料只存在這個瀏覽器。</div>
  <select id="prof" class="search"><option value="">選擇人生角色（用來判斷輪迴交叉）</option>${PROF.map(x=>`<option value="${x}" ${v.prof===x?'selected':''}>${x}</option>`).join('')}</select><div id="pn" class="sidenote"></div>
  <div class="ct"><div class="h">行星</div><div class="h">黑（意識）</div><div class="h">紅（潛意識）</div>
  ${CH.map(([id,name])=>{const auto=id==='earth'||id==='south';return `<div>${name}</div>`+[0,1].map(i=>`<input id="c_${id}_${i}" type="text" inputmode="decimal" maxlength="5" placeholder="${auto?'':'34.5'}" ${auto?'disabled':''} value="${auto?'':fmtG(v,id,i)}">`).join('')}).join('')}</div>
  <label class="sidenote" style="display:block;margin:6px 0 10px"><input type="checkbox" id="sws" ${v.sws?'checked':''}> 解讀時，同時顯示每個閘門的強項・弱點・策略</label>
  <button class="back" style="margin-bottom:10px" onclick="bodyMode='auto';location.hash='body'">查看中心、類型與權威 →</button>
  <div id="res"></div>`;
  const q=id=>document.getElementById(id);
  const refresh=()=>{
    CH.forEach(([id])=>{if(id==='earth'||id==='south')return;[0,1].forEach(i=>{const m=q('c_'+id+'_'+i).value.trim().match(/^(\d{1,2})(?:[.\-\/ ]([1-6]))?$/);const x=m?parseInt(m[1],10):NaN;v[id][i]=Number.isNaN(x)?'':x;(v.L[id]=v.L[id]||['',''])[i]=m&&m[2]?+m[2]:'';});});
    v.prof=q('prof').value;
    {const sl=v.L.sun||['',''],ap=(sl[0]&&sl[1])?sl[0]+'/'+sl[1]:'',pn=q('pn');
     if(ap&&PROF.includes(ap)){v.prof=ap;q('prof').value=ap;pn.textContent='已由太陽爻線自動判斷人生角色：'+ap;}
     else if(ap)pn.textContent='太陽爻線組合 '+ap+' 不是有效的人生角色，請檢查輸入。';
     else pn.textContent='';}
    v.sws=q('sws').checked;
    CHART=v;
    [0,1].forEach(i=>{q('c_earth_'+i).value=fmtA(v,'earth',i);q('c_south_'+i).value=fmtA(v,'south',i);});
    try{localStorage.setItem('hd_chart',JSON.stringify(v));}catch(e){}
    q('res').innerHTML=chartResult(v,v.prof);
  };
  app.querySelectorAll('input,select').forEach(el=>el.addEventListener('input',refresh));
  refresh();scrollTo(0,0);
}

  const tC=def.has('throat')?comp.throat:-1;

  let type=def.size===0?'ref':def.has('sacral')?(mt?'mg':'gen'):(mt?'man':'proj');
  let auth=type==='ref'?'lunar':def.has('solar')?'solar':def.has('sacral')?'sacral':def.has('spleen')?'spleen':def.has('heart')?'ego':(def.has('g')&&tC>=0&&comp.g===tC)?'self':'mental';

}

  return `<div class="sec">爻線（${n}.1–${n}.6）</div><div class="tabs">${tabs}</div>${body}<div class="sidenote">爻線解釋是依各爻線的特質整理的延伸解讀，不是傳統爻辭原文。</div>`;
}
const SWS={"1":["原創力強，有獨特的風格與藝術氣質。","容易因不被理解而孤獨，或為了與眾不同而刻意標新立異。","不必與人比較，專注在自己的創作節奏，靈感與時機到了再展現。"],"2":["方向感與直覺好，能為群體指出前進的方向。","容易想太多、猶豫，或被迫決定方向時迷失；千萬別盲目強求結果。","先確認這條路是不是屬於自己，順著內在的接收感前進，不必急著決定。"],"3":["能在混亂中找到新的做法，適應變化的能力強。","面對混亂容易焦慮、卡住，或衝動地想一次突破。","接受混亂是過程，一步步摸索出新的秩序，不必一開始就完美。"],"4":["邏輯清楚，擅長把問題整理成可被理解的答案；能創造出合乎邏輯的答案。","急著給答案，或因為想不通而焦慮；容易把這份能力拿來解決自己的問題。","先驗證再回答，等對方真的需要時再給意見。"],"5":["規律穩定，能建立可靠的節奏與習慣。","節奏被打亂時煩躁，或過度固守習慣。","建立屬於自己的作息，同時為變化保留彈性。"],"6":["情緒穩定後能建立信任與深度的親密，懂得設立界線。","對人防備、容易起摩擦，或太快投入關係。","慢慢確認安全感再靠近，用誠實的溝通處理衝突。"],"7":["有遠見，擅長為群體定位方向並做出公平的領導；引導群體走向安全的未來，調整社會既定的模式。","想掌控方向卻不被信任，或過度指揮；未受邀請就強行領導，不請自來會面臨失敗。","等被認可與邀請再帶領，用公平的規則而不是控制來引導大家。"],"8":["有獨特的貢獻與個人風格，能以自己的方式影響別人。","太急著證明自己，或怕不被認可而壓抑。","找到自己真正能貢獻的地方，不靠誇大，被看見是水到渠成。"],"9":["專注細節，能把小事做得扎實。","在小事上鑽牛角尖、過度用力。","先挑出真正重要的事專注，其餘適度放手。"],"10":["活出自己、有自愛的行為準則，適應力強。","為了迎合他人而改變自己，或對自己過度挑剔。","先問自己真正想怎麼做，再決定如何行動，不必每次都符合期待。"],"11":["點子王，點子多、想像力豐富，擅長提出新想法。","想法多卻不落地，或把想法強加給別人；恐懼黑暗，焦慮再也沒有新鮮的想法。","先篩選哪些想法值得實現，再與人分享，不必每個都去做；點子是給別人的，千萬不要拿來規劃自己的生活。"],"12":["表達有魅力，懂得在對的時機說出重要的話。","情緒不佳時說話傷人，或習慣沉默壓抑。","等情緒到位再開口，不必勉強自己時時表達。"],"13":["善於聆聽，能保管他人的故事與秘密，有洞察力。","過度承載別人的情緒與故事，或沉溺過去。","聽完就放下，不把別人的問題背在自己身上，選擇性地分享。"],"14":["有技能與資源，能把能量投入熱愛的事並帶來財富。","在不對的方向蠻幹，或為了金錢勉強自己。","把力氣放在真正熱愛、有回應的事上，不為錢硬撐。"],"15":["包容不同的人與生活方式，節奏獨特；具有磁性的能量場，能接納極端的韻律。","生活與情緒起伏極端，自己也難以預測；太善變，容易迷失自我。","接受自己的起伏，找出自己的節奏，同時尊重他人的不同；別給自己設限，順其自然，你的磁場會吸引對的人和事。"],"16":["熱情與技能兼具，反覆練習能成為專家。","三分鐘熱度，或怕自己不夠好而不敢展現。","把熱情放在值得投入的技能上，持續練習，準備好再展現。"],"17":["條理清楚，能組織出有依據的觀點；腦中有很多想法，在找到合適的概念與意見後，準備轉換成具體的細節，能提出符合邏輯的意見。","急於發表意見，或堅持己見；恐懼挑戰，害怕意見被拒絕或誤解，怕被質疑而把觀點藏起來。","把觀點整理好再分享，被詢問時最有說服力。"],"18":["看得出問題並能提出改善，有品質意識。","過度挑剔、苛責他人。","先確認對方想被修正，再用建設性的方式提出，不必什麼都管。"],"19":["感受敏銳，能察覺他人與群體的需求。","需求被忽略時敏感焦躁，或為了被接納而委屈自己。","先誠實面對自己的需求，再決定要不要回應他人。"],"20":["活在當下、反應快，能精準說出此刻的覺察。","衝動行動而後悔，或過度忙碌。","行動前先停一下，再用清楚的行動回應當下。"],"21":["能管理資源與秩序，有責任感與掌控力。","事事想掌控、過度緊張。","學會授權，把掌控放在真正需要負責的範圍內。"],"22":["優雅有魅力，開放時很能打動他人。","情緒起伏大，或勉強自己社交。","等心情對了再開放，不必隨時展現魅力。"],"23":["能把複雜的事說得簡單，見解獨到。","太直接而不被理解，或急著說服別人。","等被邀請再說，用簡單的方式表達最有效。"],"24":["能反覆思考，最後獲得深刻的領悟；經過自發性的突變過程，把獨特的靈感轉換成合理的概念。","想法停不下來，鑽牛角尖；恐懼無知，因不知道答案而焦慮。","給自己安靜思考的空間，領悟會自己回來，不必逼自己立刻想通；給頭腦足夠的時間反覆審視，不要用頭腦做決定。"],"25":["純真、不設防，有無條件的愛與勇氣；運用無條件的愛，適應驚嚇，在逆境中生存。","受傷後封閉，或過度天真而被利用；要注意盲目尋求方向。","保持純真，同時學會為自己設立界線。"],"26":["擅長說服與影響，有商業與談判的嗅覺。","誇大包裝，或為了達成目的而操弄。","以誠信為基礎表達，讓對方自己看見價值。"],"27":["願意照顧與滋養他人，有責任感。","過度付出而耗竭，或以照顧來控制他人。","先照顧好自己，再以健康的界線去照顧別人。"],"28":["有勇氣面對冒險，願意為有意義的事奮戰；願意為真正值得的事面對風險與困難，重視生命的意義。","為反抗而反抗，或因害怕無意義而退縮；深層恐懼是「生命沒有意義」，怕把力氣花在沒意義的事上，可能一直在找「值得」的事而遲遲不開始，或太早放棄。","把力氣放在真正值得的事上，不必每場戰役都參加；意義常常是投入之後才慢慢看見，不必等完全確定值得才行動。"],"29":["一旦承諾就全心投入，有毅力與堅持。","來者不拒，過度承諾而疲憊。","用身體的感覺確認是否真心想答應，不確定時先不承諾。"],"30":["對生命有熱情與渴望，感受力強。","慾望落空時失望或焦躁。","享受過程，不急著抓結果，感受過後再決定。"],"31":["有影響力，能代表群體發聲。","想爭取影響力卻被拒絕，或過於強勢。","等被認可與推舉再領導，用公平的方式發聲。"],"32":["能辨識什麼值得延續，擅長長期規劃。","害怕失敗而過度保守或焦慮。","把力氣放在值得延續的事上，也接受有些事會結束。"],"33":["善於沉澱經驗、獨處充電，有洞察與智慧。","逃避壓力而封閉自己。","定期退回自己的空間整理，再把智慧分享出來。"],"34":["力量強、獨立行動力高，執行效率好。","蠻幹、被壓力推著走，容易疲累。","只在身體回應想做時才用力，其餘時間保存體力。"],"35":["求新求變，體驗豐富，累積經驗。","追新卻不沉澱，或對現況不滿。","讓每次新體驗都有收穫，值得的才繼續。"],"36":["能在危機與情緒風暴中學習成長，經驗豐富。","製造戲劇，情緒波動大。","情緒波動時先等一等，再決定是否投入新體驗。"],"37":["重視家庭與友誼，能建立互惠且穩定的社群。","付出後怨懟，或期待回報。","事先說清楚彼此的約定，公平地給予與接受。"],"38":["為信念奮鬥，堅持不放棄，願意保護弱勢。","好勝頑固、處處對抗。","選擇值得奮鬥的戰場，其他的可以放手。"],"39":["能激發他人，打破卡關與僵局。","挑釁惹怒他人，或隱藏自己的情緒。","先確認對方是否準備好被激發，再以建設性的方式提出。"],"40":["願意付出、扛責任，能讓團隊穩定。","過度承攬而怨懟。","留時間休息，確認付出有被看見，學會拒絕。"],"41":["想像力豐富，能開啟新的體驗循環。","沉溺幻想，或衝動地展開行動。","把想像拿去現實驗證，聚焦可行的起點。"],"42":["能把事情推向完成，善始善終。","事情做到一半放棄，或無法收尾。","選擇值得完成的事，並接受有些事需要結束。"],"43":["內在的耳朵，有獨到的洞見，能帶來突破性的想法。","急著推銷而不被理解，或因想法特殊而孤立；恐懼被拒絕，擔心自己的想法太奇異。","先把洞見整理好，等對的人、對的時機再說。"],"44":["能辨識人才與模式，直覺判斷力強。","因過去的經驗過度防備。","以直覺辨識，但不要用過去的模式去預測所有未來。"],"45":["擅長管理與分配資源，有領導魅力。","霸道佔有，或分配不公。","以公平的方式分享資源，被信任時再主導。"],"46":["與身體連結好，能在對的地點遇到好機會。","忽視身體、過度勞累。","愛護身體，順著身體的感覺選擇環境與機會。"],"47":["能從過去的經歷中提煉領悟，也能同理他人；在混亂中找出意義。","沉溺過去，困在壓抑的感受裡；缺乏耐心，急著要答案。","給經驗時間沉澱，領悟自然會浮現，不必硬想。"],"48":["有深度與扎實的能力，能深入研究。","擔心自己不夠好而退縮，或停在表面。","持續累積實力，準備好再展現，也接受自己不可能懂一切。"],"49":["有原則與價值，能辨識不公並推動變革。","因原則而衝動決裂，或過於僵硬。","先確認這個原則是否真的重要，再以有彈性的方式推動改變。"],"50":["守護價值與法則，有責任感與保護力。","以嚴苛的規則約束他人，或背負過多責任。","守護真正重要的價值，同時允許別人有不同的標準。"],"51":["勇於開創，能帶來覺醒與突破。","愛競爭、驚嚇他人，或害怕被震撼。","把勇氣用在值得的事上，不必為了證明自己而冒險。"],"52":["專注、有定力，能在靜止中累積能量。","被逼著動而暴躁，或過度靜止。","找到安靜穩定的環境，在對的時機專注行動。"],"53":["開創力強，能啟動新的事物與周期。","開頭很多卻不收尾。","選擇真正值得投入的開始，並給自己完成的動力。"],"54":["有野心與上進心，能在組織中成長。","急功近利，或以犧牲關係換取成功。","把野心放在有意義的目標上，借助合適的人脈與環境。"],"55":["內心豐盛、有感染力，能帶動情緒與靈感。","情緒低落時感到匱乏或暴躁。","接受情緒的起伏，用創意與精神滋養自己。"],"56":["擅長說故事，能傳遞經驗與啟發。","誇大故事，或為了刺激而不斷追逐新鮮。","以真實經歷說故事，並過濾哪些經驗值得分享。"],"57":["直覺敏銳，能預警風險與危險。","因恐懼而焦慮、猶豫。","相信當下瞬間的直覺，一次就聽見並行動。"],"58":["活力充沛，能持續改善，讓生活更有生命力。","對現況不滿、過度挑剔。","以喜悅作為推動改善的動力，不必因為不完美而責備自己。"],"59":["能打破人際隔閡，建立深層的親密與連結。","築牆防衛，或太急著靠近。","確認安全感再靠近，讓親密在彼此同意下發生。"],"60":["能接受現實的限制，在邊界裡突破創新。","抗拒限制而悲觀。","先接受限制，再在限制內找到突破口，等待時機。"],"61":["對未知與真理充滿好奇，有靈感與思考力。","執著於求答案而焦慮。","允許自己暫時不知道，答案會在時機到時浮現。"],"62":["注意細節，能把事情說得精準具體。","挑剔細節、爭論對錯。","先抓住大局再補充細節，用事實溝通。"],"63":["擅長質疑與驗證，能發現疑點與漏洞。","多疑、批判，破壞信任。","為了讓答案更可靠而質疑，驗證後就放下懷疑。"],"64":["想像力與整合力強，能從混亂的經驗中浮現領悟。","因混亂而焦慮，急著釐清過去。","耐心等待畫面浮現，不必立刻弄清楚。"]};
function swsBlock(n){const s=SWS[n];if(!s)return '';
  return `<div class="sec">強項・弱點・策略</div><div class="box"><h3>強項</h3><p>${esc(s[0])}</p></div><div class="box"><h3>弱點（容易卡住的地方）</h3><p>${esc(s[1])}</p></div><div class="box"><h3>策略（怎麼運用）</h3><p>${esc(s[2])}</p></div><div class="sidenote">這三項是依閘門主題整理的通用解讀，不分行星與黑紅，方便你向對方說明；這裡的「策略」是運用方法，不是類型的策略。</div>`;}
function swsInline(n){const s=SWS[n];return `<p style="margin-top:8px"><b>強項：</b>${esc(s[0])}<br><b>弱點：</b>${esc(s[1])}<br><b>策略：</b>${esc(s[2])}</p>`;}
function oppBlock(p,n){
  const qid=PAIR[p.id]; if(!qid)return '';
  const q=P(qid), m=OPP[n], d=DATA[m];
  return `<div class="opp"><div class="oh">對面閘門：${q.n}在閘門 ${m}（${esc(d.name)}）</div>
  ${q.f.map(([l,k])=>`<div class="box"><h3>${l}</h3><p>${esc(d[k])}</p></div>`).join('')}
  <button class="back" onclick="location.hash='${q.id}/${m}${lineSel?'/'+lineSel:''}'">看${q.n} ${m} 號閘門 →</button></div>`;
}
function gate(p,n,keep){
  const d=DATA[n];
  app.innerHTML=`<div class="top"><button class="back" onclick="location.hash='${p.id}'">← ${p.n}</button><span class="crumb">閘門 ${n}</span></div>
  <div class="big">${n}</div><div class="gname">${esc(d.name)}</div>
  <div class="tabs">${PLANETS.filter(x=>x.f).map(x=>`<button class="tab ${x.id===p.id?'on':''}" onclick="location.hash='${x.id}/${n}${lineSel?'/'+lineSel:''}'">${x.n}</button>`).join('')}</div>
  ${sideBlock(p,n)}
  ${p.f.map(([l,k])=>`<div class="box"><h3>${l}</h3><p>${esc(d[k])}</p></div>`).join('')}
  ${swsBlock(n)}
  ${oppBlock(p,n)}
  ${lineBlock(p,n)}
  <div class="nav"><button class="back" ${n>1?`onclick="location.hash='${p.id}/${n-1}${lineSel?'/'+lineSel:''}'"`:'disabled style="opacity:.3"'}>← 閘門 ${n-1||''}</button><button class="back" ${n<64?`onclick="location.hash='${p.id}/${n+1}${lineSel?'/'+lineSel:''}'"`:'disabled style="opacity:.3"'}>閘門 ${n<64?n+1:''} →</button></div>`;
  if(!keep)scrollTo(0,0);
}
addEventListener('hashchange',route);route();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
