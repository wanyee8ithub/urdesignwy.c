,"•   不喜歡只顧開始，卻沒有考慮後續。","•   會留意一件事是否有可能走到完成。","","它不是害怕開始，而是需要先了解發展的基礎，才能更有意識地進入一個過程。"],"q":["當你準備開始一件事時，會不會考慮自己有沒有條件把它持續下去？","你會不會很在意，一個計劃是否有機會真正完成？"],"s":["會不喜歡：","做到一半就放棄。"]},"2":{"t":"我自然會想把事情發展下去","b":["<mark class=\"k\">核心：自然的持續與成長。</mark>","","第二爻的特質可能自然流露。放在42號閘門上，一個人可能在投入某件事後，自然想看見它逐漸成長。","","例如：","•   喜歡觀察一個項目從開始到完成。","•   願意看見自己的能力逐步發展。","•   對有興趣的事情，容易持續參與。","•   別人覺得他很有耐心，他卻只是想看看最後會發生什麼。","","它不是每件事都必須堅持，而是對有回應的事情，可能自然想體驗它完整的發展過程。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["有沒有一些事情，你會很想看見它從開始慢慢發展到完成？","當你投入一個有興趣的項目時，你會不會自然想知道它最後能夠成長到什麼程度？"],"s":["42.2 比較像：","「事情開了頭，我就想把它做完。」","不需要別人催促，自然會朝完成的方向走。","它不是單純「責任感強」。","而是：","「完成對我來說是很自然的生命節奏。」"]},"3":{"t":"我透過周期的起伏，學習何時調整或結束","b":["<mark class=\"k\">核心：試錯、發展與完成。</mark>","","第三爻透過經驗學習。放在42號閘門上，一個人可能經歷過開始得太快、半途遇到困難，或不願意結束已經不適合的事情。","","例如：","•   開始一個項目後，發現實際發展比想象中困難。","•   因為投入很多而不願意放棄。","•   經歷之後，學會區分暫時的困難與真正不適合。","•   逐漸理解，有些周期需要調整，有些則需要結束。","","它不是無法完成事情，而是透過經驗學習，怎樣面對周期中的變化，而不是只關注開始或結果。"],"q":["你有沒有經歷過一件事，開始時很有動力，但後來需要重新調整方向？","當你已經投入很多，卻發現事情不再適合時，你會不會很難決定要不要結束？"],"s":["可能：","開始 → 中途發現問題 → 調整 → 完成。"]},"4":{"t":"我透過關係與合作，讓事情走完一個周期","b":["<mark class=\"k\">核心：人際連接與共同成長。</mark>","","第四爻與人際網絡有關。放在42號閘門上，一個人可能透過團隊、家庭或長期合作，完成一個共同的發展過程。","","例如：","•   和團隊一起完成一個項目。","•   與家人共同經歷一個生活階段。","•   透過長期合作，見證彼此的成長。","•   在熟悉的關係中，願意持續投入共同目標。","","它不是必須獨自承擔完成的責任，而是合適的關係與合作，可能幫助一個周期發展得更完整。"],"q":["你有沒有經歷過一段共同努力的過程，讓你特別有完成感？","當你和別人一起完成一個長期計劃時，會不會覺得收獲和自己獨自完成很不一樣？"],"s":["別人會因為你的完成而得到成果。"]},"5":{"t":"別人期待我把事情帶到完成","b":["<mark class=\"k\">核心：完成任務的角色與他人的投射。</mark>","","第五爻容易受到投射。放在42號閘門上，別人可能認為這個人有能力持續投入，因此期待他把事情做完。","","例如：","•   團隊把需要長期跟進的任務交給他。","•   別人認為他既然開始了，就應該完成。","•   他可能承擔了原本屬於整個團隊的責任。","•   因為不想讓別人失望，而難以退出不合適的計劃。","","它不是所有事情都必須由自己完成，而是別人可能期待他負責把周期帶到終點；他仍然需要確認責任是否合理。"],"q":["別人會不會常常把需要長期跟進、直到完成的事情交給你？","你有沒有因為不想讓別人失望，而繼續承擔其實不應該全部由你負責的事情？"],"s":["「這個你幫忙完成吧。」"]},"6":{"t":"我逐漸理解，完成一個周期也是一種成長","b":["<mark class=\"k\">核心：成熟、收獲與周期的整合。</mark>","","第六爻帶有觀察與成熟的意味。放在42號閘門上，一個人可能逐漸理解，事情的價值不只在於結果，也在於整個周期帶來的經驗。","","例如：","•   不再只關注有沒有得到理想結果。","•   能夠回顧一個階段的收獲。","•   接受有些事情完成後，就不需要繼續。","•   更清楚一個階段的結束，可以為新的發展騰出空間。","","它不是不再追求成果，而是更成熟地理解，完成一個周期意味著整合經驗，而不是無限延續同一件事。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["當一件事情結束時，你會不會回頭整理自己從中學到了什麼？","你有沒有發現，有些階段真正完成後，自己反而更有空間開始新的事情？"],"s":["「不是所有東西都需要繼續下去，真正完成有時候就是知道該結束。」"]}},"oh":"完成與成長","oi":[]},"43":{"h":"獨特理解、突破、內在知道與新角度","i":["43號閘門位於阿基那中心，屬於個體回路，與突破性的理解和獨特的洞見有關。","<mark class=\"k\">這個閘門的重點不是故意與眾不同，而是一個人可能突然看見某個別人還沒有注意到的角度。</mark>"],"L":{"1":{"t":"我需要先確認，自己的理解有沒有基礎","b":["<mark class=\"k\">核心：洞見的基礎與辨識。</mark>","","第一爻重視基礎。放在43號閘門上，一個人可能需要先整理自己觀察到的信息，才比較能夠相信自己的理解。","","例如：","•   突然想到一個解釋後，會想確認依據。","•   不喜歡只憑感覺就要求別人相信自己。","•   會回頭檢查自己是否遺漏了重要信息。","•   希望能夠說明自己為什麼這樣理解。","","它不是每個洞見都需要立即證明，而是需要有一定的理解基礎，才能更清楚地知道自己看見了什麼。"],"q":["當你突然看見一件事的不同角度時，會不會想進一步確認自己的理解？","你會不會希望自己能夠說清楚，為什麼會有這樣的洞見？"],"s":["不喜歡：","「別人說這樣，所以就是這樣。」"]},"2":{"t":"我的理解可能會自然地突然出現","b":["<mark class=\"k\">核心：自然的洞見與獨特視角。</mark>","","第二爻的特質可能自然流露。放在43號閘門上，一個人可能在沒有刻意思考時，突然看見問題的另一種解釋。","","例如：","•   聽別人說話時，突然明白問題的核心。","•   看見不同信息後，突然把它們連接起來。","•   自己覺得只是想到一個角度，別人卻覺得很新穎。","•   有時很難解釋這個想法最初是怎樣出現的。","","它不是每次都能夠預測或解釋所有事情，而是某些理解可能自然浮現；之後仍需要判斷是否適用。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["你有沒有突然看見一件事的不同角度，卻一時說不清楚自己怎麼想到的？","當你有這樣的理解時，你通常會馬上分享，還是先留在心裡整理？"],"s":["可能：","「啊！原來是這個！」"]},"3":{"t":"我透過現實檢驗，學習哪些洞見真正有用","b":["<mark class=\"k\">核心：試錯、驗證與理解調整。</mark>","","第三爻透過經驗學習。放在43號閘門上，一個人可能經歷過別人無法理解自己的觀點，或發現原本的洞見並不完全適用於現實。","","例如：","•   提出一個新想法，卻發現缺少實際條件。","•   原本認為自己看見了問題，後來發現信息不完整。","•   透過實踐，分辨哪些理解值得繼續發展。","•   學習把獨特想法與現實證據連接起來。","","它不是獨特的想法就一定錯誤，而是透過經驗驗證，逐漸分辨哪些洞見有實際價值。"],"q":["你有沒有提出過一個自己覺得很有道理的想法，後來發現還需要調整？","當別人不理解你的觀點時，你會不會進一步檢查自己是否遺漏了什麼？"],"s":["「這個想法真的行嗎？」"]},"4":{"t":"我透過合適的關係，找到分享洞見的空間","b":["<mark class=\"k\">核心：人際連接與理解的交流。</mark>","","第四爻與人際網絡有關。放在43號閘門上，一個人的洞見可能在合適的關係中被理解，也可能透過交流進一步發展。","","例如：","•   與熟悉的人討論時，更容易解釋自己的想法。","•   找到願意認真聽自己說話的人。","•   透過不同觀點，讓自己的理解變得更完整。","•   在信任的團隊中，提出別人尚未注意到的問題。","","它不是需要所有人都理解自己，而是合適的交流環境，可能讓洞見有機會被理解和發展。"],"q":["你有沒有發現，只有在某些人面前，你才比較容易說清楚自己的獨特想法？","當你找到願意認真聽你表達的人時，你會不會更容易把原本模糊的理解整理出來？"],"s":["找到對的人之後，別人可能聽懂。"]},"5":{"t":"別人期待我提出突破性的答案","b":["<mark class=\"k\">核心：獨特理解與他人的投射。</mark>","","第五爻容易受到投射。放在43號閘門上，別人可能認為這個人有獨特的見解，期待他提出新的解決方法。","","例如：","•   團隊遇到問題時，希望他提出不同方向。","•   別人期待他能夠看見隱藏的問題。","•   朋友經常問他對某件事的獨特看法。","•   他可能因為別人期待答案，而感到必須一直提出新觀點。","","它不是每次都必須有突破性的想法，而是別人可能期待他看見別人看不見的東西；他也可以承認自己暫時沒有答案。"],"q":["別人會不會期待你提出一些不同於一般想法的觀點？","當別人覺得你很有洞見時，你會不會反而給自己壓力，覺得每次都要提出新答案？"],"s":["「你有沒有什麼新想法？」"]},"6":{"t":"我逐漸理解，洞見需要時間與適合的表達方式","b":["<mark class=\"k\">核心：成熟的理解與分享時機。</mark>","","第六爻帶有觀察與成熟的意味。放在43號閘門上，一個人可能逐漸理解，自己看見某個角度，並不代表別人能夠馬上理解。","","例如：","•   不再急著證明自己的想法正確。","•   更願意等到合適的時機再分享。","•   能夠接受某些洞見需要現實經驗支持。","•   理解別人暫時不認同，不一定代表自己的想法沒有價值。","","它不是把自己看得高人一等，而是更成熟地理解，獨特的理解需要時間沉澱，也需要適當的語言和時機才能被別人接收。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你現在會不會比較能接受，別人不一定馬上理解你的想法？","當你有一個新的理解時，你會不會更在意怎樣表達，才能讓別人有機會真正聽懂？"],"s":["「有些理解，需要等到別人準備好聽。」"]}},"oh":"突破與洞見","oi":[]},"44":{"h":"模式識別、記憶、直覺與人際經驗","i":["44號閘門位於脾中心，屬於部落回路，與過去經驗中的模式，以及對人和情境的敏銳感知有關。","<mark class=\"k\">它的重點不是根據過去給別人貼標簽，而是從曾經經歷過的事情中，察覺某些熟悉的模式。</mark>"],"L":{"1":{"t":"我需要先了解過去的經驗，才能判斷現在的情況","b":["<mark class=\"k\">核心：經驗基礎與模式辨識。</mark>","","第一爻重視基礎。放在44號閘門上，一個人可能需要先了解過去發生過什麼，才能判斷眼前的情況是否有相似之處。","","例如：","•   認識一個新合作對象時，會觀察對方的行為。","•   會回想過去相似的合作經驗。","•   不喜歡在完全不了解的情況下輕易信任。","•   希望先看清楚實際行為，再作判斷。","","它不是因為過去受過傷，就一定不能信任別人，而是需要從經驗中找到依據，同時觀察現在的實際情況。"],"q":["當你認識一個新的人時，會不會自然地觀察他的行為是否讓你覺得熟悉？","你會不會用過去的經驗，幫助自己判斷現在的合作或關係？"],"s":["會觀察：","「以前是不是發生過？」"]},"2":{"t":"我自然會察覺熟悉的模式","b":["<mark class=\"k\">核心：自然的模式感知。</mark>","","第二爻的特質可能自然流露。放在44號閘門上，一個人可能很快注意到某個人或情境，讓自己想起過去的經驗。","","例如：","•   很快察覺某種相處方式似曾相識。","•   能夠從細節中注意到熟悉的行為模式。","•   對合作關係中的某些變化特別敏感。","•   自己覺得只是一個感覺，別人卻可能沒有注意到。","","它不是每次直覺都絕對正確，而是過去經驗可能讓自己自然注意到某些線索；仍需要觀察當下的事實。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["你有沒有遇過某個人時，突然覺得他的某種行為很熟悉？","當你出現這種感覺時，你會不會繼續觀察，看看現在的情況是否真的和過去相似？"],"s":["可能看到一個人就覺得：","「這個模式我以前見過。」"]},"3":{"t":"我透過不同經驗，修正對人的判斷","b":["<mark class=\"k\">核心：試錯、經驗與判斷調整。</mark>","","第三爻透過經驗學習。放在44號閘門上，一個人可能曾經因為過去的經驗誤判別人，或發現原本熟悉的模式並不一定會重複。","","例如：","•   因為某個人讓自己想起過去的人，而提前產生防備。","•   後來發現對方的行為與過去並不一樣。","•   透過不同關係，學習不要只看第一印象。","•   逐漸分辨直覺提醒與舊經驗帶來的擔心。","","它不是不能相信自己的感覺，而是透過經驗學習，既聽見警覺，也讓現實行為幫助自己確認。"],"q":["你有沒有因為一個人讓你想起過去的某個人，而對他產生先入為主的判斷？","後來你有沒有發現，熟悉的感覺不一定代表現在的情況完全一樣？"],"s":["有時候看錯。","所以重新學習。"]},"4":{"t":"我在關係中看見反覆出現的模式","b":["<mark class=\"k\">核心：人際連接與群體經驗。</mark>","","第四爻與人際網絡有關。放在44號閘門上，一個人可能很容易在熟悉的關係或團隊中，看見某些行為反覆出現。","","例如：","•   發現團隊總是在相似的地方出問題。","•   能夠注意到某些合作關係的共同模式。","•   在朋友之間，看見某種反覆發生的相處方式。","•   透過長期互動，了解誰適合怎樣的合作。","","它不是認為所有人都一樣，而是透過人際經驗，看見某些模式可能反覆出現，並進一步觀察是否適用於現在。"],"q":["你有沒有發現，自己在不同關係中，會特別容易注意到某些反覆出現的模式？","在團隊合作時，你會不會很快看見哪些做法過去有效，哪些容易再次造成問題？"],"s":["可能很早發現：","「這個項目好像會重複以前的問題。」"]},"5":{"t":"別人期待我看出誰可靠、什麼值得合作","b":["<mark class=\"k\">核心：人際判斷與他人的投射。</mark>","","第五爻容易受到投射。放在44號閘門上，別人可能認為這個人很會看人，因此期待他判斷合作對象是否可靠。","","例如：","•   朋友問他某個人值不值得信任。","•   團隊希望他評估合作關係。","•   別人期待他提前發現潛在問題。","•   他可能因為別人期待判斷，而擔心自己一旦看錯就要負責。","","它不是必須看穿所有人，而是別人可能期待他提供判斷；任何人際判斷都需要給現實中的行為留下驗證空間。"],"q":["別人會不會常問你，某個人是否可靠、某個合作是否值得繼續？","當別人期待你替他們判斷一個人時，你會不會覺得自己需要非常謹慎？"],"s":["「你覺得這個人可靠嗎？」"]},"6":{"t":"我逐漸理解，經驗可以提醒我，但不能決定一切","b":["<mark class=\"k\">核心：成熟的直覺與開放觀察。</mark>","","第六爻帶有觀察與成熟的意味。放在44號閘門上，一個人可能逐漸理解，過去的經驗很有價值，但現在的人和環境也需要被重新認識。","","例如：","•   不再只憑第一印象決定是否信任別人。","•   更願意觀察對方長期的行為。","•   能夠接受自己過去的判斷也可能有誤。","•   將經驗當作提醒，而不是絕對結論。","","它不是忽略直覺，而是更成熟地運用直覺，讓經驗幫助自己觀察，同時不讓過去完全限制現在。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你現在會不會比較能夠區分，過去發生過的事與眼前正在發生的事？","當你對一個人有警覺時，你會不會同時觀察他的實際行為，而不是馬上作出最終判斷？"],"s":["「看見模式，是為了理解現在，不是為了把所有未來都預測出來。」"]}},"oh":"辨識與模式","oi":[]},"45":{"h":"資源、管理、分享、群體責任與共同利益","i":["45號閘門位於喉嚨中心，屬於部落回路，與資源的管理、群體的組織和分享有關。","<mark class=\"k\">這個閘門的重點不只是擁有資源，而是如何管理資源、決定怎樣使用，以及如何在群體中承擔責任。</mark>"],"L":{"1":{"t":"我需要先了解，群體有哪些資源和需求","b":["<mark class=\"k\">核心：資源管理的基礎。</mark>","","第一爻重視基礎。放在45號閘門上，一個人可能需要先弄清楚群體擁有多少資源、有哪些需求，以及誰應該承擔什麼責任。","","例如：","•   在安排預算前先了解實際需要。","•   關心團隊是否有足夠的人力。","•   希望資源分配有清楚的依據。","•   不喜歡在信息不足時作出重要決定。","","它不是單純喜歡掌權，而是需要先理解資源與需求，才能作出比較清楚的管理安排。"],"q":["當你負責一項團隊事務時，會不會先了解資源和需求，再決定怎樣分配？","你會不會很在意，群體中的資源是否被清楚地管理？"],"s":["會關注：","錢、資源、責任、分配。"]},"2":{"t":"我自然會注意群體的資源與安排","b":["<mark class=\"k\">核心：自然的管理與組織。</mark>","","第二爻的特質可能自然流露。放在45號閘門上，一個人可能很自然地注意到群體需要什麼，以及事情應該怎樣安排。","","例如：","•   自然留意團隊缺少什麼資源。","•   會關注共同的預算或物資。","•   在家庭裡容易參與安排共同事務。","•   別人覺得他很會組織，他卻認為只是想讓事情順利。","","它不是所有事情都要由自己決定，而是可能自然注意到群體的資源和組織方式。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["在團隊或家庭中，你會不會很自然地注意到大家缺少什麼？","當你發現資源沒有安排好時，你會不會很想重新整理？"],"s":["45.2 比較像：","「我就是知道該怎麼把資源擺好。」","可能很自然就知道誰適合做什麼、東西該放在哪裡。","它不是單純「很會管理」。","而是：","「我天生對資源的分配有感覺。」"]},"3":{"t":"我透過管理經驗，學習公平分配資源","b":["<mark class=\"k\">核心：試錯、資源與責任調整。</mark>","","第三爻透過經驗學習。放在45號閘門上，一個人可能經歷過資源分配不合理、責任不清楚，才逐漸學習怎樣安排更有效。","","例如：","•   曾經把資源分給不適合的地方。","•   因為沒有說清楚責任，導致團隊出現矛盾。","•   透過實際經驗，發現不同人需要不同的支持。","•   學習在公平、效率與實際需求之間作出調整。","","它不是每次分配都能讓所有人滿意，而是透過經驗學習，怎樣讓資源安排更符合群體的真實需要。"],"q":["你有沒有負責過資源或任務分配，後來發現原本的安排需要調整？","當大家對資源分配有不同意見時，你會不會重新檢查實際需求和分配依據？"],"s":["可能：","給錯人 → 發現問題 → 調整。"]},"4":{"t":"我在熟悉的群體中參與資源管理","b":["<mark class=\"k\">核心：人際連接與群體組織。</mark>","","第四爻與人際網絡有關。放在45號閘門上，一個人可能透過家庭、團隊或社群，參與共同資源的安排。","","例如：","•   在團隊中協調任務和資源。","•   參與家庭的共同開支安排。","•   透過熟悉的關係，推動合作。","•   關心群體是否有共同的方向。","","它不是必須成為領導者，而是可能在熟悉的群體中，自然參與組織、資源分配或共同事務。"],"q":["在家庭或團隊中，你會不會經常參與安排共同資源？","當大家需要協調不同需求時，你會不會自然地參與討論和安排？"],"s":["45.4 的重點是關係中的資源流動。","可能透過朋友、團隊、熟悉的圈子，讓資源被分配與使用。","別人會慢慢發現：","「跟著你的安排，大家都比較有保障。」","它不是單純「掌管金錢」。","而是：","「我的資源管理會透過關係影響整個群體。」"]},"5":{"t":"別人期待我負責管理和分配資源","b":["<mark class=\"k\">核心：管理角色與他人的投射。</mark>","","第五爻容易受到投射。放在45號閘門上，別人可能認為這個人有管理能力，因此期待他掌握資源、作出決定或承擔群體責任。","","例如：","•   團隊期待他安排預算。","•   家人習慣讓他處理共同事務。","•   別人認為他應該知道資源該如何分配。","•   他可能因為別人期待，而承擔了太多管理責任。","","它不是必須替所有人決定，而是別人可能把管理者的角色放在他身上；他仍然需要確認自己是否擁有相應的權限和支持。"],"q":["別人會不會經常期待你負責安排資源或處理共同事務？","當別人把決定權交給你時，你會不會也覺得自己必須承擔所有後果？"],"s":["「你應該有辦法。」"]},"6":{"t":"我逐漸理解，管理資源也需要分享與責任","b":["<mark class=\"k\">核心：成熟的管理與群體利益。</mark>","","第六爻帶有觀察與成熟的意味。放在45號閘門上，一個人可能逐漸理解，真正的管理不只是決定資源屬於誰，也包括如何讓群體中的人獲得合理支持。","","例如：","•   更重視資源安排的透明度。","•   願意聽取群體不同的需要。","•   不再把管理權等同於個人權力。","•   更關注資源是否支持共同目標。","","它不是放棄管理，而是更成熟地理解，資源的管理應該服務群體的實際需要，而不是只為了維持個人的控制感。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你現在會不會比以前更重視，資源分配是否讓大家都清楚和理解？","當你擁有管理權時，你會不會更關注這個決定對整個群體有什麼影響？"],"s":["而是：","「資源真正有意義，是因為它被正確地使用和分享。」"]}},"oh":"資源與分享","oi":[]},"46":{"h":"身體經驗、親身參與、在場與生命中的偶然相遇","i":["46號閘門位於G中心，屬於集體感知回路，與身體經驗及通過親身參與認識生命有關。","<mark class=\"k\">這個閘門的重點不只是幸運，而是透過真實參與、身體感受與生活經歷，發現自己在某個時刻與環境的連接。</mark>"],"L":{"1":{"t":"我需要先與自己的身體建立聯系","b":["<mark class=\"k\">核心：身體經驗的基礎。</mark>","","第一爻重視基礎。放在46號閘門上，一個人可能需要先了解自己的身體狀態與實際條件，才能更自在地參與生活體驗。","","例如：","•   會留意自己是否疲憊。","•   希望在參與活動前了解自己的身體狀況。","•   不喜歡完全忽略身體的需要。","•   會透過實際感受判斷某種活動是否適合自己。","","它不是只關注身體外表，而是需要建立對身體狀態的基本覺察，才能更真實地參與生活。"],"q":["當你準備參加一項活動時，會不會留意自己的身體狀態是否適合？","你有沒有發現，身體的實際感受會影響你是否享受一段經歷？"],"s":["會慢慢發現：","「我的身體喜歡什麼、不喜歡什麼？」"]},"2":{"t":"我自然會透過親身體驗認識事情","b":["<mark class=\"k\">核心：自然的身體參與。</mark>","","第二爻的特質可能自然流露。放在46號閘門上，一個人可能不滿足於只聽別人描述，而是想親自經歷。","","例如：","•   喜歡親自去一個地方看看。","•   學習某件事時，希望實際操作。","•   透過身體參與，更容易理解某種活動。","•   別人覺得他只是喜歡體驗，他卻可能在過程中獲得很真實的認識。","","它不是不相信別人，而是親身經驗可能自然成為他認識生命的重要方式。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["你是不是比較喜歡親自體驗，而不是只聽別人介紹？","當你真正去做一件事時，會不會發現自己的理解和原本想象不一樣？"],"s":["有時就是：","「我不知道為什麼，但我想去。」"]},"3":{"t":"我透過身體經驗，學習適合自己的參與方式","b":["<mark class=\"k\">核心：試錯、身體感受與調整。</mark>","","第三爻透過經驗學習。放在46號閘門上，一個人可能需要經歷不同活動，才知道什麼樣的身體參與方式適合自己。","","例如：","•   嘗試不同運動後，找到喜歡的方式。","•   參加活動後發現自己需要更多休息。","•   透過實際經驗調整工作與生活的安排。","•   學習不再只因為別人說好，就忽略自己的身體感受。","","它不是必須不斷嘗試新活動，而是透過身體經驗，逐漸知道什麼真正適合自己。"],"q":["你有沒有嘗試過某種活動之後，才發現自己的身體其實不喜歡？","當別人推薦一種生活方式時，你會不會希望親自體驗後再決定適不適合？"],"s":["走錯、選錯、體驗之後才知道。"]},"4":{"t":"我透過關係與共同體驗建立連接","b":["<mark class=\"k\">核心：人際連接與身體經驗。</mark>","","第四爻與人際網絡有關。放在46號閘門上，一個人可能透過旅行、運動、聚會或共同參與活動，與別人建立關係。","","例如：","•   透過一起旅行，和朋友變得更親近。","•   喜歡和別人一起參與實際活動。","•   通過共同經驗，建立真實的記憶。","•   發現某些關係是在一起做事時逐漸加深的。","","它不是必須透過活動維持所有關係，而是共同體驗可能成為建立連接的一種方式。"],"q":["你有沒有發現，和別人一起經歷一件事情，會讓你們的關係更靠近？","對你來說，一起實際參與活動，是否比單純聊天更容易建立連接？"],"s":["別人看到你：","「原來身體真的知道。」"]},"5":{"t":"別人期待我擁有好的體驗或帶來好運","b":["<mark class=\"k\">核心：體驗形象與他人的投射。</mark>","","第五爻容易受到投射。放在46號閘門上，別人可能認為這個人很幸運，或期待他能夠帶來好的體驗。","","例如：","•   別人覺得他總能遇到特別的機會。","•   朋友希望他推薦好玩的活動。","•   別人期待他安排一次成功的旅行。","•   他可能因為被認為幸運，而覺得自己必須不斷帶來好結果。","","它不是必須每次都遇到好事，而是別人可能把幸運或美好體驗的期待放在他身上；生活本身仍然會有不同結果。"],"q":["別人會不會覺得你很容易遇到有趣的經歷，常來問你有什麼好推薦？","當別人期待你安排一場很棒的活動時，你會不會覺得自己需要負責讓所有人滿意？"],"s":["「你覺得我應該去嗎？」"]},"6":{"t":"我逐漸理解，生命的體驗需要真實參與","b":["<mark class=\"k\">核心：成熟的身體覺察與生命經驗。</mark>","","第六爻帶有觀察與成熟的意味。放在46號閘門上，一個人可能逐漸理解，生命的價值不只在於計劃或想象，也在於真實參與其中。","","例如：","•   更願意感受當下，而不只是追求結果。","•   能夠接受並非每次經歷都很特別。","•   更懂得尊重身體的狀態。","•   透過平凡的體驗，看見生活本身的價值。","","它不是相信只要參與就一定幸運，而是更成熟地理解，真實的身體經驗本身就是認識生命的一部分。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你現在會不會更重視親身體驗，而不只是計劃一件事情？","有沒有一些平凡的經歷，後來回頭看，才發現它其實帶給你很多理解？"],"s":["「真正正確的機會，是身體也願意經歷的。」"]}},"oh":"身體、機會與正確的地點","oi":[]},"47":{"h":"從混亂經驗中整理意義，逐漸形成理解","i":["47號閘門位於阿基那中心，屬於集體感知回路，與把過去的經驗轉化為理解有關。","<mark class=\"k\">這個閘門不只是想太多，而是可能需要時間整理記憶、經歷和信息，才能慢慢看見它們之間的意義。</mark>"],"L":{"1":{"t":"我需要先整理經驗，才能理解發生了什麼","b":["<mark class=\"k\">核心：理解的基礎與信息整理。</mark>","","第一爻重視基礎。放在47號閘門上，一個人可能需要先把經歷的事情整理清楚，才知道如何理解它。","","例如：","•   事情發生後，會回想前因後果。","•   需要知道完整的經過，才比較容易形成結論。","•   當信息太多時，可能覺得腦袋很亂。","•   希望先弄清楚發生了什麼，再判斷它的意義。","","它不是一定要把每件事都想通，而是需要一定的理解基礎，才能讓混亂的經驗逐漸形成意義。"],"q":["當你經歷一件復雜的事情時，會不會反覆整理前因後果？","如果一件事還沒有弄清楚，你會不會很難直接接受一個結論？"],"s":["會問：","「這件事情到底教會我什麼？」"]},"2":{"t":"我的理解可能會在某個時刻自然出現","b":["<mark class=\"k\">核心：自然的領悟與重新理解。</mark>","","第二爻的特質可能自然流露。放在47號閘門上，一個人可能經歷一段時間的思考後，突然明白過去的某件事。","","例如：","•   原本想不通的問題，某天突然有了新的解釋。","•   經過一段時間後，重新看待過去的關係。","•   在日常生活中，突然把以前的信息連接起來。","•   別人覺得他想了很久，他卻發現理解是在某個時刻自然出現的。","","它不是每次都能立即得到答案，而是某些領悟可能需要時間，在適當的時刻自然浮現。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["你有沒有遇過，某件事情當時想不通，過了一段時間卻突然明白了？","當你不再刻意逼自己思考時，會不會反而出現新的理解？"],"s":["過去想不通。","某天突然：","「原來如此。","」"]},"3":{"t":"我透過反覆嘗試不同解釋，逐漸找到意義","b":["<mark class=\"k\">核心：試錯、思考與理解調整。</mark>","","第三爻透過經驗學習。放在47號閘門上，一個人可能會嘗試不同解釋，反覆思考某段經歷，直到發現哪些理解比較符合現實。","","例如：","•   對過去的事情有不同解釋。","•   一開始責怪自己，後來發現還有其他原因。","•   試著從不同人的角度理解一段關係。","•   透過新的經驗，修正原本對過去的判斷。","","它不是反覆思考就一定能找到答案，而是透過不同解釋和真實經驗，逐漸建立更完整的理解。"],"q":["你有沒有對過去的某件事情反覆思考，試著找出不同的解釋？","當你後來獲得新的信息時，會不會重新理解以前發生的事？"],"s":["可能反覆回憶。","不是為了困住自己。","而是想理解。"]},"4":{"t":"我透過交流，把零散的經驗整理成理解","b":["<mark class=\"k\">核心：人際連接與經驗的整合。</mark>","","第四爻與人際網絡有關。放在47號閘門上，一個人可能透過與熟悉的人交談，慢慢整理自己經歷過的事情。","","例如：","•   講出自己的經歷後，才發現真正困擾自己的是什麼。","•   透過朋友的提問，看見自己忽略的地方。","•   與經歷相似的人交流，獲得新的角度。","•   在分享過程中，把零散的記憶整理成更清楚的故事。","","它不是必須依靠別人替自己找答案，而是合適的交流可能幫助自己看見原本沒有整理出來的意義。"],"q":["你有沒有發現，把一件事情說出來之後，自己反而更清楚發生了什麼？","當別人問你一些問題時，會不會幫助你看見自己原本忽略的角度？"],"s":["別人經歷類似事情時，你可以說：","「我以前也經歷過。」"]},"5":{"t":"別人期待我替復雜的事情找出解釋","b":["<mark class=\"k\">核心：領悟能力與他人的投射。</mark>","","第五爻容易受到投射。放在47號閘門上，別人可能認為這個人善於分析經驗，因此期待他解釋復雜的問題。","","例如：","•   朋友遇到困擾時，希望他幫忙整理事情。","•   同事期待他從過去的問題中找出原因。","•   別人認為他應該知道事情為什麼會這樣發展。","•   他可能因為別人期待答案，而反覆思考，甚至陷入壓力。","","它不是每個問題都一定有一個立即可得的答案，而是別人可能期待他從混亂中找出意義；他也需要允許某些事情暫時沒有結論。"],"q":["別人會不會常常找你分析事情的來龍去脈？","當別人期待你解釋一個復雜的問題時，你會不會覺得自己必須想出答案？"],"s":["「為什麼會發生這種事？」"]},"6":{"t":"我逐漸理解，領悟需要時間，也需要放下","b":["<mark class=\"k\">核心：成熟的理解與經驗整合。</mark>","","第六爻帶有觀察與成熟的意味。放在47號閘門上，一個人可能逐漸理解，某些經驗無法靠不斷思考來解決，需要時間、距離與新的生活經驗。","","例如：","•   不再要求自己立刻理解所有事情。","•   能夠接受過去有些問題沒有完整答案。","•   更願意從現在的生活中獲得新的理解。","•   不再反覆用同一個角度責怪自己。","","它不是放棄理解，而是更成熟地理解，真正的領悟有時來自繼續生活，而不是無限重複思考。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你現在會不會比較能接受，有些事情需要時間才能明白？","當你發現自己一直反覆思考同一件事時，你會不會嘗試把注意力帶回現在的生活？"],"s":["「有些事情理解到一定程度，就可以放下，而不是繼續分析。」"]}},"oh":"從過去得到理解","oi":[]},"48":{"h":"深度、能力、知識儲備與對不足的擔心","i":["48號閘門位於脾中心，屬於集體理解回路，與深度、能力及對問題的深入理解有關。","<mark class=\"k\">這個閘門不只是擔心自己不夠好，而是可能很在意自己是否真正理解一件事，以及是否有足夠能力應對問題。</mark>"],"L":{"1":{"t":"我需要先建立足夠的知識基礎","b":["<mark class=\"k\">核心：深度的基礎與能力準備。</mark>","","第一爻重視基礎。放在48號閘門上，一個人可能希望先建立一定的知識或技能基礎，才覺得自己有能力處理問題。","","例如：","•   學習一項技能時，希望理解背後的原理。","•   不滿足於只知道表面做法。","•   面對重要任務時，會先準備資料。","•   當自己覺得知識不足時，可能不太敢開始。","","它不是必須學到什麼都懂才行動，而是需要建立基本能力，才能安心地面對挑戰。"],"q":["當你需要處理一件重要的事情時，會不會很在意自己是否準備充分？","你有沒有因為覺得自己還不夠了解，而遲遲不敢開始？"],"s":["會擔心：","「我夠不夠深？」","所以喜歡學習。"]},"2":{"t":"我自然會想深入理解事情","b":["<mark class=\"k\">核心：自然的深度與問題意識。</mark>","","第二爻的特質可能自然流露。放在48號閘門上，一個人可能很自然地想知道事情背後的原因，而不滿足於表面答案。","","例如：","•   聽到一個解釋後，還會想知道為什麼。","•   喜歡研究某個感興趣的領域。","•   對自己感興趣的事情，容易越挖越深。","•   別人覺得已經了解得夠多，他卻自然地想繼續探索。","","它不是每件事都需要深入研究，而是對某些主題，深入理解可能自然成為自己的興趣。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["有沒有一些主題，你一旦產生興趣，就會想一直研究下去？","當別人覺得一個問題已經有答案時，你會不會仍然想知道背後的原因？"],"s":["一旦感興趣：","「我可以研究很久。","」"]},"3":{"t":"我透過實際問題，學習如何運用自己的深度","b":["<mark class=\"k\">核心：試錯、能力應用與實際檢驗。</mark>","","第三爻透過經驗學習。放在48號閘門上，一個人可能擁有知識，卻需要通過實際使用，才知道哪些理解真正有幫助。","","例如：","•   學了很多理論，實際操作時才發現還需要練習。","•   發現自己知道原理，卻不一定能夠立即解決問題。","•   透過錯誤，找出知識與實踐之間的差距。","•   逐漸學會把深入理解轉化成實際能力。","","它不是知識沒有價值，而是透過經驗，學習怎樣讓深度真正應用在現實中。"],"q":["你有沒有經歷過，自己明明學了很多知識，實際做起來卻發現還需要練習？","當你發現理論和現實有差距時，你會不會想進一步找出原因？"],"s":["不斷做：","學 → 錯 → 修 → 更深。"]},"4":{"t":"我透過交流與合作，深化自己的能力","b":["<mark class=\"k\">核心：人際連接與知識的應用。</mark>","","第四爻與人際網絡有關。放在48號閘門上，一個人可能透過團隊、專業社群或與他人的交流，進一步發展自己的能力。","","例如：","•   和有經驗的人交流，學習更深入的做法。","•   在團隊合作中，發現自己的知識可以解決實際問題。","•   透過討論，理解自己原本沒注意到的細節。","•   在熟悉的圈子裡，逐漸建立某個領域的專長。","","它不是所有知識都要從別人那裡獲得，而是交流與合作可能幫助自己的深度進一步發展。"],"q":["你有沒有發現，和某些有經驗的人交流時，自己的理解會變得更深入？","你會不會透過實際合作，才發現自己還可以進一步發展哪些能力？"],"s":["別人可能覺得：","「你看到的東西比我多。」"]},"5":{"t":"別人期待我成為那個能夠解決問題的人","b":["<mark class=\"k\">核心：專業能力與他人的投射。</mark>","","第五爻容易受到投射。放在48號閘門上，別人可能認為這個人知識深入、能力強，因此期待他找到解決方案。","","例如：","•   同事遇到復雜問題時來找他。","•   別人希望他提供專業意見。","•   團隊認為他應該知道問題的根源。","•   他可能因為別人期待自己有能力，而不願意承認有些事情自己還需要學習。","","它不是必須回答所有問題，而是別人可能期待他成為問題的解決者；真正的專業也包括知道自己還需要什麼信息。"],"q":["別人會不會經常把比較復雜、需要專業判斷的事情交給你？","當別人認為你很有能力時，你會不會反而不敢承認自己也有不懂的地方？"],"s":["「你應該很懂這個吧？」","於是容易產生「我還不夠」的壓力。"]},"6":{"t":"我逐漸理解，真正的深度也包括接受自己仍在學習","b":["<mark class=\"k\">核心：成熟的能力與長遠發展。</mark>","","第六爻帶有觀察與成熟的意味。放在48號閘門上，一個人可能逐漸理解，能力不是某一天突然變得完美，而是透過持續學習與實踐不斷深化。","","例如：","•   不再等到完全準備好才開始。","•   能夠承認自己目前還不知道的事情。","•   更重視長期學習，而不是一次表現。","•   開始把知識與經驗結合起來。","","它不是降低標準，而是更成熟地理解，深度不等於永遠沒有不足，而是願意持續理解、實踐與修正。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你現在會不會比較能接受，自己可以一邊學習，一邊開始實際運用能力？","當你發現自己還有不足時，你會不會比以前更願意把它當成學習方向，而不是否定自己的理由？"],"s":["「真正的深度，也包括知道自己不知道什麼。」"]}},"oh":"深度","oi":[]},"49":{"h":"原則、價值觀、界線、關係變化與情感立場","i":["49號閘門位於情緒中心，屬於部落回路，與價值觀、原則和關係中的接受或拒絕有關。","<mark class=\"k\">這個閘門的重點不是情緒化地拒絕別人，而是當某些重要原則受到影響時，一個人可能會重新評估一段關係或一套規則。</mark>"],"L":{"1":{"t":"我需要先弄清楚，自己的原則是什麼","b":["<mark class=\"k\">核心：原則的基礎與價值辨認。</mark>","","第一爻重視基礎。放在49號閘門上，一個人可能需要先明確自己真正重視什麼，才能知道哪些事情可以接受、哪些事情無法接受。","","例如：","•   很在意關係中的忠誠與尊重。","•   對不公平的事情比較敏感。","•   會思考哪些原則不能輕易妥協。","•   當價值觀不清楚時，可能很難作出決定。","","它不是凡事都要堅持己見，而是需要先知道自己的底線，才能清楚地決定如何回應。"],"q":["在關係中，你有沒有一些原則是自己很難妥協的？","當別人做出違背你價值觀的事情時，你會不會需要重新思考這段關係？"],"s":["會問：","「什麼可以接受？什麼不可以？」"]},"2":{"t":"我自然會對原則是否被尊重有所感覺","b":["<mark class=\"k\">核心：自然的價值敏感度。</mark>","","第二爻的特質可能自然流露。放在49號閘門上，一個人可能很自然地注意到某件事是否符合自己重視的原則。","","例如：","•   對不公平的安排很快有感覺。","•   在關係中，很在意承諾有沒有被尊重。","•   不喜歡為了維持表面和諧而忽略底線。","•   別人覺得事情不嚴重，他卻感覺某個重要原則被碰觸。","","它不是每次不舒服都代表對方有錯，而是可能自然察覺價值觀上的衝突；仍需要確認事實與情境。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["你有沒有發現，某些事情會特別觸動你，因為它碰到了你很重視的原則？","當別人不遵守約定時，你會不會比一般的小失誤更在意？"],"s":["有些事情就是：","「不行。」"]},"3":{"t":"我透過關係中的變化，學習表達原則與界線","b":["<mark class=\"k\">核心：試錯、拒絕與關係調整。</mark>","","第三爻透過經驗學習。放在49號閘門上，一個人可能經歷過太快拒絕別人、壓抑底線，或在關係中積累失望。","","例如：","•   曾經為了維持關係，接受不認同的事情。","•   後來發現長期妥協會讓自己不舒服。","•   因為一次衝突，重新思考彼此的原則。","•   逐漸學習更清楚地表達自己能接受什麼。","","它不是反覆無常，而是透過關係經驗，學習怎樣表達原則，以及什麼時候需要重新評估關係。"],"q":["你有沒有為了維持一段關係，而接受過自己其實不認同的事情？","後來你有沒有學會，更早表達自己的界線，而不是等到忍無可忍才拒絕？"],"s":["可能經歷：","「以前我不能接受，現在我理解了。」"]},"4":{"t":"我會在關係中尋找共同的原則","b":["<mark class=\"k\">核心：人際連接與共同價值。</mark>","","第四爻與人際網絡有關。放在49號閘門上，一個人可能很重視與自己有共同價值觀的人，也可能透過群體建立共同的規則。","","例如：","•   希望朋友之間有基本的誠信。","•   在團隊中重視共同遵守的原則。","•   對能夠互相尊重底線的人，更容易建立信任。","•   當共同價值被破壞時，會重新評估關係。","","它不是要求所有人和自己完全一樣，而是某些核心原則可能成為建立長期關係的重要基礎。"],"q":["對你來說，和一個人建立長期關係時，共同的價值觀重要嗎？","如果你和別人對某個核心原則有很大差異，你會怎樣決定這段關係要如何繼續？"],"s":["可能決定：","「我們可以繼續合作嗎？」"]},"5":{"t":"別人期待我堅持原則或替群體表達底線","b":["<mark class=\"k\">核心：原則角色與他人的投射。</mark>","","第五爻容易受到投射。放在49號閘門上，別人可能期待這個人敢於拒絕不合理的事情，或者在群體中表達大家的底線。","","例如：","•   團隊遇到不公平安排時，希望他提出意見。","•   朋友期待他指出某段關係的問題。","•   別人認為他有原則，不容易妥協。","•   他可能因為被期待堅持原則，而覺得自己不能改變看法。","","它不是必須代表所有人表達立場，而是別人可能期待他成為堅持底線的人；他仍然需要確認自己真正認同什麼。"],"q":["別人會不會期待你在遇到不合理的事情時站出來說話？","當別人認為你很有原則時，你會不會覺得自己不能改變決定，即使後來有了新的理解？"],"s":["「你覺得這樣對不對？」"]},"6":{"t":"我逐漸理解，原則需要成熟地表達，也需要面對變化","b":["<mark class=\"k\">核心：成熟的價值觀與關係判斷。</mark>","","第六爻帶有觀察與成熟的意味。放在49號閘門上，一個人可能逐漸理解，堅守原則不代表永遠不能重新審視自己的理解。","","例如：","•   能夠分辨核心底線與個人偏好。","•   更願意解釋自己拒絕的原因。","•   理解有些關係需要重新談清楚規則。","•   能夠接受自己隨著經驗增加，對某些事情有更成熟的看法。","","它不是放棄原則，而是更成熟地理解，原則應該幫助自己建立清楚的界線，而不是讓自己無法面對任何變化。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你現在會不會更能分辨，哪些事情觸碰了真正的底線，哪些只是和自己的習慣不同？","當你發現自己以前的觀點需要調整時，你能不能允許自己重新理解，而不覺得那代表沒有原則？"],"s":["不是：","「我說了算。」","而是：","「我知道什麼對我重要，也允許別人有自己的原則。」"]}},"oh":"原則與界限","oi":[]},"50":{"h":"責任、保護、價值觀、規則與群體的共同生活","i":["50號閘門位於脾中心，屬於部落回路，與維護價值觀、責任和群體的生存有關。","<mark class=\"k\">這個閘門的重點不只是遵守規則，而是判斷什麼值得保護，以及怎樣的責任和規則能夠支持共同生活。</mark>"],"L":{"1":{"t":"我需要先弄清楚，什麼值得被保護","b":["<mark class=\"k\">核心：價值觀的基礎與責任判斷。</mark>","","第一爻重視基礎。放在50號閘門上，一個人可能需要先確認自己重視什麼，才能判斷哪些責任值得承擔。","","例如：","•   很在意家庭或團隊的基本原則。","•   希望規則能夠保護真正重要的事情。","•   會考慮責任是否合理。","•   不喜歡沒有清楚理由的要求。","","它不是所有規則都必須遵守，而是需要理解規則背後的價值，才能判斷它是否值得維護。"],"q":["當你需要承擔某個責任時，會不會先想清楚這件事為什麼重要？","你會不會特別在意，規則是否真的能夠保護大家？"],"s":["會問：","「什麼才是真正重要的？」"]},"2":{"t":"我自然會注意什麼是公平和合理的","b":["<mark class=\"k\">核心：自然的價值敏感度。</mark>","","第二爻的特質可能自然流露。放在50號閘門上，一個人可能很自然地注意到責任分配、公平與照顧是否合理。","","例如：","•   看到不公平的分工時，很快注意到。","•   會留意弱勢的人是否得到適當支持。","•   對不負責任的行為比較敏感。","•   別人覺得只是小事，他卻會想到這可能影響整個群體。","","它不是每次判斷都絕對正確，而是可能自然關注群體的責任與公平；仍需要了解具體情況。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["你會不會很自然地注意到，某件事情的安排是否公平？","當你發現有人沒有承擔應有的責任時，你通常會有什麼反應？"],"s":["可能很重視：","•   家庭","•   責任","•   公平","•   承諾"]},"3":{"t":"我透過實際經驗，學習規則如何真正保護人","b":["<mark class=\"k\">核心：試錯、責任與規則調整。</mark>","","第三爻透過經驗學習。放在50號閘門上，一個人可能發現，自己原本認為合理的規則，實際執行後卻不一定有效。","","例如：","•   訂立規則後，發現某些人因此受到不合理限制。","•   因為責任不清楚，發生問題。","•   透過經驗調整原本的標準。","•   逐漸理解，規則需要考慮現實情況。","","它不是沒有原則，而是透過實際經驗學習，怎樣讓規則真正發揮保護與支持的作用。"],"q":["你有沒有制定過一套規則，後來發現實際執行時需要調整？","當規則和現實情況產生衝突時，你會不會重新考慮怎樣做才真正合理？"],"s":["可能曾經：","太保護 → 太嚴格 → 調整。"]},"4":{"t":"我在群體中維護共同的責任與價值","b":["<mark class=\"k\">核心：人際連接與共同生活。</mark>","","第四爻與人際網絡有關。放在50號閘門上，一個人可能很重視家庭、團隊或社群共同遵守的責任。","","例如：","•   在家庭中關心大家是否履行約定。","•   在團隊中維護基本的工作規範。","•   希望群體成員互相照顧。","•   透過共同規則，讓大家更容易合作。","","它不是要控制群體，而是可能希望透過共同的價值與責任，讓關係和組織能夠穩定運作。"],"q":["在家庭或團隊中，你會不會特別在意大家是否遵守共同的約定？","你有沒有發現，當每個人都願意承擔責任時，群體會更容易穩定運作？"],"s":["50.4 的重點是價值觀透過關係傳遞。","你守護的原則與責任，會在朋友、家庭與團隊中慢慢被看見。","別人可能因為你的態度，開始重新思考什麼才重要。","它不是單純「很嚴格」。","而是：","「我的價值觀會透過人與人的連結影響群體。」"]},"5":{"t":"別人期待我成為維護規則與責任的人","b":["<mark class=\"k\">核心：責任角色與他人的投射。</mark>","","第五爻容易受到投射。放在50號閘門上，別人可能期待這個人維護規則、照顧群體，或者在出現問題時承擔責任。","","例如：","•   家人期待他管理共同事務。","•   團隊希望他提醒大家遵守規範。","•   別人認為他有責任感，因此把更多事情交給他。","•   他可能因為別人期待，而變成一直監督或照顧大家的人。","","它不是必須為整個群體負責，而是別人可能把守護規則的角色放在他身上；他仍然需要分辨哪些責任屬於自己。"],"q":["別人會不會常常期待你提醒大家遵守規則或履行責任？","你有沒有因為覺得自己應該負責，而承擔了原本可以由其他人處理的事情？"],"s":["「你應該知道什麼是對的。」"]},"6":{"t":"我逐漸理解，價值觀需要隨著現實不斷被實踐","b":["<mark class=\"k\">核心：成熟的責任與共同價值。</mark>","","第六爻帶有觀察與成熟的意味。放在50號閘門上，一個人可能逐漸理解，真正的價值觀不只是說出來的原則，也體現在每天如何對待別人。","","例如：","•   更重視規則是否公平執行。","•   理解不同的人需要不同的支持。","•   不再只看一個人有沒有遵守形式。","•   更關注責任與規則能否真正改善群體生活。","","它不是放棄規則，而是更成熟地理解，規則的價值在於支持共同生活，而不是只為了維持表面的秩序。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你現在會不會比以前更關注，規則實際執行後有沒有幫助到人？","當你看到一個人沒有符合規則時，你會不會先了解情況，再決定怎樣處理？"],"s":["「我可以守護重要的東西，但不能替所有人決定什麼最重要。」"]}},"oh":"價值、責任與守護","oi":[]},"51":{"h":"衝擊、勇氣、覺醒與面對突發變化","i":["51號閘門位於意志力中心，屬於個體回路，與衝擊、競爭和喚醒有關。","<mark class=\"k\">這個閘門不是為了制造驚嚇，而是與某些突如其來的經歷有關：它可能打破原本的狀態，讓一個人重新面對勇氣、優先事項與自己的真實反應。</mark>"],"L":{"1":{"t":"我需要先建立面對挑戰的基礎","b":["<mark class=\"k\">核心：勇氣的基礎與心理準備。</mark>","","第一爻重視基礎。放在51號閘門上，一個人可能需要先了解自己面對挑戰時的狀態，以及哪些支持能夠幫助自己穩定下來。","","例如：","•   面對重要挑戰前，會想做好準備。","•   不喜歡在完全沒有信息時被推到前面。","•   會考慮自己有哪些資源可以運用。","•   希望先確認風險，再決定如何面對。","","它不是沒有勇氣，而是需要先有基本準備，才能更清楚地面對挑戰。"],"q":["當你面對一個很大的挑戰時，會不會先確認自己有哪些準備和支持？","你比較喜歡做好準備再面對挑戰，還是會在事情發生後才開始調整？"],"s":["會問：","「如果事情突然改變，我準備好了嗎？」"]},"2":{"t":"我自然會在挑戰中表現出勇氣","b":["<mark class=\"k\">核心：自然的勇氣與行動反應。</mark>","","第二爻的特質可能自然流露。放在51號閘門上，一個人可能在某些挑戰出現時，很自然地站出來面對。","","例如：","•   面對突發情況時，能夠先採取行動。","•   對競爭或挑戰有一定興趣。","•   別人覺得事情很困難，他卻願意先試試看。","•   自己未必覺得特別勇敢，只是覺得事情需要有人處理。","","它不是每次都不害怕，而是當某種挑戰出現時，行動的勇氣可能自然被喚起。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["你有沒有經歷過某種突發情況，當下反而很自然地站出來處理？","當別人還在猶豫時，你會不會有時直接採取行動？"],"s":["51.2 比較像：","「我沒有刻意要改變，但事情就是因為我而動起來。」","可能在不知不覺中成為引發變化的人。","它不是單純「愛衝撞」。","而是：","「我的出現本身就會帶動改變。」"]},"3":{"t":"我透過衝擊與失敗，學習自己的勇氣","b":["<mark class=\"k\">核心：試錯、衝擊與自我認識。</mark>","","第三爻透過經驗學習。放在51號閘門上，一個人可能經歷過挑戰失敗、意外變化，或發現自己並沒有想象中那麼準備好。","","例如：","•   曾經很有信心，真正面對挑戰時才發現困難。","•   經歷失敗後，重新理解勇氣。","•   發現有時需要求助，而不是獨自撐住。","•   透過經驗，逐漸知道自己如何面對壓力。","","它不是需要不斷經歷衝擊才能成長，而是實際經驗可能幫助一個人認識自己的反應與力量。"],"q":["你有沒有經歷過一次挑戰，讓你重新認識自己的勇氣？","當事情超出你的預期時，你會不會更清楚自己需要什麼支持？"],"s":["可能：","被震撼 → 調整 → 變強。"]},"4":{"t":"我會在關係中激發彼此面對挑戰","b":["<mark class=\"k\">核心：人際連接與勇氣的影響。</mark>","","第四爻與人際網絡有關。放在51號閘門上，一個人可能透過關係與群體，鼓勵彼此面對挑戰。","","例如：","•   和朋友一起嘗試原本不敢做的事情。","•   在團隊中帶動大家面對困難。","•   透過共同經歷，建立彼此的信任。","•   看到重要的人面對挑戰時，願意給予支持。","","它不是必須激勵所有人，而是合適的關係可能讓挑戰成為共同成長的經歷。"],"q":["你有沒有因為身邊某個人的鼓勵，而更願意面對原本不敢嘗試的事情？","當別人遇到挑戰時，你會不會自然想鼓勵他勇敢面對？"],"s":["一個人的勇氣可能讓整個群體改變。"]},"5":{"t":"別人期待我在關鍵時刻站出來","b":["<mark class=\"k\">核心：勇氣角色與他人的投射。</mark>","","第五爻容易受到投射。放在51號閘門上，別人可能認為這個人勇敢、有膽量，因此期待他在關鍵時刻承擔挑戰。","","例如：","•   團隊遇到突發情況時，希望他站出來。","•   別人認為他敢冒險，期待他先嘗試。","•   朋友希望他鼓勵大家行動。","•   他可能因為別人期待自己勇敢，而不願承認害怕。","","它不是必須每次都當英雄，而是別人可能期待他成為那個敢於行動的人；他仍然可以評估風險，也可以承認自己需要支持。"],"q":["別人會不會覺得你很有膽量，所以遇到困難就期待你先站出來？","你有沒有因為別人覺得你勇敢，而不太願意承認自己其實也會害怕？"],"s":["「你應該可以打破這個局面。」"]},"6":{"t":"我逐漸理解，勇氣不等於永遠不害怕","b":["<mark class=\"k\">核心：成熟的勇氣與衝擊的整合。</mark>","","第六爻帶有觀察與成熟的意味。放在51號閘門上，一個人可能逐漸理解，勇氣不是完全沒有恐懼，而是能夠看見自己的狀態，並選擇怎樣回應。","","例如：","•   更願意承認自己也會不安。","•   不再為了證明勇敢而承擔不必要的風險。","•   能夠在挑戰中尋求支持。","•   更清楚什麼值得自己站出來面對。","","它不是失去勇氣，而是更成熟地理解，勇氣包括面對現實、接受自己的局限，以及選擇真正值得投入的挑戰。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你現在會不會比較能接受，勇敢的人也可以感到害怕？","當你面對挑戰時，你會不會更關注這件事是否值得，而不只是想證明自己做得到？"],"s":["「真正的覺醒，不是製造震撼，而是讓生命真正改變。」"]}},"oh":"衝擊與覺醒","oi":[]},"52":{"h":"停下來、專注、保持穩定與讓注意力集中","i":["52號閘門位於根部中心，屬於集體理解回路，與靜止和專注有關。","<mark class=\"k\">這個閘門不是懶惰或沒有動力，而是有時需要停止行動，讓能量與注意力集中在一個方向。</mark>"],"L":{"1":{"t":"我需要先建立能夠安靜下來的條件","b":["<mark class=\"k\">核心：專注的基礎與穩定環境。</mark>","","第一爻重視基礎。放在52號閘門上，一個人可能需要先有合適的環境和條件，才能真正安靜下來。","","例如：","•   希望工作時減少干擾。","•   需要一個固定的位置專心處理事情。","•   環境太吵時，很難集中注意力。","•   會先整理桌面或安排時間，再開始專注。","","它不是一定要完全安靜才能做事，而是需要一定的穩定條件，幫助自己把注意力放在重要的事情上。"],"q":["當你需要專心時，會不會特別在意周圍環境是否穩定？","你有沒有發現，先整理好環境之後，自己會比較容易進入專注狀態？"],"s":["會喜歡：","安靜、穩定、不被打擾。"]},"2":{"t":"我自然知道什麼時候需要停下來","b":["<mark class=\"k\">核心：自然的靜止與專注。</mark>","","第二爻的特質可能自然流露。放在52號閘門上，一個人可能很自然地在某些時刻安靜下來，專注於正在處理的事情。","","例如：","•   做事情時能夠暫時不理會其他刺激。","•   進入狀態後，不喜歡被打斷。","•   有時會自然地停下來觀察。","•   別人覺得他很安靜，他卻覺得自己正在集中注意力。","","它不是每次都能保持專注，而是靜止可能成為他自然集中注意力的一種方式。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["當你真正專注於一件事時，會不會自然地減少與外界的互動？","你有沒有發現，有時停下來不做別的事情，反而讓自己更清楚？"],"s":["一旦找到狀態：","「我可以坐在這裡很久。」"]},"3":{"t":"我透過分心與停頓，學習怎樣集中注意力","b":["<mark class=\"k\">核心：試錯、專注與干擾管理。</mark>","","第三爻透過經驗學習。放在52號閘門上，一個人可能經歷過同時做太多事情，後來發現需要調整注意力。","","例如：","•   一邊工作一邊處理很多信息，最後效率降低。","•   試過不同工作安排，找到適合自己的專注方式。","•   發現某些干擾會讓自己很難重新進入狀態。","•   學習在適當的時候暫停，而不是不斷切換任務。","","它不是無法專注，而是透過經驗學習，怎樣管理干擾，讓注意力真正停留在重要的事情上。"],"q":["你有沒有發現，同時處理很多事情時，反而很難真正完成其中一件？","你有沒有試過調整工作方式之後，發現自己更容易專心？"],"s":["可能：","音樂、安靜、運動、環境。","不斷調整。"]},"4":{"t":"我的穩定會影響周圍的節奏","b":["<mark class=\"k\">核心：人際連接與專注環境。</mark>","","第四爻與人際網絡有關。放在52號閘門上，一個人的穩定與專注可能幫助團隊或身邊的人建立較清楚的工作節奏。","","例如：","•   在團隊中能夠持續專注於一項任務。","•   當周圍很忙亂時，自己仍然能夠先處理眼前的事。","•   與別人一起工作時，幫助大家減少不必要的切換。","•   透過穩定的工作方式，讓合作更順暢。","","它不是必須讓所有人都安靜，而是自己的穩定可能在合適的環境中幫助群體集中注意力。"],"q":["當團隊很忙亂時，你會不會自然地先專注於自己能夠處理的部分？","你有沒有發現，自己的工作節奏有時也會影響身邊的人？"],"s":["別人可能覺得：","「你在這裡，我比較安心。」"]},"5":{"t":"別人期待我成為那個能夠穩定局面的人","b":["<mark class=\"k\">核心：穩定角色與他人的投射。</mark>","","第五爻容易受到投射。放在52號閘門上，別人可能認為這個人沉穩、專注，因此期待他在混亂時保持穩定。","","例如：","•   團隊遇到忙亂情況時，希望他先冷靜處理。","•   別人期待他能夠專心完成任務。","•   因為他平時很穩定，別人可能忽略他也會疲憊。","•   他可能覺得自己不能表現出焦躁或不確定。","","它不是必須永遠保持平靜，而是別人可能期待他提供穩定；他仍然需要自己的休息與恢復空間。"],"q":["別人會不會覺得你比較沉穩，所以在混亂的時候期待你處理事情？","你有沒有因為別人覺得你很穩定，而不太願意讓別人知道自己也會累？"],"s":["「你比較穩，你幫我想。」"]},"6":{"t":"我逐漸理解，靜止本身也有價值","b":["<mark class=\"k\">核心：成熟的專注與行動之間的平衡。</mark>","","第六爻帶有觀察與成熟的意味。放在52號閘門上，一個人可能逐漸理解，不是一直行動才有進展，有時停下來反而能夠看清方向。","","例如：","•   不再因為暫時沒有行動就覺得自己落後。","•   更懂得安排專注與休息。","•   能夠接受某些事情需要等待。","•   更重視注意力的質量，而不是活動的數量。","","它不是逃避行動，而是更成熟地理解，靜止可以幫助自己穩定下來、集中注意力，並為下一步行動創造條件。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你現在會不會比較能夠接受，有些時候停下來比繼續忙更有幫助？","當你感到壓力很大時，你會不會發現，先停一下反而讓自己更清楚下一步該做什麼？"],"s":["「不行動，有時候也是為了讓下一步更準確。」"]}},"oh":"靜止與專注","oi":[]},"53":{"h":"新周期的啟動、發展階段與開始的動力","i":["53號閘門位於根部中心，屬於集體感知回路，與新的發展周期有關。","<mark class=\"k\">這個閘門的重點不是所有事情都要由自己開始，而是對新階段的啟動可能有感受，需要辨認哪些開始值得投入。</mark>"],"L":{"1":{"t":"我需要先確認，新周期有沒有發展的基礎","b":["<mark class=\"k\">核心：開始的基礎與現實條件。</mark>","","第一爻重視基礎。放在53號閘門上，一個人可能在開啟新計劃之前，需要先確認資源、條件和後續發展是否合理。","","例如：","•   開始新項目之前，先確認基本安排。","•   不喜歡只憑一時興奮就承諾。","•   會考慮計劃有沒有持續發展的可能。","•   希望知道開始之後，自己需要承擔什麼。","","它不是不敢開始，而是需要先建立基本條件，才比較能夠穩當地進入一個新的周期。"],"q":["當你準備開啟一個新計劃時，會不會先確認自己有沒有足夠的條件？","你會不會特別在意，一件事開始之後有沒有機會持續發展？"],"s":["不是看到新東西就開始。","而是：","「值得我投入嗎？」"]},"2":{"t":"我自然會對新的開始產生興趣","b":["<mark class=\"k\">核心：自然的啟動感與新階段。</mark>","","第二爻的特質可能自然流露。放在53號閘門上，一個人可能很自然地注意到新的機會，並產生開始某件事的興趣。","","例如：","•   對新的項目有好奇。","•   看到一種新的可能性，就想了解更多。","•   喜歡體驗人生不同的階段。","•   別人覺得他很會開啟新計劃，他卻覺得只是對機會有興趣。","","它不是每個新機會都值得投入，而是開始的可能性可能自然吸引他；是否進入，還需要進一步判斷。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["有沒有一些新計劃，只要想到就會讓你很想開始？","當你看見一個新機會時，你會不會自然地想知道它能夠發展成什麼樣？"],"s":["可能：","新工作、新計劃、新興趣。"]},"3":{"t":"我透過不同的開始，學習什麼值得繼續","b":["<mark class=\"k\">核心：試錯、周期與發展調整。</mark>","","第三爻透過經驗學習。放在53號閘門上，一個人可能開始過一些事情，後來發現並不適合繼續，逐漸學習如何選擇。","","例如：","•   曾經同時開啟太多計劃。","•   開始之後才發現條件不足。","•   經歷中斷後，學會更謹慎地評估。","•   逐漸理解，開始很重要，但不是每個開始都需要堅持。","","它不是沒有持續力，而是透過經驗學習，怎樣分辨一個新開始是否有足夠的條件發展下去。"],"q":["你有沒有開始過一些事情，後來發現自己並不想繼續？","當你想開啟新計劃時，你現在會不會比以前更認真考慮後續需要投入什麼？"],"s":["有些開始成功。","有些開始失敗。"]},"4":{"t":"我透過關係與合作開啟新的周期","b":["<mark class=\"k\">核心：人際連接與共同發展。</mark>","","第四爻與人際網絡有關。放在53號閘門上，一個人可能透過朋友、團隊或合作關係，開啟新的發展階段。","","例如：","•   因為認識某個人，接觸新的工作機會。","•   與團隊一起啟動項目。","•   透過社群活動，開始學習新的領域。","•   因為共同目標而願意進入一個新階段。","","它不是每個新開始都需要別人參與，而是關係與合作可能為新的周期帶來機會和支持。"],"q":["有沒有一些新的開始，是因為認識某個人或加入某個團隊才發生的？","當你和別人一起啟動一個計劃時，會不會更容易看見新的發展機會？"],"s":["可能：","「我們來試試看。」"]},"5":{"t":"別人期待我成為開啟新計劃的人","b":["<mark class=\"k\">核心：啟動角色與他人的投射。</mark>","","第五爻容易受到投射。放在53號閘門上，別人可能認為這個人很有動力、善於啟動，因此期待他提出新計劃或帶頭開始。","","例如：","•   團隊希望他負責啟動項目。","•   朋友期待他安排新的活動。","•   別人認為他總是有新的想法。","•   他可能因為別人期待，而不斷開啟新計劃，卻沒有足夠時間完成舊的周期。","","它不是必須不斷開始新事物，而是別人可能期待他提供啟動動力；他仍然需要判斷自己是否真的想承擔這個周期。"],"q":["別人會不會常常期待你提出新計劃或負責啟動事情？","你有沒有因為別人覺得你很有動力，而開始了其實沒有時間持續的項目？"],"s":["「下一步做什麼？」"]},"6":{"t":"我逐漸理解，開始只是一個周期的起點","b":["<mark class=\"k\">核心：成熟的啟動與長遠視角。</mark>","","第六爻帶有觀察與成熟的意味。放在53號閘門上，一個人可能逐漸理解，開始一個項目只是第一步，真正的發展需要時間與持續投入。","","例如：","•   不再只因為新鮮感就開始。","•   更願意觀察自己是否準備好。","•   開始前會考慮完整的發展過程。","•   更能夠接受，有些機會暫時不開始也沒關係。","","它不是失去行動力，而是更成熟地理解，真正有價值的開始需要有機會發展，而不是只追求啟動的興奮感。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你現在會不會比以前更在意，一個新開始是否有條件走下去？","當你很想開始一件事時，你會不會也考慮自己有沒有時間讓它發展到下一階段？"],"s":["「有些事情出現，是為了開啟一個新的階段。」"]}},"oh":"開始與新周期","oi":[]},"54":{"h":"向上發展、動力、資源積累與關係中的成長","i":["54號閘門位於根部中心，屬於部落回路，與野心、發展動力和改善自身處境有關。","<mark class=\"k\">這個閘門不是簡單的貪心，而是可能有一種想要向上發展、爭取機會、改善生活或提升能力的推動力。</mark>"],"L":{"1":{"t":"我需要先建立向上發展的基礎","b":["<mark class=\"k\">核心：發展目標與現實條件。</mark>","","第一爻重視基礎。放在54號閘門上，一個人可能希望先了解自己目前的條件，再決定如何向上發展。","","例如：","•   關注自己目前有哪些能力。","•   會考慮怎樣累積經驗。","•   希望找到可以長期發展的方向。","•   不想只追求表面上的成功，卻沒有實際基礎。","","它不是不敢追求更好的生活，而是需要先建立現實條件，才知道怎樣穩步發展。"],"q":["當你想讓生活或事業更上一層樓時，會不會先評估自己目前的基礎？","你會不會很在意，自己正在做的事情是否能帶來長期的發展？"],"s":["會在意：","「我現在有什麼？」"]},"2":{"t":"我自然會對成長與提升產生動力","b":["<mark class=\"k\">核心：自然的野心與發展欲望。</mark>","","第二爻的特質可能自然流露。放在54號閘門上，一個人可能很自然地想提升自己，尋找更好的機會。","","例如：","•   對學習新技能有動力。","•   希望改善工作或生活條件。","•   看到新的發展機會時，很容易產生興趣。","•   別人覺得他很有野心，他卻覺得自己只是想讓生活更好。","","它不是一定要和別人競爭，而是向上發展的動力可能自然出現；重要的是確認自己想追求的是什麼。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["你有沒有發現，自己很自然地會想讓生活或事業變得更好？","當你看見一個可以成長的機會時，會不會很容易產生想嘗試的動力？"],"s":["可能有很強的：","「我想變得更好。」"]},"3":{"t":"我透過挫折與經驗，調整自己的野心","b":["<mark class=\"k\">核心：試錯、發展與現實調整。</mark>","","第三爻透過經驗學習。放在54號閘門上，一個人可能經歷過追求目標失敗、選錯方向，或發現原本想要的成功並不適合自己。","","例如：","•   曾經為了升職投入很多，後來發現生活失去平衡。","•   追求某個目標後，發現代價比預期大。","•   透過失敗，重新理解自己真正想要什麼。","•   逐漸學會把野心與現實條件放在一起考慮。","","它不是失去企圖心，而是透過經驗，學習怎樣追求發展而不被外界定義的成功牽著走。"],"q":["你有沒有追求過一個目標，後來發現它帶來的代價超出自己的預期？","當你發現某種成功方式不適合自己時，會不會重新調整目標？"],"s":["可能：","想得很大 → 做了才知道難度 → 調整。"]},"4":{"t":"我透過關係與合作獲得發展機會","b":["<mark class=\"k\">核心：人際連接與共同成長。</mark>","","第四爻與人際網絡有關。放在54號閘門上，一個人可能透過合作、關係或群體獲得成長機會。","","例如：","•   通過熟人認識新的工作機會。","•   在團隊合作中累積經驗。","•   與有共同目標的人一起成長。","•   發現合適的關係能夠幫助自己看見新的可能性。","","它不是必須依靠別人成功，而是合適的人際連接可能成為發展過程中的支持與機會。"],"q":["你有沒有因為認識某個人或加入某個團隊，而獲得新的發展機會？","當你想提升自己時，你會不會特別重視與什麼樣的人合作？"],"s":["54.4 的重點是成長透過關係擴散。","你的進步與企圖心，會帶動身邊的人也想向上。","別人可能因為你的努力而得到機會或啟發。","它不是單純「想爬高位」。","而是：","「我的成長會透過關係帶動整個圈子。」"]},"5":{"t":"別人期待我有野心並不斷向上發展","b":["<mark class=\"k\">核心：發展角色與他人的投射。</mark>","","第五爻容易受到投射。放在54號閘門上，別人可能認為這個人有動力、能夠追求成功，因此期待他承擔更大的目標。","","例如：","•   家人期待他事業有成。","•   團隊認為他有潛力，因此安排更高的責任。","•   別人希望他不斷提升自己的成就。","•   他可能因為外界期待，而覺得停下來就是退步。","","它不是必須不斷向上，而是別人可能期待他持續追求成功；他仍然需要判斷什麼樣的發展真正符合自己的價值。"],"q":["別人會不會期待你不斷進步、取得更好的成績？","你有沒有因為外界期待，而覺得自己不能停下來休息或重新選擇方向？"],"s":["「你很有企圖心，你幫我。」"]},"6":{"t":"我逐漸理解，成長不只看外在地位","b":["<mark class=\"k\">核心：成熟的野心與長遠價值。</mark>","","第六爻帶有觀察與成熟的意味。放在54號閘門上，一個人可能逐漸理解，真正的成長不一定只是職位、金錢或社會地位的提升。","","例如：","•   更重視生活是否符合自己的價值。","•   不再單純用別人眼中的成功衡量自己。","•   開始考慮關係、健康的生活節奏與長期滿足。","•   更清楚自己為什麼想向上發展。","","它不是放棄野心，而是更成熟地理解，發展應該服務於自己真正想要的生活，而不是只為了證明自己比以前更成功。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你現在會不會比以前更清楚，自己追求成功到底是為了什麼？","當你想到未來的發展時，會不會開始把生活品質、關係和個人價值一起考慮？"],"s":["「真正的成長，也包括知道什麼時候已經夠了。」"]}},"oh":"野心與成長","oi":[]},"55":{"h":"情緒自由、豐盛感、內在狀態與精神上的開放","i":["55號閘門位於情緒中心，屬於個體回路，與情緒狀態、自由和內在豐盛感有關。","<mark class=\"k\">這個閘門不應該被簡單理解成情緒化，而是可能很在意內在是否感到自由，以及自己能否真實地經歷情緒。</mark>"],"L":{"1":{"t":"我需要先理解，什麼讓我感到內在穩定","b":["<mark class=\"k\">核心：情緒基礎與內在支持。</mark>","","第一爻重視基礎。放在55號閘門上，一個人可能需要先了解什麼環境、生活方式或支持能夠幫助自己感到比較穩定。","","例如：","•   會留意自己在什麼情況下比較自在。","•   希望有空間表達真實情緒。","•   當生活被過度限制時，容易感到壓迫。","•   需要時間理解自己的情緒變化。","","它不是必須保持快樂，而是需要了解自己的內在狀態，才能更清楚地面對情緒變化。"],"q":["你會不會特別在意，自己有沒有足夠的空間做真實的自己？","當你感到被限制時，你的情緒會不會出現明顯變化？"],"s":["會問：","「什麼讓我真的感覺有生命？」"]},"2":{"t":"我的情緒與內在狀態會自然流動","b":["<mark class=\"k\">核心：自然的情緒表達與自由感。</mark>","","第二爻的特質可能自然流露。放在55號閘門上，一個人可能很自然地經歷不同的情緒狀態，不一定每天都保持同樣的感覺。","","例如：","•   有時很有熱情，有時只想安靜。","•   對喜歡的事情容易感到興奮。","•   某些時候特別重視自由與自主。","•   別人覺得他狀態變化明顯，他卻覺得自己只是如實感受當下。","","它不是每種情緒都必須立即行動，而是情緒可能自然流動；感受到什麼與決定怎樣行動，仍然是兩回事。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["你有沒有發現，自己的內在狀態有時會有很明顯的變化？","當你感到情緒低落時，你會不會比較需要自由和空間，而不是別人立刻要求你振作？"],"s":["有時很開心。","有時低落。","不一定有固定原因。"]},"3":{"t":"我透過情緒起伏，學習理解自己的自由","b":["<mark class=\"k\">核心：試錯、情緒體驗與內在調整。</mark>","","第三爻透過經驗學習。放在55號閘門上，一個人可能經歷過情緒波動、對自由的追求，或發現某些看似自由的選擇並沒有帶來想象中的滿足。","","例如：","•   曾經以為只要擺脫某種限制就會快樂。","•   經歷之後，發現內在狀態並不會自動改變。","•   透過不同生活經驗，理解自己真正需要什麼。","•   學會不在情緒最強烈時，馬上作出重大決定。","","它不是情緒起伏代表自己有問題，而是透過體驗，逐漸理解自由對自己真正意味著什麼。"],"q":["你有沒有經歷過，原本以為得到自由就會滿足，後來發現自己的感受比想象中復雜？","當你情緒很強烈時，你會不會需要先給自己時間，再決定下一步？"],"s":["經歷不同情緒後發現：","「原來我需要這個。","」"]},"4":{"t":"我在關係中需要自由，也需要真實的連接","b":["<mark class=\"k\">核心：人際關係與內在自由。</mark>","","第四爻與人際網絡有關。放在55號閘門上，一個人可能希望關係能夠提供支持，同時也保留表達真實狀態的空間。","","例如：","•   希望親密關係中能夠坦誠表達感受。","•   不喜歡被要求一直保持某種情緒。","•   需要有自己的時間與空間。","•   在能夠尊重彼此自由的關係中，比較容易感到自在。","","它不是不願意建立關係，而是關係需要允許真實的情緒和適當的自由，才能讓連接更自然。"],"q":["在親密關係中，你會不會特別在意自己能不能自由表達真實感受？","當別人要求你一直表現得開心或積極時，你會有什麼感覺？"],"s":["有時候一個人的狀態就能改變整個空間。"]},"5":{"t":"別人期待我保持熱情或帶來正面的情緒","b":["<mark class=\"k\">核心：情緒角色與他人的投射。</mark>","","第五爻容易受到投射。放在55號閘門上，別人可能期待這個人有熱情、富有感染力，或能夠帶動大家的情緒。","","例如：","•   別人希望他在聚會中活躍氣氛。","•   團隊期待他對計劃保持熱情。","•   朋友覺得他應該能夠很快恢復好心情。","•   他可能因為外界期待，而不願意表達自己的低落。","","它不是必須隨時積極，而是別人可能期待他展現某種情緒狀態；他仍然需要允許自己真實地經歷不同感受。"],"q":["別人會不會期待你保持熱情或積極的狀態？","你有沒有因為不想讓別人失望，而隱藏自己其實並不開心的感受？"],"s":["「你不是很有能量嗎？」","但你不需要永遠快樂。"]},"6":{"t":"我逐漸理解，內在豐盛不等於永遠快樂","b":["<mark class=\"k\">核心：成熟的情緒自由與內在整合。</mark>","","第六爻帶有觀察與成熟的意味。放在55號閘門上，一個人可能逐漸理解，內在的自由與豐盛不是每天都開心，而是能夠允許自己的感受真實存在。","","例如：","•   不再要求自己一直保持正面。","•   能夠接受情緒會隨著生活改變。","•   更清楚哪些外在限制需要處理，哪些感受需要時間消化。","•   不再只根據當天的心情判斷自己的人生是否幸福。","","它不是放棄追求快樂，而是更成熟地理解，真正的內在自由包括允許自己感受，而不必強迫自己永遠符合某種情緒標準。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你現在會不會比較能夠接受，自己不需要每天都保持開心？","當你情緒低落時，你會不會更願意先理解自己的感受，而不是馬上要求自己振作？"],"s":["「真正的豐盛，是我可以允許生命有高有低。」"]}},"oh":"精神、情緒與豐盛","oi":[]},"56":{"h":"故事、表達、體驗與從經歷中尋找意義","i":["56號閘門位於喉嚨中心，屬於集體感知回路，與故事、刺激和通過表達傳遞經驗有關。","<mark class=\"k\">這個閘門的重點不只是愛說話，而是可能透過故事、交流與新信息，讓生活變得豐富，也讓經驗能夠被別人理解。</mark>"],"L":{"1":{"t":"我需要先整理經驗，才能把故事說清楚","b":["<mark class=\"k\">核心：表達的基礎與故事結構。</mark>","","第一爻重視基礎。放在56號閘門上，一個人可能需要先弄清楚一段經歷的重點，才比較能夠把故事講清楚。","","例如：","•   回憶一件事情時，會想整理前因後果。","•   不喜歡講故事時缺少重點。","•   會先想清楚自己希望別人理解什麼。","•   當經歷太復雜時，可能需要時間整理表達。","","它不是沒有故事可以分享，而是需要先建立清楚的結構，才能把經歷轉化成別人容易理解的內容。"],"q":["當你想分享一段經歷時，會不會先想清楚自己真正想表達什麼？","你會不會覺得，先把事情整理好，講出來才比較容易讓別人理解？"],"s":["會問：","「這件經歷對我有什麼意義？」"]},"2":{"t":"我自然會透過故事表達自己","b":["<mark class=\"k\">核心：自然的表達與故事感。</mark>","","第二爻的特質可能自然流露。放在56號閘門上，一個人可能很自然地用故事、比喻或生活經驗與別人交流。","","例如：","•   聊天時很容易分享經歷。","•   擅長用故事說明自己的觀點。","•   喜歡聽別人講有趣的事情。","•   別人覺得他很會講故事，他卻覺得只是分享生活。","","它不是每件事都要說得精彩，而是故事可能自然成為他表達經驗與連接他人的方式。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["你會不會很自然地透過故事或生活經歷來表達自己的想法？","別人有沒有說過，你講述事情的方式很容易讓人投入？"],"s":["可能：","「欸，我跟你講一個……」"]},"3":{"t":"我透過不同體驗，學習哪些故事值得分享","b":["<mark class=\"k\">核心：試錯、體驗與表達調整。</mark>","","第三爻透過經驗學習。放在56號閘門上，一個人可能嘗試過不同表達方式，才逐漸知道什麼樣的故事能夠傳達真正的意義。","","例如：","•   分享經歷後，發現別人理解的重點與自己不同。","•   講述某件事時，發現自己遺漏了重要背景。","•   透過別人的反應，調整表達方式。","•   逐漸理解，不是每個經歷都需要馬上分享。","","它不是為了娛樂別人而不斷說故事，而是透過經驗學習，怎樣分享才能真正傳遞自己想表達的內容。"],"q":["你有沒有分享過一段經歷，後來才發現別人理解的重點和你想表達的不一樣？","你會不會隨著經驗增加，越來越知道哪些故事適合分享、哪些需要保留？"],"s":["不是憑空說。","而是：","「我經歷過，所以我知道。」"]},"4":{"t":"我透過故事與人建立連接","b":["<mark class=\"k\">核心：人際交流與共同經驗。</mark>","","第四爻與人際網絡有關。放在56號閘門上，一個人可能透過分享經歷、聽別人說故事，建立人與人之間的連接。","","例如：","•   朋友聚會時喜歡分享生活經歷。","•   透過故事發現彼此有相似的經驗。","•   用自己的經歷幫助別人理解某件事。","•   通過交流，讓關係變得更自然。","","它不是每次交流都需要講故事，而是故事可能成為建立共同理解和人際連接的一種方式。"],"q":["你會不會覺得，分享彼此的經歷能讓關係更靠近？","你有沒有因為聽到別人的故事，而對一個人或一件事有了新的理解？"],"s":["一個故事可能讓別人重新理解自己。"]},"5":{"t":"別人期待我提供有趣的故事或新的視角","b":["<mark class=\"k\">核心：表達角色與他人的投射。</mark>","","第五爻容易受到投射。放在56號閘門上，別人可能期待這個人會講故事、分享新鮮經驗，或讓復雜的事情變得有趣。","","例如：","•   聚會中，別人期待他分享有趣經歷。","•   朋友希望他推薦新的體驗。","•   團隊期待他用生動的方式介紹信息。","•   他可能因為別人期待，而覺得自己必須一直提供新鮮內容。","","它不是必須持續娛樂別人，而是別人可能期待他帶來故事和刺激；他仍然可以選擇安靜，或分享更平凡的經驗。"],"q":["別人會不會常常期待你分享有趣的經歷？","你有沒有因為別人覺得你很會講故事，而覺得自己必須一直提供有趣的內容？"],"s":["「還有什麼故事？」"]},"6":{"t":"我逐漸理解，故事的價值在於經驗帶來的意義","b":["<mark class=\"k\">核心：成熟的表達與經驗整合。</mark>","","第六爻帶有觀察與成熟的意味。放在56號閘門上，一個人可能逐漸理解，故事不只是讓人開心，也可以幫助人理解生命中的經驗。","","例如：","•   更重視故事背後的意義。","•   不再只追求新鮮或刺激。","•   能夠從過去經歷中提煉理解。","•   更知道分享的目的，是交流經驗，而不只是吸引注意。","","它不是失去表達的樂趣，而是更成熟地理解，故事可以豐富生活，也能讓經驗變成自己與別人都能夠理解的東西。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你現在會不會更在意，一段經歷除了有趣之外，還帶給自己什麼理解？","當你分享故事時，你會不會開始思考，自己真正想讓別人聽見的是什麼？"],"s":["「真正好的故事，是讓人看到新的可能。」"]}},"oh":"故事與刺激","oi":[]},"57":{"h":"當下警覺、細微感知、清晰感與即時判斷","i":["57號閘門位於脾中心，屬於整合回路，與細微的直覺、當下覺察和生存判斷有關。","<mark class=\"k\">這個閘門的重點不是每個感覺都絕對正確，而是可能很快察覺某些細節，並對當下的環境產生即時反應。</mark>"],"L":{"1":{"t":"我需要先建立對環境的基本覺察","b":["<mark class=\"k\">核心：直覺的基礎與安全感。</mark>","","第一爻重視基礎。放在57號閘門上，一個人可能很在意環境是否讓自己感到安全，以及自己是否能夠注意到重要的細節。","","例如：","•   進入陌生環境時，會先觀察周圍。","•   對聲音、氣氛或細節比較敏感。","•   希望了解基本情況，才決定是否放松。","•   當環境太混亂時，可能更難聽見自己細微的感覺。","","它不是必須一直保持警戒，而是需要一定的環境覺察，才能更清楚地注意當下發生的事情。"],"q":["當你進入陌生環境時，會不會很自然地先觀察周圍？","你有沒有發現，環境安靜下來時，自己比較容易察覺一些細微的感覺？"],"s":["會問：","「我的身體到底在告訴我什麼？」"]},"2":{"t":"我自然會察覺當下的細微變化","b":["<mark class=\"k\">核心：自然的直覺與即時感知。</mark>","","第二爻的特質可能自然流露。放在57號閘門上，一個人可能很自然地注意到某些細微的變化。","","例如：","•   很快察覺一個人說話的語氣不同。","•   對環境中的異常變化比較敏感。","•   某個時刻突然感覺需要停一下。","•   自己很難解釋為什麼注意到，卻自然會留意。","","它不是每個感覺都必須當成預言，而是某些細微線索可能自然進入覺察；之後仍可以觀察事實。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["你有沒有突然察覺某個細節不太對勁，卻一時說不清楚原因？","當你出現這樣的感覺時，你會不會先留意現場發生了什麼，再決定怎麼做？"],"s":["可能突然：","「不要去。」","「這個人可以相信。","」"]},"3":{"t":"我透過經驗學習，分辨直覺與擔憂","b":["<mark class=\"k\">核心：試錯、警覺與判斷調整。</mark>","","第三爻透過經驗學習。放在57號閘門上，一個人可能需要透過不同經歷，學習區分即時的直覺感知與反覆的擔憂。","","例如：","•   曾經因為一時不安而過度擔心。","•   後來發現某些感覺只是壓力帶來的反應。","•   透過經驗，更了解自己什麼時候需要注意。","•   學會觀察事實，而不是只因為不舒服就認定有問題。","","它不是不應該相信直覺，而是透過經驗學習，讓直覺提醒自己留意，而不是直接代替所有判斷。"],"q":["你有沒有經歷過，自己當下很不安，後來才發現事情並沒有想象中嚴重？","你現在會不會更能分辨，什麼是即時的感覺，什麼是反覆擔心？"],"s":["經歷之後知道：","「剛才那個感覺是真的。」"]},"4":{"t":"我在關係中察覺細微的變化","b":["<mark class=\"k\">核心：人際連接與當下感知。</mark>","","第四爻與人際網絡有關。放在57號閘門上，一個人可能很容易注意到熟悉的人在狀態、語氣或行為上的變化。","","例如：","•   發現朋友今天比平常安靜。","•   察覺同事的回應方式不同。","•   對熟悉的人際氣氛變化很敏感。","•   可能會主動詢問對方是否發生了什麼。","","它不是一定知道別人心裡在想什麼，而是可能注意到變化的線索；最好的方式仍是詢問與觀察，而不是直接替別人下結論。"],"q":["你會不會很容易察覺熟悉的人今天和往常不太一樣？","當你注意到這種變化時，你通常會直接詢問，還是先觀察一段時間？"],"s":["別人可能問：","「你覺得這個安全嗎？」"]},"5":{"t":"別人期待我提前察覺問題","b":["<mark class=\"k\">核心：直覺判斷與他人的投射。</mark>","","第五爻容易受到投射。放在57號閘門上，別人可能認為這個人敏銳、反應快，因此期待他提前發現風險。","","例如：","•   團隊希望他注意潛在問題。","•   朋友詢問他某個人是否可靠。","•   別人期待他在事情發生前提出提醒。","•   他可能因為別人相信自己的判斷，而擔心漏掉任何細節。","","它不是必須預測所有風險，而是別人可能期待他提前察覺問題；他仍然需要接受自己有時無法知道所有事情。"],"q":["別人會不會覺得你很敏銳，所以遇到問題時常來問你怎麼看？","當別人期待你提前發現風險時，你會不會因此很難放松？"],"s":["容易被投射：","「你應該可以感覺出來。」","但直覺不是隨時都必須回答。"]},"6":{"t":"我逐漸理解，直覺需要被聽見，也需要被正確使用","b":["<mark class=\"k\">核心：成熟的覺察與判斷。</mark>","","第六爻帶有觀察與成熟的意味。放在57號閘門上，一個人可能逐漸理解，直覺的價值在於提醒自己注意當下，而不是讓自己永遠處於警戒狀態。","","例如：","•   不再因為每個細微感覺就立即行動。","•   更懂得在安靜中聽見自己的感知。","•   能夠同時觀察現實情況。","•   接受有些感覺需要更多信息才能理解。","","它不是忽略直覺，而是更成熟地運用直覺，讓它成為當下的提醒，而不是持續制造恐懼的來源。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你現在會不會比較懂得聽見自己的感覺，同時也觀察現實情況？","當你出現一個直覺時，你會不會先把它當成提醒，再進一步確認？"],"s":["「它提醒我當下注意什麼，但不一定告訴我整個人生答案。」"]}},"oh":"直覺與當下清晰","oi":[]},"58":{"h":"改善生命、喜悅、活力與讓事情變得更好","i":["58號閘門位於根部中心，屬於集體理解回路，與生命活力、改善和對更好狀態的推動有關。","<mark class=\"k\">這個閘門的重點不是因為現在不夠好才想改善，而是可能看見生命仍有發展的空間，因此想讓事情更有活力。</mark>"],"L":{"1":{"t":"我需要先確認，什麼地方真正值得改善","b":["<mark class=\"k\">核心：改善的基礎與問題辨識。</mark>","","第一爻重視基礎。放在58號閘門上，一個人可能需要先確認問題在哪裡，以及改善是否真的有幫助。","","例如：","•   不喜歡只為了改變而改變。","•   會觀察目前的方法是否有效。","•   希望了解問題的根源。","•   在投入改善之前，會考慮現實條件。","","它不是凡事都要追求完美，而是需要先確認什麼值得改善，才知道力量應該放在哪裡。"],"q":["當你發現某件事可以更好時，會不會先確認問題到底在哪裡？","你會不會特別在意，改善之後是否真的能讓生活更好？"],"s":["會問：","「怎樣可以讓生活更好？」"]},"2":{"t":"我自然會看見生活還有更好的可能","b":["<mark class=\"k\">核心：自然的活力與改善動力。</mark>","","第二爻的特質可能自然流露。放在58號閘門上，一個人可能很自然地看見事情還能怎樣變得更好。","","例如：","•   對某個工作流程想到新的改善方法。","•   看到生活中可以優化的地方。","•   對有趣的練習或新方法產生動力。","•   別人覺得已經很好，他卻仍然看見可以發展的空間。","","它不是覺得現在的一切都不好，而是可能自然看見新的可能性，想讓事情更有活力。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["你會不會很自然地想到，某件事還可以怎樣做得更好？","當你看到一種新的做法時，會不會很容易產生想嘗試的動力？"],"s":["可能別人覺得：","「已經很好了。」","你卻：","「還可以更好玩。」"]},"3":{"t":"我透過改善經驗，學習怎樣讓事情真正變好","b":["<mark class=\"k\">核心：試錯、優化與實際效果。</mark>","","第三爻透過經驗學習。放在58號閘門上，一個人可能嘗試過不同改善方法，才知道什麼真正有效。","","例如：","•   改變工作流程後，發現效率反而下降。","•   嘗試新的運動方式，才知道哪種適合自己。","•   透過失敗，學習不必每次都追求更多。","•   逐漸分辨改善是來自實際需要，還是單純無法接受不完美。","","它不是不停挑剔，而是透過經驗學習，怎樣把改善動力轉化成真正有幫助的行動。"],"q":["你有沒有試過很想改善一件事，實際嘗試後才發現方法需要調整？","當你發現事情已經不錯時，你會不會仍然覺得一定要繼續改善？"],"s":["改 → 發現問題 → 再改。"]},"4":{"t":"我的改善動力會影響身邊的人","b":["<mark class=\"k\">核心：人際連接與共同進步。</mark>","","第四爻與人際網絡有關。放在58號閘門上，一個人可能透過團隊、朋友或共同活動，讓改善變成大家可以一起參與的過程。","","例如：","•   在團隊中提出讓工作更順暢的做法。","•   與朋友一起培養健康習慣。","•   透過共同練習，讓彼此更有動力。","•   幫助群體看見原本沒有注意到的改善空間。","","它不是必須糾正所有人，而是自己的改善動力可能在合適的關係中，帶動共同進步。"],"q":["你有沒有發現，當你開始改善某件事時，身邊的人也可能受到影響？","你會不會喜歡和別人一起練習、優化或發展某種能力？"],"s":["可能帶動團隊：","「我們試試這個。","」"]},"5":{"t":"別人期待我指出怎樣才能做得更好","b":["<mark class=\"k\">核心：改善角色與他人的投射。</mark>","","第五爻容易受到投射。放在58號閘門上，別人可能認為這個人很會發現改善空間，因此期待他提出更好的做法。","","例如：","•   同事請他檢查流程。","•   團隊期待他提供優化建議。","•   別人希望他幫忙找出效率問題。","•   他可能因為別人不斷期待改善，而很難接受事情暫時維持現狀。","","它不是每個問題都需要自己改善，而是別人可能期待他指出更好的方法；他仍然需要判斷什麼值得投入。"],"q":["別人會不會經常來問你，有沒有更好的做法？","當別人期待你不斷提出改善建議時，你會不會覺得自己必須一直找到問題？"],"s":["容易變成：","「你幫我改善。","」"]},"6":{"t":"我逐漸理解，改善應該來自生命的喜悅","b":["<mark class=\"k\">核心：成熟的活力與長遠優化。</mark>","","第六爻帶有觀察與成熟的意味。放在58號閘門上，一個人可能逐漸理解，改善不應該只為了證明現在不夠好，也可以來自對生命的熱愛。","","例如：","•   不再因為某件事不完美就否定它。","•   更願意選擇能帶來實際活力的改善。","•   能夠接受有些事情已經足夠好。","•   把改善當成探索可能性，而不是持續批評自己。","","它不是放棄進步，而是更成熟地理解，真正的改善可以來自喜悅與生命力，而不是永遠覺得自己不夠好。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你現在會不會更能分辨，自己想改善一件事，是因為它真的有幫助，還是因為自己無法接受不完美？","當你發現某件事已經做得不錯時，你能不能允許自己先享受成果，而不是馬上尋找下一個問題？"],"s":["這是很重要的。","「我想讓它更好，不代表現在不好。」","改善可以來自：","「我看見了還有更有生命力的可能。」"]}},"oh":"生命力與改善","oi":[]},"59":{"h":"打破隔閡、親近、連接與關係中的開放","i":["59號閘門位於薦骨中心，屬於部落回路，與親密、繁衍和打破人與人之間的距離有關。","<mark class=\"k\">這個閘門不只是外向或喜歡社交，而是可能自然地拉近人與人的距離，幫助關係從陌生走向更親近。</mark>"],"L":{"1":{"t":"我需要先確認，親近是否有安全的基礎","b":["<mark class=\"k\">核心：親密的基礎與界線。</mark>","","第一爻重視基礎。放在59號閘門上，一個人可能需要先確認彼此是否有基本的信任與安全感，才願意深入關係。","","例如：","•   不會輕易向所有人透露私事。","•   希望關係有基本的尊重。","•   會觀察對方是否願意互相了解。","•   對不合適的親近方式可能會保持距離。","","它不是不願意親近別人，而是需要一定的安全感，才能自然地打破彼此之間的隔閡。"],"q":["當你認識一個新的人時，會不會先確認彼此是否有基本的信任？","對你來說，什麼樣的相處方式會讓你覺得比較容易親近？"],"s":["會問：","「我能不能真正打開自己？」"]},"2":{"t":"我自然會拉近人與人的距離","b":["<mark class=\"k\">核心：自然的親近與開放。</mark>","","第二爻的特質可能自然流露。放在59號閘門上，一個人可能很自然地讓別人感到容易接近。","","例如：","•   很快就能與別人聊起來。","•   不太需要刻意安排，就能與人建立互動。","•   容易讓陌生人願意分享自己的事情。","•   別人覺得他很親切，他卻覺得只是自然地與人交流。","","它不是每個人都必須和自己親近，而是建立連接的能力可能自然出現；真正的親密仍然需要雙方願意。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["你有沒有發現，自己很容易和別人聊起來？","別人會不會常常很快就願意和你分享自己的事情？"],"s":["不是對所有人。","而是身體自然知道：","「這個人可以靠近。」"]},"3":{"t":"我透過關係經驗，學習親近與界線","b":["<mark class=\"k\">核心：試錯、親密與關係調整。</mark>","","第三爻透過經驗學習。放在59號閘門上，一個人可能經歷過太快親近、關係中的誤會，或發現自己沒有足夠的界線。","","例如：","•   曾經很快信任一個人，後來發現彼此期待不同。","•   發現不是每個人都想建立同樣程度的親密。","•   透過關係經驗，學習慢慢確認信任。","•   逐漸理解，親近需要尊重彼此的意願。","","它不是不適合親密關係，而是透過經驗學習，怎樣在開放與保護自己之間找到平衡。"],"q":["你有沒有因為太快親近一個人，後來才發現彼此對關係的期待不一樣？","你有沒有學習過，建立親密關係也需要尊重彼此的速度？"],"s":["可能：","靠近 → 發現問題 → 調整界限。"]},"4":{"t":"我透過熟悉的關係建立更深的連接","b":["<mark class=\"k\">核心：人際網絡與親密關係。</mark>","","第四爻與人際網絡有關。放在59號閘門上，一個人可能透過熟悉的朋友圈、團隊或長期關係，逐漸建立更深的連接。","","例如：","•   在熟悉的圈子中，更願意分享真實感受。","•   通過共同經歷，和朋友變得更親近。","•   喜歡在有信任基礎的關係中深入交流。","•   透過長期互動，讓關係從表面走向更真實的連接。","","它不是只能和熟人親近，而是熟悉與信任可能讓深層連接更容易發生。"],"q":["你會不會覺得，和一個人經歷過一些事情之後，關係才真正變得親近？","對你來說，什麼樣的共同經歷會讓你更願意打開自己？"],"s":["兩個人的關係，也可能影響家庭、朋友、團隊。"]},"5":{"t":"別人期待我能夠打破隔閡、拉近關係","b":["<mark class=\"k\">核心：親近的角色與他人的投射。</mark>","","第五爻容易受到投射。放在59號閘門上，別人可能認為這個人很會拉近距離，因此期待他主動建立連接。","","例如：","•   別人希望他在聚會中主動與人交流。","•   團隊期待他幫助新成員融入。","•   朋友認為他很容易與人親近。","•   他可能因為別人期待，而覺得自己必須隨時開放。","","它不是必須與所有人親近，而是別人可能期待他成為打破隔閡的人；他仍然可以選擇關係的深度和距離。"],"q":["別人會不會覺得你很容易和人親近，所以期待你主動建立連接？","你有沒有因為別人認為你很親切，而覺得自己必須一直保持開放？"],"s":["容易被投射：","「你應該懂我。」","但親密需要雙方同意。"]},"6":{"t":"我逐漸理解，真正的親密需要雙方都願意","b":["<mark class=\"k\">核心：成熟的親密與關係界線。</mark>","","第六爻帶有觀察與成熟的意味。放在59號閘門上，一個人可能逐漸理解，打破隔閡並不等於每段關係都應該變得親密。","","例如：","•   更能尊重別人不想分享的部分。","•   不再因為別人保持距離，就認定對方不喜歡自己。","•   更重視親密關係中的互相尊重。","•   能夠接受有些關係適合保持一定距離。","","它不是失去親近的能力，而是更成熟地理解，真正的親密不是單方面拉近距離，而是雙方都願意建立連接。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你現在會不會更能接受，不是每個人都需要和自己變得很親近？","當別人希望保持距離時，你能不能尊重他的選擇，而不把它直接理解為拒絕自己？"],"s":["「越親近，反而越需要尊重彼此的邊界。」"]}},"oh":"親密與突破界限","oi":[]},"60":{"h":"現實限制、邊界、規則與限制中的變化可能","i":["60號閘門位於根部中心，屬於個體回路，與限制、結構和在現實條件下發生變化有關。","<mark class=\"k\">這個閘門不是只代表受限制，而是與如何面對暫時無法改變的條件有關。限制可能讓人看見現實的邊界，也可能幫助新的形式逐漸成形。</mark>"],"L":{"1":{"t":"我需要先看清楚現實的限制","b":["<mark class=\"k\">核心：限制的基礎與現實判斷。</mark>","","第一爻重視基礎。放在60號閘門上，一個人可能需要先清楚了解現實條件，才知道自己能夠怎樣行動。","","例如：","•   計劃之前會考慮預算、時間和資源。","•   不喜歡忽略現實條件，只談理想。","•   會留意規則或限制會帶來什麼影響。","•   希望知道哪些事情目前可以改變，哪些暫時不能。","","它不是悲觀，而是需要先看清現實邊界，才能找到可行的行動方向。"],"q":["當你想做一件事時，會不會先考慮現實條件是否允許？","你會不會比較難接受別人完全忽略限制，只要求你馬上做到？"],"s":["會問：","「現在實際可以做到什麼？」"]},"2":{"t":"我自然會察覺哪裡存在限制","b":["<mark class=\"k\">核心：自然的邊界感與現實覺察。</mark>","","第二爻的特質可能自然流露。放在60號閘門上，一個人可能很自然地注意到事情受到什麼條件限制。","","例如：","•   很快看見計劃中的現實困難。","•   對不合理的要求有清楚感覺。","•   知道某些事情目前還不能強行推進。","•   別人覺得他太謹慎，他卻只是注意到現實條件。","","它不是故意阻止別人，而是可能自然察覺事情的邊界；關鍵是進一步分辨限制是否真的無法改變。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["你會不會很自然地注意到，一個計劃有哪些現實限制？","當別人提出很理想的想法時，你會不會馬上想到實際執行會遇到什麼問題？"],"s":["可能很清楚：","「這個現在做不到。","」"]},"3":{"t":"我透過限制與受阻的經驗，學習調整方式","b":["<mark class=\"k\">核心：試錯、限制與改變方法。</mark>","","第三爻透過經驗學習。放在60號閘門上，一個人可能經歷過計劃受阻、資源不足，才逐漸學習怎樣在限制下找到新的可能。","","例如：","•   原本的計劃因為現實條件而無法進行。","•   試過硬推，發現反而帶來更多問題。","•   透過調整時間、資源或方法，讓事情重新推進。","•   學會接受有些事情需要等待。","","它不是注定被限制，而是透過現實經驗，學習怎樣調整方式，而不是只靠意志力強行突破。"],"q":["你有沒有經歷過，原本計劃好的事情因為現實條件而必須改變？","當你發現暫時無法做到時，你通常會繼續硬推，還是會嘗試尋找其他方式？"],"s":["可能：","「原來真的不能這樣。」","於是重新調整。"]},"4":{"t":"我透過關係與合作，在限制中尋找可能","b":["<mark class=\"k\">核心：人際連接與共同調整。</mark>","","第四爻與人際網絡有關。放在60號閘門上，一個人可能透過合作、討論或群體資源，在現實限制下找到新的做法。","","例如：","•   與團隊一起重新安排資源。","•   和朋友討論後，發現其他可行的方向。","•   透過合作分擔原本難以承擔的條件。","•   在熟悉的關係中，更容易找到實際解決方法。","","它不是必須依賴別人突破限制，而是合適的關係可能幫助自己看見原本沒有注意到的可能性。"],"q":["當你遇到現實限制時，會不會通過與別人討論，找到新的做法？","你有沒有發現，原本一個人做不到的事情，透過合作就有了不同的可能？"],"s":["會幫助大家看見：","「現實條件是什麼。","」"]},"5":{"t":"別人期待我找到限制中的解決方案","b":["<mark class=\"k\">核心：現實判斷與他人的投射。</mark>","","第五爻容易受到投射。放在60號閘門上，別人可能認為這個人很務實，能夠在現實條件下找到辦法，因此期待他提出解決方案。","","例如：","•   團隊遇到資源不足時，希望他想辦法。","•   別人期待他在規則限制下找到可行的做法。","•   他可能被認為很會處理實際問題。","•   有時因為別人期待解決方案，而感到必須突破所有限制。","","它不是每個限制都能立即解決，而是別人可能期待他找到辦法；他仍然需要承認有些條件暫時無法改變。"],"q":["別人會不會常常期待你在資源不足或條件受限時，想出解決方法？","當某個限制確實無法改變時，你會不會因為別人期待而給自己很大的壓力？"],"s":["「你一定有辦法。」","但不是所有限制都需要突破。"]},"6":{"t":"我逐漸理解，限制也可能成為新形式的起點","b":["<mark class=\"k\">核心：成熟的現實感與變化。</mark>","","第六爻帶有觀察與成熟的意味。放在60號閘門上，一個人可能逐漸理解，限制雖然會阻止某些做法，卻也可能幫助自己找到不同的方向。","","例如：","•   更能接受有些事情需要等待。","•   不再把每個限制都看成失敗。","•   能夠在現實條件下尋找替代方案。","•   理解改變有時需要等到合適的條件出現。","","它不是被動接受一切，而是更成熟地理解，先看清限制，再決定怎樣行動，比一味強行突破更有幫助。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你現在會不會比較能夠接受，有些事情暫時無法改變？","當原本的計劃被限制時，你會不會開始尋找另一種可能，而不只是覺得事情失敗了？"],"s":["這是 60.6 很重要的地方：","「有了邊界，我反而知道可以怎樣發揮。」","限制不一定是阻礙。","有時候它是：","「讓創造可以真正發生的框架。」"]}},"oh":"限制與接受","oi":[]},"61":{"h":"神秘、內在疑問、生命真相與對未知的追尋","i":["61號閘門位於頭頂中心，屬於個體回路，與內在真相、神秘和對難以解釋之事的思考有關。","<mark class=\"k\">這個閘門的重點不是所有問題都一定有答案，而是一個人可能會被深層的問題吸引，想知道事物背後的真實含義。</mark>"],"L":{"1":{"t":"我需要先建立理解真相的基礎","b":["<mark class=\"k\">核心：探索的基礎與內在疑問。</mark>","","第一爻重視基礎。放在61號閘門上，一個人可能需要先弄清楚問題的範圍，才知道自己究竟在追尋什麼。","","例如：","•   對生命意義產生疑問時，會想先了解不同觀點。","•   不滿足於只聽一個簡單答案。","•   希望知道一個解釋背後的依據。","•   當問題太大、太抽象時，可能感到很難找到方向。","","它不是每個問題都必須得到答案，而是需要先建立基本的理解框架，才比較能夠繼續探索。"],"q":["你有沒有一些關於生命、存在或真相的問題，會讓你一直想深入了解？","當你面對一個很深的問題時，會不會想先弄清楚它到底在問什麼？"],"s":["會問：","「這件事情真正的意義是什麼？」"]},"2":{"t":"我自然會被神秘或深層問題吸引","b":["<mark class=\"k\">核心：自然的好奇與內在追尋。</mark>","","第二爻的特質可能自然流露。放在61號閘門上，一個人可能很自然地對難以解釋的問題產生興趣。","","例如：","•   對生命為什麼存在感到好奇。","•   喜歡思考人類無法完全解釋的事情。","•   對意識、宇宙或精神層面的問題有興趣。","•   別人覺得問題太抽象，他卻自然地想繼續探索。","","它不是每個問題都能想通，而是對未知的追尋可能自然出現；重要的是允許問題存在，而不是強迫自己立即得到答案。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["有沒有一些很深的問題，你即使暫時沒有答案，還是會想繼續探索？","當你遇到無法解釋的事情時，你會不會自然地產生好奇？"],"s":["突然：","「我好像知道了。」"]},"3":{"t":"我透過不同解釋，學習面對未知","b":["<mark class=\"k\">核心：試錯、探索與理解調整。</mark>","","第三爻透過經驗學習。放在61號閘門上，一個人可能嘗試過不同理論、觀點或解釋，逐漸發現某些答案仍然無法完全滿足自己。","","例如：","•   研究不同的哲學或精神觀點。","•   曾經相信某種解釋，後來開始產生疑問。","•   發現同一個問題可以有多種解釋。","•   逐漸學習，不需要因為暫時沒有答案，就認定探索沒有意義。","","它不是永遠無法滿足，而是透過不同經驗，學習與未知共處，並更清楚自己真正想了解什麼。"],"q":["你有沒有為了理解一個問題，嘗試過不同的解釋或觀點？","當你發現沒有一個答案能夠完全解釋事情時，你會怎麼處理？"],"s":["可能：","想很多、研究很多、問很多問題。"]},"4":{"t":"我透過交流，探索更深層的理解","b":["<mark class=\"k\">核心：人際連接與思想交流。</mark>","","第四爻與人際網絡有關。放在61號閘門上，一個人可能通過與志同道合的人交流，進一步探索深層問題。","","例如：","•   喜歡和朋友討論生命或意識的問題。","•   透過閱讀與討論接觸新的觀點。","•   在特定社群中找到願意深入交流的人。","•   通過別人提出的問題，發現自己還沒有思考過的角度。","","它不是需要別人提供所有答案，而是合適的交流可能為自己的探索帶來新的角度。"],"q":["你有沒有一些問題，只有遇到願意深入討論的人時，才會特別想聊？","當別人提出與你不同的解釋時，你會不會因此對原本的問題產生新的興趣？"],"s":["一個問題可能讓別人也開始思考：","「對哦，為什麼？」"]},"5":{"t":"別人期待我能夠理解或解釋深層問題","b":["<mark class=\"k\">核心：探索角色與他人的投射。</mark>","","第五爻容易受到投射。放在61號閘門上，別人可能認為這個人很有深度，期待他解釋生命、意識或某些難以理解的事情。","","例如：","•   別人會問他人生究竟有什麼意義。","•   朋友期待他對復雜問題提出看法。","•   他可能被認為很會思考深層議題。","•   因為別人期待答案，而覺得自己必須想出一個確定的解釋。","","它不是每個深層問題都能由自己解答，而是別人可能期待他提供答案；他仍然可以承認自己也不知道。"],"q":["別人會不會常常和你討論一些比較深層、難以解釋的問題？","當別人期待你給出人生或生命意義的答案時，你會不會覺得自己必須想出一個確定的解釋？"],"s":["「你覺得人生為什麼會這樣？」","容易被期待成為「答案的人」。"]},"6":{"t":"我逐漸理解，未知本身也可以被容許","b":["<mark class=\"k\">核心：成熟的探索與對未知的接受。</mark>","","第六爻帶有觀察與成熟的意味。放在61號閘門上，一個人可能逐漸理解，追尋真相不一定意味著每個問題都要有結論。","","例如：","•   更能夠接受某些問題暫時沒有答案。","•   不再因為別人有不同觀點，就急著證明自己正確。","•   理解探索本身也能帶來新的認識。","•   能夠保留好奇心，同時接受自己的理解有限。","","它不是放棄追尋真相，而是更成熟地理解，探索的價值不只在於找到答案，也在於逐漸認識自己與未知之間的關係。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你現在會不會比較能夠接受，有些問題暫時沒有明確答案？","當你無法完全理解一件事時，你能不能允許自己繼續探索，而不急著強迫自己想通？"],"s":["真正成熟：","「不是所有神秘都需要被解釋。」","有些東西可以：","知道它存在，但允許自己不知道答案。"]}},"oh":"神秘與內在真相","oi":[]},"62":{"h":"細節、命名、事實、組織與具體表達","i":["62號閘門位於喉嚨中心，屬於集體理解回路，與細節、命名和把概念具體化有關。","<mark class=\"k\">這個閘門的重點不是只關注小事，而是能夠通過清楚的名稱、步驟和事實，讓抽象的內容更容易理解。</mark>"],"L":{"1":{"t":"我需要先把事實和細節弄清楚","b":["<mark class=\"k\">核心：表達的基礎與事實結構。</mark>","","第一爻重視基礎。放在62號閘門上，一個人可能很在意細節是否準確，才願意把事情說清楚。","","例如：","•   寫文件時會檢查日期、名稱和數字。","•   不喜歡信息不完整就下結論。","•   會先確認步驟和事實。","•   發現細節有誤時，會想先修正再繼續。","","它不是為了挑小毛病，而是需要準確的細節，才能讓整體表達站得住腳。"],"q":["當你需要解釋一件事時，會不會很在意名稱、數字或步驟是否準確？","如果發現資料中有一個細節不對，你會不會很想先把它修正？"],"s":["會在意：","•   名稱","•   數字","•   流程","•   資料","•   具體步驟"]},"2":{"t":"我自然會注意細節並整理信息","b":["<mark class=\"k\">核心：自然的細節辨識與組織能力。</mark>","","第二爻的特質可能自然流露。放在62號閘門上，一個人可能很自然地把信息整理得清楚具體。","","例如：","•   很快發現文件中遺漏的內容。","•   自然把一件復雜的事分成幾個步驟。","•   習慣使用明確的名稱和說明。","•   別人覺得他很細心，他卻覺得只是想把事情講清楚。","","它不是每個細節都必須追究，而是把信息整理清楚可能是自然的表達方式。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["你會不會很自然地把復雜的事情整理成步驟或重點？","別人有沒有說過，你很容易注意到一些他們忽略的細節？"],"s":["別人可能沒發現：","「這裡少了一個東西。」"]},"3":{"t":"我透過錯誤與修正，學習怎樣表達得更準確","b":["<mark class=\"k\">核心：試錯、細節與表達調整。</mark>","","第三爻透過經驗學習。放在62號閘門上，一個人可能經歷過信息不完整、說明不清楚或細節錯誤，才逐漸知道怎樣表達更有效。","","例如：","•   因為一個細節遺漏，造成溝通誤會。","•   發現說明太復雜，別人仍然不知道該怎麼做。","•   透過工作經驗，學習怎樣整理流程。","•   逐漸分辨哪些細節重要，哪些可以省略。","","它不是每次都要把所有細節講完，而是透過經驗學習，怎樣提供足夠準確的信息，讓別人真正理解。"],"q":["你有沒有因為漏掉一個細節，後來才發現別人誤解了你的意思？","你有沒有慢慢學會，解釋事情時不是細節越多越好，而是要讓重點更清楚？"],"s":["可能發現：","「原本以為是這個數字，實際不是。」","所以不斷修正。"]},"4":{"t":"我在團隊中幫助大家把信息整理清楚","b":["<mark class=\"k\">核心：人際連接與信息組織。</mark>","","第四爻與人際網絡有關。放在62號閘門上，一個人可能在團隊或熟悉的群體中，幫助大家把信息、流程和細節整理清楚。","","例如：","•   在會議後整理行動事項。","•   幫助團隊確認任務步驟。","•   把抽象的討論轉成清楚的工作安排。","•   在合作中提醒大家重要的細節。","","它不是必須負責所有文書工作，而是自己的細節能力可能在群體合作中發揮價值。"],"q":["在團隊合作時，你會不會自然地整理大家討論過的重點？","當一件事情變得很混亂時，你會不會很想把步驟和責任重新寫清楚？"],"s":["把複雜事情變成：","「具體應該怎麼做。」"]},"5":{"t":"別人期待我提供準確、具體的答案","b":["<mark class=\"k\">核心：細節專家的角色與他人的投射。</mark>","","第五爻容易受到投射。放在62號閘門上，別人可能認為這個人很細心，期待他給出具體說明或確認事實。","","例如：","•   同事常問他流程應該怎麼做。","•   別人希望他檢查文件或數字。","•   團隊期待他把抽象要求變成明確步驟。","•   他可能因為別人相信自己的準確性，而擔心任何遺漏。","","它不是每個細節都必須由自己檢查，而是別人可能期待他提供明確答案；他仍然需要合理分配自己的責任。"],"q":["別人會不會經常找你確認細節、流程或具體做法？","當別人認為你很細心時，你會不會覺得自己不能出錯？"],"s":["「你幫我整理一下。」"]},"6":{"t":"我逐漸理解，細節是幫助人理解整體的工具","b":["<mark class=\"k\">核心：成熟的表達與信息整合。</mark>","","第六爻帶有觀察與成熟的意味。放在62號閘門上，一個人可能逐漸理解，細節本身不是目的，而是幫助人看清整體。","","例如：","•   更懂得選擇哪些細節需要說明。","•   不再為了追求完整，而讓表達變得復雜。","•   能夠把重要信息整理得準確又容易理解。","•   理解清楚表達需要事實，也需要判斷重點。","","它不是不再重視準確性，而是更成熟地理解，細節的價值在於幫助人理解事情，而不是讓所有人被信息淹沒。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你現在會不會更懂得選擇哪些細節需要說，哪些可以省略？","當你解釋一件復雜的事時，你會不會更關注對方能不能理解整體，而不只是自己有沒有講完所有細節？"],"s":["真正成熟：","「細節是為了讓事情更清楚，而不是讓所有事情變得更複雜。」"]}},"oh":"細節與表達","oi":[]},"63":{"h":"疑問、驗證、邏輯檢驗與確認事情是否可靠","i":["63號閘門位於頭頂中心，屬於集體理解回路，與懷疑和提出問題有關。","<mark class=\"k\">這個閘門不是為了否定一切，而是對事情是否合理、是否可靠產生疑問，推動進一步驗證。</mark>"],"L":{"1":{"t":"我需要先確認，懷疑有明確的依據","b":["<mark class=\"k\">核心：懷疑的基礎與問題辨識。</mark>","","第一爻重視基礎。放在63號閘門上，一個人可能需要先知道自己究竟在懷疑什麼，才知道怎樣驗證。","","例如：","•   不滿足於模糊地覺得不對勁。","•   會想弄清楚哪個部分缺少依據。","•   對重要決定希望看到事實。","•   不喜歡只靠感覺就認定事情有問題。","","它不是凡事都要懷疑，而是希望先明確疑問，才能有方向地尋找證據。"],"q":["當你對一件事產生懷疑時，會不會想先弄清楚自己到底懷疑哪一部分？","你會不會需要看到一些事實或依據，才比較能夠放心？"],"s":["會問：","「這個是真的嗎？」"]},"2":{"t":"我自然會對事情提出疑問","b":["<mark class=\"k\">核心：自然的懷疑與邏輯檢驗。</mark>","","第二爻的特質可能自然流露。放在63號閘門上，一個人可能很自然地想知道一件事是否合理。","","例如：","•   聽到一個結論時，會想問為什麼。","•   對不完整的解釋感到疑惑。","•   很自然地檢查前後邏輯。","•   別人覺得沒有必要追問，他卻會想確認。","","它不是故意唱反調，而是提出疑問可能是自然的理解方式；重要的是讓問題幫助驗證，而不是只制造不信任。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["當別人告訴你一個結論時，你會不會自然地想知道背後的原因？","你有沒有發現，自己常常會提出別人沒有想到的問題？"],"s":["別人覺得：","「應該沒問題。」","你可能：","「可是這裡好像不對。」"]},"3":{"t":"我透過驗證與錯誤，學習怎樣處理懷疑","b":["<mark class=\"k\">核心：試錯、證據與判斷調整。</mark>","","第三爻透過經驗學習。放在63號閘門上，一個人可能經歷過過度懷疑、相信錯誤的信息，或發現自己的判斷缺少依據。","","例如：","•   曾經懷疑某個人，後來發現自己誤解了情況。","•   相信某個解釋後，發現事實並不支持。","•   透過驗證，學習怎樣判斷信息是否可靠。","•   逐漸理解，懷疑需要有方法，而不是無限重複。","","它不是懷疑就代表不信任，而是透過經驗學習，怎樣用證據檢驗問題，同時允許自己在得到新信息後改變判斷。"],"q":["你有沒有因為缺少信息，而對一件事產生懷疑，後來才發現真實情況不同？","當新證據和你原本的判斷不一樣時，你會不會願意重新檢查自己的想法？"],"s":["會：","懷疑 → 測試 → 找證據 → 調整。"]},"4":{"t":"我透過交流，讓問題得到更完整的檢驗","b":["<mark class=\"k\">核心：人際交流與共同驗證。</mark>","","第四爻與人際網絡有關。放在63號閘門上，一個人可能透過與他人討論，進一步檢驗某個問題。","","例如：","•   和朋友討論一個觀點的合理性。","•   在團隊中提出問題，幫助大家發現遺漏。","•   透過不同人的意見，確認自己的理解是否完整。","•   在熟悉的關係中，更願意直接提出疑問。","","它不是必須說服所有人接受自己的懷疑，而是交流可能幫助自己找到更多證據與不同角度。"],"q":["當你對一件事有疑問時，會不會喜歡找別人討論，看看有沒有遺漏？","你有沒有因為別人提出不同的證據，而改變原本的判斷？"],"s":["可能提前發現：","「這個地方以後可能會出問題。」"]},"5":{"t":"別人期待我找出問題與不合理之處","b":["<mark class=\"k\">核心：檢驗角色與他人的投射。</mark>","","第五爻容易受到投射。放在63號閘門上，別人可能認為這個人很會發現問題，因此期待他檢查方案、驗證信息或指出漏洞。","","例如：","•   團隊希望他檢查計劃是否合理。","•   同事請他確認資料有沒有問題。","•   別人期待他提出反對意見，幫助大家避免錯誤。","•   他可能因為別人期待檢查，而覺得自己必須找到所有漏洞。","","它不是必須找出每個問題，而是別人可能期待他承擔檢驗責任；他也需要知道，任何判斷都有信息範圍上的限制。"],"q":["別人會不會常常找你檢查事情有沒有問題？","當大家都認為一個方案沒有問題時，你會不會覺得自己應該再找一找可能的漏洞？"],"s":["「你幫我檢查一下。","」"]},"6":{"t":"我逐漸理解，懷疑的目的是幫助理解，而不是永遠停留在問題裡","b":["<mark class=\"k\">核心：成熟的懷疑與驗證的終點。</mark>","","第六爻帶有觀察與成熟的意味。放在63號閘門上，一個人可能逐漸理解，懷疑的價值在於幫助自己檢驗事情，而不是讓自己永遠無法作出決定。","","例如：","•   更懂得判斷什麼程度的證據已經足夠。","•   不再要求每件事都達到百分之百確定。","•   能夠在合理驗證後繼續前進。","•   接受有些事情仍然存在不確定性。","","它不是停止提問，而是更成熟地理解，懷疑應該幫助自己靠近可靠的理解，而不是成為無法行動的原因。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你現在會不會比較能夠接受，有些事情無法達到百分之百確定？","當你已經找到足夠的依據時，你能不能允許自己先作出決定，而不是繼續尋找更多可能的問題？"],"s":["這是很重要的：","「我懷疑，是為了讓答案更可靠。」","所以成熟不是：","「什麼都不相信。」","而是：","「我知道什麼時候值得繼續驗證，什麼時候可以放下懷疑。」"]}},"oh":"懷疑與邏輯驗證","oi":[]},"64":{"h":"記憶、圖像、過去的經驗與尚未成形的理解","i":["64號閘門位於頭頂中心，屬於集體感知回路，與混亂、記憶和理解尚未成形的狀態有關。","<mark class=\"k\">這個閘門的重點不是沒有能力理解，而是信息、畫面和過去的經驗可能先以零散的形式出現，需要時間才能整理出意義。</mark>"],"L":{"1":{"t":"我需要先整理零散的信息","b":["<mark class=\"k\">核心：理解的基礎與信息結構。</mark>","","第一爻重視基礎。放在64號閘門上，一個人可能需要先把零散的記憶和信息整理出來，才能逐漸理解它們之間的關係。","","例如：","•   回想一件事情時，腦中出現很多不同畫面。","•   一開始說不清楚自己為什麼有某種感受。","•   需要時間把經歷的細節整理起來。","•   當信息太多時，可能暫時難以形成明確結論。","","它不是沒有理解能力，而是需要先整理信息，才能讓原本混亂的素材逐漸變得清楚。"],"q":["當你回想一段復雜的經歷時，會不會先出現很多零散的畫面，卻還說不清楚它們代表什麼？","你會不會需要一段時間整理信息，才知道自己真正想表達什麼？"],"s":["面對過去、記憶、複雜經驗時，可能會問：","「這些事情到底發生了什麼？」"]},"2":{"t":"我的腦海會自然出現不同的畫面和聯想","b":["<mark class=\"k\">核心：自然的記憶與圖像聯想。</mark>","","第二爻的特質可能自然流露。放在64號閘門上，一個人可能很自然地出現過去的畫面、片段或不同聯想。","","例如：","•   某件小事突然讓自己想起很久以前的經歷。","•   看見一個場景，就聯想到另一段記憶。","•   腦海中出現很多畫面，卻暫時不知道它們有什麼關聯。","•   別人覺得他想得很復雜，他卻只是自然地接收到不同聯想。","","它不是每個畫面都代表某個明確答案，而是記憶和聯想可能自然出現；意義仍需要時間整理。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["你有沒有發現，某個小細節會突然讓你想起很久以前的事情？","當腦海出現很多不同畫面時，你會不會先讓它們存在一段時間，而不是馬上解釋？"],"s":["有時候想很久都不明白。","然後突然：","「原來是這樣。」"]},"3":{"t":"我透過反覆整理與經驗，慢慢看見其中的意義","b":["<mark class=\"k\">核心：試錯、信息整合與理解形成。</mark>","","第三爻透過經驗學習。放在64號閘門上，一個人可能需要反覆回顧、重新整理，才能看見過去經驗之間的聯系。","","例如：","•   一開始無法理解某段經歷，後來逐漸看見關聯。","•   嘗試不同解釋後，發現某些信息其實沒有關係。","•   透過新的經歷，重新理解過去的畫面。","•   學習接受，理解可能需要時間，而不是一次就能完成。","","它不是一直混亂，而是透過整理與經驗，逐漸把零散的信息轉化成更完整的理解。"],"q":["你有沒有經歷過，某件事當時很難理解，後來因為新的經驗而看見它的意義？","當你無法馬上整理清楚時，你會不會很想立刻得到答案，還是能夠給自己一些時間？"],"s":["可能：","經歷很多 → 一開始很亂 → 慢慢整理 → 突然看懂。","所以不是單純：","「我很容易想太多。」","而是：","「混亂本身可能是理解形成之前的階段。」"]},"4":{"t":"我透過與別人交流，整理自己的記憶與經驗","b":["<mark class=\"k\">核心：人際交流與理解的形成。</mark>","","第四爻與人際網絡有關。放在64號閘門上，一個人可能透過與熟悉的人交談，幫助自己把零散的經驗整理得更清楚。","","例如：","•   和朋友回顧過去時，發現新的聯系。","•   透過別人的記憶，補足自己遺漏的部分。","•   講述經歷時，慢慢知道自己真正困惑的是什麼。","•   通過交流，看見同一段經歷的不同角度。","","它不是必須靠別人替自己解釋，而是交流可能幫助自己整理素材，讓原本混亂的經驗更容易被理解。"],"q":["你有沒有發現，和別人聊起過去的事情時，自己反而會有新的理解？","當別人提供不同的記憶或角度時，你會不會因此重新看待一段經歷？"],"s":["當自己終於整理明白之後，可能能夠告訴別人：","「我以前也經歷過這個，後來我才發現……」","所以個人經驗開始變成別人的理解入口。"]},"5":{"t":"別人期待我從混亂中找出清楚的解釋","b":["<mark class=\"k\">核心：理解角色與他人的投射。</mark>","","第五爻容易受到投射。放在64號閘門上，別人可能認為這個人善於整理復雜信息，因此期待他從混亂中找到答案。","","例如：","•   團隊面對復雜資料時，希望他整理重點。","•   別人期待他解釋一段難以理解的經歷。","•   朋友希望他幫忙梳理事情的來龍去脈。","•   他可能因為別人期待答案，而覺得自己必須立即理清所有信息。","","它不是所有混亂都能立即變成清楚的解釋，而是別人可能期待他整理復雜內容；他仍然需要時間讓信息沉澱。"],"q":["別人會不會經常期待你把復雜的事情整理清楚？","當信息還很混亂時，你會不會因為別人期待答案，而給自己很大的壓力？"],"s":["別人可能說：","「你幫我想想，這件事情到底是什麼意思？」","所以很容易被投射成：","「你應該能夠把混亂整理清楚。」","但這裡需要注意：","別人的混亂，不一定需要由你來解決。"]},"6":{"t":"我逐漸理解，混亂也可能是理解形成之前的階段","b":["<mark class=\"k\">核心：成熟的觀察與信息整合。</mark>","","第六爻帶有觀察與成熟的意味。放在64號閘門上，一個人可能逐漸理解，暫時的混亂不代表沒有意義，也不代表自己必須馬上得到結論。","","例如：","•   更能夠接受一開始說不清楚自己的感受。","•   願意讓記憶與經驗慢慢沉澱。","•   不再強迫自己立即整理出完整故事。","•   隨著時間和新的經驗，逐漸形成更清楚的理解。","","它不是放任混亂，而是更成熟地理解，理解有時需要一個形成過程；先允許素材存在，再慢慢整理，反而可能看見更完整的意義。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你現在會不會比較能接受，某些事情一開始不需要馬上想明白？","當你發現自己暫時無法整理清楚時，你能不能允許自己繼續生活，讓理解隨著時間慢慢形成？"],"s":["這是 64.6 很重要的成熟。","以前可能很想：","「我一定要弄明白。」","後來慢慢知道：","「現在看不懂，不代表永遠看不懂。」","有些事情需要時間。","有些經歷過了一段時間，回頭看才會突然明白：","「原來那時候發生的事情，是為了讓我走到這裡。」","所以 64.6 最後不是：","「我終於把所有事情都想明白。」","而是：","「我可以允許自己暫時處在不知道裡。」"]}},"oh":"混亂與理解","oi":[]}};

const CENX={"head":{"topic":"靈感、問題、思考壓力","def":{"title":"穩定地接收靈感與思考壓力","zhen":"知道什麼值得思考，善用頭腦但不被他綁架","fei":"陷入無意的自言自語，跟自己無關的問題","qs":"過度焦慮，幻視","qx":"無法接納自我的神性","detail":["你的思考模式其實是比較穩定的。","你可能會發現，自己有一些固定的思考方式，也比較清楚什麼東西會引起你的思考。","其實你知道什麼問題值得想、什麼事情不需要一直糾結。","<mark class=\"k\">提醒你：不要因為頭腦一直有想法，就覺得每一個想法都一定要處理。頭腦只是負責產生思考，並不是要你馬上找到答案。</mark>"],"remind":[],"q":["你是不是經常突然有很多想法，腦袋會自己開始運轉？","當你遇到一個問題時，你會不會很自然地想把它想明白？","你是不是很容易從一個問題延伸出另外十個問題？","別人覺得你想太多的時候，你自己反而覺得‘我只是想搞清楚而已’？","你有沒有一種感覺：腦袋一直在工作，很難真正關機？","你通常會不會因為一個問題沒有答案，而一直想下去？","你覺得自己的靈感是比較穩定、持續出現的嗎？"],"lab":"深入一點可以問","key":"你有沒有發現，你不一定需要解決所有問題，但你的頭腦就是會不斷產生問題？","extra":[],"one":"你的頭腦有自己穩定的思考節奏，知道什麼值得想。","pr":"頭腦只負責產生想法，不是每個想法都要處理、都要馬上有答案。","say":"你的思考很穩定，但不必每個想法都處理。頭腦只是負責產生思考，不是要你馬上找到答案。","qp":[0,2,4]},"und":{"title":"容易受到別人的問題和思考影響","zhen":"保持放鬆，不被必須找到答案的壓力追著跑，好點子自然來。","fei":"總想回答所有人的問題，庸人自擾，越焦慮越停不下來。","qs":"","qx":"","detail":["你的頭腦比較有彈性，容易接收到外界的問題和思考壓力，但也因此可以有很多不同的靈感與觀點。","比較容易出現一個狀況：別人有問題，你會覺得自己是不是應該幫他想答案。","不太健康的狀態時，你可能會很容易掉進一個循環：「我一定要知道答案。」→「我一定要想清楚。」→「可是為什麼我還是想不出來？」→「那我再想一下。」然後越想越焦慮，越焦慮又越想停下來。","<mark class=\"k\">這時候其實不是你不夠聰明，而是你可能已經把「別人的問題、外界的壓力」變成了自己的責任。</mark>"],"remind":[],"q":["你有沒有發現，跟一個很會思考的人待在一起之後，你也突然開始想很多？","別人提出一個問題之後，你會不會覺得自己一定要找到答案？","你有沒有為了一個其實不屬於你的問題，煩惱很久？","你會不會覺得‘我一定要想通’？","當身邊的人焦慮、一直思考時，你會不會也跟著進入那個狀態？","你有沒有發現，有時候事情本來很簡單，是聽了別人的想法以後才變復雜？","你是不是很容易覺得自己‘應該知道答案’？"],"lab":"覺察問題","key":"你現在腦袋裡一直想的事情，有多少是真的你的問題？","extra":[],"one":"你的頭腦像開放的接收器，很容易接住別人的問題和壓力。","pr":"別人有問題，不等於你要負責想出答案。","say":"不是你不夠聰明，而是你把別人的問題、外界的壓力，變成了自己的責任。","qp":[0,1,2]}},"ajna":{"topic":"思考方式、觀點、分析、確定性","def":{"title":"思考方式相對固定","zhen":"思路清晰，願意重新審視自己的認知，能辨認哪些觀點真正有價值。有自己的觀點，但不要把觀點變成框架","fei":"死守觀點不容挑戰，或者反過來根本沒有任何自己的判斷。","qs":"思緒多，偏頭痛","qx":"易怒，神經問題，失去管控","detail":["你會有一套相對穩定的思考方式和判斷邏輯。","面對事情的時候，你比較容易形成自己的觀點，也會用自己的方式去理解「這件事到底合不合理」。","思路其實是比較清晰的。你不是盲目地接受別人說的話，而是會經過自己的思考和判斷，去分辨哪些觀點真正有價值，哪些東西其實不一定適合自己相信。","<mark class=\"k\">健康的狀態，反而是有自己的判斷，但也願意重新審視自己的認知。如果發現新的資訊或經驗讓你看見不同的可能性，你能夠調整，而不是一定要證明自己原本是對的</mark>","注意的非我狀態是，有時候可能會太堅持自己的想法，覺得「我就是這樣認為」，不太願意讓別人挑戰自己的觀點。相反的另一個極端，則是因為太在意外界的聲音，最後反而失去了自己的判斷。"],"remind":["有定義：重點是「有自己的穩定判斷，但不要固執」"],"q":["你是不是有自己一套很明確的思考方式？","別人改變你的觀點容易嗎？","你是不是很喜歡把事情分析清楚？","你會不會比較相信自己已經形成的判斷？","別人提出一個跟你完全不同的觀點時，你第一反應是什麼？","你有沒有發現自己一旦想通某件事情，就很難再改變？","你是不是喜歡把事情歸納、分類、整理？"],"lab":"深入問","key":"你堅持自己的觀點，是因為你真的確定，還是因為你不喜歡‘不確定’？","extra":[],"one":"你有一套穩定的判斷方式，想通的事不容易動搖。","pr":"有自己的觀點很好，但留一點空間給新的資訊。","say":"你不是盲目相信別人，會自己思考判斷；健康的狀態是有主見，也願意重新審視。","qp":[1,4,5]},"und":{"title":"容易吸收別人的觀點","zhen":"思維靈活，包容多元視角，想不通就不硬想。","fei":"不停收集知識來假裝自己很確定，或者隨波逐流沒有立場。","qs":"","qx":"","detail":["你的思維方式比較開放，也比較容易從不同角度去理解一件事情。","你可以聽見不同人的想法，然後發現：「原來這件事情還可以從另一個角度來看。」這種思維上的彈性","<mark class=\"k\">不需要為了證明自己聰明、證明自己懂，而逼自己一定要有一個答案。</mark>","非我狀態，可能會出現在你開始害怕自己「不知道」。於是你不停地收集知識、看資料、聽別人怎麼說，希望讓自己變得很確定，甚至用很多知識來掩飾內心的不確定","另一個極端就是，因為吸收了太多不同人的觀點，最後變成別人說什麼都覺得有道理，自己卻越來越不知道到底相信什麼。"],"remind":["無定義：重點是「保持開放和彈性，但不要因為不確定而失去自己」"],"q":["你會不會發現，跟不同的人聊天，你的想法會跟著改變？","你有沒有試過跟A聊完覺得A是對的，跟B聊完又覺得B也很有道理？","別人很有自信地表達觀點時，你會不會容易被影響？","你會不會為了證明自己是對的，而花很多時間解釋？","你有沒有覺得自己一定要有一個明確答案？","你會不會害怕別人覺得你‘不知道’？","你是不是很容易吸收不同人的看法？"],"lab":"很適合現場點醒的一句","key":"你不一定沒有答案，你可能只是沒有必要一定擁有一個固定答案。","extra":[],"one":"你的思維很有彈性，能從很多角度看同一件事。","pr":"你不一定沒有答案，只是不必一定擁有一個固定答案。","say":"你不需要為了證明自己聰明，而逼自己一定要有答案，「不知道」也是可以的。","qp":[0,2,5]}},"throat":{"topic":"表達、溝通、行動、被看見","def":{"title":"表達與行動方式較穩定","zhen":"知道什麼時候開口、什麼時候安靜，恰當時機用恰當方式表達。","fei":"不停地說話、不停地做，生怕別人不知道自己在。","qs":"過多煩惱，憂慮，甲狀腺問題","qx":"失去創造力，暴食/厭食（抗拒情緒）","detail":["自己有一些習慣性的表達方式，也有自己讓別人認識你的方式。","<mark class=\"k\">知道：什麼時候適合說話，什麼時候適合安靜。 你不需要一直搶著表達自己</mark>","你的表達有屬於自己的節奏和方式。當時機對了，你自然會知道怎麼表達，也更容易讓別人聽懂你真正想傳達的東西。","非我狀態時，可能會出現一種「我是不是要做點什麼，讓別人注意到我？」的壓力。於是你可能不停地說、不停地做、不停地表現自己，擔心如果自己安靜下來，別人就不會注意到你的存在。"],"remind":["喉嚨有定義：「學習不需要一直表達，也能在對的時機自然開口。」"],"q":["你是不是很自然就會表達自己的想法？","你通常是先說出來，還是先想好才說？","你有沒有發現自己一開口，別人就會注意你？","你是不是不太喜歡一直憋著不說？","當你有想法的時候，會不會很自然地想講出來？","別人有沒有說過你很會講話、很會表達？","你會不會覺得‘讓我說出來就好了’？"],"lab":"深入問","key":"你表達自己，是因為真的有東西想表達，還是因為你需要別人注意到你？","extra":[],"one":"你有自己的表達節奏，知道什麼時候開口、什麼時候安靜。","pr":"不需要一直表達，也能在對的時機自然開口。","say":"你不需要搶著讓別人注意到你，時機對了，你自然知道怎麼說。","qp":[0,2,5]},"und":{"title":"容易被別人的表達方式影響","zhen":"被邀請時才表達，反而能量加倍，更會傾聽。","fei":"喋喋不休吸引注意力，或者相反——憋著不敢說。","qs":"","qx":"","detail":["你的表達方式並不是固定的。你可能會發現，在不同的人、不同的環境裡面，你表達自己的方式會有所不同。有時候特別能說，有時候卻比較安靜，這其實都是很正常的。","<mark class=\"k\">好的狀態時，你不需要主動搶著讓所有人聽見你的聲音。很多時候，當有人真正邀請你、詢問你的想法，或者給你一個適合表達的空間時，你反而會發現：自己說出來的話更有力量，也更容易被聽見。</mark>","你願意先聽、先觀察，你反而更容易知道這個時候適合怎樣回應。","非我狀態時，你可能會走向兩個極端。","一個極端是：為了吸引別人的注意，不停地說話。 你好像害怕自己不表達，就不會被看見，所以不斷找機會說話、表現自己。","另一個極端則剛好相反：你可能因為擔心自己說錯、害怕別人不認同，而把很多話都憋在心裡，明明有想表達的東西，卻不敢真正說出來。"],"remind":["喉嚨無定義：「學習不需要為了被看見而開口，也不需要因為害怕而閉嘴。」"],"q":["你有沒有發現，跟不同的人在一起，你講話的方式會完全不一樣？","你會不會為了讓別人注意你，而故意說一些話？","你有沒有試過明明沒什麼要說，卻覺得自己一定要講點什麼？","你會不會害怕自己沒有存在感？","當別人講話很強勢時，你會不會不自覺跟著他的節奏？","你是不是有時候覺得‘為什麼別人這麼會表達，我卻不知道該說什麼’？","你會不會因為想被看見，而做一些平常不會做的事情？"],"lab":"覺察問題","key":"你是真的有話想說，還是只是覺得‘現在應該說點什麼’？","extra":[],"one":"你的表達會隨人與場合改變，被邀請時說的話最有力量。","pr":"不必為了被看見而開口，也不必因為害怕而閉嘴。","say":"不用主動搶著說，當有人真正邀請你，你說出來的話反而更有力量。","qp":[0,1,2]}},"g":{"topic":"愛、身份、方向、人生方向","def":{"title":"身份感與方向感相對穩定","zhen":"清楚”我是誰、要去哪”，方向感穩，不靠外界確認自己。","fei":"過於固化身份，拒絕任何變化。","qs":"濫情，好好人，被占便宜","qx":"被排擠，口吃緊張，失去祥和","detail":["能清楚說出自己的人生目標是什麼，但在很多時候，你的內在會有一種屬於自己的方向感。","你比較容易知道什麼適合自己、什麼不像自己，也不需要一直透過別人的認同來確認自己的價值。","<mark class=\"k\">越來越清楚：我就是我，我不需要變成別人期待的樣子。 你也會慢慢走向適合自己的方向，即使別人不一定理解</mark>","一種內在的指南針——當你走在適合自己的路上，你會感覺自己是對的；當你偏離了自己，你也會慢慢感覺到不對勁。","非我狀態時，你可能會過度執著於自己過去定義的身份。例如：「我一直都是這樣的人，所以我不能改變」、「別人認識的我就是這樣，所以我不能變」。"],"remind":["G中心有定義：「你的方向感來自內在，但不要把自己固定在過去的身份裡。」"],"q":["你對‘我是誰’這件事情，有沒有一個比較明確的感覺？","你是不是比較知道自己喜歡什麼、不喜歡什麼？","你在人生選擇上，會不會比較知道自己要往哪裡走？","你有沒有一種‘這就是我’的感覺？","當別人不認同你的時候，你會不會依然知道自己是誰？","你是不是比較容易找到適合自己的環境？","你有沒有發現，當你走在適合自己的方向時，會特別有感覺？"],"lab":"深入問","key":"如果沒有任何人告訴你應該成為什麼樣的人，你覺得你自己是誰？","extra":[],"one":"你的內在有一支指南針，知道什麼適合自己、什麼不像自己。","pr":"方向感來自內在，但不要把自己固定在過去的身份裡。","say":"走在適合自己的路上你會覺得對；偏離了，你也會慢慢感到不對勁。","qp":[0,2,4]},"und":{"title":"容易受到環境與他人影響","zhen":"不執著於”我是誰”，知道每個人的定位，在對的人身邊找到方向。","fei":"不停尋找愛與方向，靠別人找方向，為了迎合誰不斷變形。-","qs":"","qx":"","detail":["人生可能不會一直圍繞著一個固定的問題——「我到底是誰？」、「我應該往哪裡去？」。","發現自己在不同的人身邊、不同的環境裡面，會呈現出不同的狀態。和這個人在一起時，你覺得自己是這樣的；換一個環境，又可能發現自己有完全不同的一面。","並不代表你沒有自己，而是你不一定需要把自己固定成某一種身份。你的優勢反而是，你能夠看見不同的人有不同的定位，也比較容易感受到：誰適合什麼位置、什麼環境適合自己。","<mark class=\"k\">環境和身邊的人非常重要。 當你在適合的人、適合的地方，你可能會自然發現方向感慢慢浮現，而不是需要拼命追著方向跑。</mark>","你的非我狀態，可能就是不停地尋找：「我要找誰來愛我？我要去哪裡？我的人生方向到底是什麼？」你可能希望透過某一個人、某一段關係，來告訴你自己應該是誰、應該往哪裡走。","為了不失去一個人，你可能不斷改變自己、迎合對方，希望成為對方喜歡的樣子。久而久之，你甚至可能開始懷疑：到底哪一個才是真正的我？","學習把自己放在對的環境、對的人身邊。當環境對了，你不需要拼命找方向，方向反而會慢慢出現。","你不需要急著定義自己是誰。去到對的地方、和對的人在一起，你自然會知道自己要往哪裡走。"],"remind":["G中心無定義：「你的方向感很受環境和人影響，不必拼命定義自己，先去對的地方、靠近對的人。」"],"q":["你有沒有發現，跟不同的人在一起，你好像會變成不同的自己？","你會不會到了不同環境，就感覺自己完全不一樣？","你有沒有很在意‘我到底是誰’？","你會不會通過別人對你的評價來確認自己？","你有沒有試過換一個朋友圈之後，連興趣和生活方式都改變？","你是不是很容易問自己：‘我到底適合什麼？’","你會不會覺得自己一直在尋找一個‘真正的自己’？"],"lab":"非常適合現場問","key":"你有沒有可能不是沒有方向，而是你需要先找到對的環境，方向才會自然出現？","extra":[],"one":"你的方向感會隨環境和身邊的人浮現，不必拼命定義自己。","pr":"先去對的地方、靠近對的人，方向自然會出現。","say":"你不是沒有自己，而是不需要把自己固定成某一種身份。環境對了，方向會慢慢出現。","qp":[0,2,3]}},"heart":{"topic":"意志力、價值、承諾、證明自己","def":{"title":"意志力相對穩定","zhen":"承諾必達，但懂得量力而為，用在刀刃上。","fei":"過度使用意志力證明自己，承諾超出能力範圍。","qs":"自私，憤怒，自戀，排他","qx":"害怕失控，失去自信，自我懷疑","detail":["你會發現自己一旦真正答應了一件事情，通常會希望把它做到、完成它。你是有能力對自己說：「既然我答應了，那我就會負責。」所以你的承諾感其實是比較強的。","有意志力，不代表所有事情都要靠意志力完成。","<mark class=\"k\">健康的狀態，是知道自己的能力和界限在哪裡。該承諾的時候認真承諾，不適合自己的事情，也能夠坦白說「這件事我做不到」</mark>","非我狀態時，很容易為了證明自己：「我可以」、「我一定做得到」、「我不能輸給別人」，於是不斷給自己壓力，答應一些超過自己能力或精力範圍的事情。最後可能變成：明明已經很累了，卻因為不想失信、不想認輸，只能硬撐。","學會把意志力用在真正值得的地方。"],"remind":["意志力有定義：「我有能力承諾，但我要學會量力而為，不需要什麼都證明。」"],"q":["你是不是答應別人之後，會很想做到？","你對自己有沒有比較強的要求？","你是不是比較有競爭心？","別人越不相信你，你反而越想證明給他看？","你會不會覺得‘我說到就一定要做到’？","你對自己的價值有沒有比較明確的判斷？","你有沒有發現自己為了目標可以撐很久？"],"lab":"深入問","key":"你是在完成自己的目標，還是在證明自己的價值？","extra":[],"one":"你答應了的事，就會想做到，承諾感很強。","pr":"把意志力用在真正值得的地方，不適合的事可以坦白說做不到。","say":"有意志力，不代表所有事都要靠意志力完成；知道自己的界限在哪，才是健康的狀態。","qp":[0,3,4]},"und":{"title":"容易進入「我要證明自己」的狀態","zhen":"真心欣賞每個人的價值，不靠證明自己來獲取認可。","fei":"上癮般想證明自己值得，或者完全不承諾任何事。","qs":"","qx":"","detail":["你不需要靠不斷證明自己，來證明自己的價值。","真我的狀態時，你會開始發現：每個人都有自己的價值，而你的價值也不需要透過成績、能力、金錢或者別人對你的認可來證明。你可以欣賞一個人很有能力，也可以欣賞另一個人很溫柔、很有創造力，而不需要比較：「那我呢？我是不是也必須證明我很厲害？」","非我狀態，你可能會特別想證明自己是有價值的。例如別人說「你做不到」，你就特別想證明給他看；別人表現得很好，你馬上產生競爭心；甚至明明自己已經很累了，還是會說：「沒關係，我可以。」","還有一個極端，就是因為害怕自己承諾了卻做不到，所以干脆什麼都不承諾。","<mark class=\"k\">所以你的重點不是「我要變得更有意志力」，而是學習分辨：這個承諾，是我真心想做，還是我只是想證明自己值得？</mark>"],"remind":["意志力無定義：「我不需要證明自己有價值，承諾之前先問自己：我是想做，還是想證明我可以？」"],"q":["你會不會很在意別人怎麼看你的能力？","有沒有時候明明不想做，卻因為想證明自己而答應？","你會不會很怕別人覺得你不夠好？","別人挑戰你的能力時，你是不是特別容易想證明自己？","你有沒有為了贏，而付出超過必要的代價？","你會不會答應太多事情，然後最後自己壓力很大？","你有沒有發現自己常常在證明：‘我是可以的’？"],"lab":"但你也有隱藏的超能力","key":"如果你不需要證明自己，你還會做這件事嗎？","extra":["你能看見每個人身上別人看不到的價值。正因為你自己不被”誰行誰不行”的固定框架綁死，你反而能發現那些被低估的人。很多厲害的獵頭、投資人和導師，意志力中心都是全空的。"],"one":"你不需要靠證明自己，來證明自己的價值。","pr":"承諾之前先問：我是真心想做，還是只想證明我可以？","say":"你能看見每個人身上被低估的價值；你自己的價值，也不需要靠成績或別人的認可來證明。","qp":[1,2,5]}},"spleen":{"topic":"直覺、本能、安全、健康、恐懼","def":{"title":"直覺與身體本能較穩定","zhen":"第一感覺準，信任直覺，在當下快速判斷安全與否。","fei":"忽略直覺信號，過度理性覆蓋本能。","qs":"過動，失眠，暴力，高血壓","qx":"憂郁，自殺，無工作，拖延","detail":["比較穩定的本能感知力","學習去信任這種當下的第一感覺。它不是叫你什麼事情都憑感覺做決定，而是讓你能夠注意到身體正在給你的訊號，特別是在判斷「現在安全嗎？這個人適不適合靠近？這件事情有沒有危險？」的時候","非我狀態可能是：明明身體已經給你訊號了，你卻開始用頭腦說服自己。","「應該沒事吧。」","「是不是我想太多？」","「大家都覺得他很好，應該是我誤會了。」","比喻：有定義的直覺中心像是身體裡有一個比較穩定的「雷達」——它常常很快告訴你：「這個可以靠近，那個要小心。」","你的直覺中心有定義，簡單來說，就是你的身體有時候會比你的腦袋更早知道「要不要」。","比如：","你第一次見一個人，對方其實什麼都還沒做，但你心裡突然有一個很輕的感覺：","「嗯……這個人我不太想靠近。」","可是對方明明看起來很友善，你的朋友也覺得他很好，於是你開始說服自己：","「應該是我想太多吧。」","「他看起來人很好啊。」","「可能只是我第一印象不好。」","結果後來你才發現，原來你的第一感覺早就注意到一些東西了。","又比如：","你準備去一個地方，明明沒有任何具體原因，但突然覺得：","「今天不要去了。」","或者你走進一家店，突然覺得：","「我不想進去。」","這種感覺可能只有幾秒鐘，而且你甚至說不出為什麼。","這就是我們說的「直覺」。","它不是讓你預測未來，也不是說你每一次的第一感覺都百分之百正確，而是你的身體有時候會在你的頭腦開始分析之前，先給你一個很快速的訊號。","<mark class=\"k\">所以你的真我狀態，是學習去聽這個訊號。</mark>","當然，聽直覺不代表什麼事情都不分析。比如買房、簽合約、投資，你還是需要看資料、算數字。","但如果是關於「這個人讓我舒不舒服」、「這個地方安全嗎」、「我要不要靠近」、「這件事情感覺對不對」，你可以先聽聽身體最開始給你的感覺。","你的非我狀態反而是：","身體已經在說「不要」，你的腦袋卻開始幫對方找理由。","「他應該不是故意的。」","「可能只是我太敏感。」","「大家都說沒問題，那應該是我錯了。」","然後你越想越多，最後完全忘記自己一開始的感覺。","所以你可以練習一個很簡單的問題：","「如果我現在不解釋、不分析，只問我的身體第一秒是什麼感覺？」","那個答案，值得你聽一聽。","「直覺不是大聲告訴你答案的人，它更像是一個很輕的『嗯』或『不要』。你越吵，它越聽不見。」"],"remind":["直覺中心有定義：「相信身體當下給你的第一訊號，不要讓過度分析蓋過本能。」"],"q":["你有沒有突然有一種‘不要去’的感覺？","你做決定時，會不會有一種身體很快就知道答案？","你有沒有過一種說不出理由，但就是覺得不對勁的經驗？","你是不是很會察覺環境裡細微的變化？","你有沒有發現自己很快就知道一個人可不可靠？","你會不會比較相信第一直覺？","當身體告訴你不要繼續時，你通常會聽嗎？"],"lab":"深入問","key":"你有沒有試過明明腦袋說‘沒問題’，身體卻已經告訴你‘不對’？","extra":[],"one":"你的身體，常常比腦袋更早知道「要不要」。","pr":"先不解釋、不分析，問身體：第一秒是什麼感覺？","say":"你的直覺是穩定運作的，它不大聲，只是一個很輕的「嗯」或「不要」。你越吵，它越聽不見。","qp":[0,2,6],"zh2":"相信第一秒的身體訊號，用在「安不安全、要不要靠近」上，其他事再用腦袋分析。","fe2":"身體已經說「不要」，腦袋卻開始替對方找理由：「應該沒事吧」「是我想太多」。"},"und":{"title":"容易放大別人的恐懼與直覺","zhen":"學習與恐懼、安全感相關的智慧，區分當下靈感和過去恐懼。","fei":"緊抓著對自己不好的人事物不放，要麼忽略身體信號要麼過度擔心健康。","qs":"","qx":"","detail":["你對「安全、危險、恐懼、身體狀態」這些主題，可能會有比較開放、敏感的體驗。","你可能會從不同的人、不同的環境裡面，感受到各種關於安全感和恐懼的東西。","真我的狀態時，你會越來越懂得觀察這些感覺，而不是馬上被它們控制。你可以從自己的經歷和別人的經驗中，慢慢累積出一種對安全、健康、風險和恐懼的智慧。","留意一個傾向：因為害怕失去安全感，而緊緊抓住已經不適合自己的人、關係、工作或環境。有時候你知道某個東西已經對自己不好，但因為「至少它是熟悉的」，所以反而不願意放手。另外，也可能出現兩個極端：一個是完全忽略身體給你的訊號，另一個則是太擔心自己的身體，一點變化就開始焦慮。","比喻：無定義的直覺中心比較像是一台很敏感的「接收器」——你會感受到不同人的恐懼、安全感和身體訊號，所以你的智慧來自於學習分辨：什麼是現在，什麼是過去。","你的直覺中心無定義，所以你不一定有一個一直穩定運作的「直覺雷達」。","你可能會發現，有時候跟某個人在一起，你突然覺得：","「這裡不安全。」","但換一個人，你又覺得非常安心。","或者你本來身體沒有什麼感覺，但身邊的人一直說：","「最近流感很多，要小心。」","「這個東西會不會有問題？」","「你這樣是不是身體出毛病了？」","聽多了以後，你也開始擔心。","所以你的重點不是要訓練自己變成一個「超級直覺型的人」，而是學習分辨：","<mark class=\"k\">「這個感覺到底是我的，還是我從別人那裡接收到的？」</mark>","舉個很簡單的例子。","你本來準備繼續一段關係，其實沒有特別覺得哪裡不對。","但你的朋友一直告訴你：","「我覺得這個人不適合你。」","「你以後一定會受傷。」","「你最好離他遠一點。」","聽久了以後，你開始害怕，甚至開始覺得這段關係是不是很危險。","這時候，你可以問自己：","「如果沒有聽到別人這些話，我原本的感覺是什麼？」","這就是你需要慢慢培養的分辨能力。","另外，你也可能因為害怕失去安全感，而抓著一些已經不適合自己的東西不放。","比如：","「雖然這份工作讓我很累，但至少穩定。」","「雖然這個人一直讓我不舒服，但我們認識這麼久了。」","「雖然這裡已經不適合我，但離開好像更危險。」","有時候，我們抓住的不是「適合」，而是「熟悉帶來的安全感」。","所以你的功課不是讓自己完全沒有恐懼，而是學習觀察：","「我是真的覺得這裡不安全，還是因為過去發生過類似的事情，所以我害怕？」","當你能夠慢慢分辨這一點，你會越來越有自己的智慧。","「你不需要相信所有的害怕，也不需要忽略所有的感覺。你真正要學習的是：分辨這個感覺到底是誰的，以及它是不是屬於現在。」"],"remind":["直覺中心無定義：「學習分辨真正的當下訊號與過去的恐懼，不要為了安全感抓住已經不適合的人事物。」"],"q":["你會不會很容易感受到別人害怕什麼？","別人擔心某件事情之後，你是不是也開始擔心？","你會不會因為害怕失去，而抓住一個其實已經不適合的人或東西？","你是不是很難放下熟悉的人、環境或習慣？","你有沒有明知道不適合，卻因為‘至少它是熟悉的’而留下？","別人說某個地方危險，你會不會馬上也開始緊張？","你會不會為了安全感，留在一個已經不舒服的環境？"],"lab":"很有力量的一句","key":"你現在抓住的，是因為它真的適合你，還是因為它只是你熟悉的？","extra":[],"one":"你像一台很敏感的接收器，容易把別人的恐懼，當成自己的。","pr":"問自己：「這個感覺是我的，還是我從別人那裡接收到的？」","say":"你抓住的，有時不是「適合」，而是「熟悉帶來的安全感」。","qp":[1,2,4],"zh2":"觀察這些感覺而不被牽著走，慢慢累積對安全、健康與風險的智慧。","fe2":"怕失去安全感，抓著已經不適合的人、關係或工作，因為「至少它是熟悉的」。"}},"solar":{"topic":"情緒、感受、關係、情緒波","def":{"title":"擁有自己的情緒波","zhen":"情緒有起伏但能等待情緒澄明再做決定。","fei":"被情緒巨浪捲走，在高低點倉促做決定。","qs":"自私，憤怒，自戀，排他","qx":"害怕失控，失去自信，自我懷疑","detail":["情緒可能會有明顯的高低起伏，有時候很開心、很有感覺，有時候又可能突然想安靜下來。","要學習的，是不要在情緒最高點或最低點的時候，急著做重要決定。","所以對你來說，時間是很重要的。當你面對重要選擇時，可以給自己一點時間，讓情緒走完它的過程。當情緒慢慢沉澱下來，你會比較容易看見自己真正想要的是什麼。","<mark class=\"k\">你的真我狀態不是「永遠保持開心」，而是允許自己經歷情緒，同時不讓當下的情緒替自己做決定。</mark>"],"remind":["情緒中心有定義：「情緒會有浪潮，所以重要決定不要急，等情緒澄明以後再決定。」"],"q":["你的情緒會不會有明顯的高低起伏？","你是不是需要一點時間，情緒過後才知道自己真正的想法？","你有沒有發現自己開心的時候特別開心，低落的時候也特別明顯？","情緒來的時候，你會不會很難馬上做決定？","別人會不會覺得你有時候很難預測？","你有沒有試過情緒上來的時候答應一些事情，後來又後悔？","你是不是需要獨處，讓自己的情緒慢慢沉澱？"],"lab":"非常重要的一問","key":"你在情緒最高點或最低點的時候，會做重大決定嗎？","extra":[],"one":"你的情緒有起伏的浪潮，時間會帶來清晰。","pr":"重要決定不急著做，等情緒沉澱後再決定。","say":"你不用一直保持開心；允許自己經歷情緒，只是別讓當下的情緒替你做決定。","qp":[0,1,5]},"und":{"title":"容易放大、吸收別人的情緒","zhen":"平和本體，不捲入別人的情緒漩渦，體驗各種情緒但不需要為他人情緒負責。","fei":"吸收他人情緒當成自己的，逃避衝突不願面對真相，只想取悅大家。","qs":"","qx":"","detail":["對情緒的感受可能會特別開放，也很容易感受到身邊人的情緒。","有時候自己本來心情很好，但和一個正在生氣的人待在一起之後，突然也變得煩躁；或者身邊的人很焦慮，你也會開始跟著緊張。","這時候很重要的一件事情是問自己：","「這個情緒，真的是我的，還是我正在感受別人的情緒？」","因為你的情緒中心開放，你可以體驗到各種不同的情緒，但這不代表你需要把這些情緒變成自己的，更不代表你需要負責幫所有人把情緒處理好。","真我的狀態時，你會越來越能夠保持一種內在的平和。別人開心，你可以陪他開心；別人難過，你可以理解他的難過。你也可以知道：「這是他的情緒，我可以理解，但我不需要被它帶走。」","非我狀態很容易出現在關係裡面——為了讓大家都開心，你不想衝突、不敢說真話，甚至會不斷遷就別人。有時候你可能會覺得：「只要我不要說出來，大家就不會不開心。」","但問題是，當你一直逃避衝突、一直壓抑自己，只為了維持表面的和平，最後反而可能越來越不知道自己真正想要什麼。","<mark class=\"k\">所以你的課題不是讓所有人都開心，而是允許別人擁有他們的情緒，同時也允許自己不為他們的情緒負責。</mark>","「你可以理解別人的情緒，但不需要替別人承擔；你可以追求和平，但真正的和平不是所有人都沒有情緒，而是你不需要為了別人的情緒失去自己。」"],"remind":["情緒中心無定義：「你可以感受別人的情緒，但不需要把它變成自己的，也不需要負責讓所有人開心。」"],"q":["你有沒有發現跟一個很生氣的人待在一起，你也會開始煩躁？","別人不開心的時候，你會不會比他還難受？","你是不是很怕衝突？","為了不讓別人不開心，你會不會選擇委屈自己？","你有沒有發現一個人離開以後，你的情緒反而恢復正常？","你會不會很容易感受到別人沒說出口的情緒？","你是不是經常想‘大家開心就好’？"],"lab":"核心問題","key":"這個情緒是你的，還是你只是感受到別人的情緒？","extra":[],"one":"你像一面敏感的鏡子，很容易感受到身邊人的情緒。","pr":"問自己：這個情緒是我的，還是我感受到別人的？","say":"你可以理解別人的情緒，但不需要替別人承擔，也不需要負責讓所有人開心。","qp":[0,1,3]}},"sacral":{"topic":"生命力、工作能量、持續力、回應","def":{"title":"持續穩定的生命力","zhen":"知道什麼時候停，把握好度，還能指引別人有效用能量。","fei":"停不下來，對什麼都想回應，過度活躍。","qs":"性欲過剩，反應過度","qx":"智力問題，性冷感，無力","detail":["<mark class=\"k\">你可以投入一件事情，也能夠持續地做下去；但更重要的是，你知道什麼時候應該停下來。</mark>","你本身有比較穩定的生命力，有時候身邊的人也會受到你的能量帶動。你可能會發現，當別人不知道該怎麼做的時候，你反而很容易帶著他們一起行動，讓事情變得更有效率。","非我狀態的時候，你可能會出現一種「停不下來」的感覺。這個也做一點、那個也做一點，別人有事情找你，你也想回應；明明已經累了，卻還是覺得：「再做一下應該沒關係。」久而久之，就容易變成過度活躍、過度投入，甚至把「我還有能量」誤認為「我應該繼續做」。"],"remind":["薦骨有定義：「我有穩定的能量，但我要學會知道什麼時候夠了，而不是一直把自己用到盡。」"],"q":["你是不是一旦對一件事情有感覺，就可以做很久？","你有沒有發現自己喜歡做的事情，越做越有精神？","相反，做不喜歡的事情時，會不會特別容易累？","你是不是很需要身體有事情做？","你會不會工作起來很容易進入狀態？","你有沒有試過別人覺得你太拼，但你自己覺得還好？","當身體真的想做一件事時，你是不是很難阻止自己？"],"lab":"核心問題","key":"什麼事情會讓你的身體說：‘Yes，我想做！’？","extra":[],"one":"你有穩定的生命力，也要學會知道什麼時候夠了。","pr":"「我還有能量」不等於「我應該繼續做」。","say":"你的能量能帶動身邊的人，但要留意：不要把有能量，誤認為應該一直做。","qp":[0,2,5]},"und":{"title":"容易借用別人的生命力","zhen":"精力有限但懂得選擇熱愛的事，會借力、會休息。","fei":"不懂夠了就是夠了，不知節制，過度工作直到累垮。","qs":"","qx":"","detail":["可能覺得自己特別有精神，做很多事情都沒問題；但有時候，你的身體其實是在告訴你：「今天夠了，我需要休息。」","你不需要什麼都做，也不需要把每一件事情都做到極致。當你把有限的能量放在真正喜歡、真正有意義的事情上，你反而可以做得很好。","你也可以學習「借力」——不是所有事情都必須靠自己完成。適當地讓有能量的人幫忙、分配工作、休息，其實不是偷懶，而是更聰明地使用自己的能量。","<mark class=\"k\">你的非我狀態，很容易是「不知道什麼時候夠了」。</mark>"],"remind":["薦骨無定義：「我的能量有限，所以我要選擇值得的事情，也要允許自己休息，不需要跟別人比體力。」"],"q":["你有沒有發現跟很有活力的人在一起，你突然變得很有精神？","別人還在工作，你會不會覺得自己也不能停？","你會不會很容易跟著別人工作、加班、拼命？","明明累了，卻因為別人還沒停而繼續？","你有沒有為了證明自己可以，而一直撐？","你知道什麼時候應該休息嗎？","當身邊的人很忙時，你會不會覺得自己也必須忙？"],"lab":"非常適合現場問","key":"如果沒有別人可以跟，你還會這麼努力嗎？","extra":[],"one":"你的能量有限，要選擇值得的事，也允許自己休息。","pr":"學習借力，不是所有事都要靠自己完成。","say":"休息和借力不是偷懶，是更聰明地使用能量；不需要跟別人比體力。","qp":[0,1,2]}},"root":{"topic":"壓力、動力、時間感、推動力","def":{"title":"穩定的壓力與推動力","zhen":"能辨識真正的危機，知道什麼需要快速反應。","fei":"被壓力推著走，變成只會趕工的機器。","qs":"過動，失眠，暴力，高血壓","qx":"憂郁，自殺，無工作，拖延","detail":["你會比較知道什麼時候事情是真的需要趕、什麼時候其實可以慢一點。","<mark class=\"k\">這種面對壓力之後能夠快速行動的能力，其實是你的優勢</mark>"],"remind":["根部有定義：「我有穩定的推動力，要學會控制速度，而不是被壓力控制。」"],"q":["你是不是有一種‘事情趕快做完比較舒服’的感覺？","你會不會習慣給自己一個deadline？","事情越多，你反而越有動力？","你有沒有發現自己在有壓力的時候效率特別高？","你是不是不太喜歡拖著事情？","你會不會很自然地想把事情完成、解決？","別人覺得你很趕，但你自己覺得‘還好啊’？"],"lab":"深入問","key":"你是真的需要現在完成，還是你的身體只是習慣了有壓力？","extra":[],"one":"你面對壓力能快速行動，也分得出什麼是真的要趕。","pr":"學會控制速度，而不是被壓力控制。","say":"你能在壓力下行動是優勢，但要分辨哪些事真的緊急，哪些可以慢一點。","qp":[0,3,6]},"und":{"title":"容易被壓力推著跑","zhen":"享受與生俱來的平和，事緩則圓。","fei":"匆匆忙忙想從壓力中解脫，把別人的焦慮當成自己的動力。","qs":"","qx":"","detail":["你對壓力、速度和緊迫感的感受，會比較容易受到周圍環境影響。","你本來一點都不急，但看到身邊的人一直在趕，你也會突然覺得：「糟糕，我是不是也應該快一點？","<mark class=\"k\">可以問自己：「如果沒有人在催我，我真的會這麼急嗎？」當你處於真我的狀態時，你其實可以擁有一種比較平和的節奏。事情來了，就處理；處理不了，就安排時間再處理。你不需要因為事情還沒完成，就一直逼自己。有時候事情慢一點，反而會比較圓滿。</mark>","非我狀態時，你可能會很想趕快把壓力消掉。所以別人焦慮，你也跟著焦慮；別人趕，你也跟著趕。甚至會出現一種：「我一定要把這些事情全部做完，我才可以休息。」可是問題是，事情永遠做不完。"],"remind":["根部無定義：「我不需要接住別人的焦慮，也不需要趕快把所有事情做完，才允許自己休息。」"],"q":["你會不會很怕自己拖累別人？","別人催你的時候，你是不是馬上就有壓力？","你有沒有明明不急，卻覺得一定要趕快做完？","你是不是很難放鬆，總覺得還有事情沒完成？","看到別人很忙，你會不會也跟著緊張？","你會不會為了趕快結束壓力，而答應一些其實不需要答應的事情？","當事情終於完成之後，你會不會馬上又找下一件事情做？"],"lab":"非常適合收尾的一句","key":"如果沒有任何人催你，你還會這麼趕嗎？","extra":[],"one":"你對壓力和速度很敏感，容易被身邊人的急迫感帶著走。","pr":"問自己：如果沒有人在催我，我真的會這麼急嗎？","say":"別人的焦慮不需要你接住；事情慢一點，反而可能比較圓滿。","qp":[1,2,4]}}};
