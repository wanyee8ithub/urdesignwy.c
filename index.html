<style>
:root{--bg:#eef1f3;--card:#ffffff;--ink:#12202a;--mute:#475a67;--line:#c6d1d9;--acc:#2c6180;--acc2:#6e9bb6;--soft:#e0eaf0;--on:#ffffff;--hi:#a24a5c;--hisoft:#f6e4e6;--serif:"Noto Serif TC","Songti TC","PMingLiU",serif;--sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12181d;--card:#1b242b;--ink:#f2f6f9;--mute:#b6c4ce;--line:#35444e;--acc:#9fc8df;--acc2:#5f8ca8;--soft:#222f38;--on:#0d1317;--hi:#eeaab4;--hisoft:#3a262a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12181d;--card:#1b242b;--ink:#f2f6f9;--mute:#b6c4ce;--line:#35444e;--acc:#9fc8df;--acc2:#5f8ca8;--soft:#222f38;--on:#0d1317;--hi:#eeaab4;--hisoft:#3a262a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:500;font-size:16px;line-height:1.85}
h1,h2,.big,.gname,.pl .n{font-family:var(--serif)}
h1 b{color:var(--acc)}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:24px;margin:8px 0 2px;letter-spacing:.08em}
.sub{color:var(--mute);font-size:15px;margin:0 0 18px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px;min-height:36px}
.back{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.crumb{color:var(--mute);font-size:14px}
.planets{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.pl{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 14px;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:transform .15s,border-color .15s}
.pl:hover{border-color:var(--acc2);transform:translateY(-2px)}
.pl .g{font-size:28px;color:var(--acc);line-height:1}
.pl .n{font-size:18px;font-weight:700;margin-top:6px}
.pl .d{font-size:13px;color:var(--mute);line-height:1.5}
.pl.off{opacity:.45;cursor:default;border-style:dashed}
.pl.off:hover{transform:none;border-color:var(--line)}
.intro{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--mute);margin-bottom:14px}
.search{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px;font:inherit;font-size:15px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.gt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;font:inherit;color:inherit;cursor:pointer}
.gt:hover{border-color:var(--acc2)}
.gt b{display:block;font-size:22px;color:var(--acc)}
.gt span{font-size:12px;color:var(--mute);line-height:1.3;display:block}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:999px;padding:5px 14px;font:inherit;font-size:14px;cursor:pointer}
.tab.on{background:var(--acc);border-color:var(--acc);color:var(--on)}
.big{font-size:56px;color:var(--acc);line-height:1;font-weight:700}
.gname{font-size:20px;font-weight:700;margin:4px 0 14px}
.box{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--hi);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.box h3{display:inline-block;margin:0 0 6px;font-size:15px;font-weight:700;color:var(--hi);background:var(--hisoft);border-radius:999px;padding:1px 12px;letter-spacing:.06em}
.box b,.box strong{color:var(--hi);font-weight:700}
mark.k{background:none;color:var(--hi);font-weight:700}
.box p{margin:0;font-size:17px;line-height:1.9}
.opp{margin-top:20px;padding-top:14px;border-top:1px dashed var(--line)}.oh{font-size:14px;color:var(--mute);margin-bottom:10px}.cardwide{grid-column:1/-1;border-color:var(--acc2)}
.ctabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.clist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.cc:hover{border-color:var(--acc2)}.cc b{display:block;font-size:15px}.cc span{font-size:12px;color:var(--mute);display:block}
.gates4{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0 14px}
.g4{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.g4 small{display:block;font-size:12px;color:var(--mute)}.g4 b{font-size:18px;color:var(--acc)}
.seg{display:flex;gap:8px;margin:2px 0 8px}.seg .tab.b.on{background:#2b2b2b;border-color:#2b2b2b}.seg .tab.r.on{background:#b3392f;border-color:#b3392f}
.sidenote{font-size:14px;color:var(--mute);margin-bottom:12px}
.ct{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;align-items:center;margin-bottom:14px}.ct .h{font-size:13px;color:var(--mute)}
.ct input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px;font:inherit;text-align:center}.ct input:disabled{opacity:.6;background:var(--soft)}
.pcard{margin-top:18px}.pcard h2{font-size:17px;margin:0 0 8px;color:var(--acc)}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:6px}.sec{font-size:14px;color:var(--mute);margin:18px 0 8px;letter-spacing:.06em}
.svgwrap{margin:6px 0 14px}.box ul{margin:4px 0 0;padding-left:18px}.badge{display:inline-block;font-size:12px;border:1px solid var(--acc2);color:var(--acc);border-radius:999px;padding:0 8px;margin-left:6px}
.sum{width:100%;height:170px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px;font:inherit;font-size:14px;margin:6px 0 8px}
.chl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.nav{display:flex;justify-content:space-between;margin-top:18px}
.empty{color:var(--mute);text-align:center;padding:30px 0}
.sech{display:flex;align-items:center;gap:10px;margin:22px 0 10px;font-size:13px;color:var(--mute);letter-spacing:.14em}.sech::after{content:"";flex:1;height:1px;background:var(--line)}
.tls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tl{display:flex;gap:10px;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0;text-align:left;font:inherit;color:inherit;cursor:pointer}.tl:hover{border-color:var(--acc2)}
.ti{flex:none;width:36px;height:36px;border-radius:10px;background:var(--acc);color:var(--card);display:grid;place-items:center;font-size:18px}
.tt{min-width:0}.tl b{display:block;font-size:15px;line-height:1.3}.tl i{display:block;font-style:normal;color:var(--mute);font-size:12px;line-height:1.35}
.tcs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;min-width:0;font:inherit;color:inherit;cursor:pointer}.tc:hover{border-color:var(--acc2)}
.tg{display:block;color:var(--hi);font-size:20px;line-height:1}
.tc b{display:block;font-size:15px;margin-top:2px}.tc i{display:block;font-style:normal;color:var(--mute);font-size:11.5px;line-height:1.35;margin-top:2px}
.tc.off{opacity:.45;cursor:default;border-style:dashed}
.dp{display:block;margin:0 0 9px}.dp:last-child{margin-bottom:0}.dp.qi{margin-bottom:5px;padding-left:2px}.dp.kq{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line)}
.one{font-family:var(--serif);font-size:20px;line-height:1.55;color:var(--hi);font-weight:700;margin:0 0 12px;padding:12px 14px;background:var(--hisoft);border-radius:14px}
.cards3 .box{margin-bottom:8px}.box.say{border-left-color:var(--hi)}.sm{cursor:pointer;font-weight:700;color:var(--acc)}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:4px}.brand .logo{width:56px;height:56px;flex:none}.brand h1{margin:0}.brand .sub{margin:2px 0 0}
</style>
</head>

<script>
const DATA={"1": {"name": "自我表達 / 獨特性", "sun": "展現獨一無二的原創力與藝術靈魂，以不隨波逐流的獨特性吸引世界目光。", "earth": "透過給自己充足的獨立空間、沉浸在個人創作中，讓浮躁的心重新沉靜接地。", "name2": "自我表達 / 獨特性", "sTalent": "習慣獨立創作與自我展現，具備強烈的原創力與個人魅力。", "sShadow": "陷入孤芳自賞、沉溺於個人世界，或因得不到外在認同而感到挫折與疏離。", "north": "大膽展現個人獨特視角，不為迎合社會規範或他人期待而活，成為啟發他人的生命範本。", "moon": "內心極度渴望獨立創作，唯有展現獨一無二的原創性時情緒才安心。", "mercury": "喜歡談論創新、獨特的想法與美學，溝通風格極具個人原創色彩。", "venus": "欣賞獨一無二、不隨波逐流的人事物，關係中極看重彼此的獨立性。", "mars": "急著證明自己獨特而顯得叛逆；成熟後化為沉穩的原創力", "jupiter": "守護創造與表達的自由，尊重每個人的獨特", "saturn": "曾因「不被認同或被嫌怪」而受挫，需歷經磨練才能堅定展現個人風格。", "uranus": "擁有前衛、革命性的藝術思維，常突破傳統框架帶來獨樹一格的作品。", "neptune": "對美與藝術有靈性層面的感受力，但也易在「自己到底夠不夠獨特」中迷茫。", "pluto": "看見「每個人的獨特才是真相」，不被同化"}, "2": {"name": "接收 / 方向", "sun": "展現敏銳的生命導航天賦，天生具備吸引資源與指引大眾走向正確方向的吸引力。", "earth": "透過臣服於生命的自然節奏、不再強求主導，從被動接收與大自然的連結中獲得安定。", "name2": "接收 / 方向", "sTalent": "習慣隨波逐流或被動等待他人指引，對資源與環境有天然的接收力。", "sShadow": "失去主動權、對未來方向感到迷茫，或過度依賴外部資源與他人的決定。", "north": "信任生命的內在導航，臣服於自然的引導與節奏，幫助自己與他人找到正確的方向。", "moon": "渴望生活有明確方向，臣服於生命的自然引導時才能獲得安全感。", "mercury": "擅長向他人傳達指引與方向，談話內容常能幫人找到下一步怎麼走。", "venus": "喜歡能夠為自己指引方向，或願意包容接納自己的伴侶與夥伴。", "mars": "急著找方向而亂衝；成熟後學會信任內在導航", "jupiter": "為他人指引方向，自身也受生命方向庇護", "saturn": "生命前期常感到迷茫無依，需學會信任內在導航，才能成為別人的指南針。", "uranus": "常直覺般地指引出非常規、具突破性的新方向。", "neptune": "方向選擇上易理想化或看不清現實，需依賴靈性直覺而非腦袋計算。", "pluto": "看透人生真正的方向與歸屬"}, "3": {"name": "秩序 / 突破", "sun": "展現混亂中突圍的創新能量，擅長在舊體制中打破僵局、帶來全新的變革。", "earth": "透過耐心地在混亂中建立簡單的微小秩序與常規，為內在建立安全感。", "name2": "秩序 / 突破", "sTalent": "習慣混亂與混亂中的突圍，對新舊交替與改變並不陌生。", "sShadow": "讓生活長期處於動盪與未定狀態，無法建立穩定基礎，容易陷入無意義的混亂。", "north": "在混亂中梳理新秩序，擁抱創新帶來的陣痛，將混亂轉化為具體的成長與突破。", "moon": "驅動行動的是「想要打破僵局、帶來新突破」的情緒衝動。", "mercury": "擅長溝通變革、創新與如何從混亂中梳理出新秩序。", "venus": "喜歡能在混亂中帶來新鮮感、勇敢擁抱改變的動態關係模式。", "mars": "面對混亂焦躁；成熟後能耐心在混沌中孕育新秩序", "jupiter": "保護新事物從混亂中誕生，給創新成長空間", "saturn": "常需面對混亂困境，需付出極大耐心建立系統常規才能完成突破。", "uranus": "以極其特立獨行、不可預測的方式帶來突如其來的混亂與革新。", "neptune": "易在混亂環境中感到麻木或被淹沒，需透過靈性定力來梳理混亂。", "pluto": "看見混亂是新秩序必經的真相"}, "4": {"name": "答案 / 擬定公式", "sun": "展現強大的邏輯思考與解題天賦，擅長為複雜狀況提出建設性的解決方案。", "earth": "透過接納「世界沒有絕對答案」，放下大腦的焦慮思考，讓心智回歸平靜。", "name2": "答案 / 擬定公式", "sTalent": "習慣執著於尋找「為什麼」與答案，天生具有強大的邏輯推理能力。", "sShadow": "因過度腦補、邏輯推理或焦慮於無解的問題而精神過載，把焦慮加諸他人。", "north": "接受生命「沒有絕對答案」，將邏輯思考轉化為解決現實問題的建設性公式。", "moon": "內心焦慮於「尋找答案」，唯有想通邏輯或找到解法時才能安心。", "mercury": "說話極具邏輯，擅長將複雜問題條理化、擬定出明確的執行公式。", "venus": "看重有條理、邏輯清晰的溝通，關係中喜歡開誠布公、釐清道理。", "mars": "急著給答案或爭對錯；成熟後耐心驗證再給公式", "jupiter": "以合理的公式與答案，守護他人免於困惑", "saturn": "曾因邏輯思考被質疑而受挫，需透過不斷驗證，鍛鍊出無懈可擊的公式。", "uranus": "腦海常跳脫傳統邏輯，跳躍性地得出令人意想不到的解答。", "neptune": "易執著於追求「精神或心靈上的終極答案」，但在現實邏輯中易感到困惑。", "pluto": "點破答案背後的真相，拆穿似是而非的邏輯"}, "5": {"name": "等待 / 節奏", "sun": "展現極具感染力的穩定生活節奏，能在規律中散發出令人安心的能量。", "earth": "透過堅持自己的日常微習慣與生活儀式感，讓身體獲得深層的放鬆與穩固。", "name2": "等待 / 節奏", "sTalent": "習慣固定且規律的生活節奏，能在習慣中找到安全感。", "sShadow": "對突發狀況焦慮、生活模式過度僵化，甚至強迫他人配合自己的時間表。", "north": "順應自然的時機與萬物的節奏，在耐心等待中找到內在的和諧與平靜。", "moon": "驅動你的是對固定生活韻律的需求，只有在規律節奏中才感到踏實。", "mercury": "溝通講究時機與節奏，喜歡分享時間管理、日常規律與習慣的觀點。", "venus": "關係中需要穩定的互動節奏，看重長久、規律且可預期的情感模式。", "mars": "打亂節奏或急於求成；成熟後順應自然節奏", "jupiter": "為生活訂下穩定規律，保護他人的節奏", "saturn": "生命課題是磨練「耐心」，需學會在漫長等待中不焦慮，鍛鍊出沉穩定力。", "uranus": "擁有非常奇特且不隨波逐流的個人生理時鐘與生活規律。", "neptune": "易在時間管理上感到模糊、隨波逐流，需學會建立自然的韻律。", "pluto": "看清時機與節奏的真相，違反節奏必付代價"}, "6": {"name": "摩擦 / 建立邊界", "sun": "展現敏銳的情緒邊界感與溝通天賦，擅長透過化解摩擦來建立高品質的人際連結。", "earth": "透過建立清晰且安全的心理邊界，保護自身情緒不受外界干擾，獲得內在和平。", "name2": "摩擦 / 建立邊界", "sTalent": "對情緒氛圍敏感，習慣透過防衛機制或適度衝突來測試對方是否值得信任。", "sShadow": "築起高牆或陷入無謂的情緒對立，因為害怕受傷而不敢真正靠近他人。", "north": "放下過度防衛，透過健康的溝通建立邊界，化解摩擦，達成真正的和平與深層情感連結。", "moon": "對人際間的情緒邊界極度敏感，渴望無衝突且絕對安全的情感連結。", "mercury": "擅長溝通人際界線、化解對立，或講述關於衝突與和平的話題。", "venus": "關係中極看重情緒邊界，認為好的感情建立在互相尊重與適度距離上。", "mars": "情緒衝動易起摩擦；成熟後懂得建立邊界與信任", "jupiter": "守護親密關係的界線，化解衝突維持和平", "saturn": "考驗來自於人際關係中的摩擦與高牆，需學習如何在衝突中成熟應對。", "uranus": "常以突如其來、令人意外的方式打破舊有邊界或化解冰凍關係。", "neptune": "易在關係中邊界模糊，被他人的情緒影響而感到混亂或委屈。", "pluto": "看穿人際中信任與防衛的真相"}, "7": {"name": "領導 / 方向", "sun": "展現具前瞻性與民主氣度的前鋒領袖魅力，擅長為團隊指引未來發展方向。", "earth": "透過退居幕後、以輔佐與觀察者的姿態運籌帷幄，讓自己獲得最穩固的支撐。", "name2": "領導 / 方向", "sTalent": "習慣居於幕後或被動被指派領導，天生具備謀略與輔佐能力。", "sShadow": "對團隊未來的方向感到不確定、不敢承擔主導責任或習慣性卸責。", "north": "勇敢站出來引導大眾，以民主、具前瞻性的視野帶領眾人走向正確的方向。", "moon": "渴望引導群眾，在扮演團隊方向指引者時情緒最受鼓舞。", "mercury": "說話具領袖特質，擅長溝通團隊戰略、組織方向與前瞻性願景。", "venus": "關係中看重彼此是否有共同未來方向，喜歡有領袖氣質或前瞻性的夥伴。", "mars": "急著搶主導權；成熟後以民主方式領導", "jupiter": "以公平的規則引導群體，保護被領導者", "saturn": "領導之路需歷經考驗，早期可能不敢承擔大局，需時間鍛鍊出領袖風範。", "uranus": "展現出非常非傳統、具備新時代民主理念的革命性領導風格。", "neptune": "在團隊方向上易理想化，需小心被不切實際的願景所誤導。", "pluto": "看見群體真正的方向，敢說出實話"}, "8": {"name": "貢獻 / 凝聚", "sun": "大膽公開展示自身的獨特做法與作品，以身作則地成為凝聚眾人的亮眼榜樣。", "earth": "透過默默地將自身天賦無私貢獻給社群，不在乎名聲，獲得最純粹的內在滿足。", "name2": "貢獻 / 凝聚", "sTalent": "習慣默默付出或獨自展示獨特做法，懂得默默貢獻自身天賦。", "sShadow": "因缺乏關注或認同而產生孤立感與怨懟，覺得自己懷才不遇。", "north": "公開發表與貢獻自己的獨特性，吸引志同道合的夥伴，成為凝聚團隊的榜樣。", "moon": "渴望公開展現自身獨特天賦，透過對社群產生貢獻來獲得內在滿足。", "mercury": "擅長推廣與宣傳美好的事物、藝術或個人作品，溝通充滿感染力。", "venus": "認為真正的美與價值在於無私貢獻，喜歡願意公開展示並彼此支持的關係。", "mars": "太急著被看見；成熟後靜待時機以貢獻贏得認可", "jupiter": "保護有價值的貢獻，讓獨特才能發揮", "saturn": "曾歷經懷才不遇或不敢公開展示自己的恐懼，需時間克服羞怯站上舞台。", "uranus": "以極其前衛、前所未見的方式展示作品，凝聚起一群特立獨行的跟隨者。", "neptune": "對自身的貢獻帶有靈性與理想主義色彩，但也易忽視世俗商業價值。", "pluto": "揭露「真正的貢獻來自真實的自己」"}, "9": {"name": "專注 / 細節", "sun": "展現雷射般精準的專注力，擅長從龐雜數據與繁瑣事物中積累出龐大的成果。", "earth": "透過一次只專注於做好眼前的一件微小細節，擺脫雜念，重新找回沉穩。", "name2": "專注 / 細節", "sTalent": "習慣處理微小細節，對數據、繁瑣事物有天生的敏感度。", "sShadow": "鑽牛角尖、見樹不見林，被無意義的繁瑣小事耗盡精力與大局觀。", "north": "將散落的精力收攏，雷射般地聚焦在對自身真正重要的目標上，透過細節的積累與微習慣創造巨大成果。", "moon": "需要專注於微小細節，一次做好一件事時情緒最感到踏實平靜。", "mercury": "講話與思考極注重細節、數據與事實，表達精準且不放過微小之處。", "venus": "欣賞細膩、注重細節的人事物，關係中會透過微小的體貼行動展現愛意。", "mars": "在小事上鑽牛角尖；成熟後專注得有分寸", "jupiter": "以專注與細節為生活建立秩序與保障", "saturn": "曾因注意力分散或處理繁瑣細節感到痛苦，需磨練出強大專注自律力。", "uranus": "對於非常特殊、冷門的細節領域擁有非凡且出人意料的專注研究力。", "neptune": "易在細節中迷失或陷入繁瑣麻木，需學會分清哪些細節才真正重要。", "pluto": "看見細節中決定成敗的關鍵"}, "10": {"name": "自我行為 / 自愛", "sun": "展現無條件自愛與真實活出自己的自信光芒，成為他人活出自我的指引燈塔。", "earth": "透過完全接納自己的不完美、不為迎合外界而妥協，獲得堅不可摧的內在基石。", "name2": "自我行為 / 自愛", "sTalent": "習慣觀察行為規範，天生非常在乎個人形象與角色舉止。", "sShadow": "討好他人或過度關注外界標準，因他人眼光與社會規範而失去真正的自我。", "north": "無條件愛自己與接納自己的不完美，以活出最真實的自我來展現強大的生命影響力。", "moon": "極度渴望被允許「做自己」，無條件自愛是最核心的情緒需求。", "mercury": "喜歡談論自愛、個人行為規範、個人成長與如何活出真實自我。", "venus": "關係中堅守「自愛」底線，絕不為了迎合對方委屈自己，看重真實的愛。", "mars": "用衝動或抗拒捍衛自我；成熟後真正接納自己", "jupiter": "守護「做自己」的權利，樹立自愛的準則", "saturn": "前半生常因過度在乎他人眼光或討好而失去自我，需歷經考驗學會自愛。", "uranus": "以完全不理會社會世俗眼光的態度活出自己，展現極具特色的行為風格。", "neptune": "易在「我是誰」中感到迷茫，需透過靈性覺察來尋找內在真正的自愛。", "pluto": "揭露自愛與真實行為才是力量的根源"}, "11": {"name": "思想 / 點子", "sun": "腦海中源源不絕地散發出充滿理想與啟發性的點子，以宏大的願景照亮周遭。", "earth": "透過將理想點子寫下、播種給對的人，並在現實中一步一步落地執行來獲取踏實感。", "name2": "思想 / 點子", "sTalent": "習慣不斷產生新點子與理想，腦海中永遠充滿豐富的圖像與靈感。", "sShadow": "天馬行空、空想而缺乏落地執行的能力，導致靈感隨風蒸發。", "north": "分享具啟發性的思想，將點子播種在對的時間與對的人群中，讓靈感生根發芽。", "moon": "腦海充滿理想點子時最興奮，渴望思想被聽見與理解。", "mercury": "點子製造機，極擅長分享概念、哲理與前瞻性創見。", "venus": "欣賞有思想深度、哲學涵養與豐富想像力的伴侶。", "mars": "點子多卻急躁不落地；成熟後能篩選並實現點子", "jupiter": "以理念與信念為人建立保護", "saturn": "點子常被質疑不切實際，需學會如何將抽象思想落地實踐。", "uranus": "腦海常閃過極度跳躍、打破常規且具革命性的創新概念。", "neptune": "靈感源源不絕，但易流於白日夢，需分清何為現實何為幻想。", "pluto": "看穿思想與理想背後的真相"}, "12": {"name": "謹慎 / 慎言", "sun": "在情緒對的時機展現獨特的語言、藝術或情感感染力，深深打動與震撼人心。", "earth": "透過適度地退回個人的獨處世界中充電、不勉強社交，為心靈帶來深層穩固。", "name2": "慎言 / 孤獨", "sTalent": "習慣沉浸在自己的情緒與孤獨世界中，具備高敏銳度的藝術與語言感知力。", "sShadow": "封閉自我、社交冷漠、過度敏感，覺得外界沒有人能真正理解自己。", "north": "在情緒對的時機大膽發聲，運用語言、藝術或文字將深層感受轉化為打動人心的力量。", "moon": "獨處與情緒對時才想社交，極度需要個人的獨立秘密花園。", "mercury": "語言具極強感染力與詩意，但講話極度看情緒與對的時機。", "venus": "關係中看重心靈共鳴與浪漫氛圍，極度討厭俗套社交。", "mars": "情緒化時口不擇言；成熟後懂得謹慎與選對時機", "jupiter": "守護表達的時機與分寸，讓話語有影響力", "saturn": "常感到社交隔閡或被誤解，需歷經孤獨磨練出精準表達力。", "uranus": "擁有極獨特的藝術與語言表達風格，不隨波逐流。", "neptune": "對語言的情緒波動極敏感，易因害怕被拒絕而退縮孤立。", "pluto": "看見言語與時機的力量，說出該被聽見的話"}, "13": {"name": "聆聽 / 秘密", "sun": "展現慈悲且溫暖的傾聽魅力，能讓他人卸下心防、成為眾人信任的經驗記錄者。", "earth": "透過保持客觀立場、不將他人的情緒垃圾扛在自己身上，來維持內在的平靜。", "name2": "聆聽 / 秘密", "sTalent": "習慣當他人的情感傾聽者，天生能讓他人卸下心防傾訴秘密。", "sShadow": "無止境承載他人的情緒垃圾與負面能量，導致自身情緒超載。", "north": "智慧地聆聽過去的故事，梳理經驗、保持客觀，並為他人與自己指引通往未來的道路。", "moon": "渴望聽見他人的真實故事，擔任傾聽者時能感到情感連結。", "mercury": "極佳的傾聽者，擅長記錄經驗、撰寫歷史與收納他人的秘密。", "venus": "吸引他人向自己傾吐心聲，關係中看重無條件的包容與傾聽。", "mars": "急於傾訴或過度承載他人；成熟後成為可靠的聆聽者", "jupiter": "守護他人的秘密與經驗，成為可信的見證者", "saturn": "需 原則。", "venus": "關係中極度看重原則與價值觀對齊，若原則被觸犯會果斷切割或尋求變革。", "mars": "因原則而衝動決裂；成熟後彈性地推動變革", "jupiter": "守護原則與價值，保護群體免於不公", "saturn": "需學會原則的彈性，避免因過度僵化或情緒化切割而孤立自己。", "uranus": "具備極強的革命基因，常以極具前衛與顛覆性的方式打破舊有不合理規則。", "neptune": "對變革抱持理想主義，需注意原則實施的務實性，避免過度激進。", "pluto": "看穿舊制度的真相，拒絕不合理的規則"}, "50": {"name": "價值 / 責任", "sun": "展現守護社群福祉與傳統價值觀的強大責任感，成為團體中令人信賴的後盾。", "earth": "透過建立符合現狀的健康規則、不被僵化的舊道德綁架，讓責任成為良性基石。", "name2": "價值 / 責任", "sTalent": "對社群規則與傳統價值觀有天生的責任感，習慣扮演守護者。", "sShadow": "承擔過度傳統的責任與負擔，被舊有的道德標準捆綁至窒息。", "north": "建立健康、符合現狀的價值觀與規則，守護並滋養社群的整體福祉。", "moon": "具強烈責任感，渴望守護社群福祉與價值觀，成為他人強大後盾時感到安心。", "mercury": "擅長溝通法律、道德規範、傳統價值與如何建立健康的團體運作規則。", "venus": "關係中看重責任、照顧與價值觀一致，是極具責任感與保護慾的夥伴。", "mars": "用嚴苛規則約束他人；成熟後建立健康的規範", "jupiter": "守護群體的價值與法則，成為責任與保護的後盾", "saturn": "需學會擺脫舊道德綁架，建立健康的責任界線，避免盲目承擔過重包袱。", "uranus": "能以非常新穎、前衛的方式重新定義傳統的家族或社會價值觀。", "neptune": "對責任抱持無私大愛，但需注意防範被他人的道德勒索所綑綁。", "pluto": "看清價值觀與責任背後的真相"}, "51": {"name": "震驚 / 競爭", "sun": "展現強大的衝擊力與開創勇氣，敢於打破常規，在突發震撼中展現超越自我的光彩。", "earth": "透過在遭遇人生打擊後迅速回歸內在平靜、不再與人無謂競爭，獲得靈魂的覺醒與踏實。", "name2": "震驚 / 競爭", "sTalent": "天生具備衝擊力與競爭天賦，對突發的震撼狀況有極高的適應力。", "sShadow": "過度追求刺激、好勝心太強，習慣引發驚嚇或傷害他人自尊。", "north": "從突如其來的打擊中覺醒，超越自我恐懼，並引導他人面對人生的震撼與轉折。", "moon": "渴望突破與超越，在突發震撼與競爭中激發潛能、展現光彩時感到活著。", "mercury": "說話具震撼力與衝擊性，擅長講述突破危機、開創新局的話題。", "venus": "欣賞敢於冒險、具備震撼魅力與競爭力的伴侶，關係中追求激情與突破。", "mars": "好勝愛刺激而驚嚇他人；成熟後從衝擊中覺醒", "jupiter": "守護突破與覺醒，保護面對震撼的人", "saturn": "生命中常面臨突如其來的打擊考驗，需學會在風暴中沉著，磨練出強大定力。", "uranus": "具極強革命與驚世駭俗的能量，常以令人震撼的方式打破世俗既定常規。", "neptune": "對突發衝擊極敏感，需學會透過靈性覺察將驚嚇轉化為心靈的覺醒。", "pluto": "看見「震撼帶來覺醒」的真相"}, "52": {"name": "山 / 靜止", "sun": "散發如山一般穩重安定的氣場，擅長退後一步綜觀全局，提供團隊極致的專注力。", "earth": "透過給予自己安靜不動的獨處時光、按捺住盲動的衝動，讓內在獲得強大的定力。", "name2": "山 / 靜止", "sTalent": "習慣沉靜與退後，天生具有強大的專注安定力。", "sShadow": "過度沉靜或強迫自己不動，陷入壓抑、消極或行動力癱瘓。", "north": "在動盪的環境中保持內在安定，退一步綜觀全局，找到對的時機精準出擊。", "moon": "需要安靜與專注，當能退後一步綜觀全局、靜止思考時感到情緒沉靜。", "mercury": "說話穩重、言之有物，擅長進行大局評估、長遠規劃與靜心思考。", "venus": "欣賞沉穩、安靜且能專注目標的伴侶，關係中看重安定的陪伴感。", "mars": "被逼著動而暴躁或過度靜止；成熟後專注有定力", "jupiter": "守護專注與安靜，保護沉澱與獨處", "saturn": "生命課題是學習「安靜不動」，需克服內在焦慮，鍛鍊出如山般的定力。", "uranus": "擁有非常奇特的靜心與專注方式，能在極度混亂的環境中維持奇蹟般的冷靜。", "neptune": "容易陷入逃避現實的消極靜止中，需分清何為健康的沉澱何為麻木逃避。", "pluto": "看清何時該動、何時該靜"}, "53": {"name": "開始 / 開創", "sun": "展現天生的開創者魅力，永遠充滿熱情地為新專案、新事業點燃第一把火。", "earth": "透過學會在適當時機將專案交接給合適的人延續、不強求自己收尾，獲得內在輕鬆。", "name2": "開始 / 開創", "sTalent": "天生是開創者，習慣不斷點燃新專案或發起新事物。", "sShadow": "虎頭蛇尾，開了無數個頭卻留下一堆未完結的爛攤子。", "north": "啟動真正有價值的經驗，並學會在適當時機將其交接、延續或完整結束。", "moon": "天生開創者，渴望為新專案或事業點燃第一把火，開啟新局時最興奮。", "mercury": "擅長構想新專案、撰寫企劃書，溝通內容充滿開創新局的熱情與遠景。", "venus": "被具開創力、活力充沛的伴侶吸引，關係中喜歡共同開啟新的生活體驗。", "mars": "開頭多卻不收尾；成熟後選擇值得的開始", "jupiter": "守護新事物的起步，保護開創者", "saturn": "需學會評估資源再開啟，避免因盲目開頭而承擔過度繁重的收尾包袱。", "uranus": "常以極具革命性、前所未見的方式突發性開啟全新領域的開創。", "neptune": "對新開始抱持美好幻想，需搭配務實執行力，避免陷入空有開頭的虛幻。", "pluto": "看見開始與結束的循環真相"}, "54": {"name": "野心 / 驅動力", "sun": "展現強烈的奮發圖強驅動力與向上野心，擅長爭取更高的地位與實現世俗成就。", "earth": "透過將世俗野心轉化為追求內在品質與精神層面的自我超越，讓野心不流於功利焦慮。", "name2": "野心 / 驅動力", "sTalent": "擁有強烈的向上野心與奮發圖強的驅動力，習慣爭取更高的位置。", "sShadow": "被地位、權力與功利所驅使，急功近利而忽視內在靈性成長。", "north": "將世俗的野心升華為追求靈性、內在品質與精神層面的自我超越。", "moon": "野心蓬勃，渴望提升社會地位與實現成功，奮發向上時感到靈魂有動力。", "mercury": "擅長溝通事業藍圖、階層晉升、商業合作與如何爭取更高資源。", "venus": "關係中看重上進心與事業成就，欣賞有野心、願意共同打拼的伴侶。", "mars": "急功近利地攀爬；成熟後把野心轉為有意義的追求", "jupiter": "守護上進者，透過階層與人脈獲得庇護", "saturn": "前半生晉升之路常面臨壓制與打擊，需歷經長期扎實打磨才能站上高位。", "uranus": "以完全非傳統、顛覆常規的方式（如新創或奇道）實現事業上的階層躍升。", "neptune": "對成功抱持理想化幻想，需注意建立務實的商業步驟，避免陷入空想。", "pluto": "看穿野心與階層背後的真相"}, "55": {"name": "豐盛 / 情緒波浪", "sun": "散發極具浪漫色彩的情緒感受力，能將內在豐盛的心靈能量渲染並打動整個世界。", "earth": "透過全然接納情緒低潮的自然循環、不因情緒起伏而自責，獲得心靈深處的自由。", "name2": "豐盛 / 情緒波浪", "sTalent": "對情緒的起伏與物質的豐盛極度敏感，具有強烈的浪漫色彩。", "sShadow": "隨情緒低潮沉淪、過度執著於物質豐盛，感到內在深層匱乏。", "north": "接納情緒的自然起伏，明白真正的豐盛來自於內在心靈的自由與充盈。", "moon": "情緒感受力極豐富，當能坦然接納情緒起伏時感到心靈無比自由豐盛。", "mercury": "擅長透過文字、音樂或語言表達極具感染力的情緒美感與心靈體悟。", "venus": "追求浪漫、具情緒深度與心靈契合的關係，看重內在精神的富足感。", "mars": "情緒低潮時匱乏而暴躁；成熟後接納情緒起伏", "jupiter": "守護情感的自由與內在豐盛", "saturn": "需學會在情緒低潮時沉澱，克服內在的匱乏感，建立穩固的情緒安全感。", "uranus": "擁有非常特立獨行、不受世俗標準影響的個人情緒表達與美感體驗。", "neptune": "情感極度浪漫富想像力，但需注意防範沉溺於悲傷低潮或過度美化困境。", "pluto": "看見「豐盛來自內在」的真相"}, "56": {"name": "旅人 / 說故事", "sun": "展現極具幽默與感染力的說故事天賦，能將自身豐富的人生歷練化為引導他人的故事。", "earth": "透過保持真實、不誇大其詞，將體驗沉澱為有深度的智慧，讓表達建立在誠實之上。", "name2": "旅人 / 說故事", "sTalent": "習慣講述自身的經歷，具備出色的說故事與幽默表達天賦。", "sShadow": "盲目追求感官刺激、誇大其詞、流於表面娛樂而缺乏實質內容。", "north": "將真實生命體驗化為富有啟發性的故事，引導、教育與療癒他人。", "moon": "渴望豐富的人生經歷，將自身歷練轉化為幽默故事分享給他人時最快樂。", "mercury": "天生說故事與演說天才，擅長運用生動的比喻與幽默將枯燥道理變得引人入勝。", "venus": "欣賞幽默風趣、閱歷豐富且會說故事的伴侶，關係中追求趣味與新鮮感。", "mars": "誇大故事、追求刺激；成熟後說出真實的故事", "jupiter": "守護故事與經驗的傳遞，保護旅人與說書人", "saturn": "需學會說話的誠信與分寸，避免因浮誇表達而失去他人的信任。", "uranus": "說故事風格極奇特前衛，常以令人意想不到的視角解讀人生歷練。", "neptune": "具強大的藝術想像力與敘事魅力，但需注意分清真實經歷與自我美化的幻想。", "pluto": "說出真實經歷，拆穿浮誇與幻象"}, "57": {"name": "直覺 / 澄明", "sun": "散發極其敏銳的瞬間直覺力，能瞬間察覺環境與聲音中的微妙變化、指引安全道路。", "earth": "透過瞬間信任並執行當下的直覺、放下對未來的過度焦慮恐懼，獲得身體的真切安全感。", "name2": "直覺 / 澄明", "sTalent": "擁有極為敏銳的瞬間直覺力，天生能感知聲音與環境中的微小變化。", "sShadow": "因對未來的恐懼而過度防衛，陷於焦慮中猶豫不決、不敢行動。", "north": "信任當下瞬間的直覺，克服恐懼，大膽邁向安全與健康的未來。", "moon": "直覺極敏銳，能瞬間察覺環境中的微妙變化與危險，信任直覺時最安心。", "mercury": "說話極具直覺洞察力，擅長瞬間抓出問題核心與指引安全道路。", "venus": "關係中依賴直覺選擇夥伴，看重彼此間微妙的氣場共鳴與安全感。", "mars": "因恐懼而焦慮猶豫；成熟後信任直覺", "jupiter": "以直覺守護安全，保護免於未知的危險", "saturn": "需克服對未知的生存恐懼，學會在焦慮中信任自身的瞬間直覺指引。", "uranus": "具備極強、如電光火石般的突發直覺，能瞬間預知風險並做出驚人反應。", "neptune": "直覺帶有強大的靈性感應，但需注意分清何為真實直覺、何為恐懼幻覺。", "pluto": "看見直覺對未來的預警，直指風險"}, "58": {"name": "活力 / 歡樂", "sun": "散發充滿熱情與歡樂的生命活力，天生具有想要改善現狀、讓一切變得更好的驅動力。", "earth": "透過享受當下的生活樂趣、不再強迫挑剔眼前的不完美，讓歡樂能量獲得源源不絕的滋養。", "name2": "活力 / 歡樂", "sTalent": "擁有對生命的熱情與歡樂活力，習慣尋求改進與完善。", "sShadow": "強迫改善現狀、過度挑剔批判，因而失去對生活的熱情與樂趣。", "north": "享受生命的喜悅，將這份活潑與改進的能量投注於改善社會整體的福祉。", "moon": "散發歡樂活力，天生具有想要改善現狀、讓一切變好的驅力，成功改善時感到滿足。", "mercury": "說話充滿歡樂活力，擅長提出具建設性的改善建議與讓氣氛變好的話題。", "venus": "喜歡熱情歡樂、具正面能量的伴侶，關係中看重共同享受生活的樂趣。", "mars": "挑剔現況而不滿；成熟後享受並改善", "jupiter": "守護活力與喜悅，保護改善生活的行動", "saturn": "需學會放鬆，避免因過度追求完美改善而讓自己與身邊的人備感壓力。", "uranus": "擁有非常奇特且具感染力的歡樂方式，能以非傳統角度改善生活品質。", "neptune": "歡樂帶有理想主義色彩，需注意享受現實生活，避免追求虛幻的完美樂園。", "pluto": "看清不完美中也有喜悅"}, "59": {"name": "親密 / 突破障礙", "sun": "展現打破人際高牆與藩籬的強大親和力，擅長建立深層、真誠且具有創造力的親密關係。", "earth": "透過建立健康且安全的溝通邊界，不盲目投入不合適的人際關係，獲得情緒安全感。", "name2": "親密 / 突破障礙", "sTalent": "天生具備打破隔閡、建立親密連結的能力。", "sShadow": "習慣建立防禦機制，或盲目追求親密而導致人際關係混亂。", "north": "打破人與人之間的溝通高牆，建立基於真誠、安全與尊重的深層親密關係。", "moon": "渴望打破人際隔閡，建立深層、真誠且具創造力的親密關係時感到安心。", "mercury": "擅長溝通深層情感、突破人際心防，說話具極強的感染力與親和力。", "venus": "極度看重靈魂與肉體的深層親密，看重真誠無掩飾的情感交流。", "mars": "築牆防衛或衝動求親密；成熟後建立安全的親密", "jupiter": "守護親密與生育的連結，保護關係中的信任", "saturn": "生命課題是克服對親密的恐懼，學會在受過傷後重新建立健康的信任。", "uranus": "以極前衛、非傳統的方式（如新型態關係）打破人際隔閡與傳統藩籬。", "neptune": "對親密關係抱持浪漫幻想，需建立清晰邊界，避免陷入關係模糊混亂。", "pluto": "看見親密背後的真相，突破隔閡"}, "60": {"name": "限制 / 接受", "sun": "展現能在舊框架與現實限制中尋求創新突破的天賦，將限制轉化為變革的起跑點。", "earth": "透過全然接納現實中無法改變的限制、不盲目死磕抵抗，獲得內在的坦然與平靜。", "name2": "限制 / 接受", "sTalent": "對現實中的限制與框架非常熟悉，習慣在邊界內運作。", "sShadow": "與環境或體制的限制死磕，感到悲觀、被困住與無力感。", "north": "接納現實的客觀限制，並在現有的框架之內尋求可行的創新突破。", "moon": "擅長在框架與現實限制中尋求突破，當全然接納現實限制時感到內在平靜。", "mercury": "思考務實，擅長溝通如何在有限資源與舊架構中進行漸進式創新。", "venus": "關係中務實且有界線，看重現實條件的配合，討厭不切實際的空想。", "mars": "抗拒限制而悲觀；成熟後接受並在限制內突破", "jupiter": "守護限制與規則的意義，保護秩序延續", "saturn": "需學會臣服於現實限制，在限制中打磨耐性，將限制化為最穩固的基石。", "uranus": "能在最嚴格的傳統限制中，奇蹟般地撕開一道口子，帶來革命性突破。", "neptune": "易在現實限制中感到迷茫或悲觀逃避，需透過靈性覺察獲得內在坦然。", "pluto": "看清「限制孕育突破」的真相"}, "61": {"name": "神秘 / 思考", "sun": "散發對宇宙真理與生命神秘的深層探索光彩，能在瞬間帶來靈光乍現的深刻洞見。", "earth": "透過接納世界上有許多「無法被理性解答的神秘」，停止心智焦慮，獲得靈魂平靜。", "name2": "神秘 / 思考", "sTalent": "對生命的神秘與深層真理有天生的高敏感度，喜歡思考大問題。", "sShadow": "執著於追求萬物的「背後答案」，沉浸在空想與邏輯焦慮中。", "north": "接納不可知的神秘，享受靈光乍現帶來的內在平靜與宇宙智慧。", "moon": "渴望探索宇宙真理與深層神秘，當獲得靈光乍現的深刻洞見時感到滿足。", "mercury": "對哲學、玄學、宇宙真理與深層抽象思維極具天賦，說話充滿智慧。", "venus": "追求心靈與精神層面的極致契合，欣賞具深層智慧與神秘感的伴侶。", "mars": "執著求答案而焦慮；成熟後接受未知", "jupiter": "守護內在真理與探索，保護靈感", "saturn": "需克服心智上的強迫焦慮，學會讓大腦靜心，不再強求立刻想通一切。", "uranus": "腦海常閃過極前衛、突破世俗認知且具震撼性的宇宙級靈光洞見。", "neptune": "對靈性與神秘領域具極高感受力，但需接地，避免陷入空想或精神迷霧。", "pluto": "看見宇宙與人生的深層真理"}, "62": {"name": "細節 / 精準表達", "sun": "展現極其嚴謹的數據整理與事實表達天賦，能用最精準具體的語言將複雜事物說明清楚。", "earth": "透過避免陷入瑣碎細節的牛角尖、適時抬頭關注整體大局，讓心智維持清明踏實。", "name2": "細節 / 精準表達", "sTalent": "擅長收集事實與數據，天生擁有組織細節的能力。", "sShadow": "過度專注於事實與數據，陷入瑣碎細節而忽略整體大局。", "north": "用精準、具體的語言與事實將抽象概念表達出來，讓深奧的智慧人人皆懂。", "moon": "需要事實與數據支撐，當能用精準語言說明清楚複雜細節時感到安心。", "mercury": "細節與數據大師，擅長整理繁瑣資訊並以極其精準、條理分明的語言表達。", "venus": "欣賞講話精準、注重事實與細節的伴侶，關係中看重明確且具體的溝通。", "mars": "挑剔細節而爭論；成熟後精準又顧及全局", "jupiter": "守護事實與準確，保護知識的傳達", "saturn": "需磨練細節整理的扎實功底，避免因準備不足或表達模糊而付出代價。", "uranus": "能以極奇特、精準的方式整理並呈現極度複雜前衛的數據與細節。", "neptune": "對細節敏銳但表達易受情緒影響，需注意保持事實客觀，避免模糊。", "pluto": "說出具體精確的真相，讓事實清楚"}, "63": {"name": "懷疑 / 邏輯", "sun": "展現敏銳的懷疑精神與邏輯檢驗能力，擅長為大眾抓出漏洞、尋求具建設性的方向。", "earth": "透過將懷疑用於客觀的事物驗證而非質疑人際關係，建立對生命的基本信任與安定。", "name2": "懷疑 / 邏輯", "sTalent": "天生具備懷疑精神與邏輯檢驗能力，不輕易相信未經證實的事物。", "sShadow": "對一切事物抱持過度懷疑，變成多疑、缺乏信任感與無休止的批判。", "north": "將懷疑轉化為客觀的邏輯驗證，為大眾尋求具建設性的解決方向。", "moon": "具敏銳懷疑精神，當能透過邏輯檢驗找出漏洞並驗證真相時感到踏實。", "mercury": "邏輯批判天賦，擅長質疑既有假設、抓出邏輯漏洞並尋求改進方向。", "venus": "關係中看重邏輯合理性與真實度，討厭含糊不清或缺乏驗證的承諾。", "mars": "多疑批判破壞信任；成熟後理性驗證", "jupiter": "守護質疑與檢驗的權利，保護免於受騙", "saturn": "需學會控制懷疑的分寸，避免因疑神疑鬼而陷入焦慮或破壞合作。", "uranus": "能以極前衛、出人意料的質疑角度，挑出傳統系統中隱藏的致命邏輯漏洞。", "neptune": "容易在懷疑與盲信間擺盪，需結合客觀事實與靈性直覺來尋找真相。", "pluto": "看穿謊言與漏洞的真相"}, "64": {"name": "困惑 / 想像力", "sun": "腦海中擁有豐富的經驗圖景與想像力，擅長從過去的混亂中抽象出啟發性的生命畫面。", "earth": "透過允許自己「暫時處於困惑中」、不急於立刻找出答案，等待畫面自然清晰，獲得平靜。", "name2": "困惑 / 想像力", "sTalent": "腦海中儲存著大量的過去經驗圖像，具備豐富的想像力。", "sShadow": "試圖用理性去解開過去所有的混亂，造成心智過載與精神疲憊。", "north": "接受暫時的困惑，讓大腦繪製想像圖景，等待畫面自發清晰並獲得啟示。", "moon": "腦海擁有豐富經驗圖景，當能從混亂中抽象出啟發性的生命畫面時感到滿足。", "mercury": "擅長藝術想像、解讀過去圖像與將混亂經驗轉化為抽象啟示。", "venus": "追求充滿藝術感與故事繪畫感的關係，欣賞具備豐富想像力的伴侶。", "mars": "想立刻理清過去而焦躁；成熟後耐心等待清晰", "jupiter": "守護心智的想像與沉澱，保護等待中的人", "saturn": "需克服對困惑的焦慮，學會允許時間沉澱心智，不再與過去的混亂死磕。", "uranus": "腦海常跳出極度抽象、具顛覆性與視覺震撼力的新時代想像圖景。", "neptune": "想像力與靈性感受力極強，但需注意避免沉溺於過去混亂的記憶迷霧中。", "pluto": "看見混亂經驗之後浮現的真相"}};
const CROSS=[{"id":"R1","t":"R","s":1,"d":7,"en":"Sphinx","zh":"人面獅身4","th":"充滿創意的個體，以傳奇的方式彰顯自己的人生方向，使之永垂不朽；成為典範，提供並延續突變的方向。"},{"id":"J1","t":"J","s":1,"d":4,"en":"Self-expression","zh":"自我表達","th":"善於社交的人，能為人們尚未發問的問題，提供有創意、具革命性的解答。"},{"id":"L1","t":"L","s":1,"d":4,"en":"Defiance","zh":"挑戰2","th":"吸引社會群體的個體人，此生是為了捍衛差異性；為了維護自身的獨特，強硬拒絕任何形式介入。"},{"id":"R2","t":"R","s":2,"d":13,"en":"Sphinx","zh":"人面獅身2","th":"具備影響力的密友，結合美學與人類的物質需求；在延續過去的同時，也改變整體物質世界的方向。"},{"id":"J2","t":"J","s":2,"d":49,"en":"Driver","zh":"駕駛","th":"這些人完全專注於自己的方向，以及自己的駕駛原則，並決定把別人拉進來同行。<mark class=\"k\">就算只跟他們短暫相處，也會改變你的方向。</mark>"},{"id":"L2","t":"L","s":2,"d":49,"en":"Defiance","zh":"挑戰","th":"這些人順著自己的方向走，但看起來總像在反抗一般社會的方向；他們具有讓別人脫離現況的能力。"},{"id":"R3","t":"R","s":3,"d":60,"en":"Laws","zh":"律法","th":"<mark class=\"k\">這些人形塑並改變我們的律法和價值觀，宛如藝術。</mark>我們的律法規範彼此如何共處，並為社會設立秩序。"},{"id":"J3","t":"J","s":3,"d":41,"en":"Mutation","zh":"突變","th":"不斷尋找機會，改變不公平的法律，以便在突變的過程中，建立自己的定位與影響力。"},{"id":"L3","t":"L","s":3,"d":41,"en":"Wishes","zh":"希望","th":"充滿吸引力與影響力的利他主義者，不斷尋找可能性，讓人們得以擁有更好的生活；用全新的方式切入並帶來重整。"},{"id":"R4","t":"R","s":4,"d":23,"en":"Explanation","zh":"解釋3","th":"解釋革命性與原則性的解決方案，就是他們的工作，尚未經過測試的個人覺知，經由邏輯且公式化的檢驗，其洞見需要釐清，並且反覆說明。"},{"id":"J4","t":"J","s":4,"d":8,"en":"Formulization","zh":"公式化","th":"帶來啟發，具備創造力，能建立公式並看到獨特的模式，使新方向變得可行。"},{"id":"L4","t":"L","s":4,"d":8,"en":"Revolution","zh":"革命2","th":"承接外在的投射，期待他們務實地，提出發起革命（或不發起革命）的理由，同時貢獻其資源。"},{"id":"R5","t":"R","s":5,"d":64,"en":"Consciousness","zh":"意識4","th":"順應生命之流，進而產生成長和發展的動力；其意識與自然韻律相調和。"},{"id":"J5","t":"J","s":5,"d":47,"en":"Habits","zh":"習慣","th":"有其既定的習慣與秩序，不容易被影響；具有固定的節奏，從中發展出習慣的模式或儀式，讓人生穩定運作。"},{"id":"L5","t":"L","s":5,"d":47,"en":"Separation","zh":"分離2","th":"對愛開放，他們將自己和過去行不通的模式（或關係）分開來，試著理解過往，看見人生有更長遠的運作模式，領略其美麗，或帶來改變。"},{"id":"R6","t":"R","s":6,"d":12,"en":"Eden","zh":"伊甸園3","th":"運用衝突和危機中所得到的經驗，維持親密的人際連結；透過逝去的純真，從中獲得經驗。"},{"id":"J6","t":"J","s":6,"d":15,"en":"Conflict","zh":"衝突","th":"抱持「順應生命」的態度，連結逝去的天真，自危機中創造出最佳環境，讓陪伴、友誼與愛因而萌芽。"},{"id":"L6","t":"L","s":6,"d":15,"en":"The Plane","zh":"飛機2","th":"他們此生是為了享受自身的工作，同時吸引我們深入物質層面，在物質世界中得到生活所需，同時身處社會／物質世界之中，熱愛生活。"},{"id":"R7","t":"R","s":7,"d":2,"en":"Sphinx","zh":"人面獅身3","th":"具備影響力與領導力，以清晰的邏輯看待過往，鑑往知來，引導人們走向安全的未來。"},{"id":"J7","t":"J","s":7,"d":23,"en":"Interaction","zh":"相互影響","th":"不斷找尋各種方法，活出領導者的角色，散發影響力的同時，也避免自己被影響，而接受多樣性，就成為他們領導的方式。"},{"id":"L7","t":"L","s":7,"d":23,"en":"Masks","zh":"面具2","th":"承擔來自外在的投射，要他們提供實際或有智慧的領導方式，成為有影響力的改革推動者；他們最好躲在面具或頭銜背後來發揮影響力，像將軍或治療師。"},{"id":"R8","t":"R","s":8,"d":30,"en":"Contagion","zh":"傳染2","th":"以身作則，渴望貢獻，投入資源確保未來的安全及富裕；他們是能夠影響他人的進化楷模。"},{"id":"J8","t":"J","s":8,"d":55,"en":"Contribution","zh":"貢獻","th":"以某種充滿創意又親密的方式，持續貢獻社會，像是結婚然後花許多年來翻修老舊房子。"},{"id":"L8","t":"L","s":8,"d":55,"en":"Uncertainty","zh":"不確定","th":"將能量轉化為實質形式，面對蛻變的不確定性，若要嘗試，需要秉持正確的精神與物質資源。"},{"id":"R9","t":"R","s":9,"d":40,"en":"Planning","zh":"計畫4","th":"充滿熱忱，實際專注於相關的細節。<mark class=\"k\">當所有面向皆獲得審慎考量與充分支持，重大的事件（計畫、協議、才華）就能自然發展。</mark>"},{"id":"J9","t":"J","s":9,"d":64,"en":"Focus","zh":"聚焦","th":"熱情激勵別人，引發眾人聚焦於社會的重要議題上，指認出未來社會的潛能，並為此灌注心力。"},{"id":"L9","t":"L","s":9,"d":64,"en":"Identification","zh":"指認2","th":"認知到自己渴望聚焦並發揮技能之所在（質疑或僵局），確保握有適當的資源可以解決問題，讓他們的心智穩定。"},{"id":"R10","t":"R","s":10,"d":46,"en":"Vessel of Love","zh":"愛之船4","th":"當他們全心投入於支持每個個體展現其獨特的行為，他們因而全然活出自己，愛自己的獨特之處，將世界往愛的方向推進。"},{"id":"J10","t":"J","s":10,"d":18,"en":"Behavior","zh":"行為","th":"褒貶不一的機會主義者，期望自身的行為在別人心中留下好印象，同時又很快地管理或挑戰別人的行為。"},{"id":"L10","t":"L","s":10,"d":18,"en":"Prevention","zh":"預防2","th":"既壓抑又解放，試圖在他人或社會作出不健康的行為／行動之前，防範未然，事先「修正」。"},{"id":"R11","t":"R","s":11,"d":6,"en":"Eden","zh":"伊甸園4","th":"具哲學性的思維，也許透過音樂與詩歌，來教導別人在這個世界上，關於體驗和情緒的本質。"},{"id":"J11","t":"J","s":11,"d":46,"en":"Ideas","zh":"想法","th":"本身帶有強大的突變子，收集各種普世的概念可能會成為重要的導師（或先知），往往堅守特定的看法或走向。"},{"id":"L11","t":"L","s":11,"d":46,"en":"Education","zh":"教育2","th":"<mark class=\"k\">「和平、博愛、傳播訊息」的人，渴望傳遞那些無法言喻的人類經驗。</mark>教育仍舊是人類的行為中最奧妙之處。"},{"id":"R12","t":"R","s":12,"d":36,"en":"Eden","zh":"伊甸園2","th":"善於表達，但固執己見的人，能將失去的純真，化為藝術的形式；有其天賦，能以詩和音樂的形式，表達愛與危機。"},{"id":"J12","t":"J","s":12,"d":25,"en":"Articulation","zh":"發聲","th":"傑出的演說者或老師，擁有罕見而令人印象深刻的天賦，能夠用自己聲音的音調變化，影響他人，使他人活出其個體性。"},{"id":"L12","t":"L","s":12,"d":25,"en":"Education","zh":"教育","th":"令人印象深刻的演講者，總在尋找優雅的聽眾；利用資源來教育大眾，促進全球化的改變。"},{"id":"R13","t":"R","s":13,"d":1,"en":"Sphinx","zh":"人面獅身","th":"具備個人方向，用自己獨特的方式記憶經驗，將鮮明而活躍的過去帶向未來。"},{"id":"J13","t":"J","s":13,"d":43,"en":"Listening","zh":"傾聽","th":"很棒的傾聽者和守密者，擅用藝術的形式，來詮釋自己與突破性的洞見。"},{"id":"L13","t":"L","s":13,"d":43,"en":"Masks","zh":"面具","th":"透過解釋或洞見，帶來轉化的潛能，以領導並指引他人，若能隱身於面具之後（像醫生那樣）效果最佳。"},{"id":"R14","t":"R","s":14,"d":29,"en":"Contagion","zh":"傳染4","th":"透過財富與權力的持有與積累，承諾對社會有所貢獻；聰明運用資源，促進人類的成長、發展及進化。"},{"id":"J14","t":"J","s":14,"d":59,"en":"Empowering","zh":"激勵","th":"他們多愁善感的靈魂與其財務上穩固與否，緊密相連，握有資源來創造堅固的基礎，確保投資有所回報，激勵他人。"},{"id":"L14","t":"L","s":14,"d":59,"en":"Uncertainty","zh":"不確定2","th":"了解別人在財務上的不確定性，他們能夠提供別人所需，給予幫助；藉由提供（或應允或示範）物質層面的安全感，達到親密。"},{"id":"R15","t":"R","s":15,"d":25,"en":"Vessel of Love","zh":"愛之船2","th":"關心人類福祉是其天性，透過了解自己在事物發展過程中的定位，將多樣性帶入生命之流。"},{"id":"J15","t":"J","s":15,"d":17,"en":"Extremes","zh":"極端","th":"這些人固守自己的韻律（通常是極端的韻律），與他人的韻律截然不同；他們並未察覺，自己天生能聚焦於需要被修正的事物上。"},{"id":"L15","t":"L","s":15,"d":17,"en":"Prevention","zh":"預防","th":"這些人似乎總是遇到行不通的事情；這其實是一種天賦，能夠悉心指引社會，免於重蹈覆轍。"},{"id":"R16","t":"R","s":16,"d":37,"en":"Planning","zh":"計畫2","th":"充滿熱忱，指示詳盡的解決辦法與正確的作為，找到有邏輯有條理的方式，展現並掌控進度。"},{"id":"J16","t":"J","s":16,"d":63,"en":"Experimentation","zh":"實驗","th":"有影響力的人，擅長運用自己的人際網絡，引發人們熱情來支持全新的實驗。"},{"id":"L16","t":"L","s":16,"d":63,"en":"Identification","zh":"指認","th":"強烈邏輯導向，有能力讓別人認同自己的技能或計畫，或認購其股票，因而得到支持、認購或投資。"},{"id":"R17","t":"R","s":17,"d":58,"en":"Service","zh":"服務","th":"對於何謂為人處世，具備邏輯性的見解，化不滿足為驅動力，讓他們聚焦於修正、重整和服務人群。"},{"id":"J17","t":"J","s":17,"d":38,"en":"Opinions","zh":"意見","th":"這些人總能以挑釁的方式，檢驗你的靈魂或使命；他們很容易分享許多意見，卻不見得容許別人與之爭辯。"},{"id":"L17","t":"L","s":17,"d":38,"en":"Upheaval","zh":"動盪","th":"擅長按按鈕的人；總是攪亂現狀，為接下來的修正作準備，重新引導人們至健康的方向。"},{"id":"R18","t":"R","s":18,"d":52,"en":"Service","zh":"服務3","th":"不斷修正男／女和父／母的原型，使其趨於完美的過程；所有意見和修正都是為了服務人類，精益求精。"},{"id":"J18","t":"J","s":18,"d":39,"en":"Correction","zh":"修正","th":"擅長找出模式中的缺陷，除了自己之外，能辨認任何不適當的事物；有能力使麻雀變鳳凰。"},{"id":"L18","t":"L","s":18,"d":39,"en":"Upheaval","zh":"動盪2","th":"這些人帶有異端的思維或迷人的純真，總是蓄勢待發，試圖擾亂或挑戰行不通的一切；他們是治療師，知道治療的方法必須實際可行。"},{"id":"R19","t":"R","s":19,"d":44,"en":"Four Ways","zh":"四方之路4","th":"對人權（或保育動物）等相關議題很敏感，因而備感壓力，深受社會及精神層面的力量所驅動，滿足別人的基本需求。"},{"id":"J19","t":"J","s":19,"d":1,"en":"Need","zh":"需要","th":"創意導向，生命中對於創造與美感具有深刻需求，而其親密的朋友圈為此受惠。"},{"id":"L19","t":"L","s":19,"d":1,"en":"Refinement","zh":"精致2","th":"這些人認為合宜的人生方向（共識）和偉大的美學息息相關，這不僅能滿足其需求，讓生命的經驗更盡善盡美，同時還能引領他們完成自身的使命。"},{"id":"R20","t":"R","s":20,"d":55,"en":"Sleeping Phoenix","zh":"沉睡的鳳凰2","th":"充滿魅力，總是很忙碌；等待突變發生之前，他們會全神貫注把事情做好，或忙碌沉浸於自己的創造過程裡。"},{"id":"J20","t":"J","s":20,"d":37,"en":"The Now","zh":"當下","th":"為了部落、家族、伴侶及社群而忙；在社群自己想投注能量去做的事情中，不斷拔河。"},{"id":"L20","t":"L","s":20,"d":37,"en":"Duality","zh":"二元性","th":"忙碌並勤奮於工作，讓別人印象深刻，也讓自己獲得滿足；透過協議建造鏈接，營造互利共生的夥伴關係。"},{"id":"R21","t":"R","s":21,"d":38,"en":"Tension","zh":"張力","th":"天生設立疆界的人，喜歡掌控自己的環境，與身處其中的人事物；他們擅於維持秩序，並監督情況。"},{"id":"J21","t":"J","s":21,"d":54,"en":"Control","zh":"控制","th":"內在對實現自我抱負，異常執著，向上提升的自我需求，他們需要全盤掌控，才能開始創新，創造全新的事物。"},{"id":"L21","t":"L","s":21,"d":54,"en":"Endeavor","zh":"努力","th":"有野心改變現狀的人，致力將有深度的人聚集起來；渴望探索新的領域，以發展社群、商業及科學結構。"},{"id":"R22","t":"R","s":22,"d":26,"en":"Rulership","zh":"統領","th":"<mark class=\"k\">位居要位，懂得如何優雅地聽，天生具備統領的才能，最大的責任是教育王國裡的子民。</mark>當他們得以統御人事物時，最為健康。"},{"id":"J22","t":"J","s":22,"d":11,"en":"Grace","zh":"優雅","th":"非常熱衷社交，能夠全神貫注地傾聽；他們是強而有力的突變媒介，能享受聆聽的藝術和樂趣。"},{"id":"L22","t":"L","s":22,"d":11,"en":"Informing","zh":"告知","th":"<mark class=\"k\">具備清晰表達的天賦，告知眾人嶄新而不同的事物，帶來突變。</mark>經由教導眾人新事物，引發突變。"},{"id":"R23","t":"R","s":23,"d":49,"en":"Explanation","zh":"解釋2","th":"永遠的局外人，他們總是在解釋自己，或解釋其獨特的概念、原則和洞見，以便整合至別人的革新或分析的過程裡。"},{"id":"J23","t":"J","s":23,"d":30,"en":"Assimilation","zh":"同化","th":"有魅力的人，其任務是重複別人不熟悉的洞見，直到一切變得顯而易見，吸引願意聆聽的朋友，直到他們吸收了解為止。"},{"id":"L23","t":"L","s":23,"d":30,"en":"Dedication","zh":"奉獻","th":"有潛力的好老師，能夠一遍又一遍解釋同樣的事情，推動教育和改變；總是對接下來如何進展充滿興趣。"},{"id":"R24","t":"R","s":24,"d":19,"en":"Four Ways","zh":"四方之路","th":"這些人不斷重新審視「神是什麼？神在哪裡？誰是神？」等概念，渴望尋找明確的解答，使意識與形體能共同進化。"},{"id":"J24","t":"J","s":24,"d":13,"en":"Rationalization","zh":"體悟","th":"聰明、善於思考，有其固定的運作模式，以天生的邏輯和過往的經驗值，找到過去與未來的接續性，傳遞個人的覺知。"},{"id":"L24","t":"L","s":24,"d":13,"en":"Incarnation","zh":"輪迴","th":"這些人跟過去及未來有特別的連結，當他們和自己的人生軌道合一，就能為別人的方向帶來深刻的影響。"},{"id":"R25","t":"R","s":25,"d":10,"en":"Vessel of Love","zh":"愛之船","th":"覺知於更高層面的宇宙，超越個人的宇宙之愛，為人類未來的方向、求存的驅動力與繁衍物種之間，取得平衡。"},{"id":"J25","t":"J","s":25,"d":58,"en":"Innocence","zh":"天真","th":"專注於享受人生，說服你喜歡自己的本性，追求幸福。"},{"id":"L25","t":"L","s":25,"d":58,"en":"Healing","zh":"療愈","th":"透過健康的身體，展現對生命的愛，專注感受生命的喜悅（品質），對於在不舒服中掙扎的人特別敏感，此生能透過「醫學」，來療愈別人或是療愈自己。"},{"id":"R26","t":"R","s":26,"d":47,"en":"Rulership","zh":"統領4","th":"有社交魅力的人，巧妙挑選特定的記憶，加上人際之間的碰觸（握手、抱嬰兒），承諾教育每個人以改善未來，懂得營銷自己成為領導者，他們是今日的政治家。"},{"id":"J26","t":"J","s":26,"d":6,"en":"Trickster","zh":"魔術師","th":"天生具有營銷能力，能推銷給缺乏經驗的人，能推廣與眾不同的事物。"},{"id":"L26","t":"L","s":26,"d":6,"en":"Confrontation","zh":"衝突2","th":"優雅而有正義感，起身對抗權威，建立自己的統治地位；不願意輕易改變，擁有強大的自我。"},{"id":"R27","t":"R","s":27,"d":41,"en":"Unexpected","zh":"不預期","th":"自然而然會被不預期的事物所引發，因而開啟一連串全新的體驗，因而滋養並擴展他們的智慧。"},{"id":"J27","t":"J","s":27,"d":19,"en":"Caring","zh":"照顧","th":"總是不斷照顧每一個人，照料每一件事，同時也懂得關懷自己，所有的記憶、突然的新發現與各種原則，都需要有其意義，才能成形。"},{"id":"L27","t":"L","s":27,"d":19,"en":"Alignment","zh":"校準","th":"懂得如何利用不預期的事物，帶來轉變，賦予適當的方向；幫助別人重新找到共識，作出調整。"},{"id":"R28","t":"R","s":28,"d":31,"en":"Unexpected","zh":"不預期3","th":"這些人總會不預期地承擔起責任，需要照料某些人或某些事，當他們在掙扎中找到其中的意義，將成為具有影響力的典範。"},{"id":"J28","t":"J","s":28,"d":33,"en":"Risks","zh":"風險","th":"勇於冒險的人，試圖超越極限，滿足其渴望，或是找到人生的目的和意義。"},{"id":"L28","t":"L","s":28,"d":33,"en":"Alignment","zh":"校準2","th":"深思熟慮的人，明白如何在不預期的意外中取得好處，當機會來臨，能將老舊的一切拋諸腦後，與全新的事物連結。"},{"id":"R29","t":"R","s":29,"d":8,"en":"Contagion","zh":"傳染3","th":"總是對新的（親密）的體驗說好，透過承諾尋求滿足感，他們能為體驗而體驗。"},{"id":"J29","t":"J","s":29,"d":20,"en":"Commitment","zh":"承諾","th":"對其承諾，貫徹到底；他們是靈感的來源，像是將一生侍奉給神的聖人。"},{"id":"L29","t":"L","s":29,"d":20,"en":"Industry","zh":"勤奮2","th":"這些人沒有意識到自己強大的魅力，他們只要做出正確的承諾，就能堅持並發光。"},{"id":"R30","t":"R","s":30,"d":14,"en":"Contagion","zh":"傳染","th":"天真的命運實行者，透過體驗、發現和學習，走進別人的生命，並且不預期地改變他們的命運。"},{"id":"J30","t":"J","s":30,"d":34,"en":"Fates","zh":"命運","th":"<mark class=\"k\">精力充沛、堅持不懈，任由命運安排，基於完成渴望的執著與承諾，草莽行事。</mark>具備成為神秘學老師的潛能。"},{"id":"L30","t":"L","s":30,"d":34,"en":"Industry","zh":"勤奮","th":"活力充沛的人，非常忙碌地工作、創造與連結，以滿足他們內在渴望人類進步的動機：強烈渴望在每一個新的體驗中，感覺到各種情感的可能。"},{"id":"R31","t":"R","s":31,"d":27,"en":"Unexpected","zh":"不預期2","th":"天生有能力能吸引社會大眾的注意力，而成為不預期的領導者或英雄；往往就在不預期的狀態下，眾人會發掘並讚賞他們帶來滋養的影響力。"},{"id":"J31","t":"J","s":31,"d":24,"en":"Influence","zh":"影響","th":"天生具備影響力與持續力，使用自己的思考過程、新的經驗以及記憶，來說服別人。"},{"id":"L31","t":"L","s":31,"d":24,"en":"The Alpha","zh":"創始者","th":"強大的領導者，透過解決精神面的生存問題，影響他人；為了確保未來長治久安，不斷找尋實際的解決方案。"},{"id":"R32","t":"R","s":32,"d":62,"en":"Maya","zh":"馬雅3","th":"這些人擁有內在覺知，並善用細節，造就其能力能評估並促進物質層面的成長、成熟及發展。"},{"id":"J32","t":"J","s":32,"d":56,"en":"Conservation","zh":"保存","th":"謹慎評估風險，如何存續與持久為其主要考慮，為確保未來世代生存無虞，保存資源。"},{"id":"L32","t":"L","s":32,"d":56,"en":"Limitation","zh":"限制2","th":"視無常為限制與壓力，就像公司與企業評估產品時，會以其實用性，及是否經得起時間考驗，主要的衡量標準。"},{"id":"R33","t":"R","s":33,"d":24,"en":"Four Ways","zh":"四方之路2","th":"這些人在分享洞見、回憶或任何原則之前，需要單獨隱居，以思考並消化自己的經驗；他們需要獨處的隱私與空間。"},{"id":"J33","t":"J","s":33,"d":2,"en":"Retreat","zh":"隱私","th":"在生活中展現對美的需求；他們需要充足的食物和住所（自己的空間），才能展現隱居的美學。"},{"id":"L33","t":"L","s":33,"d":2,"en":"Refinement","zh":"精致","th":"這些人知道擁有並保護一個家，是不夠的；生命因為美麗的事物而豐富，美好的事物帶來療愈。"},{"id":"R34","t":"R","s":34,"d":59,"en":"Sleeping Phoenix","zh":"沉睡的鳳凰4","th":"具有強大個人力量與魅力，總是忙著以忙碌的樣子來吸引注意力；在靈魂層面的指引下所帶來的力量與親密，能服務眾人。"},{"id":"J34","t":"J","s":34,"d":40,"en":"Power","zh":"力量","th":"忙碌於專注展現個人力量或魅力，以支持社群；他們是表演者或負責交易的業務經理。"},{"id":"L34","t":"L","s":34,"d":40,"en":"Duality","zh":"二元性2","th":"在個人魅力／自私和群體責任間遊移，為這兩種人性的基本難題，搭好橋梁；其忙碌與社群充滿愛的支持，緊密結合。"},{"id":"R35","t":"R","s":35,"d":63,"en":"Consciousness","zh":"意識2","th":"具備經驗、熟悉一切的人，他們想要改變，也希望你能加入；隨時準備好探索全新的作法。"},{"id":"J35","t":"J","s":35,"d":22,"en":"Experience","zh":"經驗","th":"這些人的經驗能夠轉化為意識層面的提升，為人們帶來影響；經驗就是一切。"},{"id":"L35","t":"L","s":35,"d":22,"en":"Separation","zh":"分離","th":"<mark class=\"k\">在人生諸多經歷之後，獲得智慧，明白我們分以各自的方式，在社會中共同生活。</mark>由於各自對體驗有不同的詮釋方式，常讓我們意見分歧，但這也是文明進化的過程。"},{"id":"R36","t":"R","s":36,"d":11,"en":"Eden","zh":"伊甸園","th":"缺乏經驗的人，追尋刺激或新的體驗，最終純真將逝去，取而代之的是智慧與優雅的展現。"},{"id":"J36","t":"J","s":36,"d":10,"en":"Crisis","zh":"危機","th":"懷抱對自己及人類的愛，擅長研究別人引發的危機行為，因而將（有關性方面的）體驗提升到更高的層次。"},{"id":"L36","t":"L","s":36,"d":10,"en":"The Plane","zh":"飛機","th":"人世間的觀照者，能夠看見人性的變幻莫測，像是好、壞、醜等諸多面向；同時也具備潛能，讓人們知道，除此之外還有更多：像是光、靈性、覺醒與啟發。"},{"id":"R37","t":"R","s":37,"d":9,"en":"Planning","zh":"計畫","th":"他們秉持自身的技能，與人交易，建立並維持社群的體制；透過相互連結，團結力量大，創造更好的成果。"},{"id":"J37","t":"J","s":37,"d":5,"en":"Bargains","zh":"交易","th":"他們是無人能擋，熱力四射的談判者，擅長達成協議，發展社群。"},{"id":"L37","t":"L","s":37,"d":5,"en":"Migration","zh":"遷移","th":"當共同的計畫或經驗已經完成，他們會另謀出路，徵服下一個領域／經驗；他們是源頭，帶來進展。"},{"id":"R38","t":"R","s":38,"d":48,"en":"Tension","zh":"張力4","th":"這些人具有創造力與其深度，了解生命本身就是掙扎，但這掙扎是值得的，因為它能刺激靈性成長和使命的進展。"},{"id":"J38","t":"J","s":38,"d":57,"en":"Opposition","zh":"對抗","th":"帶來興奮的能量，憑直覺挑釁、對抗（或驚嚇）別人，來證明並解釋自己的主張或看法。"},{"id":"L38","t":"L","s":38,"d":57,"en":"Individualism","zh":"個人主義2","th":"單純的人，他們必須不斷地突變／不斷成為自己，然後反過來驚嚇別人、制造緊張，或誘發別人內在的改變。"},{"id":"R39","t":"R","s":39,"d":21,"en":"Tension","zh":"張力2","th":"這些人藉由激發別人的才能、領導力、使命和精神，將能量向外擴展，以釋放壓力；是擅長按按鈕的人。"},{"id":"J39","t":"J","s":39,"d":51,"en":"Provocation","zh":"挑釁","th":"力量強大且情緒化，用驚嚇的方式去引發他人深層的潛能；他們明白自己的憂郁，具有創造性的價值。"},{"id":"L39","t":"L","s":39,"d":51,"en":"Individualism","zh":"個人主義","th":"一股突變的力量，以其直覺的動見，與堅定的個人主義來撼動你，但本身並不容易受他人影響。"},{"id":"R40","t":"R","s":40,"d":16,"en":"Planning","zh":"計畫3","th":"當所需的支持，與正確的協議皆到位，就能以自身的技能、邏輯的天賦，以及對細節的掌握，建立並滿足社群的需求。"},{"id":"J40","t":"J","s":40,"d":35,"en":"Denial","zh":"拒絕","th":"其任務是擇善固執，拒絕協議，直到正確無誤為止，替社會快速的進展過程踩煞車。"},{"id":"L40","t":"L","s":40,"d":35,"en":"Migration","zh":"遷移2","th":"總是在移動或搬遷的人，為下一個社群或村莊帶來進步、發展及改變。"},{"id":"R41","t":"R","s":41,"d":28,"en":"Unexpected","zh":"不預期4","th":"不預期被推至領導地位，透過關懷或找尋人生目的，引領潮流並影響他人。"},{"id":"J41","t":"J","s":41,"d":44,"en":"Fantasy","zh":"幻想","th":"有影響力的人，擅長看見趨勢，對未來懷抱夢想，因而獲得報酬；在虛擬的實境中，沉溺於幻想。"},{"id":"L41","t":"L","s":41,"d":44,"en":"The Alpha","zh":"創始者2","th":"等待不預期的冒險時刻到來，同時以美好的夢想與幻想來吸引他人，期待帶領眾人前往更新、更好的理想天地。"},{"id":"R42","t":"R","s":42,"d":61,"en":"Maya","zh":"馬雅","th":"引領潮流的人，適當評估的細節，透過完成既定的循環，促進成長，為深具啟發性的全新啟點，做好鋪陳。"},{"id":"J42","t":"J","s":42,"d":60,"en":"Completion","zh":"完成","th":"這些人專注於完成他們所開始的事，就像馬拉松選手一樣，就算其他都已經回家了，他們也非要抵達終點才行。"},{"id":"L42","t":"L","s":42,"d":60,"en":"Limitation","zh":"限制","th":"知道事情是否可行的人，為了掌控資源，確保物質上的成功，他們了解接受限制是必要的，限制設立範疇，讓宇宙萬物得以相互依存。"},{"id":"R43","t":"R","s":43,"d":4,"en":"Explanation","zh":"解釋4","th":"他們的覺知具有革命性；有效率又有邏輯地解釋自己革命性的洞見，奠定理解的基礎。"},{"id":"J43","t":"J","s":43,"d":29,"en":"Insight","zh":"洞見","th":"渴望傳達自己獨特的洞見，能有效影響那些已經準備好，願意聆聽的人。"},{"id":"L43","t":"L","s":43,"d":29,"en":"Dedication","zh":"奉獻2","th":"將洞見植入他人心中，引發微妙具顛覆性的突變，使社會更有效率。"},{"id":"R44","t":"R","s":44,"d":33,"en":"Four Ways","zh":"四方之路3","th":"這些家族人擁有敏銳的嗅覺、敏銳的本能、對歷史如數家珍，同時對他人的福祉極為敏感，不斷思考家族企業如何長久存續。"},{"id":"J44","t":"J","s":44,"d":7,"en":"Alertness","zh":"警覺","th":"先知，具備警覺本能，知曉我們所經歷的過往，以及接下來即將邁向的未來，最好注意他們的存在。"},{"id":"L44","t":"L","s":44,"d":7,"en":"Incarnation","zh":"輪迴2","th":"這些人不斷重溫過往，引領我們與過去連結，不斷思考何謂輪迴，以及如何生存。"},{"id":"R45","t":"R","s":45,"d":22,"en":"Rulership","zh":"統領2","th":"這些人來到世上，被賦予（或運作）權力，若以現代的話來說，他們就像是企業中的執行長。"},{"id":"J45","t":"J","s":45,"d":36,"en":"Possession","zh":"所有權","th":"有影響力的人，會為了社群，而接掌統治者的角色，在面臨危機或衝突時，能掌控一切。"},{"id":"L45","t":"L","s":45,"d":36,"en":"Confrontation","zh":"衝突","th":"在面臨危機和衝突時，支配家族資源的人，他們會站出來對抗或挑戰那些想掌控的人，堅持自己的要求。"},{"id":"R46","t":"R","s":46,"d":15,"en":"Vessel of Love","zh":"愛之船3","th":"身體力行，完全與其身體同步，能夠享受關係中的身體（感官）互動；為了生活本身，獻身於生活。"},{"id":"J46","t":"J","s":46,"d":52,"en":"Serendipity","zh":"因緣俱足","th":"這些人專注於讓自己在對的時間，出現在對的地點，他們了解正確的承諾（以及努力工作），能夠獲得財富和成功；完全享受活著的感覺。"},{"id":"L46","t":"L","s":46,"d":52,"en":"Healing","zh":"療愈2","th":"當他們與非關個人的宇宙之愛有所連結，會自然地療愈別人或是被療愈了；他們難能可貴，充滿喜悅的天賦，將透過專注、有承諾的連結，得以實現。"},{"id":"R47","t":"R","s":47,"d":45,"en":"Rulership","zh":"統領3","th":"引領過往的一切向前，秉持優雅的姿態，選擇性地借用傳統，或從經驗中學到的教訓，宣稱其統治的正當性。"},{"id":"J47","t":"J","s":47,"d":12,"en":"Oppression","zh":"壓抑","th":"運用對過去的了解，來推廣新的想法或概念，或是以新觀念來取代現有的認知。"},{"id":"L47","t":"L","s":47,"d":12,"en":"Informing","zh":"告知2","th":"有社交技巧，擅長運用過往的經歷，啟發人心，轉移人們的注意力，看見那些被壓抑的人，所面對的困境，告知是一門藝術。"},{"id":"R48","t":"R","s":48,"d":39,"en":"Tension","zh":"張力3","th":"這些人具備內在深度，真正了解問題所在，激發別人的技能、精神、意志，提供可行的解決方案。"},{"id":"J48","t":"J","s":48,"d":53,"en":"Depth","zh":"深度","th":"有影響力的人，以他們的深度來拓展個人抱負，擴大朋友圈，讓自己有更多機會，能帶給人們衝擊、教導或幫助，使他人的不足得以蛻變，開創新事物。"},{"id":"L48","t":"L","s":48,"d":53,"en":"Endeavor","zh":"努力2","th":"這些人有強烈的控制欲，因為這樣他們才能發揮自己的深度；宛如獨立出版者「我會自己搞定」的態度。"},{"id":"R49","t":"R","s":49,"d":43,"en":"Explanation","zh":"解釋","th":"四處遊歷的先知，為滿足生存所需，而指出必要的基本需求，並說明其中的必要原則；對於有所需求的人很敏感。"},{"id":"J49","t":"J","s":49,"d":14,"en":"Principles","zh":"原則","th":"他們是革命家，行走於時代尖端，固守原則（通常與人權有關），為了要獲得強而有力的盟友，甚至願意與神交易。"},{"id":"L49","t":"L","s":49,"d":14,"en":"Revolution","zh":"革命","th":"革命家，了解若人處饑餓中，和平不可得，認為擁有資源的人一定要分享給缺乏資源的人。"},{"id":"R50","t":"R","s":50,"d":56,"en":"Laws","zh":"律法3","th":"順應物種演化，他們創造、適應或評估法律及其價值，基於人類面對突變與改變時，求存的本能，將制訂法律視為充滿創意的內化歷程。"},{"id":"J50","t":"J","s":50,"d":31,"en":"Values","zh":"價值","th":"有影響力的人，抓住機會軟化或減輕法律的嚴苛，好確保罪責與罪行相當。"},{"id":"L50","t":"L","s":50,"d":31,"en":"Wishes","zh":"希望2","th":"超越傳統價值，具備理想主義的傾向，挑戰既定的文化與宗教準則，期待改變體系，找到不同作法的可能。"},{"id":"R51","t":"R","s":51,"d":54,"en":"Penetration","zh":"滲透","th":"這些人會在不經意間，以他們具滲透力的直覺洞見來吸引人們的注意力；他們的觀點出乎意料，總能帶來轉換，或為我們既定認知帶來突變。"},{"id":"J51","t":"J","s":51,"d":61,"en":"Shock","zh":"驚嚇","th":"他們以細節與自身直覺的洞見，帶來驚嚇，好讓人別過於嚴肅或自滿。"},{"id":"L51","t":"L","s":51,"d":61,"en":"The Clarion","zh":"號角","th":"他們此生是為了驚嚇那些已經準備好覺醒的人，也就是那些對突變保持開放態度，能夠接受號角所帶來的靈感與直覺的洞見。"},{"id":"R52","t":"R","s":52,"d":17,"en":"Service","zh":"服務2","th":"有邏輯的人，肩負著責任（以及動能），確保我們采取正確的運作模式，走向未來。"},{"id":"J52","t":"J","s":52,"d":21,"en":"Stillness","zh":"靜止","th":"安靜愉悅地建立人際網絡；以潛在的深度或解決方法，創造機會，影響他人。"},{"id":"L52","t":"L","s":52,"d":21,"en":"Demands","zh":"要求","th":"為了使社會運作無虞，這些人要求找到解決辦法、完成修正，並且強制執行。"},{"id":"R53","t":"R","s":53,"d":51,"en":"Penetration","zh":"滲透2","th":"在當下看起來似乎很快樂，試圖開始新事物來獲得認同，並為此感到壓力；他們能憑直覺而知道如何引發別人加入其行列。"},{"id":"J53","t":"J","s":53,"d":42,"en":"Beginnings","zh":"開始","th":"非常受歡迎的人，為蛻變的新循環、新開始灌注能量，評估成本、價值（社交能力），以及計畫的持續性。"},{"id":"L53","t":"L","s":53,"d":42,"en":"Cycles","zh":"循環","th":"<mark class=\"k\">有能力的人，能夠推動蛻變的循環走向成熟階段，並且順利完成。</mark>理解唯一持久不變的就是改變。"},{"id":"R54","t":"R","s":54,"d":57,"en":"Penetration","zh":"滲透4","th":"這些人在由貧致富的過程中，受到上位者的認同；向更高的力量（甚至是神秘力量）看齊。"},{"id":"J54","t":"J","s":54,"d":32,"en":"Ambition","zh":"抱負","th":"帶來蛻變的媒介，充滿影響力卻又相對保守，被恐懼所驅動，需要完成自身的承諾，是一個永遠不會滿足的人。"},{"id":"L54","t":"L","s":54,"d":32,"en":"Cycles","zh":"循環2","th":"<mark class=\"k\">充滿野心，為了個體與國家（以及自己）助長蛻變性的改變發生。</mark>奉獻一己之力，完整並完成每個循環，讓一切延續。"},{"id":"R55","t":"R","s":55,"d":34,"en":"Sleeping Phoenix","zh":"沉睡的鳳凰","th":"<mark class=\"k\">透過愛與連結，他們忙於尋找通往靈性道路的可能，而在過程中體驗到蛻變（死亡與重生）。</mark>","note":"直到二〇二七年為止"},{"id":"J55","t":"J","s":55,"d":9,"en":"Moods","zh":"情緒","th":"渴求深度、渴望知道真理的人，他們的情緒穩定，具有強烈創造潛能；充滿創意的老師。"},{"id":"L55","t":"L","s":55,"d":9,"en":"Spirit","zh":"靈魂","th":"透過創造力、好吃的食物和性伴侶關係，尋找其靈魂與生命的樂趣。"},{"id":"R56","t":"R","s":56,"d":3,"en":"Laws","zh":"律法2","th":"<mark class=\"k\">懂得如何說故事，用理想主義的見解和信念，引發他人。</mark>他們的魔法與諸多承諾相關，是夢想家的夢想。"},{"id":"J56","t":"J","s":56,"d":27,"en":"Stimulation","zh":"刺激","th":"為了讓生命有意義，他們願意冒險，追求更多刺激，他們是說故事的人，在訴說自己的故事時，得到釋放。"},{"id":"L56","t":"L","s":56,"d":27,"en":"Distraction","zh":"分心","th":"看似心不在焉，卻能透過充滿啟發性的對話，吸引眾人將注意力轉向自己，或其計畫上。"},{"id":"R57","t":"R","s":57,"d":53,"en":"Penetration","zh":"滲透3","th":"具備高度靈敏的直覺，能夠清晰看透世事；具有競爭優勢的清晰，能引領我們開拓新領域，緩和對未來的恐懼。"},{"id":"J57","t":"J","s":57,"d":62,"en":"Intuition","zh":"直覺","th":"具有深刻的見解，並帶來啟發；他們運用自我的直覺、細節、理解和衝擊，讓人打開心防並接收訊息。"},{"id":"L57","t":"L","s":57,"d":62,"en":"The Clarion","zh":"號角2","th":"直覺敏銳，通常能帶來別人需要或想要的訊息，人們需要找到他們，要求指引。"},{"id":"R58","t":"R","s":58,"d":18,"en":"Service","zh":"服務4","th":"由於生命充滿喜悅，如此奇妙，驅動他們勇於挑戰規範，透過服務社會的諸多理念和形式，讓一切井井有條運作無虞，漸趨完美。"},{"id":"J58","t":"J","s":58,"d":48,"en":"Vitality","zh":"活力","th":"這些人擁有令人向往的生命力及續航力，他們了解控制能量、以及如何分配的重要性，包括如何分配，以及分配給誰。"},{"id":"L58","t":"L","s":58,"d":48,"en":"Demands","zh":"要求2","th":"如果能得到自己想要的回饋，這些人願意將自己的能量投注於別人的計畫，或是追求技能上的完美；最好的防守就是進攻。"},{"id":"R59","t":"R","s":59,"d":20,"en":"Sleeping Phoenix","zh":"沉睡的鳳凰3","th":"強大的生育者，忙著「制造更多」以確保未來的安全；在連結中得到親密與安全感。"},{"id":"J59","t":"J","s":59,"d":16,"en":"Strategy","zh":"策略","th":"<mark class=\"k\">總是將焦點放在如何善用機會，制定策略，好與人親密。</mark>具備配對作媒的才能。"},{"id":"L59","t":"L","s":59,"d":16,"en":"Spirit","zh":"靈魂2","th":"如果他們覺醒而察覺，性與愛情的課題，就能從生命和經驗中轉化，賦予他們智慧；透過靈性，轉化愛與性的關係。"},{"id":"R60","t":"R","s":60,"d":50,"en":"Laws","zh":"律法4","th":"這些人接受評估以及改變所衍生的枝節，皆有其限制，同時仍願意維持傳統價值，例如我們於法律中明文規定「人不該殺戮」。"},{"id":"J60","t":"J","s":60,"d":28,"en":"Limitation","zh":"限制","th":"足智多謀的人，能將隱藏於限制中的潛能發揮至極致；透過冒險來尋求人生的目的，同時滋養自己及他人，以測試每一種限制的界線。"},{"id":"L60","t":"L","s":60,"d":28,"en":"Distraction","zh":"分心2","th":"以藝術的形式讓人分心，宛如魔術師般，能透過刺激和冒險的行事，超越限制。"},{"id":"R61","t":"R","s":61,"d":32,"en":"Maya","zh":"馬雅4","th":"啟發人（或被啟發）的思想家，他們須運用其頭腦來服務別人，如此才能避免自己因為無法得知的事物而惱怒；在事實和細節中尋找宇宙的真理，解開生與死的課題。"},{"id":"J61","t":"J","s":61,"d":50,"en":"Thinking","zh":"思考","th":"聰明的人，熱愛追求知識，進入內在，巨細靡遺深入其洞見，所具備的深度，足以改變既定的觀念，會是個好律師。"},{"id":"L61","t":"L","s":61,"d":50,"en":"Obscuration","zh":"朦朧2","th":"他們被啟發的覺知（來自內在真理與宇宙法則的幽暗黑箱）能詳細道出絕對的普世法則，這些規則極容易被世人所忽略。"},{"id":"R62","t":"R","s":62,"d":42,"en":"Maya","zh":"馬雅2","th":"教育帶來強大的力量，他們知道邏輯可以帶來蛻變或療愈；運用創造力，以語言命名，描述那隱藏於細節之中，屬於內在的真實，使之成形。"},{"id":"J62","t":"J","s":62,"d":3,"en":"Detail","zh":"細節","th":"擅長運用大量細節，來表達意見；若著眼於法律或制定法則時，他們會成為好律師。"},{"id":"L62","t":"L","s":62,"d":3,"en":"Obscuration","zh":"朦朧","th":"這些人對於細節或統計的處理，能到達令人讚嘆或費解的地步。<mark class=\"k\">經過整理，原本晦澀難解的細節中，可能會帶來偉大的發現。</mark>"},{"id":"R63","t":"R","s":63,"d":5,"en":"Consciousness","zh":"意識","th":"除了基本需求，透過質疑／測試既定模式，他們想明白人生所為何來，隨順生命之流，進而超脫對更多體驗的渴求。"},{"id":"J63","t":"J","s":63,"d":26,"en":"Doubts","zh":"懷疑","th":"聰明、令人信服，具有影響力的懷疑論者，有能力說服他人，以邏輯性的解釋來平衡其體驗。"},{"id":"L63","t":"L","s":63,"d":26,"en":"Dominion","zh":"支配","th":"在特定狀況下，他們強大的智慧充滿力量，足以掌控一切，有能力帶來質疑與困惑，以取得主權。"},{"id":"R64","t":"R","s":64,"d":35,"en":"Consciousness","zh":"意識3","th":"以過往經驗與既定模式相比，協助他人了解自己過往的模式，因而對人生產生全新的想法與理解。"},{"id":"J64","t":"J","s":64,"d":45,"en":"Confusion","zh":"困惑","th":"鼓舞人心的歷史學家、信息的泉源，他們的記憶源於家族層級，並取決於自我的詮釋／操控。"},{"id":"L64","t":"L","s":64,"d":45,"en":"Dominion","zh":"支配2","th":"詮釋過去，具有極大的影響力；運用信息而位居要職或成為權威人士。"}];
const LN={"1":{"h":"透過獨特的表達，展現屬於自己的創造力","i":["第1閘門位於 G 中心，屬於個體回路。<mark class=\"k\">它關注的不是單純做出什麼作品，而是一個人如何透過自己的方式表達生命中的獨特性。</mark>"],"L":{"1":{"t":"我需要先建立自己的創作基礎","b":["<mark class=\"k\">核心：基礎與穩定。</mark>","","這一爻關注的是創造力有沒有可以依靠的基礎。","","生活中可能會表現為：","•   想做一件事時，希望先掌握基本知識。","•   創作前，喜歡先了解工具、技巧或方法。","•   不喜歡還沒弄清楚，就急著展示自己的作品。","•   希望自己的表達有一定的根基，而不是只靠一時衝動。","","它不是沒有創造力，而是需要先建立基礎，才比較容易安心地表達自己。"],"q":["當你想做一件新的事情時，你會先嘗試表達，還是希望先把基礎準備好？"],"s":["1.1 的重點是基礎和安全感。","所以可能會很在意：","「我到底喜歡什麼？什麼才是真的屬於我？」","例如：","•   想先學習基本功","•   做事情前會先研究","•   不喜歡還沒準備好就展示","•   會慢慢建立自己的風格","它不是單純「沒自信」。","而是：","「我先知道自己在做什麼，才有安全感去表達。」"]},"2":{"t":"我的創造力需要自然地流露","b":["<mark class=\"k\">核心：天賦與自然表達。</mark>","","這一爻強調一種不需要刻意制造的創造力。","","生活中可能會表現為：","•   有些想法自然就會出現，不一定經過長時間計劃。","•   做自己喜歡的事情時，容易進入狀態。","•   別人可能很欣賞你的某種表達方式，但你自己覺得很平常。","•   不喜歡被要求按照固定的方法創造。","","它不是刻意證明自己有創意，而是當你處於自然的狀態時，獨特的表達可能就會出現。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["有沒有一些事情是你做起來很自然，但別人卻覺得你很有創意的？"],"s":["1.2 比較像：","「我就是這樣。」","可能不需要特別學習，就自然有：","•   審美","•   創意","•   表達方式","•   獨特品味","別人可能比自己更早發現：","「這個很有你的感覺。」","它不是單純「有天賦」。","而是：","「這個東西本來就在我裡面。」"]},"3":{"t":"我需要透過嘗試，找到自己的表達方式","b":["<mark class=\"k\">核心：試驗與調整。</mark>","","這一爻可能需要透過實際體驗，逐漸找到適合自己的創造方式。","","生活中可能會表現為：","•   嘗試不同的興趣、風格或表達方法。","•   做過以後才知道自己真正喜歡什麼。","•   作品可能不斷修改，不會第一次就滿意。","•   有時會推翻原本的想法，再重新嘗試。","","它不是沒有方向，而是需要透過嘗試和調整，慢慢發現什麼表達方式真正適合自己。"],"q":["你有沒有經歷過一開始以為自己喜歡某種方式，真正嘗試以後才發現，原來自己更喜歡另一種？"],"s":["1.3 的重點是嘗試、碰撞、調整。","可能經歷：","「我試試看。」","「好像不適合。」","「換一個。」","「這個比較像我。」","所以不是「沒有固定風格」。","而是：","「我需要真正試過，才知道什麼是我的。」"]},"4":{"t":"我的創造力可以透過人與人的交流被看見","b":["<mark class=\"k\">核心：人際交流與影響。</mark>","","這一爻強調創造力如何在關系和交流中流動。","","生活中可能會表現為：","•   與別人交流後，產生新的創作靈感。","•   朋友的分享可能啟發你看見不同的可能性。","•   你表達出來的想法，可能影響身邊的人。","•   有些創造機會來自熟悉的人或原有的人際圈。","","它不是一定要依賴別人才能創造，而是人與人的交流，可能成為你表達獨特性的一個出口。"],"q":["你的靈感通常是自己一個人時出現，還是跟別人交流後，反而更容易產生新的想法？"],"s":["4 爻進入人與人的連接。","可能通過：","•   朋友","•   熟人","•   工作圈","•   社群","讓自己的創作被看見。","它不是單純「喜歡社交」。","而是：","「我的表達會透過人與人的關係傳播出去。」"]},"5":{"t":"我希望自己的創造力能夠產生實際影響","b":["<mark class=\"k\">核心：把獨特表達轉化成別人能夠理解或使用的東西。</mark>","","這一爻可能容易被別人投射期待，希望你能夠提出有用的想法或解決方案。","","生活中可能會表現為：","•   別人會來找你，希望你提出新的做法。","•   你不只想表達自己，也希望作品能夠帶來某種影響。","•   可能會思考怎樣讓自己的創意更容易被大眾接受。","•   當別人不理解你的表達時，可能會感到失落。","","它不是為了迎合所有人，而是需要留意：別人期待你提供某種價值，不代表你必須按照別人的期待創造。"],"q":["當別人很期待你的作品或想法時，你會更有動力，還是反而覺得自己受到限制？"],"s":["5 爻容易出現投射。","別人可能覺得：","「你這麼有創意，應該有辦法。」","於是別人會找你：","•   設計","•   想辦法","•   改東西","•   創造解決方案","它不是單純「創意很多」。","而是：","「別人會期待我的創造具有實際價值。」"]},"6":{"t":"我會逐漸理解，什麼才是屬於自己的創造力","b":["<mark class=\"k\">核心：觀察、成熟與長期視角。</mark>","","這一爻比較關注創造力如何隨著人生經驗逐漸成熟。","","生活中可能會表現為：","•   不再急著證明自己有多特別。","•   開始觀察哪些表達真正符合自己。","•   隨著經歷增加，創造方式可能發生變化。","•   能夠接受自己的創作有時活躍、有時安靜。","","它不是永遠保持同一種風格，而是逐漸理解，創造力可以隨著人生階段不斷變化。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["回頭看過去的自己，你覺得自己的表達方式有沒有隨著年龄或經歷而改變？"],"s":["6 爻會退一步觀察。","可能慢慢發現：","「我不需要一直證明自己特別。」","也會開始接受：","•   我的風格會改變","•   我的興趣會改變","•   不需要所有人喜歡","•   創造不等於證明價值","所以最後是：","「我可以表達自己，也可以允許自己改變。」"]}},"oh":"創造與自我表達","oi":["1 號閘門的核心是創造、表達自己的獨特性。","它不是單純「喜歡藝術」。","而是：","「我想把屬於我的東西表達出來。」"]},"2":{"h":"接收生命提供的資源，並逐漸找到適合自己的方向","i":["第2閘門位於 G 中心。<mark class=\"k\">它與方向感有關，但不代表一個人隨時都能清楚說出人生目標。</mark>有時，方向會在經歷和回應中逐漸顯現。"],"L":{"1":{"t":"我需要先確認，自己有沒有可以依靠的方向","b":["<mark class=\"k\">核心：基礎與安全感。</mark>","","這一爻關注的是方向是否具有一定的基礎。","","生活中可能會表現為：","•   面對重要選擇時，希望先掌握足夠的信息。","•   不喜歡完全沒有準備，就贸然改變人生方向。","•   選擇工作或學習路径時，會考慮現實條件。","•   當未來太不明確時，可能會想先建立一個穩定的起點。","","它不是一定要規劃好整個人生，而是需要先有一個可以開始行動的基礎。"],"q":["當你面對一個重要的人生選擇時，你需要先確定哪些事情，才會覺得比較安心？"],"s":["重點是安全感和基礎。","可能很在意：","「這到底是不是我要走的路？」","所以不喜歡：","•   被別人安排人生","•   因為別人覺得好就去做","•   沒有確認感就行動","它不是單純「猶豫」。","而是：","「我要知道這條路是不是屬於我。」"]},"2":{"t":"我的方向有時會自然地出現","b":["<mark class=\"k\">核心：自然的方向感。</mark>","","這一爻強調不一定需要刻意尋找方向，有時適合自己的道路會自然顯現。","","生活中可能會表現為：","•   某些機會出現時，內心自然覺得可以嘗試。","•   別人問你為什麼選擇這條路，你可能很難完整解釋。","•   你不一定會主動尋找所有機會，卻可能被合適的機會吸引。","•   別人可能看見你適合什麼，但你自己未必立即意識到。","","它不是完全不需要做選擇，而是有些方向不一定靠反覆思考得出，可能是在自然的經歷中逐漸顯現。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["你有沒有過一種經驗：當時沒有特別計劃，但後來發現，那次選擇反而帶你走向很適合自己的方向？"],"s":["2.2 比較像：","「我沒有特別找，但它自己來了。」","可能突然：","•   遇見一個人","•   得到一個機會","•   接觸一件事情","•   對某個方向產生感覺","所以不是單純「隨緣」。","而是：","「有些方向不是找出來的，是接收到的。」"]},"3":{"t":"我需要透過經歷，調整自己前進的方向","b":["<mark class=\"k\">核心：試驗與修正。</mark>","","這一爻可能需要實際走過一段路，才能知道方向是否適合自己。","","生活中可能會表現為：","•   開始時覺得某個選擇不錯，後來發現不適合。","•   可能轉換工作、學習領域或生活方式。","•   透過錯誤和挫折，逐漸了解自己真正需要什麼。","•   不一定一開始就能確定最終要去哪裡。","","它不是沒有方向，而是方向感可能在經歷中不斷被修正。"],"q":["你過去有沒有因為實際嘗試過某件事，才更清楚自己不想要什麼，或者真正適合什麼？"],"s":["2.3 需要實際經驗。","可能：","「先試試看。」","然後：","「好像不是。」","再換方向。","所以不是迷路。","而是：","「我需要親自走過，才知道哪一條路屬於我。」"]},"4":{"t":"我的方向可能在關系與環境中逐漸清晰","b":["<mark class=\"k\">核心：透過關系和環境接觸方向。</mark>","","這一爻強調周圍的人和環境，可能成為你接觸新方向的途径。","","生活中可能會表現為：","•   因為朋友介紹而接觸新的工作機會。","•   在某個團體中，發現自己對某個領域有興趣。","•   透過別人的經驗，看見原本沒有考慮過的道路。","•   合適的人際環境可能讓你更容易發揮自己的潛力。","","它不是必須跟隨別人，而是關系和環境可能幫助你看見原本沒有注意到的方向。"],"q":["你人生中有沒有一些重要的方向，是因為遇到某個人、進入某個環境，才慢慢發現的？"],"s":["可能因為：","•   一個朋友","•   一個工作機會","•   一個合作","•   一個環境","才發現新的方向。","所以不是依賴別人。","而是：","「人與人的連接，會成為我看見方向的入口。」"]},"5":{"t":"別人可能期待我為他們指出方向","b":["<mark class=\"k\">核心：方向的投射與實際應用。</mark>","","這一爻可能容易讓別人覺得你知道該往哪裡走，或希望你提供方向。","","生活中可能會表現為：","•   別人會問你該選擇哪條路。","•   你可能很自然地看見某件事情可以往哪裡發展。","•   別人期待你給出明確答案，但你未必總是有答案。","•   當別人把方向的責任交給你時，你可能感到壓力。","","它不是你必須替每個人決定人生，而是別人對你的方向感可能有期待。你仍然需要分辨，哪些責任真正屬於自己。"],"q":["你有沒有發現，別人有時會來問你意見，希望你告訴他們下一步該怎麼走？"],"s":["別人可能來問：","「你覺得我應該做什麼？」","「你覺得我該換工作嗎？」","所以容易成為別人眼中的「方向提供者」。","但：","別人期待你知道，不代表你真的需要替別人決定。"]},"6":{"t":"我會逐漸理解，方向不一定需要急著確定","b":["<mark class=\"k\">核心：成熟的方向感與觀察。</mark>","","這一爻可能更關注方向如何隨著時間逐漸清晰。","","生活中可能會表現為：","•   不再因為暫時沒有目標，就認為自己落後。","•   能夠接受人生有些階段需要先觀察。","•   經過一段經歷後，才明白當時的選擇帶來了什麼。","•   比起急著得到答案，更願意讓方向隨著生活逐漸顯現。","","它不是被動等待，而是理解方向感可能需要時間累積，不一定每個階段都要有明確答案。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["當你暫時不知道下一步該怎麼走時，你通常會急著找答案，還是願意先經歷一段時間再決定？"],"s":["6 爻開始觀察：","「原來方向也會改變。」","以前適合的：","•   工作","•   關係","•   生活","•   目標","未來不一定適合。","所以最終是：","「我可以相信方向會隨著生命階段改變。」"]}},"oh":"方向與接收","oi":["2 號閘門是內在方向、接收生命帶來的方向。","它不是：","「我要趕快決定人生目標。」","而更像：","「當我允許自己接收，方向會慢慢出現。」"]},"3":{"h":"在混亂和變化中，逐漸找到新的秩序","i":["第3閘門位於薦骨中心，屬於個體回路。<mark class=\"k\">它與開始新事物時可能經歷的混亂、調整和適應有關。</mark>"],"L":{"1":{"t":"我需要先找到一個可以開始的基礎","b":["<mark class=\"k\">核心：建立基礎與應對不確定性。</mark>","","這一爻關注的是面對變化時，如何建立最初的穩定。","","生活中可能會表現為：","•   開始新工作時，希望先弄清楚基本流程。","•   面對新任務時，需要先知道最重要的部分是什麼。","•   當事情太混亂時，會想先整理出一個可以執行的步驟。","•   不喜歡在完全沒有基礎的情況下，被要求立即表現。","","它不是不能接受變化，而是需要一個基本的起點，才能逐漸處理後續的復雜情況。"],"q":["當你開始一件完全不熟悉的事情時，你最需要先弄清楚什麼？"],"s":["重點是基礎。","面對新事情時可能會想：","「最基本應該怎麼做？」","所以會想先了解：","•   規則","•   流程","•   基本方法","不是怕改變。","而是：","「有一個基礎，我才敢面對變化。」"]},"2":{"t":"我可能有一種自然適應新情況的能力","b":["<mark class=\"k\">核心：自然的適應力。</mark>","","這一爻可能表現為，在某些變化中，你會自然找到自己的處理方式。","","生活中可能會表現為：","•   一開始看起來有點混亂，但慢慢就能進入狀態。","•   不一定需要別人詳細教你每一步。","•   在某些新環境中，能夠逐漸摸索出適合自己的做法。","•   別人可能覺得你適應得不錯，但你未必刻意訓練過這種能力。","","它不是所有變化都能輕松應對，而是在適合的情境中，可能自然發展出自己的適應方式。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["當你進入一個新的環境時，你通常需要別人一步一步帶著你，還是會慢慢摸索出自己的方法？"],"s":["不一定需要別人一步一步教。","可能：","「先做再說。」","然後做著做著就知道：","「原來可以這樣。」"]},"3":{"t":"我需要透過反覆嘗試，才能找到可行的方法","b":["<mark class=\"k\">核心：試驗、錯誤與調整。</mark>","","這是第3閘門很重要的一種表現：新的秩序可能不是一開始就存在，而是在嘗試中逐漸形成。","","生活中可能會表現為：","•   一個計劃執行後，發現很多地方需要修改。","•   可能試過幾種方法，最後才找到比較有效的做法。","•   面對突發情況時，會邊處理邊調整。","•   有時會覺得自己總是在重新開始。","","它不是注定混亂，也不是做不好事情，而是可能需要透過實際試驗，才能建立真正適合的系統。"],"q":["你有沒有一些事情，是經過幾次失敗或修改之後，才終於找到適合自己的方法？"],"s":["可能：","嘗試 → 出問題 → 調整 → 再試","它不是單純容易失敗。","而是：","「錯誤本身就是我找到新方法的一部分。」"]},"4":{"t":"我可以在群體中幫助事情慢慢建立秩序","b":["<mark class=\"k\">核心：透過關系與合作適應變化。</mark>","","這一爻可能在群體環境中展現處理混亂的能力。","","生活中可能會表現為：","•   團隊面對新項目時，你會協助大家逐步釐清流程。","•   你可能會在實際合作中發現哪些做法行不通。","•   與熟悉的人合作時，更容易找到解決問題的方式。","•   你可能透過溝通和交流，讓事情慢慢穩定下來。","","它不是你必須負責收拾所有混亂，而是你可能在合適的團隊和關系中，幫助事情逐漸形成秩序。"],"q":["當團隊開始一個新項目、大家還不太清楚該怎麼做時，你通常會怎麼參與？"],"s":["自己找到新方法之後，可能：","「大家跟著這樣做比較順。」","所以自己的改變開始變成團隊的新方式。"]},"5":{"t":"我可能被期待在混亂中提出解決辦法","b":["<mark class=\"k\">核心：把混亂轉化為實際可行的方法。</mark>","","這一爻容易讓別人期待你能夠處理問題、找出出路。","","生活中可能會表現為：","•   別人遇到突發狀況時，會來找你幫忙。","•   你可能擅長在問題出現後，迅速嘗試新的做法。","•   別人期待你解決問題，但未必理解你也需要試驗和調整。","•   如果別人要求你一次就成功，你可能會感到壓力。","","它不是每次都能立刻找到正確答案，而是你可能有能力在反覆嘗試中，把混亂逐漸轉化成可行的方案。"],"q":["別人遇到問題時，會不會很自然地來找你解決？當方法第一次行不通時，你通常會怎麼做？"],"s":["當事情亂起來，別人可能第一時間找你：","「你幫我看看怎麼辦。」","所以容易被放在「解決問題的人」的位置。"]},"6":{"t":"我會逐漸看懂，變化本來就需要一個過程","b":["<mark class=\"k\">核心：從經驗中觀察變化的規律。</mark>","","這一爻可能隨著經驗累積，逐漸看懂新事物從混亂走向穩定的過程。","","生活中可能會表現為：","•   不再要求所有新計劃一開始就很順利。","•   能夠看見一個方法需要經過哪些階段才會成熟。","•   面對別人暫時無法適應變化時，比較能理解過程的重要性。","•   逐漸知道什麼時候應該繼續調整，什麼時候可以讓事情穩定下來。","","它不是永遠旁觀，而是透過經驗看懂：新事物的形成往往需要時間、嘗試和適應。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["回顧過去，你有沒有發現，一些當時看起來很混亂的經歷，後來反而讓你建立了更適合自己的方法？"],"s":["慢慢看見：","「新的秩序，本來就需要經過混亂。」","所以不再要求所有事情一開始就完美。"]}},"oh":"從混亂到秩序","oi":["3 號閘門是開始、突變、從混亂中建立新的秩序。"]},"4":{"h":"透過邏輯思考，為問題尋找可能的答案","i":["第4閘門位於阿基那中心，屬於集體邏輯回路。<mark class=\"k\">它關注的是如何從問題出發，形成能夠解釋事情的答案或理論。</mark>"],"L":{"1":{"t":"我需要先弄清楚問題，才容易建立答案","b":["<mark class=\"k\">核心：基礎與邏輯依據。</mark>","","生活中可能會表現為：","•   面對一個問題時，喜歡先了解事情的來龍去脈。","•   不喜歡只聽結論，卻不知道為什麼。","•   做決定時，希望有一定的依據。","•   對於沒有解釋清楚的事情，可能會繼續尋找答案。","","它不是一定要知道所有答案，而是需要先有足夠的理解，才能建立相對穩定的判斷。"],"q":["當別人告訴你一個結論時，你會不會很自然地想知道：為什麼會這樣？"],"s":["會在意：","「這個說法到底有沒有根據？」","喜歡：","•   邏輯","•   基礎","•   清楚的解釋","不是單純理性。","而是：","「我需要理解，才有安全感。」"]},"2":{"t":"我可能自然就會想到一些解釋","b":["<mark class=\"k\">核心：自然形成答案的能力。</mark>","","生活中可能會表現為：","•   別人提出問題時，你會自然聯想到某種可能的解釋。","•   不一定需要刻意分析很久，就能提出一個想法。","•   別人可能覺得你很會分析，但你自己認為只是順著問題想了一下。","•   有時你會先有一個答案，之後才慢慢整理背後的理由。","","它不是每個直覺式答案都正確，而是你可能自然產生解釋問題的想法，仍然需要檢驗其依據。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["別人提出一個問題時，你會不會很快就想到某種解釋？之後你會再去驗證這個想法嗎？"],"s":["有時候別人講了一大堆：","「哦，我知道問題在哪裡了。」","不是刻意分析，而是自然抓到重點。"]},"3":{"t":"我需要反覆檢驗，才能知道答案是否可靠","b":["<mark class=\"k\">核心：試驗與修正。</mark>","","生活中可能會表現為：","•   一個答案聽起來合理，但你仍然會想找證據。","•   發現原本的解釋不成立時，願意重新思考。","•   會比較不同的方法，看看哪一種更符合事實。","•   有時因為不斷修正，別人會覺得你反覆改變想法。","","它不是沒有主見，而是通過檢驗和修正，逐漸讓答案變得更可靠。"],"q":["當你發現自己原本相信的答案可能有問題時，你會堅持原來的看法，還是願意重新研究？"],"s":["會：","「理論上應該這樣，那我試試看。」","實際做過之後再修正。","所以：","「我需要經驗告訴我，這個答案到底成立不成立。」"]},"4":{"t":"我的想法可能透過交流得到驗證","b":["<mark class=\"k\">核心：透過關系分享與檢驗想法。</mark>","","生活中可能會表現為：","•   喜歡跟熟悉的人討論某個問題。","•   透過別人的回應，發現自己遺漏了什麼。","•   與某些人討論時，特別容易整理出清晰的答案。","•   可能會把自己的解釋分享給身邊的人。","","它不是一定要別人認同自己，而是交流可能幫助你檢驗、補充或修正原本的想法。"],"q":["當你想不通一件事時，找人討論會幫助你更清楚，還是你比較習慣自己想？"],"s":["喜歡跟熟悉的人討論。","可能一句話讓別人突然：","「原來可以這樣想。」","所以理解會透過關係流動出去。"]},"5":{"t":"別人可能期待我提供明確的答案","b":["<mark class=\"k\">核心：將思考轉化為解決方案。</mark>","","生活中可能會表現為：","•   別人遇到問題時，希望你給出解釋。","•   工作中可能經常被要求分析原因。","•   你提出的觀點可能被當成解決問題的方向。","•   當別人急著要答案時，你可能感到必須盡快想出結果。","","它不是你必須解決所有人的疑問，而是別人可能把你看成能夠提供答案的人。你仍然可以承認自己不知道。"],"q":["當別人遇到問題時，會不會很自然地來問你原因，或者希望你幫他們分析？"],"s":["容易被期待：","「你幫我分析一下。」","「你覺得應該怎麼辦？」","所以要留意：","別人需要答案，不代表你必須成為所有人的答案提供者。"]},"6":{"t":"我會逐漸看懂，不是每個問題都需要立即回答","b":["<mark class=\"k\">核心：成熟的觀察與理解。</mark>","","生活中可能會表現為：","•   能夠接受某些問題暫時沒有答案。","•   不再因為別人質疑，就急著證明自己正確。","•   會觀察一個理論是否經得起時間和經驗的檢驗。","•   比起馬上給出結論，更重視答案是否真正合理。","","它不是放棄思考，而是逐漸理解，有些答案需要時間驗證，有些問題也可能暫時無法被解釋清楚。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["當一個問題暫時找不到答案時，你能夠先放著，還是會一直想弄清楚？"],"s":["開始發現：","「以前我相信這個答案，現在我會用不同角度看。」","所以理解變得更有彈性。"]}},"oh":"答案與理解","oi":["4 號閘門是把問題整理成一個可以理解的答案。"]},"5":{"h":"建立適合自己的節奏，並在生活中找到規律","i":["第5閘門位於薦骨中心，屬於集體邏輯回路。<mark class=\"k\">它與規律、節奏和可預測性有關。</mark>"],"L":{"1":{"t":"我需要找到「我的節奏」","b":["<mark class=\"k\">核心：基礎與安全感。</mark>","","這一爻的重點是建立穩定、可以依靠的生活節奏。","","所以可能會很在意：","•   固定時間睡覺。","•   固定工作流程。","•   固定運動時間。","•   做事情喜歡有規律。","•   不喜歡別人突然打亂自己的安排。","","它不是單純喜歡規律，而是規律可能讓你更清楚自己如何安排生活、使用能量，以及什麼時候適合做什麼。"],"q":["你有沒有發現，當生活有一定規律時，你會比較安心？如果原本的安排突然被打亂，你通常會有什麼反應？"],"s":["5.1 的重點是基礎和安全感。","所以可能會很在意：","「什麼樣的生活方式對我是穩定的？」","例如：","•   固定睡覺","•   固定工作流程","•   固定運動","•   做事有規律","•   不喜歡突然被打亂","它不是單純喜歡規律。","而是：","「這樣我才知道自己怎麼運作。」"]},"2":{"t":"我可能自然就有自己的生活習慣","b":["<mark class=\"k\">核心：自然形成的節奏。</mark>","","這一爻強調某些規律可能不需要刻意建立，就會自然出現。","","生活中可能會表現為：","•   自然形成自己習慣的工作時間。","•   身體可能會在固定時段感到餓或想休息。","•   有些事情做久了，就自然成為生活的一部分。","•   不一定喜歡刻意安排每一分鐘，卻會有自己的節奏。","","它不是一定要制定嚴格的時間表，而是你可能自然發展出一套適合自己的規律。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["你有沒有一些習慣，是不需要特別提醒自己，也會自然重複去做的？"],"s":["可能到了某個時間，身體自然：","•   想休息","•   想工作","•   想吃東西","•   想運動","所以重點是：","自然的節奏感。","別人覺得：","「你每天怎麼都差不多？」","本人可能：","「這樣不是很正常嗎？」"]},"3":{"t":"我需要透過嘗試，找到適合自己的節奏","b":["<mark class=\"k\">核心：透過經驗調整規律。</mark>","","生活中可能會表現為：","•   嘗試不同的作息時間。","•   試過不同的工作安排，才知道什麼時候效率比較好。","•   發現某種習慣不適合自己後，願意重新調整。","•   有時會因為生活改變，而重新建立新的規律。","","它不是無法維持規律，而是需要透過實際經驗，找到真正適合自己的節奏。"],"q":["你有沒有試過建立某種生活習慣，後來發現不適合自己，於是換成另一種方式？"],"s":["可能：","「這個作息適合我。」","後來發現不適合。","於是：","建立規律 → 發現不適合 → 打破 → 重新建立。","所以不是沒有規律。","而是：","「通過實際經驗找到真正適合自己的規律。」"]},"4":{"t":"我的節奏可能影響身邊的人","b":["<mark class=\"k\">核心：透過關系形成共同節奏。</mark>","","生活中可能會表現為：","•   家人逐漸習慣你的作息。","•   團隊會按照你習慣的流程安排工作。","•   與你長期合作的人，可能會自然配合你的節奏。","•   當你的生活節奏改變時，身邊的人也可能需要適應。","","它不是要你控制別人的生活，而是穩定的個人節奏可能自然影響共同生活或合作的方式。"],"q":["在家庭或工作中，身邊的人會不會慢慢習慣你的做事節奏？"],"s":["可能變成：","「每天 9 點這樣處理。」","「每星期五檢查一次。」","別人慢慢發現：","「跟著他的節奏做，事情比較順。」"]},"5":{"t":"我可能把自己的節奏整理成一套方法","b":["<mark class=\"k\">核心：將規律轉化為實際方案。</mark>","","生活中可能會表現為：","•   把自己的工作習慣整理成流程。","•   幫助團隊建立固定的工作安排。","•   別人會來問你怎樣規劃時間或安排事情。","•   你可能很擅長提出一種比較有規律、容易重複執行的方法。","","它不是每個人都必須按照你的方式生活，而是你可能有能力把自己驗證過的規律整理成別人也能參考的方法。"],"q":["你有沒有把自己習慣的做事方式整理成一套流程，讓其他人也可以跟著做？"],"s":["可能把自己的經驗變成：","•   流程","•   系統","•   工作習慣","•   方法","別人也會期待：","「你應該知道什麼方法最有效。」"]},"6":{"t":"我會逐漸理解，節奏也會隨著人生改變","b":["<mark class=\"k\">核心：成熟的規律感與長期觀察。</mark>","","生活中可能會表現為：","•   知道不同人生階段需要不同的作息。","•   不會因為暫時失去規律，就認為自己失敗。","•   能夠觀察什麼時候需要維持原有節奏，什麼時候需要改變。","•   更懂得在穩定與彈性之間取得平衡。","","它不是永遠保持最規律的生活，而是逐漸理解，真正適合自己的節奏可能會隨著工作、家庭和人生階段改變。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["當你的工作或生活進入新階段時，你會堅持原來的習慣，還是會重新調整自己的節奏？"],"s":["可能以前 6 點運動最適合。","後來生活改變了。","於是理解：","「現在的生命階段，可能需要新的節奏。」","所以不是最規律。","而是：","知道什麼時候需要規律，什麼時候需要改變規律。"]}},"oh":"節奏與規律","oi":[]},"6":{"h":"在情緒與關系的摩擦中，學習理解界限與親密","i":["第6閘門位於情緒中心，與關系中的摩擦、情緒界限及親密互動有關。"],"L":{"1":{"t":"我需要先確認關系是否安全","b":["<mark class=\"k\">核心：建立關系的基礎與界限。</mark>","","生活中可能會表現為：","•   不會輕易對剛認識的人敞開心扉。","•   希望先觀察對方是否值得信任。","•   對關系中的衝突比較謹慎。","•   在建立親密關系之前，需要時間了解對方。","","它不是不願意親近別人，而是需要一定的安全感，才能逐漸放下防備。"],"q":["你通常需要認識一個人多久，才會比較願意向對方表達真實的自己？"],"s":["會很在意：","「這個人讓我安全嗎？」","所以可能不會輕易打開自己。","它不是冷淡。","而是：","「我要先確認這個關係是否值得靠近。」"]},"2":{"t":"我可能自然就知道，自己願意跟誰親近","b":["<mark class=\"k\">核心：自然的關系感受。</mark>","","生活中可能會表現為：","•   對某些人自然感到自在，對另一些人則需要距離。","•   不一定能說清楚為什麼，只是感覺相處起來比較舒服或不舒服。","•   不喜歡被迫與別人快速建立親密關系。","•   有時會在關系中自然地靠近，有時則想保留自己的空間。","","它不是所有第一印象都準確，而是你可能自然對關系的親近程度有所感受，也需要觀察實際相處的情況。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["你有沒有遇過一些人，明明沒有發生什麼特別的事情，但你就是需要比較長的時間才能跟對方熟起來？"],"s":["可能對人與人的距離很敏感。","有些人：","「很自然就可以聊天。」","有些人：","「不知道為什麼就是不想靠近。」","所以是自然的界限感。"]},"3":{"t":"我需要透過關系中的摩擦，了解自己的界限","b":["<mark class=\"k\">核心：透過試驗與衝突學習。</mark>","","生活中可能會表現為：","•   一開始不清楚自己能接受什麼，發生衝突後才發現底線。","•   在關系中反覆經歷相似的問題。","•   逐漸學會表達不舒服，而不是一直忍耐。","•   透過不同的相處經驗，調整自己對親密的理解。","","它不是注定要經歷很多衝突，而是實際的關系經驗可能幫助你看見自己的界限，以及什麼樣的互動適合自己。"],"q":["你有沒有在一段關系中，經歷某件事以後，才真正發現自己不能接受什麼？"],"s":["會經歷：","靠近 → 摩擦 → 發現問題 → 調整距離。","所以不是關係不好。","而是：","「我通過真實互動學習怎麼與人相處。」"]},"4":{"t":"我需要在關系中找到合適的相處距離","b":["<mark class=\"k\">核心：關系中的界限與協調。</mark>","","生活中可能會表現為：","•   在親密與保留個人空間之間尋找平衡。","•   可能很重視關系裡的互相尊重。","•   發生摩擦時，希望雙方能夠溝通。","•   不喜歡關系過度黏在一起，也不喜歡完全沒有交流。","","它不是刻意保持距離，而是需要在關系中找到雙方都能接受的相處方式。"],"q":["在親密關系中，你比較需要經常黏在一起，還是需要保留自己的空間？"],"s":["可能成為關係裡一個穩定的人。","當別人情緒很強時，會開始影響整個關係的氣氛。"]},"5":{"t":"別人可能期待我處理關系中的問題","b":["<mark class=\"k\">核心：將關系經驗轉化為實際解決方式。</mark>","","生活中可能會表現為：","•   朋友遇到感情問題時，會來找你傾訴。","•   別人可能覺得你比較懂得處理人際摩擦。","•   你可能會嘗試幫助雙方找到可以接受的相處方式。","•   有時別人會把自己的關系問題交給你處理。","","它不是你必須負責修復所有關系，而是別人可能期待你提供建議。你也需要分辨，哪些問題應該由當事人自己面對。"],"q":["朋友遇到關系問題時，會不會經常來找你？你會不會覺得自己有責任幫他們解決？"],"s":["別人可能說：","「你比較懂我們之間的問題，你幫我說。」","所以容易被投射成關係協調者。"]},"6":{"t":"我會逐漸理解，親密關系需要時間與成熟","b":["<mark class=\"k\">核心：長期觀察與成熟的關系觀。</mark>","","生活中可能會表現為：","•   不再要求一段關系永遠沒有衝突。","•   能夠觀察一個人長期的行為，而不只看一時的情緒。","•   比較理解親密關系需要磨合。","•   更清楚什麼樣的界限能夠讓關系長久。","","它不是不再投入關系，而是逐漸理解，真正穩定的親密不一定沒有摩擦，而是雙方能夠逐漸學習如何面對摩擦。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["隨著年龄或經歷增加，你對親密關系的期待有沒有改變？現在的你會比以前更重視什麼？"],"s":["慢慢看見：","「親近不代表沒有界限。」","真正成熟不是避免所有衝突。","而是知道：","什麼時候靠近，什麼時候退一步。"]}},"oh":"摩擦與情緒界限","oi":["6 號閘門的核心是摩擦、親密關係、情緒界限。"]},"7":{"h":"在群體中辨識方向，並透過適當的角色影響集體","i":["第7閘門位於 G 中心，屬於集體邏輯回路。<mark class=\"k\">它與領導、方向和群體治理有關。</mark>這裡的領導不一定是職位上的領導，也可能是在某個團體中提供方向。"],"L":{"1":{"t":"我需要先弄清楚，什麼樣的方向才站得住腳","b":["<mark class=\"k\">核心：領導的基礎。</mark>","","生活中可能會表現為：","•   接手團隊任務前，希望先了解目標。","•   不喜歡沒有方向就要求大家行動。","•   希望領導的決定有一定的依據。","•   在承擔責任之前，會先觀察事情是否合理。","","它不是不願意承擔領導角色，而是需要先建立對方向和目標的理解。"],"q":["當你需要帶領別人做一件事時，你會不會先想弄清楚目標和方向？"],"s":["不是急著當領導。","而是會問：","「這個方向真的值得大家一起走嗎？」"]},"2":{"t":"我可能自然就看見群體需要什麼方向","b":["<mark class=\"k\">核心：自然的方向感。</mark>","","生活中可能會表現為：","•   在團隊討論時，自然注意到大家正在往哪裡走。","•   不一定主動爭取領導位置，卻可能在某些時刻提供方向。","•   別人可能覺得你很會判斷團體需要什麼。","•   你可能比較容易察覺某個團隊目前缺少什麼。","","它不是你一定比別人更有能力，而是你可能自然關注群體的方向，是否適合仍然需要結合具體情境。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["在一個團體中，你會不會自然留意大家有沒有共同目標，還是你更關注自己負責的部分？"],"s":["有時候別人會自然聽他的意見。","不一定刻意領導。"]},"3":{"t":"我需要透過帶領與合作的經驗，學習領導","b":["<mark class=\"k\">核心：試驗與調整領導方式。</mark>","","生活中可能會表現為：","•   嘗試帶領團隊後，發現原本的方法不適合。","•   可能經歷過別人不配合或溝通不順的情況。","•   從錯誤中學習如何分配責任。","•   逐漸知道什麼情況下適合自己站出來，什麼情況下應該讓別人帶領。","","它不是一開始就懂得如何領導，而是可能透過實際經驗，逐漸找到合適的領導方式。"],"q":["你有沒有帶領過一個團隊，後來才發現，原本以為有效的方法其實不適合？"],"s":["可能：","「這樣帶不行，那換一種。」","通過實踐學習怎麼帶人。"]},"4":{"t":"我可能透過關系與信任影響一個群體","b":["<mark class=\"k\">核心：透過人際網絡建立領導影響力。</mark>","","生活中可能會表現為：","•   身邊的人願意聽取你的意見。","•   你可能在熟悉的團隊中更容易發揮影響力。","•   透過建立信任，讓大家願意朝共同方向前進。","•   有時不是職位最高的人，卻可能是團隊中重要的協調者。","","它不是必須成為所有人的領導，而是影響力可能來自長期建立的關系與信任。"],"q":["你有沒有發現，在某些團體中，即使你不是負責人，別人還是會自然來問你的意見？"],"s":["別人願意跟隨，往往是因為：","「我相信這個人。」","所以關係很重要。"]},"5":{"t":"別人可能期待我站出來帶領大家","b":["<mark class=\"k\">核心：領導角色的投射與實際應用。</mark>","","生活中可能會表現為：","•   團隊遇到不確定的情況時，別人希望你做決定。","•   別人會期待你指出下一步該怎麼走。","•   你可能被看成有能力整合團隊的人。","•   當大家把所有責任交給你時，可能會感到壓力。","","它不是你必須承擔所有領導責任，而是別人可能把領導者的角色投射到你身上。你需要判斷自己是否適合承擔這個角色。"],"q":["當一個團隊沒有人願意做決定時，別人會不會期待你站出來？你自己願意承擔這個位置嗎？"],"s":["容易被推到：","「你決定吧。」","的位置。","但要注意：","別人投射你是領導者，不代表每件事都要由你決定。"]},"6":{"t":"我會逐漸看懂，領導不一定代表站在最前面","b":["<mark class=\"k\">核心：成熟的領導與集體觀察。</mark>","","生活中可能會表現為：","•   更懂得觀察群體真正需要什麼。","•   不再認為所有事情都必須由自己決定。","•   知道什麼時候應該帶領，什麼時候應該讓別人發揮。","•   能夠接受領導方式隨著團隊和環境而改變。","","它不是退出領導角色，而是逐漸理解，領導的重點不一定是控制所有人，而是讓群體找到適合的方向。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你覺得好的領導一定要親自決定所有事情嗎？還是懂得什麼時候讓別人發揮，也是一種領導能力？"],"s":["慢慢知道：","「真正的領導，是看見方向，而不是控制所有人。」"]}},"oh":"領導與方向","oi":[]},"8":{"h":"透過自己的獨特表達，為群體帶來貢獻","i":["第8閘門位於喉嚨中心，屬於個體回路。<mark class=\"k\">它關注的是一個人如何展現自己的風格，並讓這種獨特性對群體產生影響。</mark>"],"L":{"1":{"t":"我需要先弄清楚，自己真正想貢獻什麼","b":["<mark class=\"k\">核心：建立貢獻的基礎。</mark>","","生活中可能會表現為：","•   不希望只是為了參與而參與。","•   想先了解自己能夠提供什麼價值。","•   在表達自己的想法之前，會先觀察內容是否有意義。","•   不喜歡被要求模仿別人來證明自己的能力。","","它不是不願意貢獻，而是需要先找到自己真正想表達、也能夠承擔的部分。"],"q":["當你想參與一個項目或團體時，你會先思考自己能夠帶來什麼，還是會先加入再慢慢找位置？"],"s":["會想：","「我有什麼東西是可以帶給這個世界的？」"]},"2":{"t":"我的獨特風格可能自然就會被看見","b":["<mark class=\"k\">核心：自然的個人風格。</mark>","","生活中可能會表現為：","•   不刻意追求特別，卻有自己的表達方式。","•   別人可能記得你某種獨特的做事風格。","•   你可能覺得自己只是照平常的方式做事。","•   當別人要求你刻意模仿某個人時，反而不容易自然發揮。","","它不是一定要與眾不同，而是你可能透過自然的表達，呈現出與別人不完全相同的風格。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["別人有沒有說過你做事或表達的方式很有自己的風格，但你自己其實沒有刻意這樣做？"],"s":["不一定需要宣傳。","別人可能自然發現：","「你這個方式很特別。」"]},"3":{"t":"我需要透過嘗試，找到真正適合自己的表達方式","b":["<mark class=\"k\">核心：透過經驗調整表達。</mark>","","生活中可能會表現為：","•   嘗試不同的創作風格或工作方式。","•   發現模仿別人雖然有效，卻不一定適合自己。","•   在實際表達後，才知道什麼方式最自然。","•   可能會經歷一段不斷修改風格的時期。","","它不是為了變化而變化，而是透過實際嘗試，逐漸找到既能表達自己、又能帶來貢獻的方式。"],"q":["你有沒有嘗試過模仿別人的方式，後來才發現，還是自己的方法比較適合自己？"],"s":["可能不斷換：","•   工作方式","•   創作方式","•   表達方式","直到找到：","「這個最像我。」"]},"4":{"t":"我的貢獻可能透過人際關系被傳遞出去","b":["<mark class=\"k\">核心：透過關系擴大影響。</mark>","","生活中可能會表現為：","•   透過朋友或合作夥伴，讓自己的作品被更多人看見。","•   在團隊中提供不同於其他人的觀點。","•   可能很重視自己與合作對象之間的默契。","•   你的獨特做法可能在熟悉的圈子裡逐漸產生影響。","","它不是必須靠人脈才能成功，而是合適的關系可能幫助你的貢獻傳遞到更多人那裡。"],"q":["你過去有沒有因為認識某個人、加入某個團體，才有機會把自己的想法或作品分享出去？"],"s":["可能一個人的風格慢慢成為：","「我們這個圈子的特色。」"]},"5":{"t":"別人可能期待我提供獨特的解決方式","b":["<mark class=\"k\">核心：把個人風格轉化為可見的貢獻。</mark>","","生活中可能會表現為：","•   別人會希望你提出不同的想法。","•   在團隊中，你可能被期待帶來新的觀點。","•   別人可能欣賞你的風格，卻也可能希望你符合他們的期待。","•   你可能需要在保持獨特性與回應實際需求之間取得平衡。","","它不是為了滿足所有人的期待而刻意特別，而是讓自己的獨特表達在合適的地方發揮作用。"],"q":["當別人期待你提出不一樣的想法時，你會覺得受到鼓勵，還是會覺得自己必須表現得特別？"],"s":["容易被期待：","「你來，我們應該會不一樣。」","所以要注意不要背負「必須改變別人」的壓力。"]},"6":{"t":"我會逐漸理解，真正的貢獻不需要刻意證明","b":["<mark class=\"k\">核心：成熟的個人表達。</mark>","","生活中可能會表現為：","•   不再急著證明自己與別人不同。","•   更能接受自己的風格有時明顯、有時低調。","•   知道自己的貢獻不一定馬上被所有人理解。","•   更重視表達是否符合自己，而不只是外界如何評價。","","它不是不在乎別人，而是逐漸明白，獨特的貢獻不一定需要靠刻意表現來證明。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["隨著經驗增加，你有沒有變得比較不需要證明自己有多特別，而是更在意自己做的事情有沒有意義？"],"s":["最終：","「我不需要不斷證明自己的獨特，獨特本身就是貢獻。」"]}},"oh":"貢獻與個人風格","oi":[]},"9":{"h":"把注意力集中在重要的細節上，一步一步推進事情","i":["第9閘門位於薦骨中心，屬於集體邏輯回路。<mark class=\"k\">它與專注、細節和持續投入有關。</mark>"],"L":{"1":{"t":"我需要先找到值得專注的重點","b":["<mark class=\"k\">核心：專注的基礎。</mark>","","生活中可能會表現為：","•   面對任務時，希望先知道最重要的部分是什麼。","•   如果目標太模糊，可能比較難投入。","•   喜歡把大任務拆成幾個具體步驟。","•   當事情有明確重點時，比較容易持續處理。","","它不是只能做小事，而是需要找到可以集中注意力的切入點，才比較容易逐步推進。"],"q":["當你面對一件很大的任務時，你會不會先把它拆成幾個小步驟，才比較容易開始？"],"s":["不是所有事情都值得我的注意力。","會問：","「什麼值得我投入？」"]},"2":{"t":"我可能自然就能專注在某些細節上","b":["<mark class=\"k\">核心：自然的專注力。</mark>","","生活中可能會表現為：","•   做自己有興趣的事情時，可以長時間投入。","•   會自然留意別人忽略的小地方。","•   有時投入到某件事裡，會忘記周圍的時間。","•   對不感興趣的事情，則可能很難維持同樣的專注。","","它不是所有事情都能專注，而是某些事情可能自然吸引你的注意力，讓你願意深入其中。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["有沒有一些事情是你一旦開始做，就會不知不覺投入很久？"],"s":["一旦有興趣，可能：","「我怎麼一做就做了幾個小時？」"]},"3":{"t":"我需要透過嘗試，學習如何維持專注","b":["<mark class=\"k\">核心：調整注意力的方式。</mark>","","生活中可能會表現為：","•   嘗試不同的工作環境或時間安排。","•   發現某些任務需要分段完成，才不會太疲憊。","•   有時過度投入細節，後來才發現忽略了整體。","•   逐漸學會判斷什麼時候需要繼續深入，什麼時候應該先停下來。","","它不是專注力不足，而是可能需要透過經驗，找到最適合自己的投入方式。"],"q":["你有沒有遇過太專注某個細節，後來才發現自己忽略了更重要的事情？"],"s":["可能發現：","「這樣做太細了。","」","然後重新調整重點。"]},"4":{"t":"我的專注力可能幫助團隊把事情做好","b":["<mark class=\"k\">核心：在合作中落實細節。</mark>","","生活中可能會表現為：","•   團隊討論大方向時，你會留意執行細節。","•   能夠協助大家逐步完成任務。","•   與熟悉的夥伴合作時，比較容易知道哪些地方需要特別注意。","•   你可能成為團隊中持續跟進具體事項的人。","","它不是你必須負責所有細節，而是你的專注可能在合適的合作關系中，幫助事情真正落實。"],"q":["在團隊合作中，你比較常負責提出大方向，還是會自然注意執行過程中的細節？"],"s":["別人可能因為你專注某個細節，而發現：","「原來這裡真的很重要。」"]},"5":{"t":"別人可能期待我把事情落實到細節","b":["<mark class=\"k\">核心：將專注力轉化為實際成果。</mark>","","生活中可能會表現為：","•   別人會請你檢查工作有沒有遺漏。","•   你可能被期待持續跟進某項任務。","•   當別人只看到大方向時，你會想到執行上需要注意什麼。","•   有時別人把太多細節交給你，反而讓你無法專注在真正重要的部分。","","它不是你應該包辦所有琐事，而是你可能有能力專注於具體事項，同時仍需要判斷哪些任務值得投入。"],"q":["別人會不會經常把需要仔細跟進、不能遺漏細節的事情交給你？"],"s":["容易變成：","「你幫我檢查一下。」","「你應該不會漏掉吧？」"]},"6":{"t":"我會逐漸看懂，專注也需要知道什麼時候放下","b":["<mark class=\"k\">核心：成熟的專注與整體觀察。</mark>","","生活中可能會表現為：","•   能夠分辨哪些細節值得深入。","•   不再認為所有事情都必須做到完美。","•   知道什麼時候需要暫停，重新觀察整體。","•   更懂得把注意力放在真正重要的事情上。","","它不是減少認真，而是逐漸學會把專注用在值得投入的地方，而不是被每一個細節牽著走。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["當你發現自己在某件事上花了很多時間時，你會怎麼判斷自己應該繼續深入，還是先停下來看看整體？"],"s":["成熟後會知道：","「不是所有事情都需要我的注意力。」"]}},"oh":"專注與細節","oi":[]},"10":{"h":"透過真實的行為，學習如何以符合自己的方式生活","i":["第10閘門位於 G 中心，屬於個體回路。<mark class=\"k\">它與自我行為、生活方式，以及一個人如何對待自己有關。</mark>"],"L":{"1":{"t":"我需要先弄清楚，什麼樣的行為符合自己的原則","b":["<mark class=\"k\">核心：自我行為的基礎。</mark>","","生活中可能會表現為：","•   做決定時，會考慮自己是否認同這個做法。","•   不喜歡為了得到認同，就做違背自己原則的事情。","•   希望自己的行為有一定的一致性。","•   當自己做了不認同的事情時，可能會感到不自在。","","它不是永遠堅持同一套原則，而是需要先理解自己重視什麼，才比較容易做出符合內在認同的選擇。"],"q":["當你發現自己做了一件其實不認同的事情時，你通常會有什麼感覺？"],"s":["會在意：","「怎樣做才是我認可的自己？」"]},"2":{"t":"我可能自然就知道，什麼樣的行為適合自己","b":["<mark class=\"k\">核心：自然的自我表達。</mark>","","生活中可能會表現為：","•   不需要刻意模仿別人，也有自己的生活方式。","•   在自在的環境中，更容易表現真實的自己。","•   別人可能欣賞你自然流露的某種特質。","•   當別人要求你刻意改變成某種樣子時，可能會覺得不自在。","","它不是所有自然的行為都一定適合自己，而是你可能在不刻意迎合時，更容易展現符合自身的行為方式。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["在什麼樣的環境或關系中，你會覺得自己最自在，不需要刻意表現成別人期待的樣子？"],"s":["不需要刻意表現。","「我本來就會這樣做。」"]},"3":{"t":"我需要透過實際經歷，學習怎樣對待自己","b":["<mark class=\"k\">核心：透過經驗調整自我行為。</mark>","","生活中可能會表現為：","•   曾經為了迎合別人而改變自己，後來發現並不適合。","•   在不同關系中，逐漸看見自己會如何反應。","•   犯錯後，開始思考自己真正想成為怎樣的人。","•   透過經驗，重新調整對自己和他人的態度。","","它不是必須經歷很多錯誤，而是實際生活可能讓你更清楚自己的行為模式，以及哪些行為值得保留或改變。"],"q":["你有沒有經歷過一些事情以後，才發現自己不想再用以前的方式對待自己或別人？"],"s":["做錯、撞牆、重新調整。","不是失敗。","而是：","「我越來越知道什麼行為適合我。」"]},"4":{"t":"我可能透過與人的相處，更了解自己的行為","b":["<mark class=\"k\">核心：在關系中看見自己。</mark>","","生活中可能會表現為：","•   與不同的人相處時，會看見自己不同的一面。","•   某些關系會讓你更自在，某些關系則容易讓你迎合別人。","•   透過別人的反饋，發現自己原本沒有注意到的行為習慣。","•   在熟悉的關系中，可能更容易表現真實的自己。","","它不是需要別人來定義你是誰，而是人與人的互動可能成為一面镜子，讓你觀察自己平時如何行動。"],"q":["你有沒有發現，自己跟不同的人相處時，會表現出不一樣的一面？哪一種狀態最接近真實的你？"],"s":["別人可能看著你：","「原來可以這樣生活。」"]},"5":{"t":"別人可能期待我成為某種行為榜樣","b":["<mark class=\"k\">核心：行為的投射與示範。</mark>","","生活中可能會表現為：","•   別人會觀察你如何處理事情。","•   有人可能覺得你的生活方式值得參考。","•   別人會期待你表現得成熟、獨立或有原則。","•   當別人對你有很多期待時，你可能會感到必須維持某種形象。","","它不是你必須成為所有人的榜樣，而是別人可能把某種期待投射到你的行為上。你仍然可以按照真實情況生活，不必為了維持形象而壓抑自己。"],"q":["你有沒有感覺，別人會對你有某種期待，希望你一直表現得成熟、獨立，或者堅持自己的原則？"],"s":["所以容易出現：","「你應該這樣做，因為你不是一直都這樣嗎？」","要記得：","別人看到的你，不一定等於完整的你。"]},"6":{"t":"我會逐漸理解，真實地生活比維持形象更重要","b":["<mark class=\"k\">核心：成熟的自我認同。</mark>","","生活中可能會表現為：","•   不再需要一直證明自己是怎樣的人。","•   能夠接受自己也有不確定或需要調整的時候。","•   更願意觀察自己的行為是否符合內在認同。","•   逐漸理解，自我接納不代表不需要成長。","","它不是拒絕改變，而是知道改變可以來自真實的自我理解，而不只是為了滿足外界的期待。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["隨著人生經驗增加，你有沒有越來越不在意別人怎樣定義你，而是更在意自己是否活得自在、是否認同自己的選擇？"],"s":["最終：","「做自己不是固定一個樣子。」","而是知道：","「我可以隨著生命改變，但仍然是我。」"]}},"oh":"自我行為與做自己","oi":[]},"11":{"h":"想法、理念、圖像、故事與可能性","i":["第11號閘門位於阿基那中心，屬於抽象感知回路，主題與理念有關。","<mark class=\"k\">理解這個閘門時，要先分清楚：有想法，不代表一定要把想法實現。</mark>","一個人可能會有很多畫面、概念、故事和不同的可能性。這些理念可以幫助他理解經驗、分享觀點，但不是每一個想法都必須變成行動或現實。","六個爻的差異，則要看一個人如何建立、展現、嘗試、分享、應用，以及逐漸理解自己的理念。"],"L":{"1":{"t":"我需要先弄清楚這個想法的基礎","b":["<mark class=\"k\">核心：基礎、理解與安全感。</mark>","","11號閘門本身與理念有關，而第一爻會比較重視基礎。","","所以，當一個新想法出現時，他可能不會馬上滿足於一個模糊的概念，而是想先弄清楚：","","•   這個想法到底是什麼意思？","•   為什麼會有這樣的想法？","•   這個理念有沒有可以理解的基礎？","•   我真的理解它了嗎？","","例如，他突然對一個新領域產生興趣。","","別人可能已經開始討論這個領域的各種可能性，但他會先去搜集資料、了解背景，或者把基本概念弄清楚。","","當基礎還不清楚時，他可能很難安心地分享自己的看法。","","它不是單純喜歡研究資料，而是需要先建立對理念的基本理解，才比較能夠安心地面對這個想法。"],"q":["當你有一個新想法時，你會馬上分享，還是會先自己研究清楚？","如果一個概念還很模糊，你會不會一直想弄明白，直到自己覺得理解了？","你有沒有發現，自己必須先理解事情的來龍去脈，才比較敢表達自己的看法？"],"s":["會喜歡：","•   閱讀","•   學習","•   收集資料","•   理解事情","因為：","「我要先知道，才有辦法形成自己的想法。」"]},"2":{"t":"我的想法常常是自然出現的","b":["<mark class=\"k\">核心：自然的靈感與理念表達。</mark>","","第二爻可以幫助我們理解某種特質如何自然地流露。","","放在11號閘門上，可能表現為：這個人不一定刻意尋找靈感，想法卻會自然地出現。","","例如：","","•   看一部电影時，突然聯想到另一個故事。","•   和朋友聊天時，自然產生新的觀點。","•   看見一件日常小事，就想到不同的可能性。","•   腦海裡經常出現各種畫面或概念。","","對他來說，這些想法可能很普通。","","但別人聽見之後，卻可能覺得：","","「你怎麼會想到這個？」","","他未必覺得自己特別有創意，因為這些聯想對他而言可能就是自然發生的。","","它不是單純想象力豐富，而是理念可能以一種自然、不費力的方式出現，不一定需要刻意制造靈感。","","當然，有想法不代表每個想法都值得發展，也不代表每個靈感都必須分享。","","解讀補充：2 爻的特點是「需要被召喚」。天賦自然流露，但往往要有人邀請、看見，才會走出自己的空間展現；沒人邀請時，可能選擇留在原地。"],"q":["你有沒有發現，自己有時候會突然想到一些東西，卻不知道靈感從哪裡來？","有沒有一些想法，你覺得很普通，但別人聽了卻覺得很特別？","當你沒有刻意思考某件事時，腦海裡會不會也自然出現很多聯想？"],"s":["可能突然：","「欸，我想到一個東西。」","靈感不一定需要強迫自己。"]},"3":{"t":"我需要透過嘗試，才知道哪些想法值得發展","b":["<mark class=\"k\">核心：經驗、嘗試與筛選理念。</mark>","","第三爻的重點是透過實際經驗認識事物。","","放在11號閘門上，一個人可能會有很多理念，但不是每個理念都適合自己，也不是每個想法都能在現實中成立。","","他可能需要經過嘗試，才知道一個想法究竟有沒有價值。","","例如：","","他曾經有一個創業想法。","","剛開始時，覺得這個方向非常有趣，也想象過很多可能性。可是，當他真的開始研究、執行，或者接觸實際情況後，才發現有些想法並不適合現實。","","於是，他可能會：","","•   修改原本的想法。","•   嘗試另一種表達方式。","•   發現自己原本誤解了某件事。","•   放下一個曾經很感興趣的理念。","•   從不同嘗試中，逐漸找到更適合自己的方向。","","它不是單純想法多、容易改變主意，而是需要透過經驗來檢驗理念，逐漸分辨哪些想法真正值得保留。","","因此，不應該只因為一個人改變了想法，就認定他沒有堅持力。","","更重要的是：他有沒有從經歷中獲得新的理解。"],"q":["你有沒有試過一開始覺得某個想法很好，但真正嘗試後，才發現它和自己想象的不一樣？","當你發現原本的想法不適合現實，你會調整它，還是會覺得自己之前想錯了？","你有沒有一些理念，是經歷過某些事情之後，才真正理解它的價值？"],"s":["會把想法拿去現實驗證。","「這樣做到底行不行？」"]},"4":{"t":"我的理念會在關係與交流中產生影響","b":["<mark class=\"k\">核心：交流、分享與理念在人際關係中的流動。</mark>","","第四爻的重點與人際連接有關。","","放在11號閘門上，一個人的理念可能會透過朋友、熟悉的圈子或團隊交流而得到分享。","","他不一定是獨自坐下來思考時才有想法。","","有時候，真正的靈感反而來自與別人互動的過程。","","例如：","","•   和朋友討論一件事時，突然產生新的觀點。","•   在團隊開會時，聽見別人的意見，自己也聯想到新的可能性。","•   與熟悉的人分享一個理念，發現對方能夠理解自己想表達的東西。","•   透過交流，慢慢把原本模糊的想法整理清楚。","","他也可能成為朋友圈中那個經常提出不同觀點、帶來新想法的人。","","不過，這不代表他的理念一定會被所有人接受。","","它不是單純喜歡與人聊天，而是理念可能透過熟悉的關係網絡流動，在交流與分享中產生連接和影響。"],"q":["你有沒有發現，和某些朋友聊天時，特別容易產生新的想法？","你會不會透過與別人討論，才慢慢弄清楚自己真正想表達什麼？","在團隊或朋友圈裡，你是不是經常會提出一些不同的觀點或可能性？"],"s":["喜歡討論。","一個想法可能因為朋友的一句話而繼續發展。"]},"5":{"t":"我會把理念整理成別人能夠理解的東西","b":["<mark class=\"k\">核心：理念的實際表達、應用與他人的期待。</mark>","","第五爻的重點之一，是別人可能會對這個人產生某種期待。","","放在11號閘門上，別人可能認為他有想法、懂得分析，或者能夠解釋某些復雜的概念。","","因此，別人可能會期待他把理念整理出來，讓大家更容易理解。","","例如：","","一個人讀了很多書，也有很多關於人生、工作或關係的想法。","","朋友遇到問題時，可能會來問他：","","「你怎麼看這件事？」","","他可能會嘗試把復雜的事情整理成一個簡單的解釋，或者用故事、比喻和例子幫助別人理解。","","在工作上，他也可能擅長把抽象的想法轉化成比較清楚的方向，讓其他人知道某個概念可以如何理解。","","不過，別人期待他有答案，不代表他真的能夠回答所有問題。","","它不是單純喜歡給別人意見，而是理念可能被別人期待具有實際價值；與此同時，他也需要分辨哪些期待值得回應。"],"q":["別人會不會常常問你對某件事的看法？","你有沒有發現，自己喜歡把復雜的事情整理成比較容易理解的說法？","當別人期待你給出答案時，你會不會覺得自己應該要有一個明確的解釋？"],"s":["「你有什麼建議？」","「你覺得應該怎麼做？」","所以容易成為點子提供者。"]},"6":{"t":"我開始看見理念的價值，也看見它的局限","b":["<mark class=\"k\">核心：觀察、成熟與長遠理解。</mark>","","第六爻的重點在於透過時間與經驗，形成更成熟的觀察。","","放在11號閘門上，一個人可能會隨著經歷增加，逐漸看見理念與現實之間的關係。","","年輕時，他可能很容易被某個想法吸引，覺得只要理解了一個道理，就能解釋很多事情。","","但隨著經驗增加，他可能發現：","","•   同一個理念，不一定適用於所有人。","•   以前相信的事情，後來可能需要重新理解。","•   一個看似正確的觀點，也可能有它的局限。","•   有些問題暫時沒有答案，並不代表自己理解得不夠好。","","因此，他可能逐漸不再急著用一個理念解釋所有事情。","","他仍然可以擁有很多想法，只是開始明白，想法是幫助自己理解世界的工具，不一定是絕對的答案。","","它不是單純變得理性或不再相信理念，而是經過時間的沉澱後，更能看見理念的價值、局限，以及它在不同情境中的適用性。","","解讀補充：6 爻的人生常見三個階段：約 30 歲前像 3 爻一樣嘗試與犯錯；約 30–50 歲退後觀察、整理；之後才逐漸成為典範。解讀時可以問客戶，現在比較像在哪個階段。"],"q":["你有沒有發現，自己以前很相信的一些想法，現在已經有了不同的理解？","當你經歷更多事情之後，會不會發現同一個道理不一定適用於每個人？","你現在會不會比以前更能夠接受，有些問題暫時不需要馬上得到答案？"],"s":["這是很重要的。","「有一個想法，不代表我必須去做。」","有些想法只是為了讓自己看見另一個可能。"]}},"oh":"想法與觀點","oi":[]},"12":{"h":"情緒狀態、表達時機與有選擇的溝通","i":["12號閘門位於喉嚨中心，與個體回路有關。它的表達帶有情緒色彩，不是任何時候都願意開口，而是需要合適的狀態與時機。","<mark class=\"k\">理解這個閘門時，要先分清楚：不表達，不代表沒有想法；願意表達，也不代表隨
